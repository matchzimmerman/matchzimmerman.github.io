name: Capture MZCMG Shop Reel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-shop-reel.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up recorder
        shell: bash
        run: |
          mkdir reel
          cd reel
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Record real live-site navigation
        shell: bash
        run: |
          cat > reel/capture.js <<'NODE'
          const { chromium } = require('playwright');

          async function smoothScroll(page, y, ms=1000) {
            await page.evaluate(({y, ms}) => new Promise(resolve => {
              const start = window.scrollY;
              const delta = y - start;
              const t0 = performance.now();
              function frame(t) {
                const p = Math.min(1, (t - t0) / ms);
                const eased = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;
                window.scrollTo(0, start + delta * eased);
                if (p < 1) requestAnimationFrame(frame); else resolve();
              }
              requestAnimationFrame(frame);
            }), {y, ms});
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport: { width: 432, height: 768 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              recordVideo: {
                dir: 'reel/video',
                size: { width: 1080, height: 1920 }
              }
            });

            const page = await context.newPage();
            await page.goto('https://www.matchzimmerman.com/shop/', {waitUntil:'networkidle', timeout:120000});
            await page.waitForSelector('#catalog .product-card', {timeout:60000});
            await page.waitForTimeout(1800);

            await smoothScroll(page, 760, 1400);
            await page.waitForTimeout(700);
            await smoothScroll(page, 0, 900);
            await page.waitForTimeout(500);

            await page.click('#brand-pills button[data-brand="MZBRDZ"]');
            await page.waitForTimeout(900);
            await page.click('#category-pills button[data-category="Sweaters"]');
            await page.waitForTimeout(1100);

            const target = page.locator('.product-card[data-id="387424854"]');
            await target.scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await target.click();
            await page.waitForSelector('#product-dialog[open]', {timeout:30000});
            await page.waitForTimeout(1300);

            const select = page.locator('#variant-select');
            if (await select.count()) {
              const options = await select.locator('option').count();
              if (options > 2) await select.selectOption({index:2});
            }
            await page.waitForTimeout(850);

            const add = page.locator('#add-button');
            if (await add.count() && await add.isEnabled()) {
              await add.click();
              await page.waitForTimeout(2200);
            } else {
              await page.keyboard.press('Escape');
              await page.waitForTimeout(500);
              await page.click('#bag-button');
              await page.waitForTimeout(1800);
            }

            await context.close();
            await browser.close();
          })();
          NODE
          node reel/capture.js

      - name: Normalize captured filename
        shell: bash
        run: |
          set -e
          FILE=$(find reel/video -type f -name '*.webm' | head -1)
          test -n "$FILE"
          cp "$FILE" MZCMG_Shop_Live_Capture.webm

      - name: Upload actual screen capture
        uses: actions/upload-artifact@v4
        with:
          name: mzcmg-shop-live-capture
          path: MZCMG_Shop_Live_Capture.webm
          retention-days: 1
