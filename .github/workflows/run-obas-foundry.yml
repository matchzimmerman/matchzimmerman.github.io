name: Run OBAS Foundry Demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-obas-foundry.yml

permissions:
  contents: write

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Run OBAS foundry
        shell: bash
        run: |
          success=0
          for attempt in {1..12}; do
            echo "Attempt $attempt"
            if curl --silent --show-error --fail --max-time 28               "https://mzcmg-shop-api.vercel.app/api/foundry-run?seed=47"               -o /tmp/foundry-run.json; then
              if jq -e '.ok == true' /tmp/foundry-run.json >/dev/null; then
                success=1
                break
              fi
              cat /tmp/foundry-run.json
            fi
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            echo "Foundry demo did not complete successfully."
            cat /tmp/foundry-run.json || true
            exit 1
          fi
          jq '.' /tmp/foundry-run.json

      - name: Save result to repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          encoded=$(base64 -w 0 /tmp/foundry-run.json)
          body=$(jq -n             --arg message "Capture OBAS foundry demo result [skip ci]"             --arg content "$encoded"             --arg branch "main"             '{message:$message, content:$content, branch:$branch}')
          curl --silent --show-error --fail             -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/contents/shop-api/demo/foundry-run.json"             -d "$body"
