name: Build MZ Woods Web

on:
  push:
    branches: [main]
    paths:
      - "woods-src/**"
      - ".github/workflows/woods-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Validate project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path woods-src --editor --quit

      - name: Export Web build
        run: |
          rm -rf woods
          mkdir -p woods
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path woods-src --export-release Web ../woods/index.html
          touch woods/.nojekyll

      - name: Publish build into site repo
        run: |
          git config user.name "mz-woods-bot"
          git config user.email "actions@users.noreply.github.com"
          git add woods
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: MZ Woods web prototype"
            git push
          fi
