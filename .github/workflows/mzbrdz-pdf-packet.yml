name: MZBRDZ PDF Packet Export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mzbrdz-pdf-packet.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch generated PDF packet
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mzcmg-shop-api.vercel.app/api/workstation?pdf=1&export=1'
          for attempt in $(seq 1 18); do
            code=$(curl -L --silent --show-error --output MZBRDZ_Printful_Markup_Index.pdf --write-out '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && [ -s MZBRDZ_Printful_Markup_Index.pdf ]; then
              if head -c 4 MZBRDZ_Printful_Markup_Index.pdf | grep -q '%PDF'; then
                exit 0
              fi
            fi
            rm -f MZBRDZ_Printful_Markup_Index.pdf
            sleep 10
          done
          echo "PDF export did not become available." >&2
          exit 1

      - name: Upload PDF packet
        uses: actions/upload-artifact@v4
        with:
          name: mzbrdz-printful-markup-index
          path: MZBRDZ_Printful_Markup_Index.pdf
          if-no-files-found: error
          retention-days: 1
