<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FIELD AUDIO // DIRECTIONAL FIELD</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f2f0e8;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;left:12px;top:10px;z-index:5;font-size:10px;line-height:1.45;pointer-events:none;text-shadow:0 1px 8px #000}#hud b{font-size:12px;letter-spacing:.08em}#meta{margin-top:7px;opacity:.72}#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000d;backdrop-filter:blur(4px)}#card{width:min(460px,87vw);padding:20px;border:1px solid #ffffff55;background:#080808ee}h1{margin:0 0 10px;font-size:14px;letter-spacing:.11em}p{font-size:11px;line-height:1.55;opacity:.78}button,input{font:inherit;color:inherit}button{background:#111b;border:1px solid #ffffff55;padding:8px 10px}#start{width:100%;margin-top:8px;padding:11px}#pad{position:fixed;right:12px;bottom:12px;z-index:8;display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:4px;opacity:.74}#pad button{padding:0;font-size:16px;touch-action:none}#f{grid-column:2}#l{grid-row:2}#r{grid-column:3;grid-row:2}#b{grid-column:2;grid-row:3}#u{grid-column:1;grid-row:3;font-size:9px}#d{grid-column:3;grid-row:3;font-size:9px}.toolbar{position:fixed;left:12px;bottom:12px;z-index:8;display:flex;flex-wrap:wrap;gap:5px;max-width:65vw}.toolbar button{font-size:9px}.panel{position:fixed;left:12px;bottom:46px;z-index:8;font-size:9px;background:#080808bb;border:1px solid #ffffff33;padding:8px;max-width:65vw}.panel input[type=range]{width:170px;vertical-align:middle}@media(min-width:800px){#pad{opacity:.38}}
</style></head><body><canvas id="cv"></canvas><div id="hud"><b>FIELD AUDIO // DIRECTIONAL FIELD</b><br>ITERATION 04 // ORIENTATION AS MIXER<div id="meta">loading…</div></div><div id="pad"><button id="f">▲</button><button id="l">◀</button><button id="r">▶</button><button id="b">▼</button><button id="u">UP</button><button id="d">DN</button></div><div id="gate"><div id="card"><h1>FIELD AUDIO // DIRECTIONAL FIELD</h1><p>The environment is audible primarily inside your viewing cone. Rotate to listen into different parts of the scan; direction matters more than proximity.</p><button id="start">ENTER + ENABLE AUDIO</button></div></div><script src="../field-data.js"></script><script>
const D=window.FIELD_DATA;
function dec(s,T){let b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)}
const pq=dec(D.p,Uint16Array),C=dec(D.c,Uint8Array),mq=dec(D.m,Int8Array),R=dec(D.r,Uint8Array),N=D.n;
const P=new Float32Array(N*3),M=new Float32Array(N*3),Rf=new Float32Array(N);
for(let i=0;i<N;i++){for(let j=0;j<3;j++){P[i*3+j]=D.min[j]+(pq[i*3+j]/65535)*D.rng[j];M[i*3+j]=mq[i*3+j]/127}Rf[i]=R[i]/255}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
function resize(){let d=Math.min(devicePixelRatio||1,1.35);cv.width=innerWidth*d;cv.height=innerHeight*d;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
let cam=[0,0,D.ext[2]*1.25+.65],yaw=Math.PI,pitch=0,keys={},hold={};
function dir(){return norm([Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)])}
function right(){return norm(cross(dir(),[0,1,0]))}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=false,lx=0,ly=0;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.006))});cv.addEventListener('pointerup',()=>drag=false);
function bh(id,k){let e=document.getElementById(id);if(!e)return;let on=x=>{x.preventDefault();hold[k]=1},off=x=>{x.preventDefault();hold[k]=0};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off)}['f:w','b:s','l:a','r:d','u:e','d:q'].forEach(x=>{let[a,b]=x.split(':');bh(a,b)});
function move(dt,s=.42){let f=dir(),rt=right(),v=[0,0,0],K=k=>keys[k]||hold[k];if(K('w')||K('arrowup'))v=add(v,f);if(K('s')||K('arrowdown'))v=sub(v,f);if(K('d')||K('arrowright'))v=add(v,rt);if(K('a')||K('arrowleft'))v=sub(v,rt);if(K('e'))v[1]+=1;if(K('q'))v[1]-=1;if(Math.hypot(...v)>.01)cam=add(cam,mul(norm(v),s*dt))}
function project(x,y,z){let rel=[x-cam[0],y-cam[1],z-cam[2]],f=dir(),rt=right(),up=norm(cross(rt,f));let X=dot(rel,rt),Y=dot(rel,up),Z=dot(rel,f);if(Z<.025)return null;let focal=Math.min(cv.width,cv.height)*.78;return[cv.width*.5+X/Z*focal,cv.height*.5-Y/Z*focal,Z]}
function drawPoints(ms,emphasis){ctx.fillStyle='#050505';ctx.fillRect(0,0,cv.width,cv.height);let t=ms*.001;for(let i=0;i<N;i++){let k=i*3,z=project(P[k],P[k+1],P[k+2]);if(!z)continue;let e=emphasis?emphasis(i,t,z[2]):0,l=(.2126*C[k]+.7152*C[k+1]+.0722*C[k+2])/255;let size=Math.max(.7,Math.min(5.5,(2.2+4*Rf[i]+3*e)/z[2]));let q=Math.floor((l*.55+Rf[i]*.25+e*.45)*5)/5;let val=Math.max(35,Math.min(245,60+q*190));ctx.globalAlpha=Math.max(.12,Math.min(.95,.24+e*.65));ctx.fillStyle=`rgb(${val},${Math.max(28,val*.9)},${Math.max(22,val*.68)})`;ctx.beginPath();ctx.arc(z[0],z[1],size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
let ac=null,master=null;function audioStart(){let A=window.AudioContext||window.webkitAudioContext;ac=new A;master=ac.createGain();master.gain.value=.16;master.connect(ac.destination);return ac}
function voice(type='sine'){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null;o.type=type;f.type='lowpass';g.gain.value=.0001;o.connect(f);f.connect(g);if(p){g.connect(p);p.connect(master)}else g.connect(master);o.start();return{o,f,g,p}}
const scale=[0,2,3,5,7,10],qf=(x,b=55,oct=4)=>{x=Math.max(0,Math.min(.999,x));let s=Math.floor(x*scale.length*oct),d=scale[s%scale.length]+12*Math.floor(s/scale.length);return b*Math.pow(2,d/12)};
function setV(v,freq,gain,cut,pan=0,tc=.12){if(!ac)return;let t=ac.currentTime+.025;v.o.frequency.setTargetAtTime(freq,t,tc);v.g.gain.setTargetAtTime(gain,t,tc*1.3);v.f.frequency.setTargetAtTime(cut,t,tc);if(v.p)v.p.pan.setTargetAtTime(Math.max(-1,Math.min(1,pan)),t,tc)}
function localSense(radius=.6,forwardOnly=false){let ws=0,h=0,r=0,l=0,o=0,pan=0,f=dir(),rt=right();for(let i=0;i<N;i+=2){let k=i*3,rel=[P[k]-cam[0],P[k+1]-cam[1],P[k+2]-cam[2]],d=Math.hypot(...rel);if(d>radius)continue;let nd=norm(rel),fd=dot(nd,f);if(forwardOnly&&fd<.25)continue;let w=(1-d/radius)*(forwardOnly?Math.max(0,fd):1);ws+=w;h+=w*((P[k+1]-D.min[1])/D.rng[1]);r+=w*Rf[i];l+=w*(.2126*C[k]+.7152*C[k+1]+.0722*C[k+2])/255;o+=w*Math.abs(M[k]*f[0]+M[k+1]*f[1]+M[k+2]*f[2]);pan+=w*dot(nd,rt)}if(ws<.001)return{den:0,h:.5,r:.1,l:.5,o:.5,p:0};return{den:Math.min(1,ws/28),h:h/ws,r:r/ws,l:l/ws,o:o/ws,p:pan/ws}}
let V=[],last=performance.now();function init(){audioStart();['sine','triangle','sine','sawtooth'].forEach(t=>V.push(voice(t)))}
function coneSense(){let f=dir(),rt=right(),bins=[{w:0,h:0,r:0,l:0,p:0},{w:0,h:0,r:0,l:0,p:0},{w:0,h:0,r:0,l:0,p:0},{w:0,h:0,r:0,l:0,p:0}];for(let i=0;i<N;i+=2){let k=i*3,rel=[P[k]-cam[0],P[k+1]-cam[1],P[k+2]-cam[2]],d=Math.hypot(...rel);if(d<.02)continue;let nd=norm(rel),fd=dot(nd,f);if(fd<.55)continue;let pp=dot(nd,rt),b=Math.max(0,Math.min(3,Math.floor((pp+1)*2)));let w=(fd-.55)/.45*Math.exp(-d*.65),x=bins[b];x.w+=w;x.h+=w*((P[k+1]-D.min[1])/D.rng[1]);x.r+=w*Rf[i];x.l+=w*(.2126*C[k]+.7152*C[k+1]+.0722*C[k+2])/255;x.p+=w*pp}return bins.map(x=>x.w?{d:Math.min(1,x.w/28),h:x.h/x.w,r:x.r/x.w,l:x.l/x.w,p:x.p/x.w}:{d:0,h:.5,r:.1,l:.5,p:0})}
function frame(ms){let dt=Math.min(.04,(ms-last)/1000);last=ms;move(dt,.26);let bins=coneSense();drawPoints(ms,(i,t)=>{let k=i*3,rel=norm([P[k]-cam[0],P[k+1]-cam[1],P[k+2]-cam[2]]);return Math.max(0,(dot(rel,dir())-.45)/.55)});ctx.strokeStyle='#ffffff88';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.12,0,Math.PI*2);ctx.stroke();if(ac)bins.forEach((m,i)=>setV(V[i],qf((m.h*.55+m.l*.35+m.r*.35)%1,55+(i%2)*27.5,3),.004+.035*m.d,350+2800*m.l,[-.9,-.3,.3,.9][i]));document.getElementById('meta').innerHTML='LOOK TO LISTEN · '+bins.map(x=>x.d.toFixed(2)).join(' / ')+'<br>orientation is the primary mixer';requestAnimationFrame(frame)}requestAnimationFrame(frame);document.getElementById('start').onclick=async()=>{init();await ac.resume();document.getElementById('gate').style.display='none'};
</script></body></html>
