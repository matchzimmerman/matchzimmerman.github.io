<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public moving-image archive of work by Match Zimmerman.">
  <title>Moving Image Archive — Match Zimmerman</title>
  <style>
    :root {
      --bg: #f4ff00;
      --ink: #090909;
      --paper: #fff;
      --line: rgba(9,9,9,.18);
      --muted: rgba(9,9,9,.62);
      --shadow: 0 18px 70px rgba(0,0,0,.22);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    button, a { font: inherit; }
    header {
      padding: 28px 24px 20px;
      border-bottom: 2px solid var(--ink);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
    }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 900px;
      font-size: clamp(34px, 7vw, 82px);
      line-height: .9;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }
    .archive-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 8px 11px;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .controls {
      padding: 16px 24px;
      border-bottom: 1.5px solid var(--ink);
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      appearance: none;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .sort-note { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    main { padding: 24px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      min-width: 0;
      border-top: 2px solid var(--ink);
      padding-top: 8px;
    }
    .card-button {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .22s ease, opacity .22s ease;
    }
    .card-button:hover img,
    .card-button:focus-visible img { transform: scale(1.025); opacity: .86; }
    .play {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%,-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--ink);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 18px;
      pointer-events: none;
    }
    .play::before { content: "▶"; transform: translateX(1px); }
    .card-info { padding: 10px 0 4px; }
    .card-kicker {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .card h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    dialog {
      width: min(1080px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      border: 2px solid var(--ink);
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0,0,0,.78); }
    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding: 13px 14px;
      border-bottom: 2px solid var(--ink);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .modal-heading { min-width: 0; }
    #modalTitle {
      margin: 0;
      font-size: clamp(18px, 3vw, 30px);
      line-height: 1;
      letter-spacing: -.035em;
    }
    #modalMeta {
      margin: 5px 0 0;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
    }
    .player-wrap { aspect-ratio: 16 / 9; background: #000; }
    .player-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .modal-copy { padding: 18px 18px 24px; }
    #modalDescription {
      margin: 0;
      max-width: 820px;
      white-space: pre-line;
      font-size: 16px;
      line-height: 1.45;
    }
    .source-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--ink);
      font-weight: 800;
      text-underline-offset: 3px;
    }
    footer {
      padding: 24px;
      border-top: 2px solid var(--ink);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    footer p { margin: 0; max-width: 720px; }
    @media (max-width: 1000px) { #grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (max-width: 720px) {
      header { grid-template-columns: 1fr; }
      .archive-meta { justify-content: flex-start; }
      #grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
      main, header, .controls, footer { padding-left: 14px; padding-right: 14px; }
    }
    @media (max-width: 430px) { #grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Match Zimmerman / Public Video Index</p>
      <h1>Moving Image Archive</h1>
    </div>
    <div class="archive-meta" aria-label="Archive summary">
      <span class="pill"><span id="count">20</span> videos</span>
      <span class="pill">2008—2026</span>
    </div>
  </header>

  <section class="controls" aria-label="Archive controls">
    <div class="filters" role="group" aria-label="Filter by platform">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="vimeo" aria-pressed="false">Vimeo</button>
      <button class="filter" type="button" data-filter="youtube" aria-pressed="false">YouTube</button>
    </div>
    <div class="sort-note">Oldest → newest</div>
  </section>

  <main>
    <div id="grid" aria-live="polite"></div>
  </main>

  <dialog id="lightbox" aria-labelledby="modalTitle">
    <div class="modal-top">
      <div class="modal-heading">
        <h2 id="modalTitle"></h2>
        <p id="modalMeta"></p>
      </div>
      <button class="close" type="button" aria-label="Close video">×</button>
    </div>
    <div class="player-wrap" id="playerWrap"></div>
    <div class="modal-copy">
      <p id="modalDescription"></p>
      <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener">Open original ↗</a>
    </div>
  </dialog>

  <footer>
    <p>Public YouTube + Vimeo work recovered from web indexes and portfolio traces. Vimeo metadata is refreshed from public oEmbed when available.</p>
    <p>© Match Zimmerman</p>
  </footer>

  <script>
    const videos = [
      {
        platform: 'vimeo', id: '1680746', date: '2008-09-01', year: 2008,
        title: 'Sink Double // A Video Loop',
        description: 'Early video-loop work by Match Zimmerman. A doubled sink image treated as a repeating moving-image study.'
      },
      {
        platform: 'vimeo', id: '1681084', date: '2008-09-01', year: 2008,
        title: 'Outback Sunrise // A Video Loop',
        description: 'Early video-loop work by Match Zimmerman built around repeated landscape and temporal motion.'
      },
      {
        platform: 'vimeo', id: '2162022', date: '2008-11-01', year: 2008,
        title: 'Talking Heads // A Video Loop',
        description: 'An early repeating moving-image work using talking heads as looped visual material.'
      },
      {
        platform: 'vimeo', id: '2162033', date: '2008-11-01', year: 2008,
        title: 'Talking Heads Projection // A Video Installation',
        description: 'Video-installation version of the Talking Heads material, presented as projected moving image.'
      },
      {
        platform: 'vimeo', id: '2162048', date: '2008-11-01', year: 2008,
        title: 'Irish Mass Lights // A Video Loop',
        description: 'An early video loop built from recorded light, repetition, and ambient movement.'
      },
      {
        platform: 'vimeo', id: '4686435', date: '2009-05-01', year: 2009,
        title: 'Up For Air // A Video Loop',
        description: 'Short-form video loop exploring repetition, duration, and cyclical motion.'
      },
      {
        platform: 'vimeo', id: '4798039', date: '2009-05-01', year: 2009,
        title: 'Navigating a Forest by Moonlight (Proof 01) // A Processing Sketch Video Loop',
        description: 'Processing-based sketch and video loop exploring simulated navigation through a forest-like field at night.'
      },
      {
        platform: 'vimeo', id: '12112814', date: '2010-05-01', year: 2010,
        title: 'Empty Used Car Lot // A Video Loop',
        description: 'A repeating moving-image study centered on the visual rhythm and vacancy of an empty used-car lot.'
      },
      {
        platform: 'vimeo', id: '58035983', date: '2013-01-01', year: 2013,
        title: 'Kinect + Max/MSP/Jitter (Multicolor Wireframe Effect)',
        description: 'Experimenting with live video effects within Max/MSP/Jitter. The Kinect records imagery and depth; the closer the user gets to the Kinect, the faster the colors flash.'
      },
      {
        platform: 'vimeo', id: '58650683', date: '2013-01-01', year: 2013,
        title: 'Max/MSP/Jitter (Bouncing Vocals)',
        description: 'Max/MSP/Jitter audiovisual experiment connecting vocal sound and animated movement.'
      },
      {
        platform: 'vimeo', id: '59443590', date: '2013-02-01', year: 2013,
        title: 'Kinect + Max/MSP/Jitter (Kinect Cat)',
        description: 'Kinect and Max/MSP/Jitter experiment using depth-camera input as live visual material.'
      },
      {
        platform: 'vimeo', id: '60329277', date: '2013-02-01', year: 2013,
        title: 'Kinect + Max/MSP/Jitter (Wireframe Datamosh Delay)',
        description: 'Live Kinect / Max/MSP/Jitter study combining wireframe rendering, delayed imagery, and datamosh-like visual feedback.'
      },
      {
        platform: 'vimeo', id: '60593490', date: '2013-02-01', year: 2013,
        title: 'Abstract Tidal Study 01 (Chroma Key Effect)',
        description: 'Study of tidal motion. Original footage by Adam Reynolds.'
      },
      {
        platform: 'vimeo', id: '62636945', date: '2013-03-01', year: 2013,
        title: 'Impression / Vision Rehearsal | Kara Senich Zimmerman + Match Zimmerman',
        description: 'Rehearsal documentation for Impression / Vision, combining dance, Kinect capture, and responsive Max/MSP/Jitter visuals.'
      },
      {
        platform: 'vimeo', id: '70642402', date: '2013-07-01', year: 2013,
        title: 'Max / MSP / Jitter | Rollie “Solitude” | Audio Visualizer',
        description: 'Audio-reactive Max/MSP/Jitter visualization created around Rollie’s “Solitude.”'
      },
      {
        platform: 'vimeo', id: '123541585', date: '2015-03-01', year: 2015,
        title: 'Impression / Vision Performance | Kinect + Max/MSP/Jitter + Dance',
        description: 'Kara Senich Zimmerman and Match Zimmerman perform their original piece, Impression/Vision, at Muhlenberg College’s 20th Anniversary Dance Concert. Visuals by Match Zimmerman using Kinect and Max/MSP/Jitter; choreography by Kara Senich Zimmerman.'
      },
      {
        platform: 'youtube', id: 'h3ZVbeXWq7g', date: '2015-03-01', year: 2015,
        title: 'Impression / Vision Performance | Kinect + Max/MSP/Jitter + Dance',
        description: 'YouTube upload of the Impression / Vision performance: dance by Kara Senich Zimmerman with Kinect and Max/MSP/Jitter visuals by Match Zimmerman.'
      },
      {
        platform: 'youtube', id: 's7Lrb7Rfj0E', date: '2025-11-01', year: 2025,
        title: 'FS: Magpie | Live Action | Parts 1–3',
        description: 'Live-action material from FIELD STATION: MAGPIE, presented as Parts 1–3.'
      },
      {
        platform: 'youtube', id: 'q5Oj6oJRccI', date: '2025-12-01', year: 2025,
        title: 'Project: Magpie | FS-MP-01 / HQ | Process Artifact 007',
        description: 'Process Artifact 007 from Project: Magpie / Field Station MP-01 HQ.'
      },
      {
        platform: 'youtube', id: 'LPYdD-mhkCs', date: '2026-01-01', year: 2026,
        title: 'Lost in Transmission | Interactive Found Object Sound Sculpture',
        description: 'Documentation of an interactive found-object sound sculpture by Match Zimmerman.'
      }
    ];

    let activeFilter = 'all';
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const dialog = document.getElementById('lightbox');
    const playerWrap = document.getElementById('playerWrap');
    const modalTitle = document.getElementById('modalTitle');
    const modalMeta = document.getElementById('modalMeta');
    const modalDescription = document.getElementById('modalDescription');
    const sourceLink = document.getElementById('sourceLink');

    const sourceUrl = (video) => video.platform === 'youtube'
      ? `https://www.youtube.com/watch?v=${video.id}`
      : `https://vimeo.com/${video.id}`;

    const thumbUrl = (video) => video.platform === 'youtube'
      ? `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`
      : `https://vumbnail.com/${video.id}.jpg`;

    const embedUrl = (video) => video.platform === 'youtube'
      ? `https://www.youtube.com/embed/${video.id}?autoplay=1&rel=0`
      : `https://player.vimeo.com/video/${video.id}?autoplay=1&title=0&byline=0&portrait=0`;

    function sortVideos(list) {
      return [...list].sort((a, b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
    }

    function render() {
      const visible = sortVideos(videos.filter(v => activeFilter === 'all' || v.platform === activeFilter));
      count.textContent = visible.length;
      grid.innerHTML = '';

      visible.forEach((video) => {
        const article = document.createElement('article');
        article.className = 'card';
        article.dataset.platform = video.platform;
        article.dataset.id = video.id;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card-button';
        button.setAttribute('aria-label', `Play ${video.title}`);

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = video.thumbnail || thumbUrl(video);
        img.alt = `Thumbnail for ${video.title}`;

        const play = document.createElement('span');
        play.className = 'play';
        play.setAttribute('aria-hidden', 'true');

        const info = document.createElement('div');
        info.className = 'card-info';
        info.innerHTML = `
          <div class="card-kicker"><span>${video.year}</span><span>${video.platform}</span></div>
          <h2></h2>
        `;
        info.querySelector('h2').textContent = video.title;

        thumbWrap.append(img, play);
        button.append(thumbWrap, info);
        button.addEventListener('click', () => openVideo(video));
        article.append(button);
        grid.append(article);
      });
    }

    function openVideo(video) {
      modalTitle.textContent = video.title;
      modalMeta.textContent = `${video.year} / ${video.platform}`;
      modalDescription.textContent = video.description || 'Public video by Match Zimmerman.';
      sourceLink.href = sourceUrl(video);
      sourceLink.textContent = `Open original on ${video.platform === 'youtube' ? 'YouTube' : 'Vimeo'} ↗`;

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl(video);
      iframe.title = video.title;
      iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      playerWrap.replaceChildren(iframe);

      dialog.showModal();
    }

    function closeVideo() {
      playerWrap.replaceChildren();
      dialog.close();
    }

    document.querySelector('.close').addEventListener('click', closeVideo);
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) closeVideo();
    });
    dialog.addEventListener('close', () => playerWrap.replaceChildren());

    document.querySelectorAll('.filter').forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
        render();
      });
    });

    async function enrichVimeo(video) {
      const endpoint = `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(sourceUrl(video))}&width=1280`;
      try {
        const response = await fetch(endpoint, { mode: 'cors' });
        if (!response.ok) return;
        const data = await response.json();
        if (data.title) video.title = data.title;
        if (data.description && data.description.trim()) video.description = data.description.trim();
        if (data.thumbnail_url) video.thumbnail = data.thumbnail_url;
        if (data.upload_date) {
          const parsed = new Date(data.upload_date);
          if (!Number.isNaN(parsed.getTime())) {
            video.date = parsed.toISOString().slice(0, 10);
            video.year = parsed.getUTCFullYear();
          }
        }
      } catch (_) {
        // Static archive data and thumbnail fallbacks remain in place.
      }
    }

    render();
    Promise.all(videos.filter(v => v.platform === 'vimeo').map(enrichVimeo)).then(render);
  </script>
</body>
</html>
