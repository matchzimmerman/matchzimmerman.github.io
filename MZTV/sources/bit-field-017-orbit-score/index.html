<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZTV · BIT FIELD 017 · ORBIT SCORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  MZTV · BIT FIELD 017 · ORBIT SCORE
  The ISS flies its real orbit over a NASA relief map of Earth; the ground passing beneath it is the score.
  Data: ISS (ZARYA) NORAD 25544 two-line elements, fetched live from CelesTrak (fallback: tle.ivanstanojevic.me,
  then the embedded set), refreshed every 4 h and propagated with SGP4 (satellite.js 5.0.0, MIT, inlined below).
  Map: "Earth (A)" relief texture, NASA 3D Resources (github.com/nasa/NASA-3D-Resources), public domain.
  Sun: computed (low-precision solar ephemeris).
  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?ff=H (pre-run memory H hours) ?capture=1
  Keys: i info · t force a rupture
-->
<style>
:root{--bg:#03100f;--sea:#0e403b;--ex:#9dffc4;--hi:#f0a54a;--tx:#e2fff1;--hit:#fff0b0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);cursor:none}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
.box{position:fixed;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:clamp(8px,0.6vw,15px);line-height:1.38;
  color:var(--tx);background:color-mix(in srgb,var(--bg) 84%,transparent);border:1px solid var(--sea);border-left:3px solid var(--hi);
  padding:.7em .9em;white-space:pre;letter-spacing:.01em;pointer-events:none}
#info{left:1.3vw;bottom:calc(11.2vh + 1.2vh);max-width:33vw;white-space:pre-wrap}
#log{left:1.3vw;top:2vh;max-width:29vw;overflow:hidden;white-space:pre-wrap;border-left:3px solid var(--ex)}
#legend{right:1.3vw;bottom:calc(11.2vh + 1.2vh);border-left:1px solid var(--sea);border-right:3px solid var(--hi)}
#dlbox{right:1.3vw;top:2vh;border-left:1px solid var(--sea);border-right:3px solid var(--ex);padding:.6em .6em .5em;white-space:normal}
#dl{display:block;width:15vw;height:15vw;max-width:34vh;max-height:34vh;image-rendering:pixelated;image-rendering:crisp-edges}
#dlcap{margin-top:.4em;white-space:pre}
.box b{color:var(--hi);font-weight:600}
.box i{font-style:normal;color:color-mix(in srgb,var(--tx) 58%,var(--sea))}
.box .h{color:var(--ex);font-weight:600}
.box .p{color:var(--hit);font-weight:600}
.k{display:inline-block;width:1.6em;height:0;vertical-align:middle;margin-right:.2em}
.k.solid{border-top:2px solid var(--hi)} .k.dots{border-top:2px dotted var(--ex)} .k.ring{width:.75em;height:.75em;border:2px dotted var(--tx);border-radius:50%;box-sizing:border-box;margin:0 .45em}
.k.ex{height:.7em;background:repeating-linear-gradient(90deg,var(--ex) 0 2px,transparent 2px 4px)} .k.nt{height:.7em;background:#000;opacity:.7}
.hide{display:none}
</style>
</head>

addEventListener('beforeunload', persist);
let captSub = 0;
function captureTick(dts) { CAPT_T += dts; captSub += dts; catchUp(now(), true, 400); liveUpdate(dts); if (captSub >= 0.25) { captSub = 0; secondTick(); } visualBeat(dts); render(); renderDownlook(); }
window.MZ = { get S() { return S; }, L, ORB, AU, PAT, rupture, force: m => forceMode(m), persist, setTLE, fetchTLE,
  advance(hours) { const t0 = S.memT, end = t0 + hours * HOUR; while (S.memT + MEM_DT <= end) { S.memT += MEM_DT; memStep(S.memT, false); } return { era: S.era, cover: L.cover, unlock: S.unlock, cnt: S.cnt }; },
  poison() { S.expo.fill(NaN, 0, 5000); S.era.p = NaN; camLon = NaN; },
  pushEvent(k) { const p = L.iss || { lat: 0, lon: 0 }; EVQ.push(k === 'echo' ? { k, deg: 15 + (Math.random() * 6 | 0), age: 3, lat: p.lat + 3, lon: p.lon - 4 } : { k, land: true, lat: p.lat }); }, rebuild: () => rebuildGraph(), snapPalette: () => paletteStep(999), tick: captureTick, get W() { return W; }, get H() { return H; } };
