<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Flower Field</title>
<meta name="description" content="MZ WORLD · FLOWER FIELD — after the paintings of Bryson Iacoboni. A field of round flowers under a held golden hour; a gap in the clouds drifts across it with the wind. Painted in his colours, and filmed by a crew of drones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · FLOWER FIELD — a painted field; a gap in the clouds drifts across it; drones film */
:root { --ink:#1d1a24; --paper:#f0e7d6; --hot:#d6402e; --deep:#355a2e; --sea:#3fb7ae; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden; -webkit-tap-highlight-color:transparent }
canvas { display:block; position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; touch-action:manipulation }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(480px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink); box-shadow:4px 4px 0 var(--sea);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; cursor:pointer; -webkit-user-select:none; user-select:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap }
@media (max-width:560px) { #hud { font-size:9.5px; line-height:1.4; padding:8px 10px; left:calc(10px + env(safe-area-inset-left,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); width:calc(100vw - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)) }
  #hud .r { grid-template-columns:1fr } #hud .r span:last-child { text-align:left; padding-left:1.2em } #hud .log div:nth-child(n+3) { display:none } }
.btn { position:fixed; font:600 11px/1 var(--mono); color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:9px 11px; letter-spacing:.08em; cursor:pointer; box-shadow:3px 3px 0 var(--sea) }
#tap { right:calc(16px + env(safe-area-inset-right,0px)); top:calc(16px + env(safe-area-inset-top,0px)) }
#mix { position:fixed; left:calc(16px + env(safe-area-inset-left,0px)); top:calc(16px + env(safe-area-inset-top,0px)); display:flex; flex-wrap:wrap; gap:8px; max-width:calc(100vw - 32px); z-index:2 }
#mix .g { display:flex; align-items:stretch; background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--sea) }
#mix button { font:600 11px/1 var(--mono); letter-spacing:.08em; color:var(--ink); background:transparent; border:0; padding:0 11px; min-height:40px; min-width:34px; cursor:pointer }
#mix button:active { background:color-mix(in srgb, var(--ink) 12%, transparent) }
#mix .nm { min-width:15ch; text-align:left; border-left:2px solid var(--ink); border-right:2px solid var(--ink); padding:6px 10px }
#mix .k { display:block; font-size:9px; opacity:.65; margin-bottom:4px }
#mix .sw { display:flex; gap:2px; margin-top:4px } #mix .sw i { width:10px; height:6px; display:block; border:1px solid var(--ink) }
#mix .one button { padding:0 12px }
#mix button:focus-visible { outline:3px solid var(--hot); outline-offset:-3px }
@media (max-width:560px) { #mix { gap:6px } #mix .nm { min-width:12.5ch } #mix button { font-size:10px } }
#ib { right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:40px; height:40px; padding:0; border-radius:50%; font-size:16px }
.btn:focus-visible, #hud:focus-visible { outline:3px solid var(--hot); outline-offset:3px }
</style>

<div id="hud" hidden role="button" tabindex="0" aria-label="World info. Tap to hide."></div>
<div id="mix" hidden role="group" aria-label="Colours and brushes">
  <div class="g"><button type="button" data-a="c-" aria-label="Previous colours">‹</button><button type="button" class="nm" data-a="c+" aria-label="Next colours"><span class="k">INKS</span><span id="cName">FLOWER FIELD</span><span class="sw" id="cSw"></span></button><button type="button" data-a="c+" aria-label="Next colours">›</button></div>
  <div class="g"><button type="button" data-a="t-" aria-label="Previous brush">‹</button><button type="button" class="nm" data-a="t+" aria-label="Next brush"><span class="k">BRUSH</span><span id="tName">DABS AND BLOCKS</span></button><button type="button" data-a="t+" aria-label="Next brush">›</button></div>
  <div class="g one"><button type="button" data-a="r" aria-label="Shuffle colours and brush">SHUFFLE</button></div>
</div>
<button id="tap" class="btn" type="button" hidden>TAP FOR SOUND</button>
<button id="ib" class="btn" type="button" hidden aria-label="Show world info">i</button>

<script src="../../lib/mzcam.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const SMALL = Math.min(innerWidth, innerHeight) < 700;
const LINES = +(Q.get('lines') || (SMALL ? 480 : 720));
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const WALKL = Q.get('walk') === '1';
const KEY = 'mzworld-flower-field-v1' + (WALKL ? '-walk' : '') + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }
let CAMHOLD = Q.has('cam') ? Math.max(0, Math.floor(+Q.get('cam'))) : -1;

// No LAT/LON: the lane is a painter's place (after Bryson Iacoboni's paintings), so the sun and the weather are simulated and say so (README: rule 1 broken on purpose).
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const _Y = V(0, 1, 0);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const prnd = mulberry(3701);   // fixed salt: the lane is the same every time
const pr = (a, b) => a + (b - a) * prnd();

/* ====================================================================== clock: a held golden hour */
// The paintings live in late light. The sun is held between about 16:40 and 19:45 and eases back over 90 minutes,
// so the shadows keep lengthening down the lane and shortening again without the lane ever going dark.
const DAY_S = 90 * 60;
let simMs = Date.now();
function goldenAt(ms) { const ph = 0.5 - 0.5 * Math.cos(TAU * (ms / 1000) / DAY_S); return { ph, b: lerp(242, 292, ph) * D2R, el: lerp(26, 3.6, ph) * D2R, clock: 16.67 + 3.08 * ph }; }
function seekPh(ph) { const cyc = Math.acos(clamp(1 - 2 * ph, -1, 1)) / TAU * DAY_S * 1000; simMs = Math.floor(simMs / (DAY_S * 1000)) * DAY_S * 1000 + cyc; }
if (Q.has('hour')) seekPh(clamp((+Q.get('hour') - 16.67) / 3.08, 0, 1));
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;
const sunVec = (b, el) => V(Math.sin(b) * Math.cos(el), Math.sin(el), Math.cos(b) * Math.cos(el));   // +x east, +z north, y up
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const clockStr = (h) => { const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };

/* ====================================================================== noise + terrain (metres; the lane runs east–west along x) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
const PATHZ = 13;   // a mown path through the field, north of the middle
function terrainH(x, z) {
  let y = 0.22 * (fbm(x * 0.06 + 3, z * 0.06) - 0.5);
  if (z > 18) y += 0.004 * Math.pow(z - 18, 1.5);
  if (z < -24) y += 0.003 * Math.pow(-z - 24, 1.5);
  y += 0.0005 * Math.pow(Math.max(0, Math.abs(x) - 70), 2);
  return y;
}
const f4 = (n) => (+n).toFixed(4);

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
// GARDEN ROAD is built from the paintings: an oil-stick violet-black INK; a hedge-green DEEP; Bryson's turquoise contour as SEA
// (it also carries the road's grey and the shade on skin and white shirts); poppy-red HOT; a smudged pink GLOW; a primed-canvas PAPER.
// FLOWER FIELD is built from the paintings: a navy ground (INK), a brick red (DEEP), lilac (SEA), an orange-red (HOT),
// pink (GLOW) and cream (PAPER). There is no green ink: the field is navy and lilac, as in the painting of the skater over the flowers.
// Every colourway is taken from Bryson's paintings (the photos Match shared, 2026-10-30), in the six-ink roles:
// INK the darkest ground, DEEP a second dark (roofs, blossom), SEA a cool middle (lilac blooms, sky), HOT the accent (red crowns),
// GLOW a warm light (pink blooms), PAPER the light ground.
const COLORWAYS = [
  { name: 'FLOWER FIELD',   from: 'the skater over the flowers',     c: ['#1e2747', '#8f3a2a', '#b6b3ea', '#e9543c', '#f3b9c9', '#f1ece0'] },
  { name: 'ORANGE SEA',     from: 'the sitter by the orange shore',  c: ['#1b2442', '#41658f', '#93b4d4', '#ec6a1c', '#f39ac0', '#f3ecdc'] },
  { name: 'POPPY HEDGE',    from: 'the lilac shirt in the poppies',  c: ['#1f2b20', '#3f6b35', '#c4a4e2', '#ef6b28', '#f2a6b8', '#e9eef0'] },
  { name: 'RED WALL',       from: 'the red wall and the teal line',  c: ['#20263a', '#5a6620', '#33c3b6', '#d42a2a', '#e8c4e4', '#f7f0dd'] },
  { name: 'GREEN WALL',     from: 'the kickflip by the tulips',      c: ['#1c2a21', '#24523a', '#d9dbe6', '#da3a3a', '#f09fb8', '#eee1c8'] },
  { name: 'MINT SCRIBBLE',  from: 'the black line on mint and moss', c: ['#151515', '#5b4a1f', '#41c19c', '#cc2f29', '#83d06d', '#eff0ea'] },
  { name: 'OLIVE GARDEN',   from: 'the white shirt in the garden',   c: ['#1f2419', '#5c6c33', '#8f9ca2', '#c9332b', '#e7a4a7', '#ece6d3'] },
  { name: 'AROUND, ABOVE',  from: 'the walker and the white dog',    c: ['#1d1a1f', '#6b6a2e', '#9f92b6', '#e1b72a', '#d9cbc2', '#eeeae0'] },
  { name: 'SLATE ROOM',     from: 'the portrait on the pink floor',  c: ['#26333f', '#2f5530', '#4b6c86', '#9b3b22', '#e58ba7', '#e8e3dc'] },
  { name: 'CROSSWALK',      from: 'the skater on the white stripes', c: ['#0f2236', '#4c5b24', '#5088a8', '#d9342e', '#f2b18b', '#eef0ea'] },
  { name: 'MUSTARD SLIDE',  from: 'the plaid shirt on mustard',      c: ['#1a1414', '#5f5a2b', '#607e8b', '#7b2023', '#e0a32a', '#efe8da'] },
  { name: 'PINK ROOM',      from: 'the figure in the pink room',     c: ['#1b1519', '#7b3b6b', '#aaa5b9', '#e86b1f', '#ef90b2', '#f2ece5'] },
  { name: 'YELLOW SINGER',  from: 'the singer on yellow',            c: ['#2a241f', '#c79b1f', '#70a7b1', '#d1462f', '#b9b2c7', '#efe4c3'] },
  { name: 'LIME HOUSE',     from: 'the skater off the house',        c: ['#1f1b2d', '#2f6b6b', '#a0b7c0', '#c3344b', '#d0d95b', '#efe8d6'] },
  { name: 'COBALT',         from: 'the blue canvas',                 c: ['#0c1a5c', '#1e40ae', '#7c98d7', '#e15b2b', '#f2b7c7', '#f1efe9'] },
  { name: 'BRICK ROOM',     from: 'the skater on the brick ground',  c: ['#22191a', '#8e3424', '#3fcfb0', '#2b4fc0', '#e8443a', '#efe4c6'] },
  { name: 'PORTRAIT',       from: 'the small portrait',              c: ['#1f2a44', '#4a5a6a', '#9a9ae8', '#e2552e', '#f3c4a8', '#eae6dc'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky    */ [SEA, GLOW, PAPER, 0.9, 1], /* 1 sun/lamp */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 foliage */ [INK, INK, SEA, 1.2, 0],
  /* 3 pink bloom */ [INK, GLOW, PAPER, 0.6, 0], /* 4 bowl */ [INK, DEEP, HOT, 1.0, 0], /* 5 lilac bloom */ [INK, SEA, PAPER, 0.6, 0],
  /* 6 coping */ [DEEP, PAPER, PAPER, 0.9, 1], /* 7 dark */ [INK, INK, DEEP, 0.3, 0], /* 8 skin */ [DEEP, GLOW, PAPER, 0.6, 0],
  /* 9 white */ [SEA, PAPER, PAPER, 0.9, 0], /*10 shorts */ [INK, INK, SEA, 1.1, 0], /*11 board */ [INK, HOT, GLOW, 0.8, 0],
  /*12 field */ [INK, SEA, GLOW, 1.0, 0], /*13 white bloom */ [SEA, PAPER, PAPER, 0.6, 0], /*14 path */ [SEA, GLOW, PAPER, 0.9, 0],
  /*15 roof */ [DEEP, HOT, GLOW, 1.1, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1],
  grammar: { period: 6.4, dith: 0.12, wob: 7, outline: 1, hatch: 1.0, dab: 0.3 }, center: 38,
  uncanny: { next: rr(6, 12) * 60, counts: {}, last: {}, mem: {} }, rain: 0.4, at: Date.now(),
  gaps: 0, sunC: 0, texture: 0, light: null, log: [], runSec: 0
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
{ const away = clamp((Date.now() - (S.at || Date.now())) / 1000, 0, 14 * 86400); S.rain *= Math.exp(-away / (8 * 3600)); S._away = away; }   // the ground dried while the source was dark
for (const k of ['tension', 'rain', 'gaps', 'sunC', 'texture']) if (!isFinite(S[k])) S[k] = DEF()[k];
if (!(S.colorway >= 0 && S.colorway < COLORWAYS.length)) S.colorway = 0;
if (!S.grammar || !isFinite(S.grammar.dab)) S.grammar = Object.assign(DEF().grammar, S.grammar || {});
simT = S.runSec || 0;
function save() { try { S.runSec = simT; S.at = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: clockStr(goldenAt(simMs).clock), text }); if (S.log.length > 40) S.log.length = 40; }
if (!S.log.length) logEv('the field was found for the first time'); else { logEv('the field resumed (epoch ' + S.epoch + ')'); if (S._away > 6 * 3600) logEv(`the field was dark for ${(S._away / 3600).toFixed(0)} h; the ground dried`); }

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 16 / 9, 0.03, 4000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH); rtEdge.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect; uniform float uFocus, uAper; uniform float uPerPx, uWobPx, uPxK, uDab;
uniform vec3 uCamP; uniform vec3 uSunD; uniform float uLemon, uPaint;

// in paint mode the data target carries each surface's stroke direction on screen instead of a carved line
float angOf(vec3 W, vec3 T){ vec4 a=uVP*vec4(W,1.); vec4 b=uVP*vec4(W+T*0.05,1.); vec2 d=b.xy/max(abs(b.w),1e-4)-a.xy/max(abs(a.w),1e-4); d.x*=uAspect; return fract(atan(d.y,d.x)/3.14159265+1.); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
// V3: brush strokes painted onto each surface in its own coordinates (rows of strokes across s, laid along t), stepped in octaves of
// distance like the carved lines, so still things keep still paint and nothing swims. Returns (tone jitter, bristle).
uniform float uStrokePx, uV4; uniform float uBW[16], uBL[16];
// V3 (Study 003): one brush for everything
vec2 strokeOct3(float s, float t, float w){
  float s1=s/w+(vn(vec2(t/(w*2.2),floor(s/w)*1.3))-0.5)*0.45;
  float row=floor(s1); float fs=fract(s1);
  float L=3.4+1.6*hash(vec2(row,1.7));
  float t1=t/(w*L)+hash(vec2(row,3.7))*9.; float cell=floor(t1), ft=fract(t1);
  float st=0.12*hash(vec2(row,cell+0.5)), en=0.78+0.2*hash(vec2(cell,row+0.3));
  float side=abs(fs-0.5)*2.; float rag=(vn(vec2(t/(w*0.6),row*2.3))-0.5)*0.5;
  bool top=ft>st&&ft<en&&side<0.92+rag;
  float tone=top?hash(vec2(row,cell)):hash(vec2(row+0.5,floor(t1+0.5))+11.);
  float br=vn(vec2(t/(w*1.6)+row*3.1, s/(w*0.085)));
  if(top){ float tail=smoothstep(en-0.25,en,ft); br*=1.-0.65*tail*step(br,0.5); } else br*=0.75;
  return vec2(tone-0.5, br); }
vec2 strokeS3(float s, float t, float dist, float graze){
  float per=uStrokePx*max(dist,0.01)*uPxK*mix(1.,graze,0.5);
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float w0=exp2(floor(L));
  return mix(strokeOct3(s,t,w0),strokeOct3(s,t,w0*2.),f); }
// V4 (Study 004): each material's brush, after the paintings
// one octave of strokes of width w: (tone jitter, bristle, which-paint). Bristle below 0.2 marks a gap where the underpainting shows.
vec3 strokeOct(float s, float t, float w, float bl){
  float s1=s/w+(vn(vec2(t/(w*2.2),floor(s/w)*1.3))-0.5)*0.5;
  float row=floor(s1); float fs=fract(s1);
  float L=bl*(0.7+0.6*hash(vec2(row,1.7)));
  float t1=t/(w*L)+hash(vec2(row,3.7))*9.; float cell=floor(t1), ft=fract(t1);
  float st=0.05*hash(vec2(row,cell+0.5)), en=0.9+0.16*hash(vec2(cell,row+0.3));
  float side=abs(fs-0.5)*2.; float rag=(vn(vec2(t/(w*0.6),row*2.3))-0.5)*0.55;
