<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZTV · BIT FIELD 018 · LULL · BEDSIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  MZTV · BIT FIELD 018 · LULL
  A night field for falling asleep. A=432 Hz just-intoned pentatonic tones drift in and out over a low A drone,
  a breathing pad and a brown-noise bed. A breath pacer (inhale 40% / exhale 60%, slowing from 8 to 5 breaths/min)
  drives both the pad swell and the size of the lanterns. Tones fall only on the exhale. Every tone drops a lantern into
  a slow membrane of contours (pitch = height, pan = x). The arc: SETTLING → DESCENDING → DEEP. Tones thin out, the
  register falls, the breath flattens toward steady sound, the light dims and loses blue.
  Memory: lanterns leave sediment that holds the note heard there; worn ground later echoes it. A transition table
  learns the lullaby, so the melody grows more familiar the longer the piece has been heard. Voices unlock over hours.
  Two files, one source: index.html = MZTV stream (arc follows the local clock: day field, dusk descent, deep night,
  dawn); bedtime.html = bedside (arc starts when you press play, deep after ~45 min, then stays deep).
  Params: ?info=0|1|2 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?ff=H ?capture=1
          ?arc=MIN (bedside arc length, default 45) ?end=MIN (bedside: fade to silence at MIN)
          ?binaural=1 (optional delta-range binaural pair on the drone; needs headphones) ?vol=0..1.5 ?dim=0.1..1.5 ?t0=MIN
  Keys: i cycles info (compact / full / off)
-->
<style>
:root{--bg:#14070f;--mid:#4a1030;--hi:#e0506a;--gl:#ffb070;--tx:#ffc9a6}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);cursor:none}
body.wait{cursor:pointer}
#snd{right:1.2vw;bottom:1.6vh;font-size:clamp(11px,0.9vw,18px);font-weight:600;color:var(--gl);border-left:3px solid var(--gl);opacity:.95!important}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.box{position:fixed;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:clamp(8px,0.56vw,14px);line-height:1.4;
  color:var(--tx);background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--mid);border-left:3px solid var(--hi);
  padding:.7em .9em;white-space:pre-wrap;letter-spacing:.01em;pointer-events:none;transition:opacity 4s ease}
#info{left:1.2vw;top:1.6vh;max-width:52vw}
#log{left:1.2vw;bottom:1.6vh;max-width:40vw;border-left:3px solid var(--gl)}
.box b{color:var(--gl);font-weight:600}
.box i{font-style:normal;opacity:.62}
.box .h{color:var(--hi);font-weight:600}
.box .p{color:var(--gl);font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="info" class="box"></div>
<div id="log" class="box hide"></div>
<div id="snd" class="box hide">▶ CLICK / TAP ANYWHERE FOR SOUND</div>
<script>window.MZTV_BEDTIME = true;</script>
<script>
'use strict';
/* ================= utils + params ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, fin = v => Number.isFinite(v);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return fin(v) ? v : d; };
const BED = window.MZTV_BEDTIME === true;
const CAPTURE = Q.get('capture') === '1';
let INFO = CAPTURE ? 0 : clamp(parseInt(Q.get('info') ?? '1', 10) || 0, 0, 2);
const FRESH = Q.get('fresh') === '1', MUTE = Q.get('audio') === '0', BIN = Q.get('binaural') === '1';
const RATE = Math.max(0.01, num('rate', 1)), FF = Math.max(0, num('ff', 0));
const LINES = clamp(Math.round(num('lines', 270)), 90, 720);
const ARC = Math.max(1, num('arc', 45)), END = Math.max(0, num('end', 0)), VOL = clamp(num('vol', 1), 0, 1.5), DIM = clamp(num('dim', 1), 0.1, 1.5);
const KEY = BED ? 'mztv-lull-bed-v1' : 'mztv-lull-v1';
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function b64u8(u) { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function u8b64(s, n) { try { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return n && u.length !== n ? null : u; } catch (e) { return null; } }
const b64f = a => b64u8(new Uint8Array(a.buffer, a.byteOffset, a.byteLength));
function fb64(s, n) { const u = u8b64(s, n * 4); return u ? new Float32Array(u.buffer) : null; }

/* ================= tuning =================
   A4 = 432 Hz. Just-intoned pentatonic on A that also holds a D chord: A 1 · B 9/8 · D 4/3 · E 3/2 · F# 5/3.
   Tone pool spans A3 216 → F#5 720; 432 sits in the middle of it. */
const RAT = [1, 9 / 8, 4 / 3, 3 / 2, 5 / 3], NN = ['A', 'B', 'D', 'E', 'F#'];
const POOL = []; for (let o = 0; o < 2; o++) for (let k = 0; k < 5; k++) POOL.push(216 * Math.pow(2, o) * RAT[k]);   // 10 notes
const NP = POOL.length;
const noteName = i => NN[i % 5] + (3 + Math.floor(i / 5));
const CHORDS = [   // pad chords over the A pedal: [name, freqs, hue shift for hi/glow]
  { n: 'HOME · A', f: [108, 162, 216, 324], hue: 0 },
  { n: 'OPEN · Asus4', f: [108, 144, 216, 288], hue: -7 },
  { n: 'WARM · D/A', f: [108, 180, 216, 288], hue: 9 },
  { n: 'SIX · A6/9', f: [108, 162, 243, 360], hue: 4 },   // unlocked by memory
];
const CHORD_NEXT = [[1, 2, 3], [0, 2], [0, 1], [0, 2]];

/* ================= state + memory ================= */
const SW = 128, SH = 72, SN = SW * SH;
function priorMk() { const m = new Float32Array(NP * NP); for (let i = 0; i < NP; i++) for (let j = 0; j < NP; j++) { const d = Math.abs(i - j); m[i * NP + j] = [0.35, 1, 0.6, 0.25, 0.08][Math.min(d, 4)] * (d > 4 ? 0.5 : 1); } return m; }
const PRIOR = priorMk();
function freshState(seed) {
  return { v: 1, seed: seed || ((Math.random() * 1e9) | 0), hours: 0, tones: 0, sessions: 0, sed: new Float32Array(SN), note: new Uint8Array(SN).fill(255),
    mk: PRIOR.slice(), unlock: { echo: false, six: false, tide: false, low: false }, pal: [0, 0, 0, 0], gram: { a: 0, b: 0, k: 1 }, era: { n: 1, since: 0, p: 0 },
    chord: 0, lastIdx: 5, drift: { x: 0, y: 0, ang: 0.4 }, log: [] };
}
function loadState() {
  const seedQ = Q.has('seed') ? (parseInt(Q.get('seed'), 10) | 0) : 0;
  if (FRESH || CAPTURE) { if (FRESH) try { localStorage.removeItem(KEY); } catch (e) { } return freshState(seedQ); }
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!o || o.v !== 1) return freshState(seedQ);
    const s = Object.assign(freshState(o.seed), o);
    s.sed = fb64(o.sed, SN) || new Float32Array(SN); s.note = u8b64(o.note, SN) || new Uint8Array(SN).fill(255);
    const mk = fb64(o.mk, NP * NP); s.mk = mk || PRIOR.slice();
    sanitize(s); return s;
  } catch (e) { return freshState(seedQ); }
}
function sanitize(s) {
  for (let i = 0; i < SN; i++) if (!fin(s.sed[i]) || s.sed[i] < 0) s.sed[i] = 0; else if (s.sed[i] > 1) s.sed[i] = 1;
  for (let i = 0; i < NP * NP; i++) if (!fin(s.mk[i]) || s.mk[i] <= 0) s.mk[i] = PRIOR[i];
  if (!fin(s.hours)) s.hours = 0; if (!fin(s.era.p)) s.era.p = 0; if (!fin(s.gram.k)) s.gram.k = 1;
  for (let i = 0; i < 4; i++) if (!fin(s.pal[i])) s.pal[i] = 0;
  if (!(s.chord >= 0 && s.chord < CHORDS.length)) s.chord = 0; if (!(s.lastIdx >= 0 && s.lastIdx < NP)) s.lastIdx = 5;
  for (const k of ['x', 'y', 'ang']) if (!fin(s.drift[k])) s.drift[k] = 0;
}
function saveState() {
  if (CAPTURE) return;
  try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, S, { sed: b64f(S.sed), note: b64u8(S.note), mk: b64f(S.mk), log: S.log.slice(-60) }))); } catch (e) { }
}
let S = loadState(); S.sessions++;
const RND = mulberry(S.seed ^ (Date.now() & 0xffff));
const SEEDH = S.seed | 0;
const START_MS = Date.now(), PERF0 = performance.now();
let T = BED ? num('t0', 0) * 60 : 0;   // sim seconds since start (bedside: minutes into the arc)
function stamp() { const s = Math.floor((performance.now() - PERF0) / 1000 * RATE); const p = n => String(n).padStart(2, '0'); return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`; }
function logEv(m) { S.log.push({ t: stamp(), m }); if (S.log.length > 60) S.log.shift(); renderLog(); }

/* ================= the arc =================
   a: 0 = settling · 1 = deep. Bedside: minutes since play / ARC. Stream: the local clock
   (07–19 day field · 19–22:30 dusk descent · 22:30–05:30 deep · 05:30–07 dawn). */
let DAWN = false, CLOCKPH = '';
function arcNow() {
  if (BED) return T / 60 / ARC;
  const d = new Date(START_MS + T * 1000), h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  DAWN = false;
  if (h >= 7 && h < 19) { CLOCKPH = 'DAY FIELD'; return 0; }
  if (h >= 19 && h < 22.5) { CLOCKPH = 'DUSK DESCENT'; return (h - 19) / 3.5; }
  if (h >= 5.5 && h < 7) { CLOCKPH = 'DAWN'; DAWN = true; return 1 - (h - 5.5) / 1.5; }
  CLOCKPH = 'NIGHT · DEEP'; return 1.3;
}
const P = { a: 0, s: 0, deep: 0, period: 7.5, depth: 1, rate: 8, lo: 2, hi: 9, lum: 1, noise: 0.3, noiseLP: 520, speed: 1, master: 1, endG: 1, phase: '' };
function derive() {
  const a = arcNow(), s = smooth(a), deep = smooth((a - 0.75) / 0.5);
  P.a = a; P.s = s; P.deep = deep;
  P.period = lerp(7.5, 12, s);                       // 8 → 5 breaths per minute
  P.depth = 1 - 0.72 * deep;                         // breath modulation flattens once asleep: steady sound arouses least
  P.rate = lerp(8, 2.6, s) * (1 - 0.65 * deep);      // tones per minute
  P.hi = lerp(6, 5, s); P.lo = lerp(1.5, 0, s);      // tones stay at or under B4 486 Hz; 432 is the ceiling in deep
  P.lum = lerp(1, 0.5, s) * (1 - 0.4 * deep) * DIM;
  P.noise = lerp(0.3, 0.78, s); P.noiseLP = lerp(520, 250, s);
  P.speed = lerp(1, 0.42, s); P.master = lerp(1, 0.8, s);
  P.endG = BED && END > 0 ? 1 - smooth((T / 60 - END) / 2) : 1;
  P.phase = BED ? (a < 0.35 ? 'SETTLING' : a < 1 ? 'DESCENDING' : 'DEEP') : CLOCKPH;
}

/* ================= breath + tones =================
   Breath phase is a continuous accumulator (period changes never jump). Inhale 40% rises, exhale 60% falls (C1 smooth).
   At each breath, tones are planned only inside the exhale. The melody walks a learned transition table. */
let BP = RND(), BE = 0.5, BMOD = 0.5;
const breathEnv = f => f < 0.4 ? 0.5 - 0.5 * Math.cos(Math.PI * f / 0.4) : 0.5 + 0.5 * Math.cos(Math.PI * (f - 0.4) / 0.6);
const PEND = [];         // planned tones {t, idx, amp, echo, x, y, pan, au, vis}
const LANT = [];         // visual lanterns
function familiarity() {  // how far the learned table has narrowed from the prior (0..1)
  let h = 0, hp = 0;
  for (let i = 0; i < NP; i++) { let s = 0, sp = 0; for (let j = 0; j < NP; j++) { s += S.mk[i * NP + j]; sp += PRIOR[i * NP + j]; }
    for (let j = 0; j < NP; j++) { const p = S.mk[i * NP + j] / s, q = PRIOR[i * NP + j] / sp; if (p > 0) h -= p * Math.log(p); if (q > 0) hp -= q * Math.log(q); } }
  return clamp(1 - h / hp, 0, 1) * 4;   // entropy drops slowly; scaled so a few nights reads as meaningful
}
let FAM = 0;
function nextIdx(i) {
  const lo = Math.floor(P.lo), hi = Math.ceil(P.hi), ex = 1 + 0.9 * clamp(FAM, 0, 1) + Math.min(0.6, S.hours / 40);
  let tot = 0; const w = new Float32Array(NP);
  for (let j = lo; j <= hi; j++) { w[j] = Math.pow(S.mk[i * NP + j], ex); tot += w[j]; }
  if (!(tot > 0)) return clamp(i, lo, hi);
  let r = RND() * tot; for (let j = lo; j <= hi; j++) { r -= w[j]; if (r <= 0) return j; } return hi;
}
function learn(i, j) { const k = i * NP + j; S.mk[k] = Math.min(6, S.mk[k] + 0.22); }
function placeFor(idx) {   // pitch = height; memory pulls lanterns toward familiar (moderately worn) ground
  const yN = 0.86 - 0.72 * (idx / (NP - 1));
  let best = null, bs = -1;
  for (let c = 0; c < 6; c++) {
    const x = 0.08 + RND() * 0.84, y = clamp(yN + (RND() - 0.5) * 0.12, 0.06, 0.94);
    const s = S.sed[Math.floor(y * (SH - 1)) * SW + Math.floor(x * (SW - 1))], sc = s * (1 - s) * 4 * 0.8 + RND() * 0.35;
    if (sc > bs) { bs = sc; best = { x, y }; }
  }
  return best;
}
function planBreath() {
  const per = P.period, lam = P.rate * per / 60;
  let n = 0, L = Math.exp(-lam), p = RND(); while (p > L && n < 3) { n++; p *= RND(); }
  let i = S.lastIdx;
  for (let k = 0; k < n; k++) {
    const j = nextIdx(i); learn(i, j); i = j;
    const t = T + per * (0.42 + 0.5 * (k + 0.2 + RND() * 0.6) / n);
    const pos = placeFor(j);
    PEND.push({ t, idx: j, amp: 0.8 - 0.25 * P.s, x: pos.x, y: pos.y, pan: (pos.x * 2 - 1) * 0.7, au: false, vis: false });
    // a fifth beneath, sometimes, while still settling
    if (P.a < 0.5 && j >= 3 && RND() < 0.18) PEND.push({ t: t + 0.9, idx: j - 3, amp: 0.45, x: pos.x, y: clamp(pos.y + 0.1, 0, 0.94), pan: (pos.x * 2 - 1) * 0.5, au: false, vis: false, quiet: true });
  }
  S.lastIdx = i;
  // harmonic centre moves at breath boundaries, rarely, and less often in deep
  if (RND() < 1 / lerp(26, 60, P.s)) changeChord();
}
function changeChord(force) {
  const opts = CHORD_NEXT[S.chord].filter(c => c !== 3 || S.unlock.six);
  const c = opts[Math.floor(RND() * opts.length)];
  if (c === undefined || (c === S.chord && !force)) return;
  S.chord = c; padChord(c); logEv(`harmonic centre → ${CHORDS[c].n}`);
}
function breathTick(dt) {
  const prev = BP; BP += dt / P.period;
  let crossings = Math.floor(BP) - Math.floor(prev); if (crossings > 3) crossings = 3;
  for (let k = 0; k < crossings; k++) planBreath();
  BE = breathEnv(BP - Math.floor(BP)); BMOD = 1 - P.depth + P.depth * BE;
}
function spawnLantern(e) {
  const hiN = e.idx / (NP - 1);
  LANT.push({ x: e.x, y: e.y, t0: e.t, idx: e.idx, amp: e.amp * 1.15 * (e.echo ? 0.5 : e.quiet ? 0.6 : 1) * (0.75 + 0.45 * hiN), R: 11 + (1 - hiN) * 13, rs: 4.5 + RND() * 2, echo: !!e.echo });
  if (LANT.length > 24) LANT.shift();
  // sediment: memory of where tones landed and which note was heard there
  const cx = e.x * (SW - 1), cy = e.y * (SH - 1);
  for (let y = Math.max(0, Math.floor(cy - 5)); y <= Math.min(SH - 1, Math.ceil(cy + 5)); y++)
    for (let x = Math.max(0, Math.floor(cx - 5)); x <= Math.min(SW - 1, Math.ceil(cx + 5)); x++) {
      const d2 = (x - cx) * (x - cx) + (y - cy) * (y - cy), w = 0.1 * Math.exp(-d2 / 6), k = y * SW + x;
      if (!e.echo) { S.sed[k] = Math.min(1, S.sed[k] + w * (1 - S.sed[k] * 0.5)); if (w > 0.05) S.note[k] = e.idx; }
    }
  if (!e.echo) {
    S.tones++;
    const k = Math.round(cy) * SW + Math.round(cx);
    if (S.unlock.echo && S.sed[k] > 0.45 && S.note[k] !== 255 && RND() < 0.3) {
      const ni = S.note[k];
      PEND.push({ t: T + 3.5 + RND() * 2, idx: ni, amp: 0.4, x: clamp(e.x + (RND() - 0.5) * 0.06, 0.02, 0.98), y: e.y, pan: -(e.x * 2 - 1) * 0.6, au: false, vis: false, echo: true });
    }
  }
}

/* ================= slow memory + evolution (once per sim minute) ================= */
const SED_DECAY = Math.pow(0.5, 1 / (72 * 60)), MK_K = 1 - Math.pow(0.5, 1 / (4 * 24 * 60));
const GRAM = ['LATTICE', 'PEARL', 'GRAIN'];
let MINACC = 0, COVER = 0;
function memMinute() {
  S.hours += 1 / 60;
  let cov = 0;
  for (let i = 0; i < SN; i++) { const v = S.sed[i] * SED_DECAY; S.sed[i] = v; if (v > 0.3) cov++; if (v < 0.02 && S.note[i] !== 255 && v < 0.005) S.note[i] = 255; }
  COVER = cov / SN;
  for (let i = 0; i < NP * NP; i++) S.mk[i] += (PRIOR[i] - S.mk[i]) * MK_K;
  FAM = familiarity();
  // palette drift: random walk, pulled home, clamped to its family
  for (let i = 0; i < 4; i++) { S.pal[i] += (RND() - 0.5) * 0.8 - S.pal[i] * 0.02; S.pal[i] = clamp(S.pal[i], -16, 16); }
  // membrane currents turn over hours
  S.drift.ang += (RND() - 0.5) * 0.01;
  // unlocks, spread over hours of accumulated listening
  const U = S.unlock;
  if (!U.echo && S.hours > 1.5 && COVER > 0.04) { U.echo = true; logEv('unlocked · worn ground now echoes its note'); }
  if (!U.low && S.hours > 3) { U.low = true; logEv('unlocked · low A bell in the deep'); }
  if (!U.six && S.hours > 7 && FAM > 0.25) { U.six = true; logEv('unlocked · A6/9 chord (F# 360 Hz joins the pad)'); }
  if (!U.tide && S.hours > 16) { U.tide = true; logEv('unlocked · tide: the noise bed begins to move across the room'); }
  // visual grammar: pressure from how worn and how familiar the field has become
  S.era.p += (0.012 + COVER * 0.08 + FAM * 0.02) * (P.a < 0.2 ? 0.6 : 1);
  if (S.era.p > 1 && S.hours - S.era.since > 0.66) {
    const next = FAM > 0.5 ? 1 : COVER > 0.12 ? 2 : (S.gram.b + 1) % 3;
    if (next !== S.gram.b) { S.gram.a = S.gram.b; S.gram.b = next; S.gram.k = 0; S.era.n++; S.era.since = S.hours; S.era.p = 0; logEv(`dither grammar → ${GRAM[next]} (era ${S.era.n})`); }
    else S.era.p = 0.5;
  }
}

/* ================= visuals ================= */
const cv = document.getElementById('cv'), cx = cv.getContext('2d', { alpha: false });
let W = 480, H = 270, SC = 1, IMG, BUF, LF, GW, GH, BG, THR = [], THRM, CX0, CXF, RY0, RYF;
function resize() {
  // a hidden tab / unsized OBS source can report 0×0 at load: fall back, then the resize listener corrects it
  const iw = CAPTURE ? 1920 : (innerWidth || document.documentElement.clientWidth || 1920), ih = CAPTURE ? 1080 : (innerHeight || document.documentElement.clientHeight || 1080);
  SC = Math.max(1, Math.round(ih / LINES)); W = Math.max(8, Math.ceil(iw / SC)); H = Math.max(8, Math.ceil(ih / SC));
  cv.width = W; cv.height = H; cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px';
  IMG = cx.createImageData(W, H); BUF = new Uint32Array(IMG.data.buffer); LF = new Float32Array(W * H);
  GW = Math.ceil(W / 4) + 2; GH = Math.ceil(H / 4) + 2; BG = new Float32Array(GW * GH);
  CX0 = new Int32Array(W); CXF = new Float32Array(W); RY0 = new Int32Array(H); RYF = new Float32Array(H);
  for (let x = 0; x < W; x++) { const g = x / 4; CX0[x] = g | 0; CXF[x] = g - (g | 0); }
  for (let y = 0; y < H; y++) { const g = y / 4; RY0[y] = g | 0; RYF[y] = g - (g | 0); }
  // dither grammars: LATTICE (bayer 8) · PEARL (round clustered dots) · GRAIN (interleaved gradient)
  const b8 = new Float32Array(64); { const m = [[0]]; let M = m; for (let n = 1; n < 8; n *= 2) { const N = []; for (let y = 0; y < 2 * n; y++) { N.push([]); for (let x = 0; x < 2 * n; x++) N[y].push(4 * M[y % n][x % n] + [0, 2, 3, 1][(y >= n) * 2 + (x >= n)]); } M = N; } for (let i = 0; i < 64; i++) b8[i] = (M[i >> 3][i & 7] + 0.5) / 64; }

  setP(g.nF1.frequency, P.noiseLP, 2); setP(g.nF2.frequency, P.noiseLP * 1.2, 2);
  setP(g.nP.pan, S.unlock.tide ? 0.35 * Math.sin(T * 2 * Math.PI / 47) : 0, 0.8);
  setP(g.droneG.gain, 0.16 + 0.04 * P.deep, 3);
  setP(g.wet.gain, 0.38 + 0.2 * P.s, 3);
  setP(g.toneF.frequency, lerp(900, 650, P.s), 3);
  if (g.binR) setP(g.binR.frequency, 108 + lerp(6, 2, P.s), 4);
}
function audioUnlock() { if (MUTE) return; AU.wanted = true; if (!AU.ctx) { if (!AU.busy) { AU.busy = true; createContext().finally(() => { AU.busy = false; }); } } else if (AU.ctx.state !== 'running') AU.ctx.resume().catch(() => { }); }
for (const ev of ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown']) addEventListener(ev, audioUnlock, { capture: true });
const sndEl = document.getElementById('snd');
function soundPlate() { const need = !MUTE && !CAPTURE && !(AU.ctx && AU.ctx.state === 'running'); sndEl.classList.toggle('hide', !need); document.body.classList.toggle('wait', need); }
setInterval(soundPlate, 300);

/* ================= the clock: one advance() for both rAF and the audio interval ================= */
let lastAdv = performance.now(), SAVE_ACC = 0, NAN_CHECK = 0;
function advance(realDt, audible) {
  const dt = clamp(realDt, 0, 2) * RATE;
  T += dt; TV += dt * P.speed;
  derive(); breathTick(dt);
  if (S.gram.k < 1) { S.gram.k = Math.min(1, S.gram.k + dt / 180); }
  MINACC += dt; let n = 0; while (MINACC >= 60 && n++ < 30) { MINACC -= 60; memMinute(); } if (MINACC >= 60) MINACC = 0;
  // tones: to audio when inside the lookahead, to the field when their time arrives
  const running = audible && AU.ctx && AU.g && AU.ctx.state === 'running';
  const look = (document.hidden ? 1.8 : 0.5) * RATE;
  for (let k = PEND.length - 1; k >= 0; k--) {
    const e = PEND[k];
    if (!e.au && e.t <= T + look) { e.au = true; if (running && RATE <= 4) { const at = AU.ctx.currentTime + Math.max(0.03, (e.t - T) / RATE); if (at > AU.ctx.currentTime) playTone(e, at); } }
    if (!e.vis && e.t <= T) { e.vis = true; spawnLantern(e); }
    if (e.au && e.vis) PEND.splice(k, 1);
  }
  for (let k = LANT.length - 1; k >= 0; k--) if (T - LANT[k].t0 > 22) LANT.splice(k, 1);
  if (running) { CTL_ACC += realDt; if (CTL_ACC >= 0.1) { CTL_ACC = 0; audioControl(); } if (!AU.worklet) noiseSegments(); }
  SAVE_ACC += realDt; if (SAVE_ACC >= 60) { SAVE_ACC = 0; saveState(); }
  NAN_CHECK += realDt; if (NAN_CHECK > 5) { NAN_CHECK = 0; selfHeal(); }
}
function selfHeal() {   // never freeze: sanitise memory and scalar state
  let bad = false; for (let i = 0; i < SN; i += 7) if (!fin(S.sed[i])) { bad = true; break; }
  if (bad || !fin(T) || !fin(TV) || !fin(BP)) { if (!fin(T)) T = 0; if (!fin(TV)) TV = 0; if (!fin(BP)) BP = 0; sanitize(S); logEv('self-heal · field regrown from memory'); }
}
function tickFromInterval() { const n = performance.now(), d = (n - lastAdv) / 1000; lastAdv = n; advance(d, true); }
function prewarm() {   // "it was running before you arrived": 40 s of breaths, silently, so lanterns are already in the field
  const t0 = T; T -= 40; for (let i = 0; i < 400; i++) { T += 0.1; TV += 0.1; derive(); breathTick(0.1); for (let k = PEND.length - 1; k >= 0; k--) { const e = PEND[k]; if (e.t <= T) { e.au = true; spawnLantern(e); PEND.splice(k, 1); } } }
  T = t0; for (const L of LANT) if (L.t0 > T) L.t0 = T;
}
function fastForward(hours) {   // pre-run memory: breaths, tones, sediment, learning, unlocks. Arc/time restored after.
  const t0 = T, tv0 = TV, steps = Math.floor(hours * 3600 / 2);
  for (let i = 0; i < steps; i++) { T += 2; derive(); breathTick(2); MINACC += 2; if (MINACC >= 60) { MINACC -= 60; memMinute(); }
    for (let k = PEND.length - 1; k >= 0; k--) { const e = PEND[k]; if (e.t <= T) { spawnLantern(e); PEND.splice(k, 1); } } if (LANT.length > 20) LANT.length = 0; }
  T = t0; TV = tv0; LANT.length = 0; PEND.length = 0; S.gram.k = 1; logEv(`fast-forwarded ${hours} h of memory`);
}

/* ================= info ================= */
const infoEl = document.getElementById('info'), logEl = document.getElementById('log');
let INFO_WAKE = performance.now();
function applyInfo() { infoEl.classList.toggle('hide', INFO < 1); logEl.classList.toggle('hide', INFO < 2); }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]); }
function renderLog() { if (INFO < 2) return; logEl.innerHTML = '<span class="h">EVOLUTION LOG</span>\n' + (S.log.slice(-7).map(e => `<i>${esc(e.t)}</i> ${esc(e.m)}`).join('\n') || '<i>listening…</i>'); }
addEventListener('keydown', e => { INFO_WAKE = performance.now(); if (e.key === 'i' || e.key === 'I') { INFO = (INFO + 2) % 3; applyInfo(); renderLog(); renderInfo(); } });
addEventListener('pointerdown', () => { INFO_WAKE = performance.now(); });
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
function renderInfo() {
  if (INFO < 1) return;
  const I = [], bpm = 60 / P.period, inS = P.period * 0.4, outS = P.period * 0.6;
  const snd = MUTE ? ' <i>· audio off</i>' : AU.ctx && AU.ctx.state === 'running' ? '' : ' <span class="p">· TAP / CLICK FOR SOUND</span>';
  const where = BED ? `BEDSIDE · ${mmss(T)} in · ${P.phase}${END > 0 ? ` · fades out at ${END} min` : ''}` : `${P.phase} · ${new Date(START_MS + T * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
  I.push(`<span class="h">MZTV · BIT FIELD 018 · LULL</span>  ${where}${snd}`);
  I.push(`<b>BREATH</b> ${bpm.toFixed(1)}/min · in ${inS.toFixed(1)} s · out ${outS.toFixed(1)} s → pad swell + lantern size${P.depth < 0.6 ? ' <i>(flattening: steady sound once asleep)</i>' : ''}`);
  I.push(`<b>TONES</b> A = 432 Hz just pentatonic · ${noteName(Math.floor(P.lo))}–${noteName(Math.ceil(P.hi))} · ~${P.rate.toFixed(1)}/min, only on the exhale → each drops a lantern (pitch = height)`);
  I.push(`<b>BED</b> A drone 54 Hz · pad ${CHORDS[S.chord].n} · brown noise ${Math.round(P.noise * 100)}% under ${Math.round(P.noiseLP)} Hz${BIN ? ` · binaural Δ ${lerp(6, 2, P.s).toFixed(1)} Hz` : ''}`);
  I.push(`<b>LIGHT</b> ${Math.round(clamp(P.lum, 0, 1.5) * 100)}% · blue ${Math.round((1 - 0.45 * P.s) * 100)}% · motion ${Math.round(P.speed * 100)}% → dims toward sleep`);
  I.push(`<b>MEMORY</b> ${S.hours.toFixed(1)} h heard · lullaby familiarity ${Math.round(clamp(FAM, 0, 1) * 100)}% · worn ground ${Math.round(COVER * 100)}% · ${GRAM[S.gram.b]}`);
  infoEl.innerHTML = I.join('\n');
  // bedside: the box recedes after a minute and a half so it doesn't light the room
  const idle = (performance.now() - INFO_WAKE) / 1000;
  const op = BED ? (idle > 90 ? 0.18 : 0.8) : lerp(0.88, 0.5, P.s);
  infoEl.style.opacity = op; logEl.style.opacity = op;
}

/* ================= boot ================= */
resize(); addEventListener('resize', () => { if (!CAPTURE) resize(); });
document.addEventListener('visibilitychange', () => { if (!CAPTURE && !document.hidden && (cv.width * SC < innerWidth - SC || cv.height * SC < innerHeight - SC)) resize(); });
derive(); FAM = familiarity(); palette();
if (FF > 0) fastForward(FF);
prewarm();
if (S.sessions === 1 && S.log.length === 0) logEv(BED ? 'bedside session begins · settling' : 'field opens');
applyInfo(); renderInfo(); renderLog();
if (!MUTE && !CAPTURE) audioUnlock();   // OBS allows autoplay; a browser waits for a tap
cv.addEventListener('webglcontextlost', e => e.preventDefault());
let PAL_ACC = 0, INFO_ACC = 0;
function frame(dt) { PAL_ACC += dt; if (PAL_ACC > 0.5) { PAL_ACC = 0; palette(); blendThr(); } INFO_ACC += dt; if (INFO_ACC > 0.5) { INFO_ACC = 0; renderInfo(); } render(); }
if (!CAPTURE) {
  setInterval(tickFromInterval, 40);
  setInterval(audioWatch, 1000);
  let lastR = performance.now();
  const loop = () => { const n = performance.now(), d = (n - lastR) / 1000; lastR = n; frame(d); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
}
window.MZ = {
  get S() { return S; }, get P() { return P; }, get T() { return T; }, get LANT() { return LANT; }, get AU() { return AU; },
  tick(dt) { advance(dt, false); frame(dt); },
  force(op) { if (op === 'chord') changeChord(true); else if (op === 'grammar') { S.era.p = 2; S.era.since = -9; memMinute(); } else if (op === 'unlock') { S.hours = Math.max(S.hours, 20); S.unlock.echo = true; memMinute(); } else if (op === 'deep') { T = BED ? ARC * 60 * 1.5 : T; } else if (op === 'nan') { S.sed[5] = NaN; T = NaN; } },
  setT(min) { T = min * 60; }, rebuild: () => rebuildGraph(), save: saveState,
};
</script>
