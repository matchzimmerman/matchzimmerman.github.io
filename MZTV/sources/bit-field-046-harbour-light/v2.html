<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZTV — HARBOUR LIGHT · BIT FIELD 046 · v2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1530}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#info{position:absolute;left:18px;bottom:16px;max-width:min(560px,46vw);padding:9px 11px 8px;font:11px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;white-space:pre-wrap;pointer-events:none;border-left:3px solid;transition:opacity .6s}
#info b{font-weight:700;letter-spacing:.12em}
#info .d{opacity:.72}
#info.off{opacity:0}
</style></head><body>
<canvas id="screen" aria-label="Generative harbour at low sun after J.M.W. Turner, driven by live weather"></canvas>
<div id="info"></div>
<script>
'use strict';
/* =====================================================================
   MZTV · BIT FIELD 046 · HARBOUR LIGHT — after J.M.W. Turner
   v2. A low sun over a working harbour, printed in six inks of dithered
   pixels. Three harbours Turner painted (Margate, the Thames at
   Rotherhithe, Venice) under the sky of wherever this screen is: its
   own sun, clock and live weather. Focus drifts in and out. Built to run for days on one screen or wrapped
   round a room (?walls=N&wall=i).
   ===================================================================== */
const Q=new URLSearchParams(location.search);
const qn=(k,d)=>{const v=Number(Q.get(k));return Q.has(k)&&Number.isFinite(v)?v:d;};
const LINKED=window.MZTV_LINKED===true;
const OPT={
  info:Q.get('info')!=='0', fresh:Q.get('fresh')==='1', audio:Q.get('audio')!=='0',
  seed:qn('seed',46)|0, rate:Math.max(.05,Math.min(240,qn('rate',1))), lines:Math.max(90,Math.min(400,qn('lines',180)|0)),
  ff:Math.max(0,Math.min(96,qn('ff',0))), capture:Q.get('capture')==='1', live:Q.get('live')!=='0',
  walls:Math.max(1,Math.min(12,qn('walls',1)|0)), wall:Q.has('wall')?Math.max(0,qn('wall',0)|0):-1,
  site:(Q.get('site')||'').toLowerCase(), hour:Q.has('hour')?qn('hour',17):null, held:(Q.get('held')||'').toLowerCase(),
  lat:Q.has('lat')?qn('lat',NaN):NaN, lon:Q.has('lon')?qn('lon',NaN):NaN, place:Q.get('place')||'', focus:(Q.get('focus')||'').toLowerCase(),
  sun:Math.max(.05,Math.min(.95,qn('sun',.62))), fps:Math.max(8,Math.min(60,qn('fps',30)))
};
const SYNC=OPT.walls>1&&OPT.wall>=0;        // wall-slice mode: everything derived from the clock so separate machines agree
const MEMORY_ON=!OPT.capture&&!SYNC;
const STORE=LINKED?'mztv-harbour-light-play-v1':'mztv-harbour-light-v1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const fin=(v,d)=>Number.isFinite(v)?v:d;

/* ---------- deterministic randomness ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash3(a,b,c){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,2147483647)+OPT.seed*97;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
const PERM=new Uint8Array(512);{const r=mulberry(OPT.seed*7919+11),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=r()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)PERM[i]=p[i&255];}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
  const a=PERM[PERM[X]+Y],b=PERM[PERM[X+1]+Y],c=PERM[PERM[X]+Y+1],d=PERM[PERM[X+1]+Y+1];
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return((a+(b-a)*u)+((c+(d-c)*u)-(a+(b-a)*u))*v)/255;}
function fbm3(x,y){return vn(x,y)*.55+vn(x*2.03+17.1,y*2.03+3.7)*.3+vn(x*4.1+5.3,y*4.1+41.9)*.15;}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

/* ---------- places Turner painted ---------- */
const SITES=[
  {id:'margate',name:'MARGATE',sub:'THANET SKIES',lat:51.389,lon:1.381,mlat:51.40,mlon:1.40,root:73.42,tz:0},
  {id:'thames',name:'THAMES · ROTHERHITHE',sub:'THE TEMERAIRE REACH',lat:51.500,lon:-0.050,mlat:null,mlon:null,root:65.41,tz:0},
  {id:'venice',name:'VENICE · GIUDECCA',sub:'THE LAGOON',lat:45.427,lon:12.330,mlat:45.38,mlon:12.40,root:77.78,tz:1}
];
const SITE_HOURS=4, SITE_XFADE=0.25; // hours at each place, crossfade hours (through a veil)

/* ---------- inks: four low-sun moods, six inks each (dark → light) ---------- */
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const MOODS={
  night:  ['#131937','#27396f','#4b6598','#8ba1b8','#d1cda8','#f4eccc'].map(hex),
  dawn:   ['#2b2c59','#5b6ba6','#a9b4c4','#e7cf8e','#f6e39a','#fffbe0'].map(hex),
  evening:['#2b1637','#6f2a4c','#c5463a','#ee8a32','#fbc94c','#fff3c4'].map(hex),
  day:    ['#34325f','#74719f','#c7b8a2','#efca7c','#f8e6a6','#fffcee'].map(hex)
};
const LANTERN=hex('#ff8f2e');

/* ---------- solar position (NOAA, simplified) ---------- */
function solar(lat,lon,ms){
  const d=ms/86400000+2440587.5-2451545,g=(357.529+.98560028*d)*Math.PI/180,q=280.459+.98564736*d;
  const L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*Math.PI/180,e=(23.439-3.6e-7*d)*Math.PI/180;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=(18.697374558+24.06570982441908*d)%24,lst=(gmst*15+lon)*Math.PI/180;
  let ha=lst-ra;ha=Math.atan2(Math.sin(ha),Math.cos(ha));
  const la=lat*Math.PI/180,el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha));
  return{elev:el*180/Math.PI,ha:ha*12/Math.PI}; // ha in hours, <0 morning
}

/* ---------- canvas / resolution ---------- */
const cv=$('screen'),g=cv.getContext('2d',{alpha:false});
const mk=document.createElement('canvas'),mg=mk.getContext('2d',{willReadFrequently:true}); // silhouettes
const rk=document.createElement('canvas'),rg=rk.getContext('2d',{willReadFrequently:true}); // reflections
let W=320,H=180,SCALE=6,HY=108,img=null,px32=null,skyL=null,TOTALX=1,OX=0,PAD=0;
let bMap=null,B1=null,B2=null,B3=null,B4=null,BT=null,rowDepth=null;
function resize(){
  const vw=Math.max(1,innerWidth),vh=Math.max(1,innerHeight);
  SCALE=Math.max(1,Math.round(vh/OPT.lines));H=Math.ceil(vh/SCALE);const Wv=Math.ceil(vw/SCALE);
  PAD=SYNC?Math.round(H*.2):0;W=Wv+2*PAD; // wall slices render a hidden margin so soft focus meets across the seams
  HY=Math.round(H*.6);
  cv.width=W;cv.height=H;cv.style.width=W*SCALE+'px';cv.style.height=H*SCALE+'px';cv.style.left=(-PAD*SCALE)+'px';
  mk.width=rk.width=W;mk.height=rk.height=H;
  img=g.createImageData(W,H);px32=new Uint32Array(img.data.buffer);skyL=new Float32Array(W*H);
  TOTALX=Wv*OPT.walls/H; OX=SYNC?OPT.wall*Wv-PAD:0;
  bMap=new Float32Array(W*H);B1=new Float32Array(W*H);B2=new Float32Array(W*H);B3=new Float32Array(W*H);B4=new Float32Array(W*H);BT=new Float32Array(W*H);
  rowDepth=new Float32Array(H);for(let y=0;y<H;y++)rowDepth[y]=y<=HY?1:clamp(1-Math.pow(clamp((y-HY-1)/((H-HY)*.95),0,1),1/2.1),0,1);
  buildHarbours();
}

/* ---------- harbours: what stands on the water at each place ---------- */
let HARB=[];
function buildHarbours(){
  HARB=SITES.map((s,si)=>{
    const r=mulberry(OPT.seed*131+si*977),things=[],T=TOTALX,sx=T*OPT.sun;
    const n=Math.max(8,Math.round(T*5.5));
    const kinds=si===0?['lugger','lugger','smack','ship','rowboat','lugger','ship']
               :si===1?['barge','barge','ship','lighter','barge','ship','rowboat']
               :['gondola','gondola','trabaccolo','ship','gondola','sandolo','trabaccolo'];
    for(let i=0;i<n;i++){
      const d=.06+.86*Math.pow(r(),1.15); // 0 near .. 1 far
      let u=(i+.15+r()*.7)/n*T;
      if(Math.abs(u-sx)<.08&&d<.5)u+=.18; // keep the near water under the sun open
      things.push({kind:kinds[i%kinds.length],u,d,ph:r()*6.283,mass:.6+r()*.8,flip:r()<.5?-1:1,slot:i,sz:.8+r()*.4});
    }
    // crossers: vessels that pass slowly through
    const lanes=[{d:.55,speed:.05},{d:.82,speed:.03}];
    // fixed architecture
    const fixed=[];
    if(si===0){fixed.push({kind:'pier',u:sx-.95*Math.min(1,T),len:.7,d:.42});fixed.push({kind:'buoy',u:sx+.32,d:.18,ph:r()*6.28});}
    if(si===1){fixed.push({kind:'wharf',u:T*.04,len:Math.min(.5,T*.28),d:.25});fixed.push({kind:'city',u:0,len:T,d:.8});fixed.push({kind:'buoy',u:sx-.36,d:.2,ph:r()*6.28});}
    if(si===2){fixed.push({kind:'skyline',u:0,len:T,d:.74});
      for(let k=0;k<Math.round(T*5);k++){fixed.push({kind:'bricola',u:r()*T,d:.08+r()*.5,ph:r()*6.28});}
      fixed.push({kind:'buoy',u:sx+.4,d:.22,ph:r()*6.28});}
    return{things,lanes,fixed};
  });
}

/* ---------- where this screen is: its own sky ---------- */
const LOCKEY='mztv-harbour-light-loc-v1',DEVTZ=-new Date().getTimezoneOffset()*60;
const tzCity=()=>{try{return(Intl.DateTimeFormat().resolvedOptions().timeZone||'').split('/').pop().replace(/_/g,' ');}catch(e){return'';}};
const LOC={lat:42,lon:clamp(DEVTZ/240,-180,180),name:'',src:'clock',ok:false}; // until located: the device clock's meridian
async function locate(){
  if(Number.isFinite(OPT.lat)&&Number.isFinite(OPT.lon)){Object.assign(LOC,{lat:clamp(OPT.lat,-85,85),lon:clamp(OPT.lon,-180,180),name:OPT.place.toUpperCase(),src:'url',ok:true});return;}
  if(!OPT.fresh){try{const v=JSON.parse(localStorage.getItem(LOCKEY)||'null');if(v&&Number.isFinite(v.lat)&&Number.isFinite(v.lon)&&Date.now()-v.at<7*864e5){Object.assign(LOC,{lat:v.lat,lon:v.lon,name:(OPT.place||v.name||'').toUpperCase(),src:'saved',ok:true});return;}}catch(e){}}
  const tries=[
    async()=>{const j=await(await fetch('https://get.geojs.io/v1/ip/geo.json',{cache:'no-store'})).json();return{lat:Number(j.latitude),lon:Number(j.longitude),name:j.city||tzCity()};},
    async()=>{const j=await(await fetch('https://ipapi.co/json/',{cache:'no-store'})).json();return{lat:Number(j.latitude),lon:Number(j.longitude),name:j.city||tzCity()};},
    async()=>{const c=tzCity();if(!c)throw 0;const j=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(c))).json();const r=j.results[0];return{lat:Number(r.latitude),lon:Number(r.longitude),name:r.name};}
  ];
  for(const t of tries){try{const r=await t();if(Number.isFinite(r.lat)&&Number.isFinite(r.lon)&&(r.lat||r.lon)){
      Object.assign(LOC,{lat:clamp(r.lat,-85,85),lon:r.lon,name:(OPT.place||r.name||'').toUpperCase(),src:'net',ok:true});
      try{localStorage.setItem(LOCKEY,JSON.stringify({lat:LOC.lat,lon:LOC.lon,name:LOC.name,at:Date.now()}));}catch(e){}return;}}catch(e){}}
}

/* ---------- live weather ---------- */
const WX=SITES.map((s,i)=>({wind:4,dir:250,gust:7,cloud:55,low:30,hum:80,rain:0,temp:10,vis:20000,wave:.5,period:6,ok:false,tz:DEVTZ,at:0}));
const WXS=SITES.map(()=>({wind:4,dir:250,gust:7,cloud:55,low:30,hum:80,rain:0,temp:10,wave:.5,period:6,vis:20000})); // eased
function synthWX(i,t){ // fallback weather if the network is not there: slow, plausible
  const h=t/3600;return{wind:3+5*vn(h*.3,i*9),dir:200+120*vn(h*.1,i*9+4),gust:6+8*vn(h*.4,i*7),cloud:100*vn(h*.15,i*5+2),low:60*vn(h*.2,i*5+8),
    hum:65+30*vn(h*.2,i*3),rain:Math.max(0,vn(h*.25,i*11)-.75)*6,temp:9,vis:8000+20000*vn(h*.2,i),wave:.2+1.1*vn(h*.2,i*13),period:5+4*vn(h*.1,i)};}
async function fetchWX(){
  if(!OPT.live)return;
  if(!LOC.ok)await locate();
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}&current=temperature_2m,relative_humidity_2m,precipitation,cloud_cover,cloud_cover_low,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&wind_speed_unit=ms&timezone=auto`;
    const j=await(await fetch(u,{cache:'no-store'})).json(),c=j.current;
    const o={wind:fin(c.wind_speed_10m,4),dir:fin(c.wind_direction_10m,250),gust:fin(c.wind_gusts_10m,7),cloud:fin(c.cloud_cover,55),low:fin(c.cloud_cover_low,30),
      hum:fin(c.relative_humidity_2m,80),rain:fin(c.precipitation,0),temp:fin(c.temperature_2m,10),vis:fin(c.visibility,20000),tz:fin(j.utc_offset_seconds,DEVTZ),ok:true,at:Date.now()};
    o.wave=.05+o.wind*.035;o.period=3;o.sea=false; // inland: the wind makes the water
    try{const m=await(await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${LOC.lat}&longitude=${LOC.lon}&current=wave_height,wave_period`,{cache:'no-store'})).json();
      const wh=m.current&&m.current.wave_height,wp=m.current&&m.current.wave_period;
      if(Number.isFinite(wh)&&wh!==null){o.wave=Math.max(wh,.05+o.wind*.02);o.period=Number.isFinite(wp)&&wp?wp:5;o.sea=true;}}catch(e){}
    for(const w of WX)Object.assign(w,o);
  }catch(e){/* keep last values */}
}

/* ---------- clock ---------- */
const T0=Date.now();let simT=T0/1000+OPT.ff*3600; // seconds, virtual
const ST={driftA:0,driftB:0,swell:0,chop:0,vort:0,evolve:0};
const EPOCH=Date.UTC(2026,0,1)/1000;
const DEF={driftA:.0045,driftB:.011,swell:.9,chop:2.1,vort:.02,evolve:.004};
function siteAt(t){
  if(OPT.site){const i=SITES.findIndex(s=>s.id===OPT.site||s.name.toLowerCase().startsWith(OPT.site));if(i>=0)return{a:i,b:i,f:0};}
  const h=t/3600/SITE_HOURS,blk=Math.floor(h),fr=(h-blk)*SITE_HOURS;
  const a=((blk%3)+3)%3,b=(a+1)%3,start=SITE_HOURS-SITE_XFADE;
  return{a,b,f:fr>start?sstep(0,1,(fr-start)/SITE_XFADE):0};
}

/* ---------- memory (what this harbour has lived through) ---------- */
let MEM={v:1,hours:0,site:[0,0,0],storm:0,rain:0,calm:0,fog:0,vortices:0,lastVortex:-1e9,pigment:[0,0],log:[],ghost:0};
let ERA={name:'GLOW',since:simT,pressure:0,amt:{veil:0,glass:0,vortex:0},target:'GLOW',until:0};
let saved=null;
function load(){
  if(!MEMORY_ON||OPT.fresh)return;
  try{saved=JSON.parse(localStorage.getItem(STORE)||'null');
    if(saved&&saved.v===1){Object.assign(MEM,saved.mem||{});Object.assign(ST,saved.st||{});if(saved.era)ERA={...ERA,...saved.era,since:simT-(saved.era.age||0)};}
  }catch(e){}
  for(const k in ST)ST[k]=fin(ST[k],0);
}
function save(){
  if(!MEMORY_ON)return;
  try{MEM.log=MEM.log.slice(-40);localStorage.setItem(STORE,JSON.stringify({v:1,mem:MEM,st:ST,era:{name:ERA.name,pressure:ERA.pressure,amt:ERA.amt,target:ERA.target,until:ERA.until-simT>0?ERA.until:0,age:simT-ERA.since}}));}catch(e){}
}
function logEv(s){const d=new Date(simT*1000+(typeof WX!=='undefined'&&WX[0].ok?WX[0].tz:DEVTZ)*1000);const hh=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');MEM.log.push(hh+' '+s);if(MEM.log.length>60)MEM.log.shift();}
function unlocked(what){
  if(SYNC||OPT.capture){const days=(simT-Date.UTC(2026,10,12)/1000)/86400;return days>({tug:0,lanterns:0,vortex:.5,ghost:2,glass:.2}[what]||0);}
  if(what==='tug')return MEM.hours>=.75;
  if(what==='lanterns')return MEM.hours>=2;
  if(what==='vortex')return MEM.storm>=.5||MEM.hours>=10;
  if(what==='glass')return MEM.calm>=1||MEM.hours>=5;
  if(what==='ghost')return MEM.vortices>=1;
  return true;
}

/* ---------- the world state each frame ---------- */
const W_=WXS; let SITE={a:0,b:0,f:0}, MOOD=null, PAL=[], PALr=[], LAMP=0;
function blendWX(){const {a,b,f}=SITE,A=WXS[a],B=WXS[b],o={};for(const k in A)o[k]=lerp(A[k],B[k],f);
  // wind direction: blend as vector
  const ax=Math.sin(A.dir*Math.PI/180),ay=Math.cos(A.dir*Math.PI/180),bx=Math.sin(B.dir*Math.PI/180),by=Math.cos(B.dir*Math.PI/180);
  o.dir=Math.atan2(lerp(ax,bx,f),lerp(ay,by,f))*180/Math.PI;return o;}
function moodAt(si,t){
  const s=LOC,sol=solar(LOC.lat,LOC.lon,t*1000);let e=sol.elev,ha=sol.ha;
  if(OPT.hour!=null){const loc=OPT.hour;ha=loc-12;e=Math.cos((loc-12)/12*Math.PI)*30+(s.lat<48?14:6)-12;}
  if(OPT.held==='evening'){e=4;ha=3;} else if(OPT.held==='dawn'){e=3;ha=-3;} else if(OPT.held==='night'){e=-20;ha=6;} else if(OPT.held==='day'){e=30;ha=1;}
  const aw=sstep(-1.5,1.5,ha);
  const wN=1-sstep(lerp(-11,-15,aw),lerp(-3,-6,aw),e), wD=sstep(14,26,e)*(1-wN), wL=1-wN-wD;
  return{e,ha,aw,wN,wD,wL};
}
function mixPal(m){
  const out=[];for(let i=0;i<6;i++){const c=[0,0,0];for(let k=0;k<3;k++){
    const low=lerp(MOODS.dawn[i][k],MOODS.evening[i][k],m.aw);c[k]=MOODS.night[i][k]*m.wN+MOODS.day[i][k]*m.wD+low*m.wL;}out.push(c);}
  return out;
}
function computePalette(wx){
  const ma=moodAt(SITE.a,simT),mb=moodAt(SITE.b,simT),m={};for(const k in ma)m[k]=lerp(ma[k],mb[k],SITE.f);
  MOOD=m;let p=mixPal(m);
  // weather: overcast greys the middle inks, rain darkens; pigment memory leans warm/cool; slow drift with a pull home
  const over=sstep(55,100,wx.cloud)*.38+sstep(0,2,wx.rain)*.2;
  const drift=Math.sin(simT/5400)*.035+MEM.pigment[0];
  p=p.map((c,i)=>{const Y=c[0]*.3+c[1]*.59+c[2]*.11;const gr=[Y*1.02,Y*.98,Y*1.08];
    let o=c.map((v,k)=>lerp(v,gr[k],i>0&&i<5?over:over*.3));
    if(i>=2&&i<=4){o[0]*=1+drift;o[2]*=1-drift*.8;}
    return o.map(v=>clamp(v|0,0,255));});
  PAL=p;PALr=p.map(c=>(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0]);
  LAMP=(255<<24)|(LANTERN[2]<<16)|(LANTERN[1]<<8)|LANTERN[0];
}

/* ---------- eras: GLOW · VEIL · GLASS · VORTEX ---------- */
function updateEra(dt,wx){
  const hum=wx.hum,fogish=sstep(82,97,hum)*.7+sstep(9000,1500,wx.vis)*.8;
  if(SYNC){ // deterministic: 45-minute blocks hashed with the hour of day
    const blk=Math.floor(simT/2700),r=hash3(blk,SITE.a,3);
    let tgt='GLOW';if(fogish>.5||r<.18)tgt='VEIL';else if(wx.wind<3.5&&r<.4)tgt='GLASS';else if(r>.9&&unlocked('vortex'))tgt='VORTEX';
    if(tgt!==ERA.name){ERA.name=tgt;ERA.since=simT;}
  }else{
    const age=simT-ERA.since;
    ERA.pressure=clamp(fin(ERA.pressure,0)+dt/3600*(.12+sstep(6,16,wx.gust)*.6+sstep(60,100,wx.cloud)*.15),0,1.5);
    if(ERA.name==='VORTEX'){if(simT>ERA.until){setEra('GLOW');ERA.pressure=0;MEM.vortices++;MEM.lastVortex=simT;

/* ---------- integrated state ---------- */

  const moodName=MOOD.wN>.5?'MOONLIGHT':MOOD.wD>.5?'HIGH HAZE':MOOD.aw>.5?'LOW SUN · EVENING':'LOW SUN · MORNING';
  const sa=siteAt(simT);const leftH=SITE_HOURS-((simT/3600/SITE_HOURS)%1)*SITE_HOURS;
  const nextName=SITES[(sa.a+1)%3].name.split(' ')[0];
  const roll=(rollOf(simT,wx).amp*180/Math.PI).toFixed(1);
  const L=[];
  L.push(`<b>HARBOUR LIGHT</b>  <span class="d">BIT FIELD 046 · after J.M.W. Turner${LINKED?' · PLAY (mixer-linked)':''}</span>`);
  L.push(`${s.name}  ·  ${LOC.name?LOC.name+' sky':'local sky'} ${hh}  ·  ${moodName}  ·  ${ERA.name}`);
  L.push(`<span class="d">wind ${wx.wind.toFixed(1)} m/s ${dirName(wx.dir)} → clouds drift ${dirName(wx.dir+180)}, sails fill</span>`);
  L.push(`<span class="d">cloud ${wx.cloud|0}% → veils the sun · humidity ${wx.hum|0}% → far ships dissolve</span>`);
  L.push(`<span class="d">${WX[0].sea===false?'wind on the water':'swell'} ${wx.wave.toFixed(1)} m / ${wx.period.toFixed(0)} s → boats roll ${roll}°, the sea and the bell</span>`);
  const fl=FOC.left;L.push(`<span class="d">focus ${FOC.from===FOC.to||fl<=0?FOC.to+' (held)':FOC.from+' → '+FOC.to+' · '+Math.floor(fl/60)+':'+String(Math.floor(fl%60)).padStart(2,'0')} → the sound softens with it</span>`);
  L.push(`<span class="d">sun height → the inks · memory ${MEM.hours.toFixed(1)} h${OPT.site?'':` · ${nextName} in ${Math.floor(leftH)}:${String(Math.floor(leftH%1*60)).padStart(2,'0')}`}</span>`);
  const lg=MEM.log.slice(-2);for(const l of lg)L.push(`<span class="d">${l}</span>`);
  if(OPT.audio&&!(AU.ctx&&AU.ctx.state==='running'))L.push(`<span class="d">click or press any key for sound · i hides this</span>`);
  info.innerHTML=L.join('\n');
  info.style.background=`rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},.72)`;info.style.color=css(PAL[5]);info.style.borderColor=css(PAL[3]);
}

/* ---------- main loop ---------- */
function step(dt){
  simT+=dt;const prevA=SITE.a,prevF=SITE.f;SITE=siteAt(simT);
  if(MEMORY_ON&&prevF<.5&&SITE.f>=.5)logEv('through the veil to '+SITES[SITE.b].name);
  // ease live weather
  const k=SYNC?1:1-Math.exp(-dt/300);
  for(let i=0;i<3;i++){const src=(WX[i].ok)?WX[i]:synthWX(0,simT);
    for(const key in WXS[i]){if(key==='dir'){let d=((src.dir-WXS[i].dir+540)%360)-180;WXS[i].dir=(WXS[i].dir+d*k+360)%360;}else WXS[i][key]=fin(lerp(WXS[i][key],src[key],k),src[key]);}}
  const wx=blendWX();W_cache=wx;
  updateEra(dt,wx);integrate(dt,wx);
  // memory accrues
  if(MEMORY_ON||OPT.capture){const h=dt/3600;MEM.hours+=h;MEM.site[SITE.a]+=h*(1-SITE.f);if(wx.gust>14||wx.wind>10)MEM.storm+=h;if(wx.rain>.2)MEM.rain+=h;if(wx.wind<3)MEM.calm+=h;if(ERA.name==='VEIL')MEM.fog+=h;
    MEM.pigment[0]*=Math.exp(-h/12);}
  // self-heal: anything non-finite regrows from memory / defaults
  for(const key in ST)if(!Number.isFinite(ST[key]))ST[key]=DEF[key]*(simT%1e4);
  if(!Number.isFinite(ERA.pressure))ERA.pressure=0;
  return wx;
}
function prewarm(){ // the harbour was running before you arrived
  const steps=OPT.ff>0?Math.min(OPT.ff*360,40000):90;const dt=OPT.ff>0?10:2;simT-=steps*dt;for(let i=0;i<steps;i++)step(dt);
}
let lastRaf=performance.now(),acc=0,lastSaveAt=0,lastInfo=0,frames=0;
function loop(now){
  requestAnimationFrame(loop);
  if(OPT.capture&&window.MZ&&MZ.captureHold)return;
  const dtR=Math.min(.5,(now-lastRaf)/1000);lastRaf=now;acc+=dtR;if(acc<1/OPT.fps)return;
  const dt=Math.min(acc,.5)*OPT.rate;acc=0;
  try{
    let wx=step(dt);render(wx);frames++;
    if(now-lastInfo>1000){updateInfo(wx);lastInfo=now;}
    if(now-lastSaveAt>60000){save();lastSaveAt=now;}
  }catch(e){console.error(e);for(const key in ST)ST[key]=fin(ST[key],0);}
}
addEventListener('resize',resize);
function gesture(){if(AU.ctx){if(AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{});}else startAudio();}
addEventListener('keydown',e=>{if(e.key==='i'||e.key==='I'){info.classList.toggle('off');}gesture();});
addEventListener('pointerdown',gesture);
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
cv.addEventListener('webglcontextlost',e=>e.preventDefault()); // (2D canvas; kept for parity)

/* ---------- test / capture handles ---------- */
window.MZ={
  get state(){return{simT,site:SITES[SITE.a].id,siteF:SITE.f,era:ERA.name,amt:{...ERA.amt},pressure:ERA.pressure,mem:JSON.parse(JSON.stringify(MEM)),st:{...ST},wx:W_cache,mood:MOOD,W,H,lamps:LAMPS.length,visible:VISIBLE.length,focus:{...FOC},loc:{...LOC},audio:AU.ctx&&AU.ctx.state};},
  force(op){ // bypasses gates
    if(op==='vortex'){setEra('VORTEX');ERA.until=simT+1500;ERA.amt.vortex=1;}
    else if(op==='glass'){setEra('GLASS');ERA.amt.glass=1;}
    else if(op==='veil'){setEra('VEIL');ERA.amt.veil=1;}
    else if(op==='glow'){setEra('GLOW');for(const k in ERA.amt)ERA.amt[k]=0;}
    else if(op.startsWith('site:')){OPT.site=op.slice(5);}
    else if(op.startsWith('focus:')){OPT.focus=op.slice(6);}
    else if(op==='storm'){for(const w of WX){Object.assign(w,{wind:16,gust:24,wave:2.6,cloud:95,low:80,rain:2,ok:true});}}
    else if(op==='calm'){for(const w of WX){Object.assign(w,{wind:1,gust:2,wave:.1,cloud:15,low:0,rain:0,hum:60,vis:30000,ok:true});}}
    else if(op==='unlock'){MEM.hours=Math.max(MEM.hours,12);MEM.vortices=Math.max(1,MEM.vortices);MEM.storm=1;MEM.calm=2;}
    else if(op==='poison'){ST.swell=NaN;ST.driftA=Infinity;ERA.pressure=NaN;}
  },
  hour(h){OPT.hour=h;}, held(m){OPT.held=m;},
  step(sec,n=1){let wx;for(let i=0;i<n;i++)wx=step(sec);render(wx);updateInfo(wx);},
  audio:AU, rebuild, save, captureHold:false
};

if(Number.isFinite(OPT.lat)&&Number.isFinite(OPT.lon))Object.assign(LOC,{lat:clamp(OPT.lat,-85,85),lon:clamp(OPT.lon,-180,180),name:OPT.place.toUpperCase(),src:'url',ok:true});
resize();load();prewarm();
if(MEMORY_ON&&!MEM.log.length)logEv('the harbour opened');
fetchWX();setInterval(fetchWX,10*60*1000);
if(OPT.audio&&!OPT.capture){startAudio().then(()=>{if(AU.ctx&&AU.ctx.state!=='running'){AU.ctx.resume().catch(()=>{});}});}
{const wx=step(.01);render(wx);updateInfo(wx);}
requestAnimationFrame(loop);
</script>
</body></html>
