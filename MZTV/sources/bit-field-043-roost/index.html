<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Roost</title>
<meta name="description" content="MZ WORLD · ROOST — horned birds keep their own errands around one tree, cut from a black block in two inks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root { --ink:#0d0b0e; --paper:#f4eee0; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--paper); background:var(--ink); border:2px solid var(--paper); letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--paper); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .ev { font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--paper); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
@media (max-width:560px) { #hud { font-size:9.5px; line-height:1.4; padding:8px 10px; left:10px; bottom:10px; width:calc(100vw - 20px) } #hud .r { grid-template-columns:1fr } #hud .r span:last-child { display:none } }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>
<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 1080);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const WALK = Q.get('walk') === '1';                 // the visitor walk layer drives this page through window.MZ; it only gets its own memory
const KEY = 'mzworld-roost-v1' + (WALK ? '-walk' : '') + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

// No LAT/LON: the real school trail is unverified, so the sun and the weather are simulated and say so (README: rule 1 broken on purpose).
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const prnd = mulberry(3501);   // fixed salt: the woods are the same every time
const pr = (a, b) => a + (b - a) * prnd();
/* ====================================================================== clock: a held morning */
const MORNING_S = 96 * 60;
let simMs = Date.now();
function morningAt(ms) { const ph = 0.5 - 0.5 * Math.cos(TAU * (ms / 1000) / MORNING_S); return { ph, b: lerp(112, 160, ph) * D2R, el: lerp(15, 36, ph) * D2R, clock: 8.5 + 3 * ph }; }
if (Q.has('hour')) { const want = clamp(+Q.get('hour'), 8.5, 11.5); const ph = (want - 8.5) / 3; const cyc = Math.acos(1 - 2 * ph) / TAU * MORNING_S * 1000; simMs = Math.floor(simMs / (MORNING_S * 1000)) * MORNING_S * 1000 + cyc; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;
const sunVec = (b, el) => V(Math.sin(b) * Math.cos(el), Math.sin(el), Math.cos(b) * Math.cos(el));   // +x east, +z north, y up
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const clockStr = (h) => { const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
/* ====================================================================== noise + terrain (the clearing's layout is shared with TWISTED TREE; nothing else is) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
const CC = { x: 6.5, z: 29 };               // the clearing and the tree
const HC = 8.0;                             // canopy height used to cast the sun through the woods
const WOOD_Z0 = -46;                        // the wood edge (the school side is south of it)
const trailX = (z) => -3.2 + 2.6 * Math.sin(z * 0.07 + 0.4) + 1.1 * Math.sin(z * 0.21 + 1.0);
const FORK = [[trailX(14), 14], [-9, 19], [-17, 24], [-27, 27.5]];
function segD(px, pz, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az; const t = clamp(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz), 0, 1); return Math.hypot(px - ax - vx * t, pz - az - vz * t); }
function trailD(x, z) { let d = z < WOOD_Z0 - 14 || z > 74 ? 99 : Math.abs(x - trailX(z)) * 0.93; for (let i = 0; i < FORK.length - 1; i++) d = Math.min(d, segD(x, z, FORK[i][0], FORK[i][1], FORK[i + 1][0], FORK[i + 1][1])); return d; }
const creek1 = (x) => -13 + 1.5 * Math.sin(x * 0.12);
const creek2 = (x) => 8 + 1.1 * Math.sin(x * 0.19 + 1.5);
const creekD = (x, z) => Math.min(Math.abs(z - creek1(x)), Math.abs(z - creek2(x)) * 1.2);
// the lemon sun: the canopy gap sits where the morning sun, at its lemon moment, would put its patch on the tree
const LEMON = { b: 135 * D2R, el: 25 * D2R };
const LS = sunVec(LEMON.b, LEMON.el);
const GAP = { x: CC.x + LS.x / LS.y * HC, z: CC.z + LS.z / LS.y * HC, r: 7.2 };
function clearD(x, z) { return segD(x, z, CC.x, CC.z, lerp(CC.x, GAP.x, 0.55), lerp(CC.z, GAP.z, 0.55)) - 8.4 - 1.4 * (vnoise(x * 0.25 + 4, z * 0.25) - 0.5); }
function land(x, z) { return 0.85 * Math.sin(x * 0.042) + 0.58 * Math.sin(z * 0.077) + 0.22 * Math.sin(x * 0.18 + z * 0.09) + 0.9 * (fbm(x * 0.03 + 7, z * 0.03) - 0.5); }
function terrainH(x, z) {
  let y = land(x, z);
  const c = creekD(x, z); y -= 0.95 * (1 - smoothstep(0.85, 2.5, c)) + 0.06 * (1 - smoothstep(0, 0.85, c));
  const dc = Math.hypot(x - CC.x, z - CC.z); y += 0.32 * Math.exp(-dc * dc / 7);
  const t = trailD(x, z); y -= 0.06 * (1 - smoothstep(0.6, 1.3, t));
  y += 0.0009 * Math.pow(Math.max(0, Math.abs(x - 4) - 40), 2) + 0.0006 * Math.pow(Math.max(0, z - 62), 2);
  return y;
}
const f4 = (n) => (+n).toFixed(4);
const GLSL_PLACE = /* glsl */`
float trailX(float z){ return -3.2+2.6*sin(z*0.07+0.4)+1.1*sin(z*0.21+1.0); }
float segD(vec2 p, vec2 a, vec2 b){ vec2 v=b-a; float t=clamp(dot(p-a,v)/dot(v,v),0.,1.); return length(p-a-v*t); }
float trailD(vec2 p){ float d=(p.y<${f4(WOOD_Z0 - 14)}||p.y>74.)?99.:abs(p.x-trailX(p.y))*0.93;
  ${FORK.slice(0, -1).map((f, i) => `d=min(d,segD(p,vec2(${f4(f[0])},${f4(f[1])}),vec2(${f4(FORK[i + 1][0])},${f4(FORK[i + 1][1])})));`).join(' ')} return d; }
float creekD(vec2 p){ return min(abs(p.y-(-13.+1.5*sin(p.x*0.12))), abs(p.y-(8.+1.1*sin(p.x*0.19+1.5)))*1.2); }
float clearD(vec2 p){ return segD(p,vec2(${f4(CC.x)},${f4(CC.z)}),vec2(${f4(lerp(CC.x, GAP.x, 0.55))},${f4(lerp(CC.z, GAP.z, 0.55))}))-8.4-1.4*(vn(p*0.25+vec2(4.,0.))-0.5); }
float trailSlope(float z){ return 0.182*cos(z*0.07+0.4)+0.231*cos(z*0.21+1.0); }
`;

/* ====================================================================== palettes (two inks: the block and what shows where it is cut away) */
const COLORWAYS = [
  { name: 'BLACK BLOCK', c: ['#0d0b0e', '#f4eee0'] }, { name: 'OX BLOOD', c: ['#2c0a12', '#f1e2cc'] }, { name: 'BLUE BLOCK', c: ['#10205e', '#f5efe0'] },
  { name: 'CUT FLAME', c: ['#100c0c', '#ff6b2c'] }, { name: 'LIMEWASH', c: ['#13211a', '#dcebb4'] }, { name: 'YOLK', c: ['#191307', '#f7ca3c'] },
  { name: 'SHOCK PINK', c: ['#17121f', '#ff9fc2'] }, { name: 'BONE BLOCK', c: ['#f2ecdc', '#151214'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };

/* ====================================================================== persistent state (memory) */
const DEF = () => ({ v: 1, born: Date.now(), epoch: 1, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.5, len: 9, wob: 0.34, outline: 1, width: 1 }, center: 38, uncanny: { next: rr(6, 12) * 60, counts: {}, last: {}, mem: {} },
  rain: 1.2, rainAt: Date.now(), crack: 0.08, hatched: 0, fav: {}, feuds: {}, perched: {}, log: [], runSec: 0 });
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
{ const away = clamp((Date.now() - (S.rainAt || Date.now())) / 1000, 0, 7 * 86400); S.rain *= Math.exp(-away / (8 * 3600)); }
for (const k of ['tension', 'rain', 'crack', 'hatched']) if (!isFinite(S[k])) S[k] = DEF()[k];
const T0 = S.runSec || 0; simT = T0;
function save() { try { S.runSec = simT; S.rainAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: clockStr(morningAt(simMs).clock), text }); if (S.log.length > 40) S.log.length = 40; }
logEv(S.log.length ? 'the roost resumed (epoch ' + S.epoch + ')' : 'the roost was found for the first time');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 16 / 9, 0.05, 4000);
function resize() { W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); IH = Math.min(LINES, H); IW = Math.round(IH * W / H); rtData.setSize(IW, IH); camera.aspect = W / H; camera.updateProjectionMatrix(); PU.uRes.value.set(IW, IH); }

/* ====================================================================== shaders: the block is black; every white mark is wood taken away */
const COMMON = /* glsl */`
uniform float uPerPx, uPxK, uLen, uWob, uCutW;
uniform vec3 uCamP, uSunD; uniform vec2 uGapC; uniform float uGapR, uCanH, uSway, uGapOn;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
${GLSL_PLACE}
vec4 pack(float cut, float id){ return vec4(cut, (id+0.5)/16., 0., 1.); }
// one row of tapered gouge strokes: positive inside a cut. u across the rows, v along them; tone is how much wood comes out here
float cell(float u, float v, float tone, float k){
  float row=floor(u+0.5*(vn(vec2(v*0.05,k))-0.5)*uWob);
  float fu=fract(u)-0.5+(vn(vec2(v*0.22,row*3.1+k))-0.5)*uWob;
  float r=hash(vec2(row,k+7.));
  float L=uLen*mix(0.65,1.7,r);
  float vv=v/L+r*37.; float seg=floor(vv), fv=fract(vv);
  float there=hash(vec2(seg,row+k));
  if(there>smoothstep(0.02,0.42,tone)+0.12*tone) return -1.;
  float taper=pow(max(sin(3.14159*fv),0.),0.6)*(0.7+0.3*hash(vec2(seg+3.,row)));
  float w=mix(0.1,0.82,clamp(tone,0.,1.))*uCutW;
  return 0.5*w*taper-abs(fu);
}
float gouge(float s, float t, float dist, float graze, float tone){
  float per=uPerPx*max(dist,0.01)*uPxK*mix(1.,graze,0.75);
  float L=log2(max(per,1e-5)); float f=smoothstep(0.1,0.9,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float a=cell(s/p0,t/p0,tone,0.), b=cell(s/p1,t/p1,tone,1.);
  return step(0.,mix(a,b,f));
}
float grazeOf(vec3 N, vec3 W0){ return 1./max(abs(dot(N,normalize(uCamP-W0))),0.3); }
float lightAt(vec3 w){
  if(uSunD.y<0.03) return 0.5; float above=uCanH-w.y; if(above<0.3) return 1.;
  vec2 p=w.xz+uSunD.xz/uSunD.y*above; float g=length(p-uGapC)/uGapR+(vn(p*0.45+vec2(uSway*0.3,0.))-0.5)*0.5;
  return mix(0.32,1.,(1.-smoothstep(0.82,1.02,g))*uGapOn); }
`;
const SH = { uTime: { value: 0 }, uSunD: { value: V(0, 1, 0) }, uCamP: { value: V() }, uGapC: { value: new THREE.Vector2(GAP.x, GAP.z) }, uGapR: { value: GAP.r }, uCanH: { value: HC },
  uSway: { value: 0 }, uGapOn: { value: 1 }, uPerPx: { value: 6 }, uPxK: { value: .0012 }, uLen: { value: 9 }, uWob: { value: .34 }, uCutW: { value: 1 }, uFogD: { value: 46 }, uWet: { value: 0.3 },
  uWindL: { value: V() }, uCalm: { value: 1 }, uHoldR: { value: 15 }, uHoldOn: { value: 0 }, uTreeP: { value: V(CC.x, 0, CC.z) }, uBreath: { value: 0 } };
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uSwayK, uCalm, uHoldR, uHoldOn; uniform vec3 uWindL, uTreeP;
attribute vec3 aT; attribute vec2 aP;
varying vec3 vW, vN, vL, vT; varying vec2 vP;
void main(){ vP=aP; vec4 w=modelMatrix*vec4(position,1.);
  if(uSwayK>0.){ float hold=mix(1.,smoothstep(uHoldR*0.55,uHoldR,length(w.xz-uTreeP.xz)),uHoldOn)*uCalm; float k=uSwayK*max(w.y-2.,0.)/8.; w.xz+=(uWindL.xz*(0.75+0.25*sin(uTime*0.7+w.x*0.13+w.z*0.11))+vec2(sin(uTime*0.9+w.z*0.2),cos(uTime*0.8+w.x*0.2))*0.1)*k*hold; }
  w.xyz+=normalize(mat3(modelMatrix)*normal)*uBreath*0.02;
  vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); vL=position; vT=mat3(modelMatrix)*aT; gl_Position=projectionMatrix*viewMatrix*w; }`;
const OBJ_FRAG = /* glsl */`${COMMON}
uniform float uId, uMode, uFogD, uWet; varying vec3 vW, vN, vL, vT; varying vec2 vP;
void main(){ vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N; float dist=length(vW-uCamP); float fog=exp(-dist/uFogD);
  float lam=max(dot(N,uSunD),0.); float cl=lightAt(vW); float cut=0.; float g=grazeOf(N,vW);
  if(uMode<0.5){   // the ground: long diagonal strokes; the lit patch is cut nearly clean
    vec2 p=vW.xz; float td=trailD(p), cd=creekD(p), ce=clearD(p); float gp=smoothstep(0.55,0.95,cl);
    float tone=0.1+0.62*gp+0.1*vn(p*0.3); float a=dot(p,vec2(0.52,0.85)), b=dot(p,vec2(0.85,-0.52));
    if(cd<0.9){ tone=0.42; a=p.y*1.+hash(floor(p*3.)); b=p.x; } else if(td<0.85){ tone=0.34; a=p.x-trailX(p.y); b=p.y; } else if(ce>0.){ tone*=0.55; a=p.y+0.9*(vn(p*0.3)-0.5); b=p.x; }
    float gz=abs(dot(N,normalize(uCamP-vW))); cut=gouge(a,b,dist,min(1./max(gz,0.1),9.),(tone*fog+0.16*(1.-fog)*smoothstep(0.3,1.,dist/uFogD))*smoothstep(0.012,0.2,gz));
  } else {          // wood: the cuts run with the grain
    float rim=pow(1.-abs(dot(N,normalize(uCamP-vW))),2.);
    float tone=uMode<1.5?0.4+0.42*lam*cl+0.2*rim:0.12+0.42*lam*cl;
    cut=gouge(vP.y,vP.x,dist,g,tone*fog);
  }
  gl_FragColor=pack(cut,uId); }`;
function objMat(id, mode, sway = 0) { return new THREE.ShaderMaterial({ vertexShader: OBJ_VERT, fragmentShader: OBJ_FRAG, side: THREE.DoubleSide, uniforms: Object.assign({}, SH, { uId: { value: id }, uMode: { value: mode }, uSwayK: { value: sway } }) }); }

/* ---------- sky: uncut block, a sun gouged as a target, sparse long cuts for cloud */
const SKY_VERT = `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; gl_Position.z=gl_Position.w*0.99999; }`;
const SKY_FRAG = /* glsl */`${COMMON}
uniform float uCloud, uTime, uSunR; varying vec3 vW;
void main(){ vec3 d=normalize(vW-uCamP); float c=0.; float r=acos(clamp(dot(d,uSunD),-1.,1.))/uSunR;
  vec3 a=normalize(cross(uSunD,vec3(0.,1.,0.))), b=cross(a,uSunD); float ang=atan(dot(d,b),dot(d,a));
  if(r<0.42) c=1.; else if(r<0.62) c=0.; else if(r<0.8) c=1.; else if(r<2.9){ float n=floor(ang*11.46); float fa=abs(fract(ang*11.46)-.5); float L=1.5+1.3*hash(vec2(n,3.)); c=step(fa,0.26*(1.-(r-1.)/(L)))*step(r,L+0.8)*step(1.,r); }
  if(d.y>0.02&&c<0.5){ vec2 p=d.xz/max(d.y,0.05)*40.+vec2(uTime*0.05,0.); float h=vn(p*0.05)*0.7+vn(p*0.13)*0.3; if(h>1.02-uCloud*0.42){ float row=floor(p.y*1.1); float v=p.x*0.09+hash(vec2(row,1.))*9.; if(abs(fract(p.y*1.1)-.5)<0.22*sin(3.14159*fract(v))&&hash(vec2(floor(v),row))<0.65) c=1.; } }
  gl_FragColor=pack(c,0.); }`;

/* ---------- puppets: the actual marks of the print */
const atlas = new THREE.TextureLoader().load('creatures.png' + (Q.has('v') ? '?v=' + Q.get('v') : '')); atlas.flipY = false; atlas.minFilter = THREE.LinearFilter; atlas.magFilter = THREE.LinearFilter; atlas.generateMipmaps = false; atlas.colorSpace = THREE.NoColorSpace;
const PUP_VERT = `varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const PUP_FRAG = `uniform sampler2D uTex; uniform vec3 uCamP; uniform float uFogD; varying vec2 vUv; varying vec3 vW;
