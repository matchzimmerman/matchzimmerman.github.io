<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MZ WORLD · TWISTED TREE / WALK</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#162e2f;color:#f2ead0;font:11px ui-monospace,monospace}iframe{border:0;position:absolute;inset:0;width:100%;height:100%}.back{position:fixed;z-index:12;top:13px;right:13px;background:#273f3ec9;border:1px solid #e9d6ab;color:#f3dfba;text-decoration:none;padding:11px 16px;letter-spacing:.12em}aside{position:fixed;z-index:12;left:16px;bottom:18px;background:#213332c2;border-left:2px solid #eac77b;padding:10px;line-height:1.5;pointer-events:none}.pad{position:fixed;z-index:12;right:20px;bottom:26px;width:150px;height:150px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;touch-action:none}.pad button{border:1px solid #dbc9a8ba;background:#203d3dd9;color:#f0e1bd;font:17px monospace;touch-action:none}.pad button:active{background:#e5c17a;color:#1b2c2d}.pad button:nth-child(1){grid-column:2;grid-row:1}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:3;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:3}@media(min-width:900px){.pad{display:none}}@media(max-width:690px){aside{bottom:188px;font-size:9px;left:12px}} @supports(height:100dvh){html,body,iframe{height:100dvh}}.back{top:calc(12px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}.pad{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}aside{left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));max-width:50vw}@media(max-width:690px){aside{bottom:calc(164px + env(safe-area-inset-bottom));max-width:min(265px,72vw)}.pad{width:142px;height:142px}}@media(orientation:landscape) and (max-height:530px){.pad{width:111px;height:111px;bottom:max(10px,env(safe-area-inset-bottom))}.pad button{font-size:14px}.back{font-size:9px;padding:8px}aside{bottom:10px;max-width:38vw;font-size:8px}}</style></head><body><iframe id="world" title="TWISTED TREE WALK" src="./index.html?walk=1&lines=460"></iframe><a class="back" href="./index.html">AUTONOMOUS VIEW ↗</a><aside>WALK / ANOTHER WAY OF SEEING<br>DRAG TO LOOK · WASD OR ARROW KEYS<br>NO QUESTS · NO SCORE</aside><div class="pad"><button aria-label="Forward" data-key="forward">↑</button><button aria-label="Left" data-key="left">←</button><button aria-label="Right" data-key="right">→</button><button aria-label="Backward" data-key="backward">↓</button></div><script>const frame=document.querySelector('#world');let down=new Set();const update=()=>frame.contentWindow?.postMessage({kind:'mz-walk-input',x:Number(down.has('right'))-Number(down.has('left')),z:Number(down.has('backward'))-Number(down.has('forward'))},'*');document.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down.add(key);update()});const stop=()=>{down.delete(key);update()};el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop)});</script></body></html>
