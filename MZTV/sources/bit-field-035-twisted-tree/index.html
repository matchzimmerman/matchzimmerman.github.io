/* MZ WORLD · TWISTED TREE · Study 003 — an autumn woodland printed in six inks; the light finds one tree */
:root { --ink:#1f1a33; --paper:#f3ecd2; --hot:#cf5a30; --deep:#2d4a72; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }

  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }

#hud .r span:last-child { color:var(--deep); text-align:right }

<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const WALK = Q.get('walk') === '1';                 // the visitor walk layer drives this page through window.MZ; it only gets its own memory
const KEY = 'mzworld-twisted-tree-v3' + (WALK ? '-walk' : '') + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

// No LAT/LON: the real school trail is unverified, so the sun and the weather are simulated and say so (README: rule 1 broken on purpose).
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const prnd = mulberry(3501);   // fixed salt: the woods are the same every time
const pr = (a, b) => a + (b - a) * prnd();

/* ====================================================================== clock: a held autumn morning */
// The story happens one fall morning after math. Here the morning is held: the sun climbs from about 08:30 to 11:30 and eases back over 96 minutes,
// so the light keeps walking across the clearing without the woods ever going dark.
const MORNING_S = 96 * 60;
let simMs = Date.now();
function morningAt(ms) { const ph = 0.5 - 0.5 * Math.cos(TAU * (ms / 1000) / MORNING_S); return { ph, b: lerp(112, 160, ph) * D2R, el: lerp(15, 36, ph) * D2R, clock: 8.5 + 3 * ph }; }
if (Q.has('hour')) { const want = clamp(+Q.get('hour'), 8.5, 11.5); const ph = (want - 8.5) / 3; const cyc = Math.acos(1 - 2 * ph) / TAU * MORNING_S * 1000; simMs = Math.floor(simMs / (MORNING_S * 1000)) * MORNING_S * 1000 + cyc; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;
const sunVec = (b, el) => V(Math.sin(b) * Math.cos(el), Math.sin(el), Math.cos(b) * Math.cos(el));   // +x east, +z north, y up
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const clockStr = (h) => { const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };

/* ====================================================================== noise + terrain (metres; the trail runs north into the woods) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
const CC = { x: 6.5, z: 29 };               // the clearing and the tree
const HC = 8.0;                             // canopy height used to cast the sun through the woods
const WOOD_Z0 = -46;                        // the wood edge (the school side is south of it)
const trailX = (z) => -3.2 + 2.6 * Math.sin(z * 0.07 + 0.4) + 1.1 * Math.sin(z * 0.21 + 1.0);
const FORK = [[trailX(14), 14], [-9, 19], [-17, 24], [-27, 27.5]];
function segD(px, pz, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az; const t = clamp(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz), 0, 1); return Math.hypot(px - ax - vx * t, pz - az - vz * t); }
function trailD(x, z) { let d = z < WOOD_Z0 - 14 || z > 74 ? 99 : Math.abs(x - trailX(z)) * 0.93; for (let i = 0; i < FORK.length - 1; i++) d = Math.min(d, segD(x, z, FORK[i][0], FORK[i][1], FORK[i + 1][0], FORK[i + 1][1])); return d; }
const creek1 = (x) => -13 + 1.5 * Math.sin(x * 0.12);
const creek2 = (x) => 8 + 1.1 * Math.sin(x * 0.19 + 1.5);
const creekD = (x, z) => Math.min(Math.abs(z - creek1(x)), Math.abs(z - creek2(x)) * 1.2);
// the lemon sun: the canopy gap sits where the morning sun, at its lemon moment, would put its patch on the tree
const LEMON = { b: 135 * D2R, el: 25 * D2R };
const LS = sunVec(LEMON.b, LEMON.el);
const GAP = { x: CC.x + LS.x / LS.y * HC, z: CC.z + LS.z / LS.y * HC, r: 7.2 };
function clearD(x, z) { return segD(x, z, CC.x, CC.z, lerp(CC.x, GAP.x, 0.55), lerp(CC.z, GAP.z, 0.55)) - 8.4 - 1.4 * (vnoise(x * 0.25 + 4, z * 0.25) - 0.5); }
function land(x, z) { return 0.85 * Math.sin(x * 0.042) + 0.58 * Math.sin(z * 0.077) + 0.22 * Math.sin(x * 0.18 + z * 0.09) + 0.9 * (fbm(x * 0.03 + 7, z * 0.03) - 0.5); }
function terrainH(x, z) {
  let y = land(x, z);
  const c = creekD(x, z); y -= 0.95 * (1 - smoothstep(0.85, 2.5, c)) + 0.06 * (1 - smoothstep(0, 0.85, c));
  const dc = Math.hypot(x - CC.x, z - CC.z); y += 0.32 * Math.exp(-dc * dc / 7);
  const t = trailD(x, z); y -= 0.06 * (1 - smoothstep(0.6, 1.3, t));
  y += 0.0009 * Math.pow(Math.max(0, Math.abs(x - 4) - 40), 2) + 0.0006 * Math.pow(Math.max(0, z - 62), 2);
  return y;
}
const f4 = (n) => (+n).toFixed(4);
const GLSL_PLACE = /* glsl */`
float trailX(float z){ return -3.2+2.6*sin(z*0.07+0.4)+1.1*sin(z*0.21+1.0); }
float segD(vec2 p, vec2 a, vec2 b){ vec2 v=b-a; float t=clamp(dot(p-a,v)/dot(v,v),0.,1.); return length(p-a-v*t); }
float trailD(vec2 p){ float d=(p.y<${f4(WOOD_Z0 - 14)}||p.y>74.)?99.:abs(p.x-trailX(p.y))*0.93;
  ${FORK.slice(0, -1).map((f, i) => `d=min(d,segD(p,vec2(${f4(f[0])},${f4(f[1])}),vec2(${f4(FORK[i + 1][0])},${f4(FORK[i + 1][1])})));`).join(' ')} return d; }
float creekD(vec2 p){ return min(abs(p.y-(-13.+1.5*sin(p.x*0.12))), abs(p.y-(8.+1.1*sin(p.x*0.19+1.5)))*1.2); }
float clearD(vec2 p){ return segD(p,vec2(${f4(CC.x)},${f4(CC.z)}),vec2(${f4(lerp(CC.x, GAP.x, 0.55))},${f4(lerp(CC.z, GAP.z, 0.55))}))-8.4-1.4*(vn(p*0.25+vec2(4.,0.))-0.5); }
float trailSlope(float z){ return 0.182*cos(z*0.07+0.4)+0.231*cos(z*0.21+1.0); }
`;

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
// AUTUMN CLEARING is designed as relationships: a violet-black licorice INK and cobalt DEEP for the canopy's underside and shade;
// a cool teal-green SEA for crowns and shaded grass; HOT russet held to the leaf litter, the trail and a few turned crowns;
// GLOW is the lemon, kept almost entirely for the sunlit grass of the clearing and the sun; PAPER for sky, glints and the dry stones.
const COLORWAYS = [
  { name: 'AUTUMN CLEARING',  c: ['#1f1a33', '#2d4a72', '#4a9a8c', '#cf5a30', '#f7d93f', '#f3ecd2'] },
  { name: 'LEMON SNOWBALL',   c: ['#2b2340', '#5d4f86', '#88bf9c', '#ec7a44', '#fbe55a', '#fbf6e4'] },
  { name: 'BLACK LICORICE',   c: ['#140f19', '#3b2d4c', '#4e8088', '#b9472c', '#e9b94a', '#ebdfc4'] },
  { name: 'SIGNAL FLARE',     c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'PISTACHIO NIGHT',  c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'ULTRAMARINE',      c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',           c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
  { name: 'ATLANTIC PRINT',   c: ['#1b1f3a', '#2c3e7a', '#3f9aa6', '#f0603f', '#f2c14e', '#efe6cf'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const MAT = [
  /* 0 sky    */ [DEEP, SEA, PAPER, 0.9, 1], /* 1 sun    */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 crown  */ [INK, DEEP, SEA, 1.25, 0],
  /* 3 turned */ [DEEP, HOT, GLOW, 1.25, 0], /* 4 stone  */ [INK, DEEP, PAPER, 0.9, 1], /* 5 moss   */ [INK, SEA, GLOW, 0.95, 0],
  /* 6 trunk  */ [INK, DEEP, HOT, 1.25, 0], /* 7 dark   */ [INK, INK, DEEP, 0.3, 0], /* 8 licorice*/ [INK, DEEP, PAPER, 1.4, 0],
  /* 9 timber */ [INK, HOT, PAPER, 1.0, 0], /*10 paint  */ [DEEP, HOT, GLOW, 0.7, 0], /*11 floor  */ [INK, DEEP, HOT, 1.0, 0],
  /*12 trail  */ [DEEP, HOT, PAPER, 0.85, 0], /*13 cloud  */ [SEA, PAPER, PAPER, 0.8, 0], /*14 grass  */ [INK, SEA, GLOW, 1.0, 0],
  /*15 leaf   */ [INK, HOT, GLOW, 0.6, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 3, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.4, dith: 0.12, wob: 7, outline: 1, hatch: 1.0 }, center: 38,
  uncanny: { next: rr(6, 12) * 60, counts: {}, last: {}, mem: {} }, rain: 1.4, rainAt: Date.now(), litter: [], litterDepth: 0.4, fallen: 0,
  lightMin: 0, log: [], runSec: 0
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 3) S = Object.assign(DEF(), o); } } catch (e) {}
{ const away = clamp((Date.now() - (S.rainAt || Date.now())) / 1000, 0, 7 * 86400); S.rain *= Math.exp(-away / (8 * 3600)); S.litterDepth *= Math.exp(-away / (36 * 3600)); }   // the ground dried while the source was dark
for (const k of ['tension', 'rain', 'litterDepth', 'lightMin', 'fallen']) if (!isFinite(S[k])) S[k] = DEF()[k];
const T0 = S.runSec || 0; simT = T0;
function save() { try { S.runSec = simT; S.rainAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: clockStr(morningAt(simMs).clock), text }); if (S.log.length > 40) S.log.length = 40; }
if (!S.log.length) logEv('the woods were found for the first time'); else logEv('the woods resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 16 / 9, 0.03, 4000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect; uniform float uFocus, uAper; uniform float uPerPx, uWobPx, uPxK;
uniform vec3 uCamP; uniform vec3 uSunD; uniform vec2 uGapC; uniform float uGapR, uCanH, uSway, uDapOn, uGapOn, uLemon;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
${GLSL_PLACE}
float cocAt(float dist){ return clamp(abs(dist-uFocus)/max(dist,0.005)*uAper,0.,1.); }
vec4 pack(float sh, float id, float line, float acc, float dist){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., clamp(line,0.,1.), step(0.5,acc)*0.5+0.49*cocAt(dist)); }
// the hatching is carved into each surface (SRUTHÁN v3): lines run along T, spaced in the object's own coordinates, octave-stepped by distance
// isolines of s are the carved lines; t runs along them. Spacing is octave-stepped in metres, so a surface's own coordinate stays seamless.
float lineS(float s, float t, float dist, float graze, float extra){
  float per=uPerPx*(1.+1.6*cocAt(dist))*max(dist,0.01)*uPxK*mix(1.,graze,0.75);
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float wk=uWobPx/max(uPerPx,0.1)*0.9;
  float l0=cos((s+((vn(vec2(s,t)/(p0*7.)+3.1)-.5)*wk+extra)*p0)*6.2831853/p0);
  float l1=cos((s+((vn(vec2(s,t)/(p1*7.)+3.1)-.5)*wk+extra)*p1)*6.2831853/p1);
  return 0.5+0.5*mix(l0,l1,f); }
float grazeOf(vec3 N, vec3 W0, float dist){ return dist<5e4?1./max(abs(dot(N,normalize(uCamP-W0))),0.3):1.; }
float lineAt(vec3 W, vec3 W0, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  return lineS(dot(W,A),dot(W,B),dist,grazeOf(N,W0,dist),extra); }
// the sun through the woods: cast each point up along the sun to the canopy; the gap lets the lemon patch through, the leaves let flecks through
float canopyLight(vec3 w){
  if(uSunD.y<0.03) return 0.55;
  float above=uCanH-w.y; if(above<0.3) return 1.;
  vec2 p=w.xz+uSunD.xz/uSunD.y*above;
  if(p.y<${f4(WOOD_Z0)}) return 1.;
  float edge=(vn(p*0.45+vec2(uSway*0.35,0.))-0.5)*0.5+(vn(p*1.3-vec2(0.,uSway*0.5))-0.5)*0.22;
  float g=length(p-uGapC)/uGapR+edge;
  float gap=1.-smoothstep(mix(0.82,0.9,uLemon),mix(1.02,0.94,uLemon),g);
  float leaf=vn(p*0.8+vec2(uSway,uSway*0.6))*0.6+vn(p*2.4-vec2(uSway*1.7,uSway*0.4))*0.4;
  float fleck=smoothstep(0.62,0.69,leaf)*uDapOn;
  float lane=(1.-smoothstep(1.0,2.6,trailD(p)))*smoothstep(0.45,0.6,leaf)*0.75;
  float lit=max(gap*uGapOn,max(fleck,lane)*mix(1.,0.35,uLemon));
  return mix(0.3,1.,lit); }
`;
const SH = {   // shared uniforms
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 90 }, uFogShade: { value: 0.62 },
  uBreath: { value: 0 }, uKeyUp: { value: 1 },
  uFocus: { value: 1 }, uAper: { value: 0.2 }, uGapC: { value: new THREE.Vector2(GAP.x, GAP.z) }, uGapR: { value: GAP.r }, uCanH: { value: HC },
  uSway: { value: 0 }, uDapOn: { value: 1 }, uGapOn: { value: 1 }, uLemon: { value: 0 },
  uPerPx: { value: 6 }, uWobPx: { value: 7 }, uPxK: { value: .0012 }, uWindL: { value: V() }, uCalm: { value: 1 },
  uHoldR: { value: 14 }, uHoldOn: { value: 0 }, uTreeP: { value: V(CC.x, 0, CC.z) }, uWet: { value: 0.3 }, uLitter: { value: 0.4 }, uRiver: { value: 0 }, uLight: { value: 0 },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uBreathOn, uCloth, uMover, uCalm, uHoldR, uHoldOn; uniform vec3 uWindL, uTreeP;
attribute vec3 aT; attribute vec2 aP;
varying vec3 vW, vN, vL, vT; varying vec2 vP; varying float vC;
void main(){
  vC=0.; vP=aP;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
