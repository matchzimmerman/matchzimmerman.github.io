<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Outbuilding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · OUTBUILDING — a building that keeps to itself, printed; the info box is printed in the current inks */
:root { --ink:#1c2228; --paper:#eeeadf; --hot:#c4572e; --deep:#3d4f63; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(480px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
@media (max-width:560px) { #hud { font-size:9.5px; padding:8px 10px } }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-outbuilding-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 39.27, LON = -76.73;           // town-level (Catonsville, Maryland): drives sun, moon and weather only
const TZ = 'America/New_York';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const prnd = mulberry(40040);               // fixed salt: the place is the same for every seed
const pr = (a, b) => a + (b - a) * prnd();

/* ====================================================================== clock */
const fmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short', month: 'numeric' });
function localParts(ms) {
  const o = {}; for (const p of fmt.formatToParts(new Date(ms))) o[p.type] = p.value;
  const h = +o.hour % 24, m = +o.minute, sec = +o.second;
  return { h, m, sec, str: `${o.hour % 24 < 10 ? '0' : ''}${h}:${o.minute}:${o.second}`, hour: h + m / 60 + sec / 3600, wd: o.weekday, month: +o.month,
    weekend: o.weekday === 'Sat' || o.weekday === 'Sun' };
}
let simMs = Date.now();
if (Q.has('hour')) { const want = +Q.get('hour'); const cur = localParts(simMs).hour; simMs += (((want - cur) % 24 + 24) % 24) * 3600e3; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;

/* ====================================================================== noise + terrain (metres; +x north, +z east, y up) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
// the building: long axis east-west, 30 m × 7 m; the lot lies south of it
const BW = 3.5, BL = 15, WALL0 = 0.45, WALLTOP = 3.39, RIDGE = 4.3;
const roadZ = (x) => 31 + 5 * Math.sin(x * 0.021 + 0.6);
function lotMask(x, z) {   // 1 on asphalt
  const box = (x0, x1, z0, z1, r) => { const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1); return 1 - smoothstep(0, r, Math.hypot(dx, dz)); };
  const lot = box(-40, -5.2, -24, 21, 1.2);
  const drive = box(-24, -9, 18, roadZ(-16), 0.8);
  const road = 1 - smoothstep(3.0, 3.6, Math.abs(z - roadZ(x)));
  return Math.max(lot, drive, road);
}
function groundH(x, z) {
  let h = 0.018 * x + 2.6 * smoothstep(36, 90, z) + 2.2 * smoothstep(12, 45, x) * smoothstep(-30, 10, z) - 1.4 * smoothstep(-26, -60, z)
    + 0.9 * (fbm(x * 0.045 + 3, z * 0.045 + 1) - 0.5);
  const mound = 0.9 * Math.exp(-Math.pow((x + 30) / 6, 2) - Math.pow((z + 22) / 7, 2));
  h += mound;
  const lot = lotMask(x, z); const plane = (x < -5 ? 0.1 * (-5 - x) : 0.018 * x) - 0.25 + 0.05 * Math.sin(x * 0.11) * Math.sin(z * 0.07);
  h = lerp(h, plane, lot);
  const pad = 1 - smoothstep(0.8, 3.5, Math.max(Math.abs(x) - BW, Math.abs(z) - BL, 0));
  return lerp(h, -0.3, pad);
}

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)) };
}
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); };
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'GALVANISED',     c: ['#1c2228', '#3d4f63', '#9db5a8', '#c4572e', '#e9c46a', '#eeeadf'] },
  { name: 'CREOSOTE',       c: ['#1f1712', '#4a3426', '#8f9c7a', '#d9622b', '#e6c27a', '#f2eadb'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'RED OXIDE',      c: ['#2a1414', '#7a2e22', '#9fb0a8', '#e8a33d', '#f3dfb0', '#f4ece0'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'WINDOW UNIT',    c: ['#22202a', '#585a72', '#b9c7b2', '#e0703a', '#f2d79a', '#f6f1e4'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const MAT = [
  /* 0 sky     */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun     */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 siding  */ [DEEP, SEA, PAPER, 1.0, 0],
  /* 3 bare    */ [INK, DEEP, SEA, 1.0, 0],   /* 4 rust    */ [INK, HOT, GLOW, 1.0, 1],   /* 5 grass   */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 6 wood    */ [INK, DEEP, GLOW, 1.0, 0],  /* 7 dark    */ [INK, INK, DEEP, 0.3, 0],   /* 8 foliage */ [INK, DEEP, SEA, 0.9, 0],
  /* 9 white   */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 asphalt */ [INK, DEEP, SEA, 0.9, 0], /*11 wet     */ [INK, SEA, PAPER, 0.7, 0],
  /*12 awning  */ [INK, SEA, SEA, 0.8, 0],    /*13 cloud   */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon    */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp    */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.8, dith: 0.12, wob: 7, outline: 1, hatch: 1.0, ribK: 1 }, center: 38,
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} }, log: [], runSec: 0,
  rust: 0.38, peel: 0.42, wetH: 0, wet: 0, crack: 0.22, ft: { below: false, cycles: 0 }, savedAt: Date.now(),
  night: { key: '', off: 3, allNight: false }, car: { in: false }, logKind: {},
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
const T0 = S.runSec || 0; simT = T0;
{ // the surface dried while the source was dark
  const awayH = clamp((Date.now() - (S.savedAt || Date.now())) / 3600e3, 0, 1e4); S.wet *= Math.exp(-awayH / 3); }
function save() { try { S.runSec = simT; S.savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: localParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
function logOnce(kind, text, gapMin = 45) { const l = S.logKind[kind]; if (l != null && simT - l < gapMin * 60 && l <= simT) return; S.logKind[kind] = simT; logEv(text); }
if (!S.log.length) logEv('the outbuilding was found as it is'); else logEv('the outbuilding resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 4000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH); wireU.uResW.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform float uPerPx, uWobPx, uPxK, uRibK;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
vec4 pack(float sh, float id, float line, float acc){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., clamp(line,0.,1.), acc>0.5?1.:0.); }
// the hatching is carved into the surface (as SRUTHÁN v3): lines run along T, spaced across it in the surface's own coordinates,
// and the spacing follows distance in octaves so the print keeps its density on screen. A still object keeps a still pattern.
float lineAt(vec3 W, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float s=dot(W,A), t=dot(W,B); float wk=uWobPx/max(uPerPx,0.1)*1.35;
  float l0=cos((s+((vn(vec2(s,t)/(p0*7.)+3.1)-.5)*wk+extra)*p0)*6.2831853/p0);
  float l1=cos((s+((vn(vec2(s,t)/(p1*7.)+3.1)-.5)*wk+extra)*p1)*6.2831853/p1);
  return 0.5+0.5*mix(l0,l1,f); }
// the corrugation is the line grammar: lines sit on the ribs themselves, and step out to every 2nd, 4th… rib with distance
float ribLine(float s, float t, float dist, float pitch){
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per/pitch,1.)*uRibK); float f=smoothstep(0.,1.,fract(L));
  float p0=pitch*exp2(floor(L)), p1=p0*2.;
  float wk=uWobPx/max(uPerPx,0.1)*0.5;
  float w0=(vn(vec2(s/(p0*5.),t/(p0*11.))+1.7)-.5)*wk*p0, w1=(vn(vec2(s/(p1*5.),t/(p1*11.))+1.7)-.5)*wk*p1;
  return 0.5+0.5*mix(cos((s+w0)*6.2831853/p0), cos((s+w1)*6.2831853/p1), f); }
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uTime: { value: 0 }, uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 600 }, uFogShade: { value: 0.6 }, uDay: { value: 1 }, uSkyB: { value: 0.6 },
  uPerPx: { value: 6 }, uWobPx: { value: 7 }, uPxK: { value: 0.0012 }, uRibK: { value: 1 },
  uRust: { value: 0.38 }, uPeel: { value: 0.42 }, uCrack: { value: 0.22 }, uWet: { value: 0 }, uGrow: { value: 1 }, uRainNow: { value: 0 },
  uWindL: { value: V() }, uLean: { value: 0 }, uLeanC: { value: V(0, 0, 0) }, uCalm: { value: 1 },
  uFloodP: { value: V() }, uFloodD: { value: V(0, -1, 0) }, uFlood: { value: 0 },
  uSpill: { value: [0, 0, 0, 0, 0, 0] }, uWinZ: { value: [0, 0, 0, 0, 0, 0] }, uFan: { value: 0 },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uCloth, uMover, uLean, uCalm; uniform vec3 uWindL, uLeanC;
attribute vec3 aT; attribute vec4 aTree; attribute float aLot;
varying vec3 vW, vN, vL, vT; varying float vC, vLot;
void main(){
  vC=0.; vLot=aLot;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  vec3 wl=uWindL*uCalm;
  if(uCloth>2.5&&uCloth<4.5){   // grass blades bend with the wind
    float hgt=max(position.y,0.); float ph=sin(uTime*2.1+w.x*1.7+w.z*1.3)+0.5*sin(uTime*3.3+w.x*4.+w.z*3.);
    float k=1.5*hgt*hgt; w.xz+=(wl.xz*(0.75+0.3*ph)+vec2(ph,ph*0.6)*0.05*uCalm)*k; w.y-=k*0.2*length(wl.xz);
    vC=0.05*ph*hgt;
  }
  if(uCloth>4.5){                // trees: sway with the wind, and sometimes lean in toward the building
    vec3 root=aTree.xyz; float hgt=max(w.y-root.y,0.);
    float ph=sin(uTime*0.8+root.x*0.37+root.z*0.21)+0.45*sin(uTime*1.9+w.x*0.6+w.z*0.5);
    w.xz+=wl.xz*(0.8+0.3*ph)*hgt*hgt*0.0018+vec2(ph,ph*0.7)*0.006*hgt*(0.3+length(wl.xz))*uCalm;
    vec2 d=uLeanC.xz-root.xz; float dl=length(d); d=dl>0.01?d/dl:vec2(0.);
    float k=uLean*hgt*hgt*0.02*smoothstep(4.,16.,dl)*(1.-smoothstep(48.,85.,dl));
    w.xz+=d*k; w.y-=k*0.1;
  }
  vW=w.xyz; vN=n; vL=uMover>0.5?position:w.xyz; vT=mat3(modelMatrix)*lt;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const OBJ_FRAG = /* glsl */`
${COMMON}
uniform float uId, uMode, uEmit, uTime, uAmb, uDiff, uFogD, uFogShade, uSkyB, uDay;
uniform float uRust, uPeel, uCrack, uWet, uGrow, uRainNow, uFan;
uniform vec3 uKeyD, uCamP, uT, uFloodP, uFloodD; uniform float uFlood; uniform float uSpill[6]; uniform float uWinZ[6];
varying vec3 vW, vN, vL, vT; varying float vC, vLot;
const float RIB=0.30, RIBR=0.46, WALLTOP=${WALLTOP.toFixed(2)};
float lights(vec3 N){
  float s=0.;
  vec3 Lv=uFloodP-vW; float dl=length(Lv); vec3 Ld=Lv/max(dl,1e-3);
  float cone=smoothstep(0.42,0.75,dot(-Ld,uFloodD));
  s+=uFlood*cone*max(dot(N,Ld),0.)*exp(-dl*dl/600.)*1.5;
  for(int i=0;i<6;i++){ if(uSpill[i]<0.01) continue;
    vec3 wp=vec3(-${BW.toFixed(1)}-0.2,1.7,uWinZ[i]); vec3 q=wp-vW; float d2=dot(q,q); vec3 qd=q/sqrt(max(d2,1e-4));
    float face=smoothstep(0.,0.5,-qd.x);
    s+=uSpill[i]*face*max(dot(N,qd),0.)*exp(-d2/7.)*0.6; }
  return s; }
void main(){

  cam(i) { cut(i); DIR.until = 1e12; },
  look(p, t, fov = 30) { DIR.look = p ? { p: V(...p), tgt: V(...t), fov } : null; },
  ink(i) { S.colorway = i; cwMix = 1; cwFrom = COLORWAYS[i].c.map(hexV); },
  grammar(g) { Object.assign(S.grammar, g); },
  h: (x, z) => groundH(x, z),
  geo: { BW, BL, WALLTOP, RIDGE, flue: B.flueTop.toArray(), ac: B.ac.toArray() },
  seekHour(h) { const cur = localParts(simMs).hour; simMs += (((h - cur) % 24 + 24) % 24) * 3600e3; },
  wet(mm) { S.wet = clamp(S.wet + mm * 0.5, 0, 1.5); },
  age(o = {}) { if (o.rust != null) S.rust = clamp(o.rust, 0, 0.92); if (o.crack != null) S.crack = clamp(o.crack, 0, 1); if (o.peel != null) S.peel = clamp(o.peel, 0, 0.95); },
  get state() { return { S, live: { ...live }, WX: { ...WX }, cam: CREW[DIR.cur].name, building: { ...B_ }, car: car.state, lines: { ...LINES_ }, crows: crows.map(c => c.state), deer: deer.map(d => d.state) }; },
  setWx(o) { Object.assign(WXT, o); Object.assign(WX, o); WX.live = true; },
  analyser() { return AUD.an; },
  audio: AUD,
};
