<style>
/* MZ WORLD · FARM — a working farm above Galway Bay, printed; the info box is printed in the current inks */
:root { --ink:#1b1f3a; --paper:#efe6cf; --hot:#f0603f; --deep:#2c3e7a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(480px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));

// coordinates; spacing follows distance in octaves so the print keeps its density on screen. Still things keep still patterns.
float lineAt(vec3 W, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);

  float s=dot(W,A), t=dot(W,B);

  float per=uPerPx*1.4*clamp(ds,base*0.8,base*10.);   // octaves land between 0.7x and 1.4x: HEADLAND's weight on average

uniform float uTime, uSway, uHush; uniform vec3 uWindL; uniform vec4 uPh[8];

void main(){

  if(uSway>0.5&&uSway<1.5){ lp.y*=0.1+0.95*aG; bh=lp.y; }      // a blade: its height is the grazing map

const OBJ_FRAG = /* glsl */`

void stoneC(vec3 N, inout vec3 T, inout float sh, inout float acc){   // each stone carved in its own lie

  if(uMode>2.5&&uMode<3.5){ sh+=0.08*(vn(vec2(dot(vL,T)*4.,dot(vL,cross(T,N))*30.))-0.5); }          // grain, hair, straw
  else if(uMode>3.5&&uMode<4.5){   // fleece: looping curls carved into the wool, clumped

/* ====================================================================== info box */
const hud = document.getElementById('hud'); hud.hidden = !INFO;
const tapBtn = document.getElementById('tap');
const pct = (v) => (v * 100).toFixed(0) + '%';
function hudUpdate() {
  if (!INFO) return; const g = galwayParts(simMs); const sEl = SUNM.sun.el / D2R; const sAz = (SUNM.sun.az / D2R + 360) % 360; const bpm = (240 / AUD.barSec).toFixed(0);
  const fa = flockArea(), zone = dogZone(), deg = ZDEG[zone] ?? 0;
  const ev = live.ev ? `<div class="ev">NOW · ${EVT[live.ev].label}</div>` : '';

  hud.innerHTML = `<div class="t"><span>MZ WORLD · FARM</span><span>EPOCH ${S.epoch} · ${COLORWAYS[S.colorway].name}</span></div>
  <div class="r"><span>53.244 N 9.404 W · ${g.str} · sun ${sEl.toFixed(0)}° ${compass(sAz)}</span><span>${WX.live ? 'LIVE' : 'SIMULATED'} WEATHER</span></div>
  <div class="r"><span>WIND ${WX.wind.toFixed(1)} m/s ${compass(WX.windDir)} · CLOUD ${pct(WX.cloud)}</span><span>→ grass, fleece, the new wall</span></div>
  <div class="r"><span>RAIN ${WX.precip.toFixed(1)} mm · HUMIDITY ${WX.hum.toFixed(0)}%</span><span>→ haze ${(SH.uFogD.value | 0)} m, echo, farmer in</span></div>

  <div class="r"><span>GRASS home ${pct(fieldMean('field.home'))} · hill ${pct(fieldMean('field.hill'))} · low ${pct(fieldMean('field.low'))}</span><span>→ where they go next</span></div>
  <div class="r"><span>BERNARD ${dog.note}</span><span>→ bass on ${NOTE[AUD.deg(deg) % 12]}</span></div>

  ${ev}<div class="log">${S.log.slice(0, 4).map(l => `<div>${l.t} — ${l.text}</div>`).join('')}</div>

/* ====================================================================== loop, keys, API */
addEventListener('resize', resize); resize();
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('[gl] context lost'); });
renderer.domElement.addEventListener('webglcontextrestored', () => { resize(); fieldTex.needsUpdate = true; console.warn('[gl] context restored'); });
rebuildWaves(); SUNM = sunMoon(simMs); SUND.copy(azElToVec(SUNM.sun.az, SUNM.sun.el)); MOOND.copy(azElToVec(SUNM.moon.az, SUNM.moon.el));
settle();
for (let i = 0; i < 360; i++) step(0.25);   // pre-warm: it was running before you arrived
landSync(); landDirty = false;
cut(Q.has('cam') ? clamp(+Q.get('cam'), 0, CREW.length - 1) : chooseShot());
if (Q.has('cam')) DIR.until = 1e12;
let audT = 0, landT = 0;
function frame(dt) {
  try { step(dt); applyLook(dt); render(); audT += dt; if (audT > 0.1) { audT = 0; AUD.frame(); } landT += dt; if (landDirty && landT > 2) { landT = 0; landDirty = false; landSync(); } }
  catch (e) { console.error(e); }
}
let lastT = performance.now(), hudT = 0;
function raf(now) { const dt = (now - lastT) / 1000; lastT = now; frame(dt); hudT += dt; if (hudT > 0.5) { hudT = 0; hudUpdate(); } requestAnimationFrame(raf); }
if (!CAPTURE) requestAnimationFrame(raf);
addEventListener('beforeunload', () => { S.flockPos = flock.map(e => [+e.x.toFixed(2), +e.z.toFixed(2)]); save(); });
addEventListener('keydown', (e) => { const k = e.key.toLowerCase();
  if (k === 'i') { INFO = !INFO; hud.hidden = !INFO; if (INFO) hudUpdate(); }
  if (k === 'm') AUD.mute();
  if (k === 'r' && !live.ev) { logEv('a hand on the farm (human intervention)'); S.tension = 1; }
  AUD.start(); });
addEventListener('pointerdown', () => AUD.start());
tapBtn.addEventListener('click', () => AUD.start());
AUD.init(); hudUpdate();
window.MZ = {
  tick(dt = 1 / 30) { frame(dt); hudUpdate(); },
  advance(sec, dt = 0.25) { for (let t = 0; t < sec; t += dt) step(dt); landSync(); landDirty = false; applyLook(0.1); render(); hudUpdate(); },
  force(name) { if (live.ev) endEvent(); if (name === 'rupture') { rupture('forced by hand'); return; } if (name === 'herd') { herdStart(bestField(flockArea()), 'moving the flock (by hand)'); return; } startEvent(name, true); },
