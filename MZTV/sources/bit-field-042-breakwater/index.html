<style>
/* MZ WORLD · BREAKWATER — a wall that takes every wave so the harbour stays calm, printed; the info box is printed in the current inks */
:root { --ink:#16202a; --paper:#efebe1; --hot:#c8553d; --deep:#34506a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(500px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
@media (max-width:560px) { #hud { font-size:9.5px; padding:8px 10px } }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const TEXT_ON = Q.get('text') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-breakwater-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 53.27, LON = -9.05;            // town-level (Galway Bay): drives sun, moon and weather only
const MLAT = 53.2, MLON = -9.65;           // the marine point for the swell (the same one HEADLAND reads)
const TZ = 'Europe/Dublin';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length)];
const prnd = mulberry(42042);               // fixed salt: the place is the same for every seed
const pr = (a, b) => a + (b - a) * prnd();

/* ====================================================================== clock */
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short', month: 'numeric' });
function localParts(ms) {
  const o = {}; for (const p of fmt.formatToParts(new Date(ms))) o[p.type] = p.value;
  const h = +o.hour % 24, m = +o.minute, sec = +o.second;
  return { h, m, sec, str: `${h < 10 ? '0' : ''}${h}:${o.minute}:${o.second}`, hour: h + m / 60 + sec / 3600, wd: o.weekday, month: +o.month,
    weekend: o.weekday === 'Sat' || o.weekday === 'Sun' };
}
let simMs = Date.now();
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;

/* ====================================================================== noise + terrain (metres; +x north, +z east, y up; sea level 0) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
// the wall runs north along x at z = 0 from the south shore; open sea to the west (z < 0), the harbour to the east (z > 0)
const X0 = -132, X1 = 96, CREST = 4.2, PARA = 6.1, HZ = 3.5;
const southShore = (z) => -128 + 9 * Math.sin(z * 0.017 + 0.4) + 6 * Math.sin(z * 0.051);
const eastShore = (x) => 158 + 12 * Math.sin(x * 0.019 + 1.1) - 95 * smoothstep(120, 240, x);
const landD = (x, z) => Math.max(southShore(z) - x, z - eastShore(x));   // > 0 on land
function groundH(x, z) {
  const d = landD(x, z);
  const basin = z > 0 && x < X1 + 40 && z < eastShore(x) ? 1.6 : 0;
  const floor = -6.5 - 2 * fbm(x * 0.01 + 4, z * 0.01) + basin;
  const land = 1.2 + 0.06 * Math.max(d, 0) + 3.5 * fbm(x * 0.012 + 1, z * 0.012 + 7) + 10 * smoothstep(50, 260, d) * fbm(x * 0.006, z * 0.006 + 3)
    + 3.4 * Math.exp(-Math.pow(z / 16, 2)) * smoothstep(-110, -150, x);   // the root of the wall is built up
  return lerp(floor, land, smoothstep(-14, 6, d));
}
function shelterAt(x, z) { return smoothstep(0, 5, z) * smoothstep(X1 + 60, X1 - 40, x - 0.35 * z); }
function wallDist(p) { if (p.x > X1) return Math.max(0, Math.hypot(p.x - X1, p.z) - 7); const x = clamp(p.x, X0, X1); return Math.hypot(p.x - x, Math.max(0, p.z > 0 ? p.z - HZ : -p.z - 4)); }

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)) };
}
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); };
/* ---------- the world clock: real noon is world noon; the afternoon stretches into a long sunset, the whole night
   passes in five minutes around real midnight, and then the dawn. Weather stays real time. */
const DARK_EL = -3 * D2R, NIGHT_REAL = 300e3, DAY = 86400e3, HALF = 43200e3;
const SOLAR_MID0 = Date.UTC(2026, 0, 1) + (-LON / 15) * 3600e3;   // solar midnight, roughly, in UTC
const NIGHTS = new Map();
const sunEl = (ms) => sunMoon(ms).sun.el;
function nightAround(t) {
  const k = Math.round((t - SOLAR_MID0) / DAY); let n = NIGHTS.get(k); if (n) return n;
  const m0 = SOLAR_MID0 + k * DAY; let M = m0, lo = 9;
  for (let d = -40; d <= 40; d++) { const e = sunEl(m0 + d * 60e3); if (e < lo) { lo = e; M = m0 + d * 60e3; } }
  const cross = (a, b, falling) => { for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if ((sunEl(m) > DARK_EL) === falling) a = m; else b = m; } return (a + b) / 2; };
  const D = cross(M - HALF, M, true), A = cross(M, M + HALF, false);
  n = { M, D: Math.min(D, M), A: Math.max(A, M) }; NIGHTS.set(k, n); if (NIGHTS.size > 8) NIGHTS.delete(NIGHTS.keys().next().value); return n;
}
function worldOf(t) {
  const n = nightAround(t), h = NIGHT_REAL / 2, noonP = n.M - HALF, noonN = n.M + HALF;
  if (t < n.M - h) return noonP + (t - noonP) / (n.M - h - noonP) * (n.D - noonP);
  if (t > n.M + h) return n.A + (t - (n.M + h)) / (noonN - (n.M + h)) * (noonN - n.A);
  return n.D + (t - (n.M - h)) / NIGHT_REAL * (n.A - n.D);
}
let WMS = worldOf(simMs);
function seekWorldHour(want) {   // move the real clock forward to the next moment the world shows hour `want`
  const diff = (t) => { const d = localParts(worldOf(t)).hour - want; return ((d % 24) + 36) % 24 - 12; };
  let best = simMs, bd = 99; for (let t = simMs; t < simMs + DAY; t += 120e3) { const d = Math.abs(diff(t)); if (d < bd) { bd = d; best = t; } }
  for (let t = best - 120e3; t < best + 120e3; t += 2e3) { const d = Math.abs(diff(t)); if (d < bd) { bd = d; best = t; } }
  simMs = best; WMS = worldOf(simMs);
}
if (Q.has('hour')) seekWorldHour(+Q.get('hour'));
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];


/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'SALT PRINT',     c: ['#121c28', '#22466e', '#6fa2b2', '#cf5a3c', '#e8c170', '#efebe1'] },
  { name: 'STORM GLASS',    c: ['#141a22', '#3a4658', '#a3b4bd', '#d0663a', '#dfd0a0', '#f1eee6'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'HARBOUR LAMP',   c: ['#1d1a24', '#4a4466', '#9ab8a8', '#e86a3a', '#f5d27f', '#f6f0e2'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'SLATE RAIN',     c: ['#1a1f24', '#43505c', '#9fb2b0', '#c7603f', '#e3cf94', '#f0ede4'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const MAT = [
  /* 0 sky     */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun/held light */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 sea */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam/salt */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 stone */ [INK, SEA, PAPER, 1.0, 0],  /* 5 rock     */ [INK, DEEP, SEA, 1.0, 0],
  /* 6 wood    */ [INK, DEEP, GLOW, 1.0, 0],  /* 7 dark    */ [INK, INK, DEEP, 0.3, 0],   /* 8 grass   */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 9 white   */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 paving  */ [DEEP, SEA, PAPER, 0.8, 0], /*11 rust    */ [INK, HOT, GLOW, 1.0, 0],
  /*12 hull    */ [INK, HOT, HOT, 0.7, 0],    /*13 cloud   */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon    */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp    */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const NCAM = 9;
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.8, dith: 0.12, wob: 7, outline: 1, hatch: 1.0, courseK: 1 }, center: 38,
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} }, log: [], runSec: 0,
  // the record is lopsided on purpose: every impact is kept, shelter is never written down
  salt: 0.3, rust: 0.16, impacts: 0, cams: Array.from({ length: NCAM }, () => ({ imp: 0 })), clear: 0,
  branch: { storm: 0, rain: 0 }, force: null, poll: { next: rr(1.2, 3) * 60, n: 0 }, reportAt: -1e9, wave: 0,
  savedAt: Date.now(), logKind: {}, boat: {},
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
if (!Array.isArray(S.cams) || S.cams.length !== NCAM) S.cams = DEF().cams;
const T0 = S.runSec || 0; simT = T0;
{ // while the source was dark the clearness faded
  const awayH = clamp((Date.now() - (S.savedAt || Date.now())) / 3600e3, 0, 1e4); S.clear *= Math.exp(-awayH / 2.2); }
function save() { try { S.runSec = simT; S.savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: localParts(WMS).str, text }); if (S.log.length > 40) S.log.length = 40; }
function logOnce(kind, text, gapMin = 45) { const l = S.logKind[kind]; if (l != null && simT - l < gapMin * 60 && l <= simT) return; S.logKind[kind] = simT; logEv(text); }
if (!S.log.length) logEv('the wall was found as it is'); else logEv('the wall resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 16000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH); txtSize(); if (typeof spray !== 'undefined') spray.material.uniforms.uPtMax.value = 14 * IH / 720;
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform float uPerPx, uWobPx, uPxK, uCourseK;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
vec4 pack(float sh, float id, float line, float acc){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., clamp(line,0.,1.), acc>0.5?1.:0.); }
// the hatching is carved into the surface (as SRUTHÁN v3): lines run along T, spaced across it in the surface's own coordinates,
// and the spacing follows distance in octaves so the print keeps its density on screen. A still object keeps a still pattern.
float lineAt(vec3 W, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float s=dot(W,A), t=dot(W,B); float wk=uWobPx/max(uPerPx,0.1)*1.35;
  float l0=cos((s+((vn(vec2(s,t)/(p0*7.)+3.1)-.5)*wk+extra)*p0)*6.2831853/p0);
  float l1=cos((s+((vn(vec2(s,t)/(p1*7.)+3.1)-.5)*wk+extra)*p1)*6.2831853/p1);
  return 0.5+0.5*mix(l0,l1,f); }
// the stone courses are the line grammar: lines sit on the courses themselves, and step out to every 2nd, 4th… course with distance
float courseLine(float s, float t, float dist, float pitch){
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per/pitch,1.)*uCourseK); float f=smoothstep(0.,1.,fract(L));
  float p0=pitch*exp2(floor(L)), p1=p0*2.;
  float wk=uWobPx/max(uPerPx,0.1)*0.5;
  float w0=(vn(vec2(s/(p0*5.),t/(p0*11.))+1.7)-.5)*wk*p0, w1=(vn(vec2(s/(p1*5.),t/(p1*11.))+1.7)-.5)*wk*p1;
  return 0.5+0.5*mix(cos((s+w0)*6.2831853/p0), cos((s+w1)*6.2831853/p1), f); }
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uTime: { value: 0 }, uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 900 }, uFogShade: { value: 0.6 }, uDay: { value: 1 }, uSkyB: { value: 0.6 },
  uPerPx: { value: 6 }, uWobPx: { value: 7 }, uPxK: { value: 0.0012 }, uCourseK: { value: 1 },
  uSalt: { value: 0.3 }, uRust: { value: 0.16 }, uWet: { value: 0 }, uWindL: { value: V() }, uCalm: { value: 1 },
  uBreath: { value: 0 }, uGlowH: { value: 0 }, uStorm: { value: 0 },
  uLamp: { value: Array.from({ length: 6 }, () => new THREE.Vector4()) },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uCloth, uMover, uCalm, uBreath; uniform vec3 uWindL;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying float vC;
void main(){
  vC=0.;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  vec3 wl=uWindL*uCalm;

  const wd = fromBearingTravel(WX.windDir); const gustNow = EF.wind + (WX.gust - WX.wind) * Math.max(0, Math.sin(simT * 0.37) * Math.sin(simT * 0.13));
  SH.uWindL.value.set(wd.x, 0, wd.y).multiplyScalar(clamp(gustNow / 10, 0, 1.8));

  const place = (m, dir, deg, up) => { m.position.copy(camera.position).addScaledVector(dir, 2500); m.quaternion.copy(camera.quaternion); const s = 2 * 2500 * Math.tan(deg * D2R); m.scale.set(s, s, 1); m.visible = up; };
  place(sunM, SUND, 2.6, sEl > -0.08 && live.storm < 0.6); place(moonM, MOOND, 1.5, mEl > -0.05 && sEl < 0.1);

  PU.uRain.value = clamp(EF.precip / 2, 0, 1); PU.uRainDir.value.set(wd.x * (0.35 + 0.5 * live.storm), -1).normalize(); PU.uTime.value = simT;
  PU.uMis.value = live.ev === 'storm' ? Math.round(2 + 3 * Math.abs(Math.sin(simT * 1.7))) : 0;

/* ====================================================================== info box */
const hud = document.getElementById('hud'); hud.hidden = !INFO;
const tapBtn = document.getElementById('tap');
function hudUpdate() {
  if (!INFO) return; const lp = localParts(WMS); const rp = localParts(simMs); const sEl = SUNM.sun.el / D2R; const sAz = (SUNM.sun.az / D2R + 360) % 360;
  const ev = live.ev ? `<div class="ev">NOW · ${EVT[live.ev].label}</div>` : '';
  const over = live.storm > 0.05 ? ` (the world's storm: ${EF.swellH.toFixed(1)} m)` : '';
  const cam = CREW[DIR.cur]; const pct = Math.round(AUD.dist * 100);
  hud.innerHTML = `<div class="t"><span>MZ WORLD · BREAKWATER</span><span>EPOCH ${S.epoch} · ${COLORWAYS[S.colorway].name}</span></div>
  <div class="r"><span>WORLD ${lp.str.slice(0, 5)} · real ${rp.str.slice(0, 5)} · sun ${sEl.toFixed(0)}° ${compass(sAz)}</span><span>LOCAL · ${WX.live ? 'LIVE' : 'SIMULATED'} WEATHER</span></div>
  <div class="r"><span>SWELL ${WX.swellH.toFixed(1)} m · ${WX.swellT.toFixed(1)} s from ${compass(WX.swellDir)}${over}</span><span>→ impacts, bar ${AUD.barSec.toFixed(1)} s</span></div>
  <div class="r"><span>WIND ${WX.wind.toFixed(1)} m/s ${compass(WX.windDir)} · HUMIDITY ${WX.hum.toFixed(0)}%${EF.precip > 0.05 ? ' · RAIN ' + EF.precip.toFixed(1) + ' mm' + (live.rainB > 0.05 || live.storm > 0.05 ? " (the world's)" : '') : ''}</span><span>→ spray, chop, echo</span></div>
  <div class="r"><span>THE WALL straight tone ${NOTE[WALL_NOTE % 12]}${Math.floor(WALL_NOTE / 12) - 1}, unchanged${PULLED ? ' · distortion pulled off by hand' : ''}</span><span>→ ${CAM(DIR.cur)} hears it ${pct}% clipped</span></div>
  <div class="r"><span>IMPACTS on record ${S.impacts.toLocaleString('en-GB')} · SHELTER on record 0</span><span>→ salt ${(S.salt * 100).toFixed(0)}%, rust ${(S.rust * 100).toFixed(0)}%</span></div>
  <div class="r"><span>HARBOUR chop ${harbourChop().toFixed(2)} m (${harbourStatus()}) · outside ${EF.swellH.toFixed(1)} m</span><span>${CAM(DIR.cur)} ${cam.name} · pressure ${Math.min(99, S.tension * 100) | 0}%</span></div>
  ${ev}<div class="log">${S.log.slice(0, 4).map(l => `<div>${l.t} — ${l.text}</div>`).join('')}</div>
  <div class="cr">MATCH ZIMMERMAN CREATIVE MEDIA GROUP · MZTV</div>`;
}

/* ====================================================================== loop, keys, API */
addEventListener('resize', resize); resize();
if (document.fonts && document.fonts.load) document.fonts.load('600 20px "JetBrains Mono"').then(() => { TXT.need = true; }).catch(() => {});
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('[gl] context lost'); });
renderer.domElement.addEventListener('webglcontextrestored', () => { resize(); console.warn('[gl] context restored'); });
SUNM = sunMoon(WMS); SUND.copy(azElToVec(SUNM.sun.az, SUNM.sun.el)); MOOND.copy(azElToVec(SUNM.moon.az, SUNM.moon.el)); effWx(); rebuildWaves();
cut(Q.has('cam') ? clamp(+Q.get('cam'), 0, CREW.length - 1) : Math.floor(rnd() * CREW.length));
if (Q.has('cam')) DIR.until = 1e12;
// pre-warm: it was running before you arrived (the boats settle, the gulls are on the wall)
{ if (SUNM.sun.el > -0.05) gulls.forEach((c, i) => { if (rnd() < 0.8) { c.state = 'perch'; c.perch = pickPerch(c); BOATS.forEach(b => b.g.updateMatrixWorld()); c.pos.copy(perchPos(PERCH[c.perch])); c.until = rr(20, 200); } });
  if (S.boat && S.boat.away) { WORK.state = 'away'; WORK.until = rr(5, 30) * 60; WORK.pos.set(600, 0, -800); }
  const pollAt = S.poll.next; S.poll.next = 1e12;
  for (let i = 0; i < 240; i++) step(0.25);
  S.poll.next = Math.max(pollAt, simT + 20); TXT.q.length = 0; TXT.cur = null; PREWARM = false; }
function frame(dt) {
  try { step(dt); applyLook(dt); render(); AUD.frame(dt); }
  catch (e) { console.error(e); }
}
let lastT = performance.now(), hudT = 0;
function raf(now) { const dt = (now - lastT) / 1000; lastT = now; frame(dt); hudT += dt; if (hudT > 0.5) { hudT = 0; hudUpdate(); } requestAnimationFrame(raf); }
if (!CAPTURE) requestAnimationFrame(raf);
addEventListener('beforeunload', () => { S.boat = { away: WORK.state !== 'moored' }; save(); });
addEventListener('keydown', (e) => { const k = e.key.toLowerCase();
  if (k === 'i') { INFO = !INFO; hud.hidden = !INFO; if (INFO) hudUpdate(); }
  if (k === 'm') AUD.mute();
  if (k === 'r' && !live.ev) { logEv('a hand on the wall (human intervention)'); S.tension = 1; }
  if (k === 'c' && !live.ev) { logEv('a hand chose to say it plainly (human intervention)'); S.force = 'rain'; S.tension = 1; }
  if (k === 'd') { PULLED = !PULLED; logEv(PULLED ? 'a hand pulled the distortion off: the tone as it always was (human intervention)' : 'the hand let go of the distortion'); }
  AUD.start(); });
addEventListener('pointerdown', () => AUD.start());
tapBtn.addEventListener('click', () => AUD.start());
AUD.init(); hudUpdate();
window.MZ = {
  tick(dt = 1 / 30) { frame(dt); hudUpdate(); },
  advance(sec, dt = 0.25) { for (let t = 0; t < sec; t += dt) step(dt); applyLook(sec); render(); hudUpdate(); },
  force(name) {
    if (name === 'poll') { poll(false); return; } if (name === 'receipt') { receipt(true); return; } if (name === 'report') { waveReport(); return; }
    if (live.ev) { const was = live.ev; live.ev = null; AUD.event(was, false); if (was === 'hush' && name === 'rupture') { rupture('forced by hand'); return; } }
    if (name === 'rupture') { rupture('forced by hand'); return; }
    startEvent(name, true); },
  cam(i) { cut(i); DIR.until = 1e12; },
  look(p, t, fov = 30) { DIR.look = p ? { p: V(...p), tgt: V(...t), fov } : null; },
  ink(i) { S.colorway = i; cwMix = 1; cwFrom = COLORWAYS[i].c.map(hexV); },
  grammar(g) { Object.assign(S.grammar, g); },
  h: (x, z) => groundH(x, z),
  geo: { X0, X1, CREST, PARA, HZ, beacon: BW_.beaconP.toArray() },
  seekHour(h) { seekWorldHour(h); },
  get worldHour() { return localParts(WMS).hour; },
  pull(v) { PULLED = v == null ? !PULLED : !!v; },
  weather(o = {}) { if (o.salt != null) S.salt = clamp(o.salt, 0.05, 0.95); if (o.rust != null) S.rust = clamp(o.rust, 0, 0.95); if (o.clear != null) S.clear = clamp(o.clear, 0, 1); },
  say(lines, o) { say(lines, Object.assign({ now: true }, o)); },
  get state() { return { S, live: { ...live }, WX: { ...WX }, EF: { ...EF }, cam: CREW[DIR.cur].name, dist: AUD.dist, boats: BOATS.map(b => b.state), gulls: gulls.map(c => c.state), text: TXT.cur ? TXT.cur.kind || TXT.cur.mode : null, calm: Array.from(CALM) }; },
  setWx(o) { Object.assign(WXT, o); Object.assign(WX, o); WX.live = true; },
  analyser() { return AUD.an; },
  audio: AUD,
};
