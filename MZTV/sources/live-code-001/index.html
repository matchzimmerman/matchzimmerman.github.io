<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE CODE 001 · MZTV</title>
<style>
:root{
  --ink:#18132d;
  --violet:#3324ff;
  --orange:#ff6a38;
  --acid:#eef44f;
  --cream:#f3edd8;
  --pink:#ff55ad;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--cream);overflow:hidden}
body{font-family:"SFMono-Regular",Menlo,Consolas,ui-monospace,monospace;color:var(--ink);min-width:940px}
#app{height:100%;display:grid;grid-template-rows:42px 1fr;border:4px solid var(--ink)}
header{
  display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:4px solid var(--ink);
  background:var(--acid);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase
}
header .title{font-size:14px;letter-spacing:.14em}
header .grow{flex:1}
button{
  appearance:none;border:2px solid var(--ink);background:var(--cream);color:var(--ink);padding:5px 9px;
  font:800 10px/1 ui-monospace,monospace;text-transform:uppercase;cursor:pointer;border-radius:0;box-shadow:2px 2px 0 var(--ink)
}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:var(--pink)}
main{min-height:0;display:grid;grid-template-columns:1fr 1fr}
#codeSide,#visualSide{min-width:0;min-height:0;position:relative;overflow:hidden}
#codeSide{background:var(--violet);color:var(--cream);border-right:4px solid var(--ink);display:grid;grid-template-rows:34px 1fr 34px}
.bar{
  display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:2px solid var(--ink);
  background:var(--orange);color:var(--ink);font:800 10px/1 ui-monospace,monospace;text-transform:uppercase
}
.bar .grow{flex:1}
#code{overflow:auto;padding:14px 10px 24px 8px;scrollbar-width:thin;scrollbar-color:var(--acid) transparent}
.line{
  min-height:28px;display:grid;grid-template-columns:34px minmax(250px,1fr) 92px 68px;align-items:center;
  gap:8px;padding:1px 4px;border-left:6px solid transparent;transition:background .08s,border-color .08s
}
.line.flash{background:var(--pink);color:var(--ink);border-left-color:var(--acid)}
.line.active{background:rgba(238,244,79,.12);border-left-color:var(--acid)}
.ln{text-align:right;opacity:.55;font-size:10px;user-select:none}
.src{
  outline:0;white-space:pre;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700;line-height:1.2;
  padding:4px 2px;border-bottom:1px solid rgba(243,237,216,.12)
}
.src:focus{background:var(--cream);color:var(--ink);border-bottom-color:var(--ink)}
.meter{height:10px;display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.meter i{display:block;background:rgba(243,237,216,.18)}
.meter i.on{background:var(--acid)}
.read{font-size:10px;text-align:right;font-weight:900;letter-spacing:.03em;color:var(--acid)}
.comment .src{opacity:.62;font-weight:500}
.comment .meter,.comment .read{opacity:0}
#status{
  display:flex;align-items:center;gap:10px;padding:0 12px;border-top:2px solid var(--ink);background:var(--cream);
  color:var(--ink);font:800 10px/1 ui-monospace,monospace;text-transform:uppercase
}
#status .dot{width:9px;height:9px;background:var(--pink);border:2px solid var(--ink)}
#status .dot.ok{background:var(--acid)}
#visualSide{background:var(--orange)}
#visualBar{
  position:absolute;z-index:3;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:2px solid var(--ink);background:var(--cream);font:800 10px/1 ui-monospace,monospace;text-transform:uppercase
}
#visualBar .grow{flex:1}
#stage{position:absolute;left:0;right:0;top:34px;bottom:0;width:100%;height:calc(100% - 34px);image-rendering:pixelated}
#tag{
  position:absolute;z-index:4;left:12px;bottom:12px;border:2px solid var(--ink);background:var(--acid);color:var(--ink);
  padding:7px 9px;font:900 10px/1.25 ui-monospace,monospace;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)
}
#era{
  position:absolute;z-index:4;right:12px;bottom:12px;color:var(--ink);background:var(--pink);border:2px solid var(--ink);
  padding:7px 9px;font:900 10px/1.25 ui-monospace,monospace;text-transform:uppercase
}
@media(max-height:620px){
  .line{min-height:23px;grid-template-columns:28px minmax(210px,1fr) 78px 58px}
  .src{font-size:11px}.meter{height:8px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">MZTV / LIVE CODE 001</div>
  <div>OBAS audiovisual source</div>
  <div class="grow"></div>
  <div id="clock">72 BPM · BAR 01</div>
  <button id="evolveBtn" class="on">AUTO EVOLVE</button>
  <button id="playBtn">PLAY</button>
</header>
<main>
  <section id="codeSide">
    <div class="bar"><span>LIVE SCORE</span><span>CODE MUTATES WITH THE PIECE</span><span class="grow"></span><span>⌘/CTRL + ENTER = APPLY</span></div>
    <div id="code"></div>
    <div id="status"><span class="dot ok" id="statusDot"></span><span id="statusText">ready · edit a line or let the system rewrite itself</span></div>
  </section>
  <section id="visualSide">
    <div id="visualBar"><span>OBAS FIELD</span><span class="grow"></span><span id="fieldRead">PRESSURE .34 · MEMORY .72 · DRIFT .13</span></div>
    <canvas id="stage"></canvas>
    <div id="tag">SOUND + IMAGE<br>SHARED STATE</div>
    <div id="era">ERA 01<br>RIDGES</div>
  </section>
</main>
</div>

<script>
'use strict';
(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);

const S={
  playing:false,auto:true,bpm:72,step:0,bar:1,era:1,eraName:'RIDGES',eraStep:0,
  pressure:.34,memory:.72,drift:.13,density:.58,echo:.48,mutation:.28,
  pulse:0,sub:0,grain:0,space:0,rupture:0,beatPhase:0,visPhase:0,
  kick:'x...x..x....x...',dust:'..x...x...x..x..',
  bass:['c1','.','.','c1','.','eb1','.','.','g0','.','bb0','.','.','c1','.','.'],
  fieldSeed:Math.random()*10000
};

const specs=[
  {id:'c1',src:'// one score -> sound + image',comment:1},
  {id:'tempo',src:'tempo(72)',signal:'space'},
  {id:'kick',src:'kick("x...x..x....x...")',signal:'pulse'},
  {id:'bass',src:'sub("<c1 . . c1 . eb1 . . g0 . bb0 . . c1 . .>")',signal:'sub'},
  {id:'dust',src:'dust(prob(.28))',signal:'grain'},
  {id:'dub',src:'space("dub", .48)',signal:'space'},
  {id:'c2',src:'// visual field',comment:1},
  {id:'field',src:'field("ridges")',signal:'rupture'},
  {id:'pressure',src:'pressure(~.34)',signal:'pressure'},
  {id:'memory',src:'memory(~.72)',signal:'memory'},
  {id:'drift',src:'drift(~.13)',signal:'drift'},
  {id:'density',src:'density(~.58)',signal:'density'},
  {id:'c3',src:'// influence routing',comment:1},
  {id:'l1',src:'influence(kick -> rupture, .92)',signal:'pulse'},
  {id:'l2',src:'influence(sub -> mass, .84)',signal:'sub'},
  {id:'l3',src:'influence(dust -> grain, .46)',signal:'grain'},
  {id:'mutate',src:'mutate(every(4 bars), .28)',signal:'mutation'}
];

const code=document.getElementById('code');
const lineMap={};
specs.forEach((sp,i)=>{
  const row=document.createElement('div'); row.className='line'+(sp.comment?' comment':''); row.dataset.id=sp.id;
  const ln=document.createElement('span'); ln.className='ln'; ln.textContent=String(i+1).padStart(2,'0');
  const src=document.createElement('span'); src.className='src'; src.contentEditable=sp.comment?'false':'true'; src.spellcheck=false; src.textContent=sp.src;
  const meter=document.createElement('span'); meter.className='meter';
  for(let j=0;j<12;j++){const q=document.createElement('i'); meter.appendChild(q)}
  const read=document.createElement('span'); read.className='read'; read.textContent='';
  row.append(ln,src,meter,read); code.appendChild(row);
  lineMap[sp.id]={row,src,meter,read,signal:sp.signal,comment:sp.comment};
  src.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();applyLine(sp.id)}
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();applyAll()}
  });
  src.addEventListener('blur',()=>{if(!sp.comment)applyLine(sp.id)});
});

function flash(id){
  const o=lineMap[id]; if(!o)return; o.row.classList.add('flash');
  setTimeout(()=>o.row.classList.remove('flash'),180);
}
function rewrite(id,text){
  const o=lineMap[id]; if(!o||document.activeElement===o.src)return;
  if(o.src.textContent!==text){o.src.textContent=text;flash(id)}
}

function applyLine(id){
  const t=lineMap[id].src.textContent.trim();
  try{
    let m;
    if(id==='tempo'&&(m=t.match(/tempo\(([\d.]+)\)/)))S.bpm=clamp(+m[1],48,128);
    else if(id==='kick'&&(m=t.match(/kick\("([x.\-]+)"\)/)))S.kick=m[1];
    else if(id==='dust'&&(m=t.match(/prob\(([\d.]+)\)/)))S.mutation=clamp(+m[1],0,1);
    else if(id==='dub'&&(m=t.match(/,\s*([\d.]+)\)/)))S.echo=clamp(+m[1],0,1);
    else if(id==='field'&&(m=t.match(/field\("([^"]+)"\)/))){S.eraName=m[1].toUpperCase()}
    else if(id==='pressure'&&(m=t.match(/~?([\d.]+)\)/)))S.pressure=clamp(+m[1],0,1);
    else if(id==='memory'&&(m=t.match(/~?([\d.]+)\)/)))S.memory=clamp(+m[1],0,1);
    else if(id==='drift'&&(m=t.match(/~?([\d.]+)\)/)))S.drift=clamp(+m[1],0,1);
    else if(id==='density'&&(m=t.match(/~?([\d.]+)\)/)))S.density=clamp(+m[1],0,1);
    status('applied '+id,true);
  }catch(e){status('could not parse '+id,false)}
}
function applyAll(){Object.keys(lineMap).forEach(id=>{if(!lineMap[id].comment)applyLine(id)});status('score applied',true)}

document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();applyAll()}});

function status(msg,ok){
  document.getElementById('statusText').textContent=msg;
  document.getElementById('statusDot').className='dot'+(ok?' ok':'');
}

let AC=null,master=null,delay=null,feedback=null,delayFilter=null;
function audioInit(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.34;master.connect(AC.destination);
  delay=AC.createDelay(2);delay.delayTime.value=.34;
  feedback=AC.createGain();feedback.gain.value=.52;
  delayFilter=AC.createBiquadFilter();delayFilter.type='lowpass';delayFilter.frequency.value=1700;
  delay.connect(delayFilter).connect(feedback).connect(delay);delay.connect(master);
}
function envGain(amp,dur){
  const g=AC.createGain(),n=AC.currentTime;
  g.gain.setValueAtTime(Math.max(.0001,amp),n);
  g.gain.exponentialRampToValueAtTime(.0001,n+dur);return g;
}
function trigKick(){
  const n=AC.currentTime,o=AC.createOscillator(),g=envGain(.9,.28);
  o.type='sine';o.frequency.setValueAtTime(115,n);o.frequency.exponentialRampToValueAtTime(42,n+.17);
  o.connect(g).connect(master);o.start(n);o.stop(n+.3);
  if(Math.random()<.35+S.pressure*.25)g.connect(delay);
}
function trigDust(){
  const len=Math.floor(AC.sampleRate*.055),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=envGain(.08+.08*S.pressure,.06);
  src.buffer=buf;bp.type='bandpass';bp.frequency.value=700+rnd(1500);bp.Q.value=3+rnd(8);
  src.connect(bp).connect(g).connect(master);if(Math.random()<S.echo)g.connect(delay);src.start();
}
const semi={c:0,'c#':1,db:1,d:2,'d#':3,eb:3,e:4,f:5,'f#':6,gb:6,g:7,'g#':8,ab:8,a:9,'a#':10,bb:10,b:11};
function hz(note){const m=String(note).toLowerCase().match(/^([a-g](?:#|b)?)(-?\d)$/);if(!m)return 32.7;const midi=(+m[2]+1)*12+semi[m[1]];return 440*Math.pow(2,(midi-69)/12)}
function trigSub(note){
  const n=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sine';o2.type='triangle';o.frequency.value=hz(note);o2.frequency.value=hz(note)*2;
  lp.type='lowpass';lp.frequency.value=190+S.pressure*260;lp.Q.value=2.5;
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.22,n+.018);g.gain.exponentialRampToValueAtTime(.0001,n+.33);
  o.connect(lp);o2.connect(lp);lp.connect(g).connect(master);if(Math.random()<.22+S.echo*.35)g.connect(delay);
  o.start(n);o2.start(n);o.stop(n+.35);o2.stop(n+.35);
}
function trigStab(){
  const n=AC.currentTime,root=[48,51,43,46][S.era%4],g=AC.createGain(),lp=AC.createBiquadFilter();
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.09,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.55);
  lp.type='lowpass';lp.frequency.value=700+S.pressure*900;
  [0,3,7].forEach(iv=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(root+iv-69)/12);o.connect(lp);o.start(n);o.stop(n+.6)});
  lp.connect(g).connect(master);g.connect(delay);
}

function currentSignal(name){
  if(name==='pulse')return S.pulse;
  if(name==='sub')return S.sub;
  if(name==='grain')return S.grain;
  if(name==='space')return S.space;
  if(name==='rupture')return S.rupture;
  if(name==='pressure')return S.pressure;
  if(name==='memory')return S.memory;
  if(name==='drift')return S.drift;
  if(name==='density')return S.density;
  if(name==='mutation')return S.mutation;
  return 0;
}
function updateMeters(){
  Object.values(lineMap).forEach(o=>{
    if(o.comment)return;
    const v=clamp(currentSignal(o.signal),0,1);
    [...o.meter.children].forEach((q,i)=>q.classList.toggle('on',i<Math.round(v*12)));
    o.read.textContent=v.toFixed(2);
  });
}
function updateLiveCode(){
  rewrite('tempo','tempo('+Math.round(S.bpm)+')');
  rewrite('pressure','pressure(~'+S.pressure.toFixed(2)+')');
  rewrite('memory','memory(~'+S.memory.toFixed(2)+')');
  rewrite('drift','drift(~'+S.drift.toFixed(2)+')');
  rewrite('density','density(~'+S.density.toFixed(2)+')');
  rewrite('dub','space("dub", '+S.echo.toFixed(2)+')');
  rewrite('dust','dust(prob('+S.mutation.toFixed(2)+'))');
  rewrite('field','field("'+S.eraName.toLowerCase()+'")');
}
function mutateEra(force){
  if(!S.auto&&!force)return;
  const names=['RIDGES','PRESSURE','RUPTURE','DRIFT','MEMORY','FAULT','TIDE'];
  S.era++;S.eraName=names[S.era%names.length];
  S.pressure=clamp(S.pressure+rnd(.34,-.20),.16,.94);
  S.memory=clamp(S.memory+rnd(.22,-.16),.34,.92);
  S.drift=clamp(S.drift+rnd(.24,-.12),.04,.48);
  S.density=clamp(S.density+rnd(.34,-.24),.28,.94);
  S.echo=clamp(S.echo+rnd(.34,-.22),.18,.82);
  S.mutation=clamp(S.mutation+rnd(.28,-.18),.12,.72);
  S.bpm=clamp(S.bpm+rnd(8,-6),64,86);
  S.fieldSeed=Math.random()*10000;S.rupture=1;
  const kickP=['x...x..x....x...','x...x...x..x....','x..x....x...x...','x....x..x.x.....'];
  S.kick=kickP[S.era%kickP.length];rewrite('kick','kick("'+S.kick+'")');
  const roots=[
    ['c1','.','.','c1','.','eb1','.','.','g0','.','bb0','.','.','c1','.','.'],
    ['c1','.','g0','.','.','bb0','.','c1','.','.','eb1','.','.','g0','.','.'],
    ['c1','.','.','.','eb1','.','g0','.','.','bb0','.','g0','.','c1','.','.'],
    ['c1','.','.','bb0','.','.','g0','.','eb1','.','.','c1','.','.','g0','.']
  ];
  S.bass=roots[S.era%roots.length];
  rewrite('bass','sub("<'+S.bass.join(' ') + '>")');
  updateLiveCode();
  document.getElementById('era').innerHTML='ERA '+String(S.era).padStart(2,'0')+'<br>'+S.eraName;
  if(AC){delay.delayTime.setTargetAtTime(.23+S.echo*.34,AC.currentTime,.08);feedback.gain.setTargetAtTime(.30+S.echo*.39,AC.currentTime,.08)}
}
document.getElementById('evolveBtn').onclick=function(){S.auto=!S.auto;this.classList.toggle('on',S.auto);this.textContent=S.auto?'AUTO EVOLVE':'AUTO HELD'};

let timer=null;
function stepTick(){
  if(!S.playing)return;
  const i=S.step;
  if(S.kick[i%S.kick.length]==='x'){trigKick();S.pulse=1;S.rupture=Math.max(S.rupture,.65)}
  if(Math.random()<(S.mutation*.45+.09) && ((i+S.era)%2===0)){trigDust();S.grain=1}
  const note=S.bass[i%S.bass.length];
  if(note!=='.'&&note){trigSub(note);S.sub=1}
  if(i===12 && Math.random()<.18+S.pressure*.35){trigStab();S.space=1}
  S.step=(S.step+1)%16;
  if(S.step===0){
    S.bar++;
    if(S.auto && S.bar%4===1)mutateEra(false);
  }
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if(!S.playing)return;
  const swing=(S.step%2?.08:0);
  timer=setTimeout(stepTick,(60000/S.bpm/4)*(1+swing));
}
document.getElementById('playBtn').onclick=async function(){
  audioInit();await AC.resume();S.playing=!S.playing;
  this.textContent=S.playing?'STOP':'PLAY';this.classList.toggle('on',S.playing);
  if(S.playing){stepTick();status('running · score and field share one clock',true)}else{clearTimeout(timer);status('stopped · field remains alive',true)}
};

const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false});
const low=document.createElement('canvas'),g=low.getContext('2d',{alpha:false});
const W=320,H=180;low.width=W;low.height=H;
const P=['#3324ff','#ff6a38','#eef44f','#f3edd8','#ff55ad'];
let trails=document.createElement('canvas'),tg=trails.getContext('2d');trails.width=W;trails.height=H;
const pts=Array.from({length:260},()=>({a:rnd(TAU),r:rnd(1),j:rnd(1),k:rnd(1)}));
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();

function ditherBlock(x,y,w,h,c1,c2,amount){
  g.fillStyle=c1;g.fillRect(x,y,w,h);
  g.fillStyle=c2;
  const step=4;
  for(let yy=0;yy<h;yy+=step)for(let xx=0;xx<w;xx+=step){
    const b=((xx/step)&1)^((yy/step)&1);
    if(((Math.sin((xx+x)*1.7+(yy+y)*2.3+S.fieldSeed)+1)*.5) < amount*(b?.95:.62))g.fillRect(x+xx,y+yy,2,2);
  }
}
function drawVisual(t){
  S.visPhase+=.006+S.drift*.018;
  S.pulse*=.88;S.sub*=.92;S.grain*=.80;S.space*=.96;S.rupture*=.95;
  S.pressure=clamp(S.pressure+Math.sin(t*.00037+S.era)*.0007,0,1);
  S.density=clamp(S.density+Math.sin(t*.00023+4)*.0005,0,1);
  S.memory=clamp(S.memory+Math.sin(t*.00017+7)*.00025,0,1);
  S.space=clamp(S.space+Math.sin(t*.0012)*.005,0,1);

  g.fillStyle=P[3];g.fillRect(0,0,W,H);

  // broad OBAS planes
  g.fillStyle=P[(S.era+1)%3];g.fillRect(0,0,W,H*.22);
  g.fillStyle=P[(S.era+2)%3];g.fillRect(0,H*.78,W,H*.22);

  // field ribbon
  const cy=H*(.50+Math.sin(S.visPhase*.43)*.06);
  g.lineJoin='round';g.lineCap='round';
  for(let q=0;q<5;q++){
    g.strokeStyle=P[(q+S.era)%4];g.lineWidth=5+q*3+S.sub*7;
    g.beginPath();
    for(let x=-20;x<W+20;x+=4){
      const y=cy+Math.sin(x*.035+S.visPhase*3+q*.45)*(12+24*S.pressure)+Math.sin(x*.012-S.visPhase*1.4)*18*S.drift+q*3;
      if(x===-20)g.moveTo(x,y);else g.lineTo(x,y);
    }
    g.stroke();
  }

  // influence body
  const cx=W*(.30+Math.sin(S.visPhase*.31)*.08),by=H*(.47+Math.cos(S.visPhase*.27)*.05);
  const rad=28+S.sub*16+S.pressure*14;
  g.fillStyle=P[(S.era+3)%4];g.beginPath();
  for(let i=0;i<32;i++){
    const a=i/32*TAU;
    const rr=rad*(1+.18*Math.sin(a*5+S.visPhase*3)+.09*Math.sin(a*11-S.visPhase*2));
    const x=cx+Math.cos(a)*rr,y=by+Math.sin(a)*rr*.86;
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.closePath();g.fill();
  ditherBlock(Math.floor(cx-rad*.55),Math.floor(by-rad*.45),Math.floor(rad*1.1),Math.floor(rad*.9),P[(S.era+3)%4],P[(S.era+1)%4],.22+.42*S.pressure);

  // particle scars / memory
  tg.fillStyle='rgba(243,237,216,'+(1-S.memory*.80)+')';tg.fillRect(0,0,W,H);
  tg.fillStyle=P[(S.era+2)%4];
  const count=Math.floor(28+S.density*150+S.grain*90);
  for(let i=0;i<count;i++){
    const p=pts[i%pts.length],a=p.a+S.visPhase*(.2+p.k*.5);
    const rr=(18+p.r*100)*(1+S.sub*.18);
    const x=W*.58+Math.cos(a)*rr+Math.sin(a*3)*S.drift*24;
    const y=H*.49+Math.sin(a*1.13)*rr*.55;
    const z=1+(i%3);
    tg.fillRect(Math.round(x/z)*z,Math.round(y/z)*z,z,z);
  }
  g.globalAlpha=.58;g.drawImage(trails,0,0);g.globalAlpha=1;

  // rupture blocks
  const blocks=3+Math.floor(S.rupture*11);
  for(let i=0;i<blocks;i++){
    const x=((i*47+Math.floor(S.fieldSeed))%W),y=((i*29+Math.floor(S.fieldSeed*.7))%H);
    g.fillStyle=P[(i+S.era)%4];g.fillRect(x,y,3+(i%4)*4,6+(i%3)*7);
  }

  // kick pulse ring
  if(S.pulse>.03){
    g.strokeStyle=P[4];g.lineWidth=2+S.pulse*6;g.beginPath();g.arc(cx,by,rad+10+S.pulse*36,0,TAU);g.stroke();
  }

  // grain
  g.fillStyle=P[0];
  for(let i=0;i<Math.floor(8+S.grain*90);i++){
    const x=Math.floor(rnd(W)),y=Math.floor(rnd(H));
    if((x+y+i)%3)g.fillRect(x,y,1+(i%2),1);
  }

  // 1-bit-ish scan markers
  g.fillStyle=P[0];
  for(let x=0;x<W;x+=16)if(((x/16+S.era)|0)%3===0)g.fillRect(x,H-4,8,2);

  ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,canvas.width,canvas.height);
  document.getElementById('fieldRead').textContent='PRESSURE '+S.pressure.toFixed(2)+' · MEMORY '+S.memory.toFixed(2)+' · DRIFT '+S.drift.toFixed(2);
  document.getElementById('clock').textContent=Math.round(S.bpm)+' BPM · BAR '+String(S.bar).padStart(2,'0');
  updateMeters();
  if(S.auto && Math.floor(t/240)%2===0)updateLiveCode();
  requestAnimationFrame(drawVisual);
}
requestAnimationFrame(drawVisual);
updateLiveCode();
mutateEra(true);
})();
</script>
