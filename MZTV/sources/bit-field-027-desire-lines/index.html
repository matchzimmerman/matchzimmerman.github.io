  while (simAcc >= 1 / 30 && n < 2) { simStep(); simAcc -= 1 / 30; n++; S.frames++; }
  if (simAcc > 0.1) simAcc = 0;
  render();
  hudT += dt; if (hudDirty || hudT > 0.5) { hudT = 0; drawHud(); }
  requestAnimationFrame(frame);
}

// ============================================================================ boot
alloc(false);
if (!load()) {
  S = freshState();
  // the epoch at the end of the lineage is this piece itself; reading begins in the oldest one
  S.epoch.i = 0; palTo = PAL[LIN[0].id].map(hex); palCur = palTo.map(c => c.slice());
  log(`BEGIN · ${NU} TURNS · ${P.stats.sentences} SENTENCES · ${NC} RECURRING CONCEPTS · ${LIN.length} EPOCHS IN THE LINEAGE`);
  log(`EPOCH 1 · ${LIN[0].name} (${LIN[0].date}) · ${NOTE[LIN[0].center]} ${LIN[0].mode.toUpperCase()} · ${LIN[0].meter}-STEP CYCLE`);
} else {
  // the ground comes back from memory; live trails regrow from it
  for (let i = 0; i < NG; i++) { TM[i] = SED[i] * 0.8; TH[i] = SED[i] * 0.25; }
  S.reader.next = Math.min(S.reader.next, S.T + 2);
  log(`RESUMED · ${fmtT(S.T)} OF HISTORY RESTORED`);
}
// fast-forward (testing): logical time runs on, the field is stepped coarsely
if (FF > 0) {
  const target = S.T + FF * 3600; let k = 0;
  while (S.T < target) { advance(1); if (++k % 2 === 0) simStep(60); }
  log(`FAST-FORWARDED ${FF}H`);
}
// pre-warm so it was already running before you arrived
for (let i = 0; i < 140; i++) { if (i % 10 === 0) advance(0.35); simStep(); }
for (let i = 0; i < NG; i++) { DH[i] = 1 - Math.exp(-TH[i] * 0.9); DM[i] = 1 - Math.exp(-TM[i] * 1.4); DS[i] = clamp(SED[i] * 2.2 * SIGV.sedGain, 0, 1); }
palCur = palTo.map(c => c.slice());
render(); drawHud();
setInterval(logicTick, 100);
setInterval(scheduler, 40);
setInterval(watchdog, 1000);
requestAnimationFrame(frame);
startAudio();
const unlock = () => { startAudio(); };
for (const ev of ['pointerdown', 'touchend', 'keydown', 'click']) addEventListener(ev, unlock, { passive: true });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'i' || k === 'h') { INFO = !INFO; hudDirty = true; }
  else if (k === 'm') { A.muted = !A.muted; if (A.G) A.G.out.gain.setTargetAtTime(A.muted ? 0 : OUT, A.ctx.currentTime, 0.3); }
  else if (k === 'c') { S.count.human++; S.epoch.tension += 0.1; correction(0.9, 'H', true); }
  else if (k === 'a') { S.count.human++; ratify(true); }
});
addEventListener('pagehide', save); addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
let rsT = 0; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const [w, h] = viewSize(); if (Math.round(LINES * w / h / 2) * 2 !== VW) { alloc(true); } else { hc.width = w; hc.height = h; hudDirty = true; } }, 250); });

// ============================================================================ capture / test API
window.MZ = {
  ready: true,
  state: () => ({ T: S.T, epoch: S.epoch.i, epochName: LIN[S.epoch.i].name, tension: S.epoch.tension, pass: S.reader.pass, u: S.reader.u, count: S.count, agents: nA, sedMean, sig: Object.assign({}, SIG), log: S.log.slice(0, 12), audio: A.ctx ? A.ctx.state : 'none', visits: S.reader.visits.slice(), history: S.epoch.history.slice() }),
  force(op) {
    if (op === 'rupture') { S.epoch.tension = 1; beginRupture('forced'); }
    else if (op === 'correct') correction(0.9, 'H', true);
    else if (op === 'accept') ratify(true);
    else if (op === 'return') { const c = S.concepts.born.findIndex(b => b); if (c >= 0) returnEvent(c, 'M', 3600); }
    else if (op === 'bridge') { const b = P.bridges[0]; bridgeEvent(b[0], b[1]); }
  },
  advance: (sec) => { for (let i = 0; i < sec; i++) advance(1); },
  sim: (n) => { for (let i = 0; i < n; i++) simStep(); render(); },
  poison() { TH[NG >> 1] = NaN; TM[NG >> 3] = NaN; },
  audio: () => A,
  rebuild: () => rebuildGraph('TEST'),
  save, alloc,
};
</script>
