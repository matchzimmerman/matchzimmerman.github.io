  { const sp = S.dir.clone().multiplyScalar(8000).add(camera.position).project(camera); if (S.el > -1 && sp.z < 1) lensL.push([sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5, sc, 0.35 * smooth((S.el + 1) / 4) * (0.4 + 0.6 * warm)]); }
  { const mp = moon.position.clone().project(camera); if (moon.visible && mp.z < 1) lensL.push([mp.x * 0.5 + 0.5, mp.y * 0.5 + 0.5, new THREE.Color(0.7, 0.75, 0.85), 0.05 * night]); }
  for (let i = 0; i < 8; i++) { const L = lensL[i]; if (L) { lens.uniforms.uL.value[i].set(L[0], L[1], 0); lens.uniforms.uLC.value[i].setRGB(L[2].r * L[3], L[2].g * L[3], L[2].b * L[3]); } else lens.uniforms.uLC.value[i].setRGB(0, 0, 0); }
  lens.uniforms.uAsp.value = camera.aspect;
  // focus: slow racks between near water and far
  const rack = smooth(vn1(t * RATE / 70 + 5)); const focus = lerp(6, 400, Math.pow(rack, 0.6)); STATE.focus = focus;
  bokeh.uniforms.focus.value = focus; bokeh.uniforms.aperture.value = 0.00012 + 0.0005 * (1 - rack); bokeh.uniforms.maxblur.value = 0.006; bokeh.enabled = QUAL > 0;
  bloom.strength = lerp(0.2, 0.32, night); grade.uniforms.uTime.value = t;
  composer.render();
  Object.assign(STATE, { hour: H, sun: S, moon: M, sea: sea_s, flares: live.map(l => l.F.name + (l.s.phase === 'rise' ? ' (rising)' : '')), day, night });
}

/* ================= sound: sea bed, drone, flares ================= */
const AU = { ctx: null, g: null, sched: 0 };
function makeNoise(ctx, secs) { const n = Math.floor(ctx.sampleRate * secs), b = ctx.createBuffer(2, n, ctx.sampleRate), r = mulberry(SEED + 41);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let l = 0; for (let i = 0; i < n; i++) { l = l * 0.996 + (r() * 2 - 1) * 0.06; d[i] = l * 0.7; }
    const f = Math.floor(ctx.sampleRate * 0.5); for (let i = 0; i < f; i++) { const k = i / f; d[n - f + i] = d[n - f + i] * (1 - k) + d[i] * k; } } return b; }
function buildAudio(ctx) {
  const out = ctx.createGain(); out.gain.value = 0; out.connect(ctx.destination);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.connect(out);
  const top = ctx.createBiquadFilter(); top.type = 'lowpass'; top.frequency.value = 2400; top.connect(comp);
  const verbIR = (() => { const len = Math.floor(ctx.sampleRate * 6), b = ctx.createBuffer(2, len, ctx.sampleRate), r = mulberry(5); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let lp = 0; for (let i = 0; i < len; i++) { lp = lp * 0.8 + (r() * 2 - 1) * 0.2; d[i] = lp * Math.pow(1 - i / len, 2.4); } } return b; })();
  const verb = ctx.createConvolver(); verb.buffer = verbIR; const vf = ctx.createBiquadFilter(); vf.type = 'lowpass'; vf.frequency.value = 900; const vg = ctx.createGain(); vg.gain.value = 0.45; verb.connect(vf); vf.connect(vg); vg.connect(top);
  // sea bed: brown noise swelling with the swell period
  const sea = ctx.createBufferSource(); sea.buffer = makeNoise(ctx, 21); sea.loop = true; const sf = ctx.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 500; const sg = ctx.createGain(); sg.gain.value = 0.4;
  sea.connect(sf); sf.connect(sg); sg.connect(top); sg.connect(verb); sea.start();
  // drone: a low fifth whose colour follows the sky
  const dg = ctx.createGain(); dg.gain.value = 0.1; const df = ctx.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 300; df.connect(dg); dg.connect(top); dg.connect(verb);
  const osc = [[49, "sine", 0.3], [73.4, 'sine', 0.3], [98, 'triangle', 0.18], [146.8, 'sine', 0.07]].map(([f, ty, a]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = ty; o.frequency.value = f; g.gain.value = a; o.connect(g); g.connect(df); o.start(); return o; });
  const wb = ctx.createBufferSource(); wb.buffer = sea.buffer; wb.loop = true; const wf = ctx.createBiquadFilter(); wf.type = 'bandpass'; wf.Q.value = 0.7; wf.frequency.value = 500; const wg = ctx.createGain(); wg.gain.value = 0;
  wb.connect(wf); wf.connect(wg); wg.connect(top); wb.start(0, 7.3);
  return { out, top, verb, sea, sf, sg, dg, df, osc, wb, wf, wg };
}
function scheduleFlareSound(ctx, g, F, when) {   // launch thunk, rising hiss, ignition boom, burning crackle (all low)
  const t0 = when; const nb = ctx.createBufferSource(); nb.buffer = g.sea.buffer; nb.loop = true;
  const thump = ctx.createOscillator(), tg = ctx.createGain(); thump.frequency.setValueAtTime(90, t0); thump.frequency.exponentialRampToValueAtTime(38, t0 + 0.4);
  tg.gain.setValueAtTime(0, t0); tg.gain.linearRampToValueAtTime(0.35, t0 + 0.01); tg.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2); thump.connect(tg); tg.connect(g.top); tg.connect(g.verb); thump.start(t0); thump.stop(t0 + 1.3);
  const hf = ctx.createBiquadFilter(); hf.type = 'bandpass'; hf.Q.value = 2; hf.frequency.setValueAtTime(300, t0); hf.frequency.exponentialRampToValueAtTime(900, t0 + F.rise);
  const hg = ctx.createGain(); hg.gain.setValueAtTime(0, t0); hg.gain.linearRampToValueAtTime(0.12, t0 + 0.3); hg.gain.linearRampToValueAtTime(0, t0 + F.rise);
  const ig = ctx.createOscillator(), igg = ctx.createGain(), ti = t0 + F.rise; ig.frequency.setValueAtTime(60, ti); ig.frequency.exponentialRampToValueAtTime(30, ti + 1.5);
  igg.gain.setValueAtTime(0, ti); igg.gain.linearRampToValueAtTime(0.25, ti + 0.05); igg.gain.exponentialRampToValueAtTime(0.001, ti + 3); ig.connect(igg); igg.connect(g.top); igg.connect(g.verb); ig.start(ti); ig.stop(ti + 3.2);
  const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 420; bf.Q.value = 0.8; const bg = ctx.createGain(); bg.gain.setValueAtTime(0, ti); bg.gain.linearRampToValueAtTime(0.05, ti + 1.5);
  bg.gain.setValueAtTime(0.05, ti + F.burn); bg.gain.linearRampToValueAtTime(0, ti + F.burn + 4); const pan = ctx.createStereoPanner(); pan.pan.value = clamp(F.x / 700, -0.9, 0.9);
  nb.connect(hf); hf.connect(hg); hg.connect(pan); nb.connect(bf); bf.connect(bg); bg.connect(pan); pan.connect(g.top); pan.connect(g.verb); nb.start(t0, (F.seed % 17)); nb.stop(ti + F.burn + 4.5);

function audioTick(tNow, tAudio) {   // tNow: piece time; tAudio: ctx time for tNow
  const ctx = AU.ctx, g = AU.g; if (!ctx) return;
  const S = sunState(tNow), day = smooth((S.el + 4) / 14), sea_s = seaStateAt(tNow), sw = 0.5 + 0.5 * Math.sin(tNow * TAU / (Math.max(5, SM.swellPer || 9) * 1.2));
  if (g.wg) { const w = clamp(((SM.wind || 0) - 2) / 14, 0, 1); g.wg.gain.setTargetAtTime(0.1 * w * w, tAudio, 2); g.wf.frequency.setTargetAtTime(lerp(300, 900, w), tAudio, 2); }
  g.sg.gain.setTargetAtTime(lerp(0.18, 0.55, sea_s) * (0.55 + 0.45 * sw), tAudio, 0.6); g.sf.frequency.setTargetAtTime(lerp(280, 900, sea_s) * (0.7 + 0.5 * sw), tAudio, 0.6);

  planFlares(tNow + 10); for (const F of FL) if (!F.heard && F.t0 >= tNow - 0.05 && F.t0 < tNow + 1.0) { F.heard = true; scheduleFlareSound(ctx, g, F, tAudio + (F.t0 - tNow)); }
}
async function renderAudioOffline(t0, secs) {   // capture: sound for [t0, t0+secs], sample-locked to render(t)
  const ctx = new OfflineAudioContext(2, Math.ceil(secs * 48000), 48000); AU.ctx = ctx; AU.g = buildAudio(ctx); AU.g.out.gain.setValueAtTime(0.9, 0);
  for (const F of FL) F.heard = false; for (let t = 0; t < secs; t += 0.25) { audioTick(t0 + t, t); }
  const buf = await ctx.startRendering(), n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1), ab = new ArrayBuffer(44 + n * 4), d = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true); d.setUint32(24, 48000, true); d.setUint32(28, 192000, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); w(36, 'data'); d.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); d.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  const u = new Uint8Array(ab); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s);
}

/* ================= info box ================= */
const infoEl = document.getElementById('info'); let INFO = Q.get('info') !== '0';
const hhmm = H => String(Math.floor(H)).padStart(2, '0') + ':' + String(Math.floor(fract(H) * 60)).padStart(2, '0');
function renderInfo() { infoEl.style.display = INFO ? 'block' : 'none'; if (!INFO) return; const S = STATE;
  const phase = S.sun.el > 12 ? 'day' : S.sun.el > -1 ? (S.hour < 12 ? 'sunrise' : 'dusk') : S.sun.el > -10 ? 'twilight' : 'night';
  const cell = DATA.cell ? `${Math.abs(DATA.cell[0]).toFixed(2)}N ${Math.abs(DATA.cell[1]).toFixed(2)}W` : 'no reading yet';
  const upd = DATA.fetched ? hhmm(((DATA.fetched + OFF * 60000) / 3600000) % 24) : '—';
  infoEl.innerHTML = `<b>MZTV · BIT FIELD 022 · WATER STUDIES · GALWAY BAY</b>
${SITE.name} ${hhmm(S.hour)} · ${phase} · sun ${S.sun.el.toFixed(0)}° · moon ${S.moon.el.toFixed(0)}°
swell ${SM.swell.toFixed(1)} m · ${SM.swellPer.toFixed(0)} s · from ${compass(SM.swellDir)}   wind sea ${SM.windWave.toFixed(1)} m
wind ${SM.wind.toFixed(1)} m/s from ${compass(SM.windDir)} · gusts ${SM.gust.toFixed(0)} · cloud ${SM.cloud.toFixed(0)}%
sea ${SM.sst.toFixed(1)} °C · visibility ${(SM.vis / 1000).toFixed(0)} km${SM.precip > 0.05 ? ' · rain ' + SM.precip.toFixed(1) + ' mm' : ''}
flares ${S.flares.length ? S.flares.join(', ') : '—'} · focus ${S.focus.toFixed(0)} m
<b>what controls what</b>
real sun + moon over Inverin → glitter path, sky, drone colour
swell height, period, direction → the long waves' size, length, heading
wind → short chop, whitecaps above ~5 m/s, cloud drift, flare drift, wind hiss
cloud, rain, visibility → cover, dimmed sun, haze · sea temp → water colour
each flare → its own light path, cloud glow, a thump + hiss
<span style="opacity:.7">data: ${DATA.src} · marine model cell ${cell} · updated ${upd}</span>`; }
addEventListener('keydown', e => { if (e.key === 'i') { INFO = !INFO; renderInfo(); } if (e.key === 'f') fireNow(); });

/* ================= boot ================= */
function onResize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { if (!CAPTURE) onResize(); });
await new Promise(r => { THREE.DefaultLoadingManager.onLoad = r; setTimeout(r, 3000); });
if (!CAPTURE && !Q.has('data')) { await Promise.race([refreshData(), new Promise(r => setTimeout(r, 6000))]); setInterval(refreshData, 15 * 60 * 1000); }
render(0); renderInfo();
window.MZ = { ready: true, get DATA() { return DATA; }, refresh: refreshData, seek(t) { render(t); renderInfo(); }, get S() { return STATE; }, audioWav: renderAudioOffline, flares: () => { planFlares(T + 3600); return FL.map(f => ({ t0: f.t0, name: f.name })); } };
if (!CAPTURE) {
  let last = performance.now(), infoAcc = 0; const loop = () => { const n = performance.now(); T += (n - last) / 1000; last = n; render(T); infoAcc += 1; if (infoAcc > 15) { infoAcc = 0; renderInfo(); }
    if (AU.ctx && AU.ctx.currentTime > AU.sched - 0.5) { audioTick(T, AU.ctx.currentTime); AU.sched = AU.ctx.currentTime + 0.25; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const startAudio = async () => { if (MUTE || AU.ctx) return; AU.ctx = new AudioContext(); AU.g = buildAudio(AU.ctx); AU.g.out.gain.setTargetAtTime(0.9, AU.ctx.currentTime, 2); for (const F of FL) F.heard = F.t0 < T; };
  const go = document.getElementById('go');
  if (!MUTE) { startAudio(); setTimeout(() => { if (!AU.ctx || AU.ctx.state !== 'running') { go.hidden = false; go.onclick = async () => { go.hidden = true; await AU.ctx.resume(); }; } }, 600); }
}
