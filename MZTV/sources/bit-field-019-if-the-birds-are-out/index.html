<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>If the Birds Are Out · MZTV</title>
<!--
  MZTV · IF THE BIRDS ARE OUT
  A poem by Match Zimmerman, set as an OBAS field. Each stanza is a shot; each line lands on the beat (82 bpm).
  The field is one world: a house across the street, two aligned windows, the ocean behind them.
  Params: ?autoplay=1 (OBS) ?capture=1 (no loop; drive with MZ.tick/seek) ?lines=N (canvas rows) ?text=0 ?layout=v|h|c ?t0=SEC
-->
<style>
@font-face { font-family: 'JBM'; src: url('JetBrainsMono-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'JBM'; src: url('JetBrainsMono-Medium.woff2') format('woff2'); font-weight: 500; }
:root { --ink: #f6efdc; --band: rgba(9, 8, 24, 0.64); }
html, body { margin: 0; height: 100%; background: #0b0a1e; overflow: hidden; }
#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#wm { position: fixed; image-rendering: pixelated; }
#tag { position: fixed; font: 500 var(--tagsz, 24px)/1.2 'JBM', monospace; color: var(--ink); letter-spacing: 0.06em; }
#tag span { background: var(--band); padding: 4px 10px; }
#poem { position: fixed; font: 400 var(--fs, 40px)/var(--lh, 56px) 'JBM', monospace; color: var(--ink); white-space: pre; }
#poem div span { background: var(--band); padding: 3px 12px; box-decoration-break: clone; }
#end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 0; }
#end .blk { background: var(--band); padding: 48px 56px 40px; display: flex; flex-direction: column; align-items: center; }
#end .ln { font: 500 var(--efs, 30px)/1.5 'JBM', monospace; color: var(--ink); letter-spacing: 0.05em; text-align: center; }
#end .ln.sm { font-weight: 400; opacity: 0.9; }
#endwm { image-rendering: pixelated; margin-bottom: 30px; }
#go[hidden] { display: none !important; }
#go { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 22px 'JBM', monospace; color: var(--ink); background: rgba(9, 8, 24, 0.5); cursor: pointer; letter-spacing: 0.08em; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="wm"></canvas>
<div id="tag"><span>MZTV · A POEM BY MATCH ZIMMERMAN</span></div>
<div id="poem"></div>
<div id="end"><div class="blk"><canvas id="endwm"></canvas>
  <div class="ln sm">a poem by Match Zimmerman</div>
  <div class="ln sm">set as an OBAS field · sound and image from one system</div>
  <div class="ln" style="margin-top:22px">MZTV</div>
  <div class="ln">twitch.tv/matchzimmerman</div></div></div>
<div id="go" hidden>▶ PLAY · IF THE BIRDS ARE OUT</div>
<script src="poem.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1', TEXT = Q.get('text') !== '0';
const clamp = (x, a, b) => x < a ? a : x > b ? b : x, lerp = (a, b, k) => a + (b - a) * k;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const ease = (t, a, b) => smooth((t - a) / (b - a));
const fract = x => x - Math.floor(x);

/* ================= script: the poem is the clock ================= */
const BPM = 82, BEAT = 60 / BPM, HALF = BEAT * 2, BAR = BEAT * 4;
const lineBeats = s => { const w = s.trim().split(/\s+/).length; return w <= 3 ? 2 : w <= 5 ? 3 : 4; };
const SHOTS = []; let beat = 0;
POEM.forEach((st, si) => {
  const shot = { i: si, b0: beat, lines: [] };
  let b = beat + (si === 0 ? 4 : 2);
  const pages = st.split('\n|\n');
  pages.forEach((pg, pi) => {
    pg.split('\n').forEach(tx => { shot.lines.push({ tx, b, page: pi }); b += lineBeats(tx); });
    if (pi < pages.length - 1) b += 1;
  });
  b += 3; if ((b - 0) % 2) b++;           // cut on the half-bar
  shot.b1 = b; beat = b; SHOTS.push(shot);
});
const END_B0 = beat, END_B1 = beat + 8, TOTAL = END_B1 * BEAT;
for (const s of SHOTS) { s.t0 = s.b0 * BEAT; s.t1 = s.b1 * BEAT; for (const l of s.lines) l.t = l.b * BEAT; }
const END_T0 = END_B0 * BEAT;
const cue = (s, l) => SHOTS[s].lines[l].t;                       // when line l of stanza s lands
const cueEnd = (s, l) => { const L = SHOTS[s].lines; return l + 1 < L.length ? L[l + 1].t : SHOTS[s].t1; };
const shotAt = t => { for (const s of SHOTS) if (t < s.t1) return s.i; return 6; };

/* ================= canvas + layout ================= */
const cv = document.getElementById('cv'), cx = cv.getContext('2d', { willReadFrequently: false });
let VW = innerWidth, VH = innerHeight;
const LAYOUT = Q.get('layout') || (VW < VH ? (VW / VH > 0.7 ? 'c' : 'v') : 'h');
const LINES0 = +Q.get('lines') || (LAYOUT === 'h' ? 216 : LAYOUT === 'c' ? 270 : 384);
// in a browser, snap to an integer pixel scale so the dither stays crisp; capture keeps the exact line count
const LINES = clamp(Math.round(CAPTURE || Q.get('lines') ? LINES0 : innerHeight / Math.max(1, Math.round(innerHeight / LINES0))), 90, 900);
let W, H, U, FX, FY, IMG, BUF, THR = {}, VIS = { x0: 0.4, x1: 1 };
const HS = 0.8;   // house scale: front window width as a fraction of the short side
function resize() {
  VW = innerWidth; VH = innerHeight; H = LINES; W = Math.max(8, Math.round(LINES * VW / VH)); U = Math.min(W, H);
  cv.width = W; cv.height = H; IMG = cx.createImageData(W, H); BUF = new Uint32Array(IMG.data.buffer);
  FX = LAYOUT === 'h' ? W * 0.66 : W * 0.5; FY = LAYOUT === 'h' ? H * 0.5 : LAYOUT === 'c' ? H * 0.46 : H * 0.42;
  { const ch = Math.max(H, W / (HB.w / HB.h)), x0 = W / 2 - ch * (HB.w / HB.h) / 2; VIS = { x0: -x0 / ch, x1: (W - x0) / ch }; }
  buildThresholds(); layoutText();
}
/* dither grammars (per shot: the grammar ruptures on the cut) */
function buildThresholds() {
  const b8 = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
  const cl = [24,10,12,26,35,47,49,37,8,0,2,14,45,59,61,51,22,6,4,16,43,57,63,53,30,20,18,28,33,41,55,39,34,46,48,36,25,11,13,27,44,58,60,50,9,1,3,15,42,56,62,52,23,7,5,17,32,40,54,38,31,21,19,29];
  const mk = f => { const a = new Float32Array(W * H); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) a[y * W + x] = f(x, y); return a; };
  THR.bayer = mk((x, y) => (b8[(y & 7) * 8 + (x & 7)] + 0.5) / 64);
  THR.pearl = mk((x, y) => (cl[(y & 7) * 8 + (x & 7)] + 0.5) / 64);
  THR.grain = mk((x, y) => fract(52.9829189 * fract(0.06711056 * x + 0.00583715 * y)));
  THR.b4 = mk((x, y) => ([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5][(y & 3) * 4 + (x & 3)] + 0.5) / 16);
}

/* ================= palettes (dark → light), one per shot ================= */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALS = [
  ['#16204f', '#4a5cff', '#ff8fb8', '#fff3e0'],   // 0 house by day: indigo, electric blue, pink, cream
  ['#0d0826', '#43207a', '#ff5f3a', '#ffd76a'],   // 1 night lamps: ink, violet, vermilion, lamp yellow
  ['#241a5c', '#ff5e7a', '#ffb08a', '#fff4cf'],   // 2 sunrise: indigo, coral, apricot, dawn
  ['#050c2e', '#1747ff', '#7fe7ff', '#f2fbff'],   // 3 chop: radar blue
  ['#1a1030', '#6a4bff', '#c8ff5a', '#fbfaf0'],   // 4 foam + cycles: violet, lime foam
  ['#0a0a22', '#2b2a6e', '#8a5cff', '#ffcf7a'],   // 5 tonight
].map(p => p.map(hex));
const GRAMMAR = ['bayer', 'pearl', 'b4', 'grain', 'pearl', 'bayer'];
const PAL = new Uint32Array(4);
function setPal(cols) { for (let i = 0; i < 4; i++) { const c = cols[i]; PAL[i] = (255 << 24) | (Math.round(c[2]) << 16) | (Math.round(c[1]) << 8) | Math.round(c[0]); } }

/* ================= noise ================= */
function h2(x, y) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function h3(x, y, z) { return h2(x + Math.imul(z | 0, 1442695041), y ^ Math.imul(z | 0, 97)); }
function vn2(x, y) { const X = Math.floor(x), Y = Math.floor(y), fx = x - X, fy = y - Y, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = h2(X, Y), b = h2(X + 1, Y), c = h2(X, Y + 1), d = h2(X + 1, Y + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function vn3(x, y, z) { const Z = Math.floor(z), fz = z - Z, w = fz * fz * (3 - 2 * fz);
  const q = (zz) => { const X = Math.floor(x), Y = Math.floor(y), fx = x - X, fy = y - Y, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = h3(X, Y, zz), b = h3(X + 1, Y, zz), c = h3(X, Y + 1, zz), d = h3(X + 1, Y + 1, zz); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  return lerp(q(Z), q(Z + 1), w); }

/* ================= state: what the poem asks of the world at time t ================= */
const HB = { w: 0.72, h: 0.52 };             // back window, in house units (front window is 1.0 × 0.72)
function stateAt(t) {
  const s = shotAt(t), S = {
    shot: s, pal: PALS[Math.min(s, 5)], grammar: GRAMMAR[Math.min(s, 5)],
    cam: { z: 1, x: 0, y: 0.05, fx: FX, fy: FY }, par: 0, shade: 0.2, night: 0, lamps: 0, room: 0.1, sil: [],
    inside: false, pushK: 0, hz: 0.36, shore: 0.8, sky: 0.8, sun: { x: 0.9, y: 0.14, up: 1 }, moon: null,
    chop: 0.05, under: 0, dance: 0, foam: 0.3, fibers: 0, tide: 0, brk: -1, brkX: 0, birds: [], crabs: 0, spy: 0,
    bedside: 0, stars: 0, drift: t,
  };
  if (s === 0) {
    const a = 0; S.cam.z = lerp(0.86, 1.02, ease(t, 0, SHOTS[0].t1)); S.cam.y = lerp(-0.05, 0.03, ease(t, 0, SHOTS[0].t1));
    S.par = 0.26 * (1 - ease(t, cue(0, 1), cueEnd(0, 2)));                        // "Parallel windows aligned"
    S.shade = lerp(0.62, 0.12, ease(t, cue(0, 3), cueEnd(0, 4)));               // "With shades drawn / Framing an ocean"
    S.shade = lerp(S.shade, 1.0, ease(t, cue(0, 6), cue(0, 6) + BEAT * 1.2));  // "When pulled shut."
    S.sun = { x: 1.05, y: 0.12, up: 1 }; S.sky = 0.85;
  } else if (s === 1) {
    const T0 = SHOTS[1].t0, T1 = SHOTS[1].t1;
    S.night = 1; S.sky = 0.08; S.sun.up = 0; S.moon = { x: 0.3, y: 0.12 }; S.stars = 1; S.shade = 0.08; S.room = 0.34;
    S.lamps = lerp(0.35, 1, ease(t, cue(1, 3), cueEnd(1, 3)));                 // "Silhouetted by a glow"
    S.cam.z = lerp(1.0, 1.08, ease(t, T0, cue(1, 4))); S.cam.x = 0; S.cam.y = 0.05;
    const k = ease(t, cue(1, 5), T1 - BEAT);                                  // push toward the lamp base ("filled with shells")
    S.cam.z = lerp(S.cam.z, 3.4, k * k); S.cam.x = lerp(0, -0.38, k); S.cam.y = lerp(0.05, 0.26, k);
    const sl = (t0, dur, dir, y) => { const p = (t - t0) / dur; if (p > -0.1 && p < 1.1) S.sil.push({ x: dir > 0 ? lerp(-0.7, 0.7, p) : lerp(0.7, -0.7, p), y }); };
    sl(cue(1, 1), BEAT * 5, 1, 0.06);                                          // "shadows slip across"
    sl(cue(1, 2) + BEAT * 1.5, BEAT * 6, -1, 0.09);
    sl(cue(1, 5) - BEAT, BEAT * 7, 1, 0.07);
  } else if (s === 2) {
    const T0 = SHOTS[2].t0;
    S.sky = 0.95; S.sun = { x: 0.5, y: lerp(0.4, 0.26, ease(t, T0, SHOTS[2].t1)), up: 1 }; S.shade = 0.04; S.room = 0.08;
    S.pushK = ease(t, T0 + BEAT, cueEnd(2, 1));                                // through the window: "At sunrise / I rely on"
    // the curl: a single peeling wave
    const b0 = cue(2, 3) - BEAT, b1 = cueEnd(2, 5);                            // "the curl of a calm ocean … spirals onto shore"
    S.brk = clamp((t - b0) / (b1 - b0), -1, 1.4); S.chop = 0.02;
    // pelicans glide in on "Pelicans predicting"
    const bt = t - cue(2, 2) + BEAT;
    if (bt > 0) for (let i = 0; i < 5; i++) S.birds.push({ x: VIS.x0 - 0.06 - i * 0.075 + bt * (VIS.x1 - VIS.x0 + 0.4) / 14, y: S.hz - 0.035 + i * 0.012 + 0.004 * Math.sin(bt * 0.8 + i), s: 0.032 - i * 0.002, f: 0.2 * Math.sin(bt * 1.1 + i * 1.7) });
    // page 2: look down to the sand, crabs
    const p2 = ease(t, cue(2, 6) - BEAT * 1.5, cue(2, 6) + BEAT * 1.5);
    S.look = p2 * 0.7; S.crabs = clamp((t - cue(2, 7)) / (cue(2, 9) - cue(2, 7)), 0, 1) * (t > cue(2, 6) ? 1 : 0);
    S.crabT = t - cue(2, 7); S.spy = ease(t, cue(2, 10), cue(2, 10) + BEAT * 2);
  } else if (s === 3) {
    const T0 = SHOTS[3].t0;
    S.inside = true; S.sky = 0.75; S.sun = { x: 0.2, y: 0.2, up: 0.6 };
    S.chop = lerp(0.15, 1, ease(t, cue(3, 4), cueEnd(3, 7)));                  // "the chop … demonstrate its power"
    S.under = ease(t, cue(3, 6), cueEnd(3, 7));
    S.dance = ease(t, cue(3, 10), cueEnd(3, 11)) * (1 - 0.4 * ease(t, cue(3, 12), SHOTS[3].t1));   // "To dance / on its edges"
    const ex = ease(t, cue(3, 12), SHOTS[3].t1);                               // "Of its endless expanse"
    S.cam.zm = lerp(1.0, 0.8, ex); S.hz = lerp(0.36, 0.2, ex); S.shore = lerp(0.8, 0.9, ex);
    S.chop = lerp(S.chop, 0.55, ex);
  } else if (s === 4) {
    const T0 = SHOTS[4].t0, c0 = cue(4, 5);
    S.inside = true; S.sky = 0.9; S.sun = { x: 1.0, y: 0.18, up: 1 }; S.chop = 0.08;
    const back = ease(t, c0 - BEAT, c0 + BEAT * 2);                           // "Slipping backward"
    S.look = lerp(0.56, 0, back); S.fibers = lerp(1, 0.25, back);
    S.grip = ease(t, cue(4, 3), cueEnd(4, 4));                                 // "As it loses its grip / Of the earth"
    if (t > c0) {                                                               // cycles of sun and moon, day and night, low and high
      const c = (t - c0) / (BAR * 2);
      const a = c * Math.PI * 2;
      S.sun = { x: 0.69 + 0.5 * Math.cos(a + Math.PI), y: S.hz - 0.28 * Math.sin(a), up: 1 };
      S.moon = { x: 0.69 + 0.5 * Math.cos(a), y: S.hz + 0.28 * Math.sin(a) };
      S.sky = 0.08 + 0.85 * smooth(0.5 + 1.3 * Math.sin(a));
      S.stars = 1 - smooth(S.sky * 2);
      S.tide = 0.06 * Math.sin(a * 0.5) * ease(t, cue(4, 9), cue(4, 9) + BEAT * 2) + 0.02 * Math.sin(a);
    }
  } else {                                                                      // 5 tonight … sunrise … bedside (and the end card holds it)
    const T0 = SHOTS[5].t0, sr = cue(5, 4);
    const dawn = ease(t, sr - BEAT, cue(5, 5) + BEAT);                          // "When the sun rises"
    S.night = 1 - dawn; S.sky = lerp(0.06, 0.95, dawn); S.stars = 1 - dawn; S.moon = dawn < 0.5 ? { x: 1.1, y: 0.1 } : null;
    S.sun = { x: 0.35, y: lerp(0.45, 0.25, dawn), up: dawn };
    S.lamps = 0.28 * (1 - dawn); S.room = lerp(0.2, 0.08, dawn);
    S.shade = lerp(1.0, 0.08, ease(t, cue(5, 5), cueEnd(5, 5) + BEAT));        // "If the birds are out"
    S.pal = PALS[5].map((c, i) => c.map((v, k) => lerp(v, PALS[2][i][k], dawn)));
    const bt = t - cue(5, 5) - BEAT;
    if (bt > 0) for (let i = 0; i < 5; i++) S.birds.push({ x: -0.2 - i * 0.07 + bt * 0.09, y: S.hz - 0.06 + i * 0.012, s: 0.03 - i * 0.002, f: 0.2 * Math.sin(bt + i * 1.3) });
    S.bedside = ease(t, cue(5, 8) - BEAT, cue(5, 9) + BEAT * 1.5);               // "Lucky enough to spy / from my bedside."
    S.cam.z = lerp(1.05, 0.62, S.bedside); S.cam.y = 0.04;
    if (s === 6) S.endDim = 1;
  }
  return S;
}

/* ================= ocean: one function, in back-window units (X across, Y 0 top → 1 sill) ================= */
function ocean(X, Y, t, S) {
  const hz = S.hz, sky = S.sky;
  if (Y < hz) {                                                                 // sky
    const d = hz - Y;
    let v = sky * (0.3 + 0.5 * Math.exp(-d * 5)) + 0.04;
    const cl = vn2(X * 2.2 + t * 0.012, Y * 16);                                // banded cloud
    v += (cl - 0.5) * 0.22 * (0.4 + sky);
    if (S.sun.up > 0.01) { const dx = X - S.sun.x, dy = (Y - S.sun.y), d2 = dx * dx + dy * dy;
      if (d2 < 0.0025) v = lerp(v, 1.1, S.sun.up); else v += 0.28 * S.sun.up * Math.exp(-d2 * 60); }
    if (S.moon) { const dx = X - S.moon.x, dy = Y - S.moon.y, d2 = dx * dx + dy * dy;
      if (d2 < 0.0011) { const ex = X - S.moon.x - 0.012, e2 = ex * ex + dy * dy; v = e2 < 0.0009 ? v : 0.95; } }
    if (S.stars > 0.01 && h2(Math.floor(X * 400), Math.floor(Y * 400)) > 0.994 - 0.004 * Math.sin(t * 2 + X * 50)) v = lerp(v, 0.8, S.stars);
    for (const B of S.birds) v = bird(X, Y, B, v);
    return v;
  }
  const shoreY = S.shore + S.tide + 0.01 * Math.sin(X * 7 + t * 0.35) + S.dance * 0.018 * Math.sin(X * 26 - t * 5.2) * (0.6 + 0.4 * Math.sin(X * 3 + t))
    + 0.022 * Math.max(0, Math.sin(t * Math.PI * 2 / (BAR * 2)));             // swash, one run-up every two bars
  if (Y < shoreY) {                                                             // sea
    const dz = Y - hz, zd = 0.06 / (dz + 0.006), Xp = (X - 0.69) / (dz + 0.03) * 0.09;
    const chop = S.chop;
    let ph = zd * 5 + t * 1.15 + 0.9 * vn2(Xp * 0.7, zd * 0.4) * (1 + chop * 2);
    let r = Math.pow(0.5 + 0.5 * Math.cos(ph), 9 - chop * 4);
    if (chop > 0.1) { const c2 = Math.pow(0.5 + 0.5 * Math.cos(Xp * 2.6 - zd * 3.4 + t * 2.1 + vn2(Xp, t * 0.5) * 3), 6); r = Math.max(r, c2 * chop); }
    let v = 0.2 + sky * 0.28 * Math.exp(-dz * 9) + r * (0.34 + 0.2 * chop) * (1 - smooth((dz - 0.3) * 3) * 0.3);
    if (S.under > 0) { const w1 = vn2(X * 5 + t * 0.2, Y * 9), w2 = vn2(X * 5 + w1 * 3 - t * 0.3, Y * 9 + w1 * 3); const sw = Math.abs(fract(w2 * 4 + t * 0.15) - 0.5);
      v -= S.under * 0.22 * smooth((0.18 - sw) * 8) * smooth(dz * 6); }
    // sun / moon glitter column
    const gx = S.sun.up > 0.2 && S.sky > 0.3 ? S.sun.x : S.moon ? S.moon.x : null;
    if (gx !== null && Math.abs(X - gx) < 0.012 + dz * 0.1 && h3(Math.floor(X * 300), Math.floor(Y * 400), Math.floor(t * 6)) > 0.8) v = lerp(v, 0.95, 0.8 * (1 - smooth((dz - 0.2) * 4) * 0.5));
    // the curl
    if (S.brk > -0.2) v = curl(X, Y, t, S, v, hz, shoreY);
    // foam line at the water's edge, and the fibers it leaves
    const e = shoreY - Y;
    if (e < 0.012) v = lerp(v, 0.95, 0.9 * (h2(Math.floor(X * 380), Math.floor(Y * 380 + t * 3)) > 0.25 ? 1 : 0.4));
    else if (e < 0.09) {
      const fib = Math.abs(vn2(X * 3.2 + t * 0.03, Y * 150 - t * 0.9 * (S.grip ? 1 + S.grip * 2 : 1)) - 0.5);
      const fray = vn2(X * 11, Y * 40 + t * 0.4);
      const amt = (S.foam * 0.5 + S.fibers) * (1 - e / 0.09) * smooth((fray - 0.25 - 0.3 * (S.grip || 0)) * 3);

  const sF = ctx.createBiquadFilter(); sF.type = 'lowpass'; sF.Q.value = 0.4; const sHP = ctx.createBiquadFilter(); sHP.type = 'highpass'; sHP.frequency.value = 55;
