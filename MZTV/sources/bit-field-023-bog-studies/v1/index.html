const Q = new URLSearchParams(location.search), num = (k, d) => Q.has(k) ? +Q.get(k) : d;

const SEED = num('seed', 20260930);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x, lerp = (a, b, k) => a + (b - a) * k, smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

/* ================= one noise, shared by the GPU and the CPU =================
   An integer hash, periodic every 1024 lattice cells, written identically in JS and GLSL. The wind field, the vegetation map
   and the clouds are built from it, so the sound (CPU) hears exactly the gusts the screen (GPU) draws. */
function hu(ix, iy) { const x = ix & 1023, y = iy & 1023; let h = (Math.imul(x, 0x8da6b343) ^ Math.imul(y, 0xd8163841)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x7feb352d) >>> 0; h = Math.imul(h ^ (h >>> 15), 0x846ca68b) >>> 0; h = (h ^ (h >>> 16)) >>> 0; return h / 4294967295; }
function vn(x, y) { const fx = Math.floor(x), fy = Math.floor(y), u = x - fx, v = y - fy, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
  return lerp(lerp(hu(fx, fy), hu(fx + 1, fy), su), lerp(hu(fx, fy + 1), hu(fx + 1, fy + 1), su), sv); }
function fbm(x, y, oct) { let a = 0, s = 0.5; for (let i = 0; i < oct; i++) { a += s * vn(x, y); x = x * 2 + 1.7; y = y * 2 + 9.2; s *= 0.5; } return a; }
const PT0 = 0.77, PT1 = 0.79;   // pool threshold: about 4% of the near bog is open water
const GL_NOISE = `
uniform vec2 uOff1, uOff2, uCloudOff; uniform float uCover, uT; uniform vec3 uSunDir, uCam;
float hu(vec2 m){ uint x = uint(m.x) & 1023u; uint y = uint(m.y) & 1023u; uint h = (x * 0x8da6b343u) ^ (y * 0xd8163841u);
  h = (h ^ (h >> 16u)) * 0x7feb352du; h = (h ^ (h >> 15u)) * 0x846ca68bu; h ^= h >> 16u; return float(h) / 4294967295.0; }
float vn(vec2 p){ vec2 fl = floor(p); vec2 f = p - fl; vec2 m = fl - 1024.0 * floor(fl / 1024.0); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hu(m), hu(m + vec2(1.0, 0.0)), u.x), mix(hu(m + vec2(0.0, 1.0)), hu(m + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p, int oct){ float a = 0.0, s = 0.5; for (int i = 0; i < 6; i++){ if (i >= oct) break; a += s * vn(p); p = p * 2.0 + vec2(1.7, 9.2); s *= 0.5; } return a; }
float gustAt(vec2 p){ vec2 a = p / 64.0 - uOff1; float n1 = vn(a) * 0.62 + vn(a * 2.0 + vec2(17.3, -4.1)) * 0.38;
  vec2 b = p / 13.0 - uOff2; float n2 = vn(b) * 0.6 + vn(b * 2.0 + vec2(5.1, 9.7)) * 0.4;
  return clamp((n1 * 0.68 + n2 * 0.32 - 0.5) * 1.9 + 0.5, 0.0, 1.0); }
float swirlAt(vec2 p){ return (vn(p / 64.0 - uOff1 + vec2(33.0, 7.0)) - 0.5) * 1.1; }
float cloudAt(vec3 d, int oct){ if (d.y < 0.004) return 1.0; vec2 p = d.xz / (d.y + 0.06) * 1.3 - uCloudOff; return smoothstep(1.0 - uCover, 1.0 - uCover + 0.3, fbm(p, oct)); }
float shadowAt(vec3 wp, int oct){ if (uSunDir.y < 0.03) return uCover; vec3 hit = wp + uSunDir * ((1500.0 - wp.y) / uSunDir.y); return cloudAt(normalize(hit - uCam), oct); }
vec4 vegAt(vec2 p){ float r0 = length(p);
  float pf = vn(p / 28.0 + vec2(31.7, -12.3)) * 0.65 + vn(p / 9.0 + vec2(4.1, 8.8)) * 0.35;
  float pool = smoothstep(${PT0}, ${PT1}, pf) * (1.0 - smoothstep(350.0, 420.0, r0)) * smoothstep(6.0, 9.0, r0);
  float hf = vn(p / 11.0 + vec2(-3.3, 5.9)) * 0.6 + vn(p / 3.7 + vec2(1.3, -2.2)) * 0.4 + 0.12 * smoothstep(60.0, 160.0, p.y);
  float heath = smoothstep(0.60, 0.70, hf) * (1.0 - pool);
  float moss = smoothstep(${PT0 - 0.06}, ${PT0}, pf) * (1.0 - pool);
  float dens = 0.55 + 0.45 * vn(p / 5.3 + vec2(9.9, 2.7));

`;
function veg(x, z) { const r0 = Math.hypot(x, z);
  const pf = vn(x / 28 + 31.7, z / 28 - 12.3) * 0.65 + vn(x / 9 + 4.1, z / 9 + 8.8) * 0.35;
  const pool = sstep(PT0, PT1, pf) * (1 - sstep(350, 420, r0)) * sstep(6, 9, r0);
  const hf = vn(x / 11 - 3.3, z / 11 + 5.9) * 0.6 + vn(x / 3.7 + 1.3, z / 3.7 - 2.2) * 0.4 + 0.12 * sstep(60, 160, z);
  return { pool, heath: sstep(0.60, 0.70, hf) * (1 - pool), moss: sstep(PT0 - 0.06, PT0, pf) * (1 - pool), dens: 0.55 + 0.45 * vn(x / 5.3 + 9.9, z / 5.3 + 2.7) }; }
// the ground: rolling bog, a low rise to the north (the photo's horizon), and the land falling away south toward Galway Bay
const SEA_Y = -41;
function groundH(x, z) {
  let h = 2.4 * (fbm(x / 90 + 3.1, z / 90 - 7.7, 3) - 0.5) + 0.8 * (vn(x / 24 + 11.3, z / 24 - 5.2) - 0.5);
  h += 3.8 * sstep(55, 195, z) * (0.75 + 0.5 * vn(x / 60 + 2.2, 4.4));
  if (z < -60) h -= 46 * Math.pow((-z - 60) / 3000, 0.85);
  const v = veg(x, z); h += 0.22 * (vn(x / 1.4 + 0.7, z / 1.4 - 3.9) - 0.5) * (1 - v.pool) - 0.12 * v.pool;
  return h;
}

/* ================= place: the bog above Inverin, Connemara ================= */
const SITE = { name: 'INVERIN BOG', lat: 53.247, lon: -9.468, tz: 'Europe/Dublin' };
const rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI;
const TZF = new Intl.DateTimeFormat('en-US', { timeZone: SITE.tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
function tzOffsetMin(ms) { const p = TZF.formatToParts(new Date(ms)), g = k => +p.find(x => x.type === k).value; return Math.round((Date.UTC(g('year'), g('month') - 1, g('day'), g('hour') % 24, g('minute')) - Math.floor(ms / 60000) * 60000) / 60000); }
const NOW0 = Date.now(); let OFF = tzOffsetMin(NOW0);
const EPOCH0 = (() => { if (Q.has('utc')) return Date.parse(Q.get('utc'));
  if (Q.has('hour') || CAPTURE) { const h = num('hour', 16), loc = new Date(NOW0 + OFF * 60000), mid = Date.UTC(loc.getUTCFullYear(), loc.getUTCMonth(), loc.getUTCDate()); return mid + h * 3600000 - OFF * 60000; }
  return NOW0; })();
let T = 0;
const epochAt = t => EPOCH0 + t * RATE * 1000;
const hourAt = t => (((epochAt(t) + OFF * 60000) / 3600000) % 24 + 24) % 24;
function horizontal(ra, dec, d) { const lst = rad((280.46061837 + 360.98564736629 * d) % 360) + rad(SITE.lon), H = lst - ra, lat = rad(SITE.lat);
  const alt = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat)) + Math.PI;
  return { alt, az }; }
const jd2000 = ms => ms / 86400000 + 2440587.5 - 2451545.0;
function sunHor(ms) { const d = jd2000(ms), g = rad(357.529 + 0.98560028 * d), q = 280.459 + 0.98564736 * d, L = rad(q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)), e = rad(23.439 - 0.00000036 * d);
  return horizontal(Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), Math.asin(Math.sin(e) * Math.sin(L)), d); }

// scene frame (as in WATER STUDIES): +z north, -z south (the bay), -x east
const horDir = h => V3(-Math.sin(h.az) * Math.cos(h.alt), Math.sin(h.alt), Math.cos(h.az) * Math.cos(h.alt)).normalize();
function sunState(t) { const h = sunHor(epochAt(t)); return { el: deg(h.alt), az: deg(h.az), dir: horDir(h) }; }
function moonState(t) { const h = moonHor(epochAt(t)); return { el: deg(h.alt), az: deg(h.az), dir: horDir(h) }; }
function localDate(t) { return new Date(epochAt(t) + OFF * 60000); }
function dayOfYear(t) { const d = localDate(t); return (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400000 + 1 + d.getUTCHours() / 24; }

/* ================= the weather at Inverin: Open-Meteo, refreshed every 15 min ================= */
const DATA = { src: 'defaults', wind: 7, windDir: 240, gust: 12, cloud: 70, precip: 0, vis: 30000, temp: 12, rh: 85, dew: 9.6, wxAt: null, fetched: 0 };
if (Q.has('data')) { try { Object.assign(DATA, JSON.parse(Q.get('data')), { src: 'url' }); } catch (e) { } }
else if (!CAPTURE) { try { const c = JSON.parse(localStorage.getItem('mztv-023-inverin') || 'null'); if (c && Date.now() - c.fetched < 3 * 3600e3) Object.assign(DATA, c, { src: c.src.replace(' (cached)', '') + ' (cached)' }); } catch (e) { } }
async function getJSON(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function refreshData() {
  try { const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${SITE.lat}&longitude=${SITE.lon}&current=temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation,visibility&wind_speed_unit=ms&timezone=GMT`);
    const c = j.current || {}, pick = (v, d) => (v == null || !isFinite(v) ? d : v);
    Object.assign(DATA, { wind: pick(c.wind_speed_10m, DATA.wind), windDir: pick(c.wind_direction_10m, DATA.windDir), gust: pick(c.wind_gusts_10m, DATA.gust), cloud: pick(c.cloud_cover, DATA.cloud),
      precip: pick(c.precipitation, DATA.precip), vis: pick(c.visibility, DATA.vis), temp: pick(c.temperature_2m, DATA.temp), rh: pick(c.relative_humidity_2m, DATA.rh), dew: pick(c.dew_point_2m, DATA.dew),
      wxAt: c.time, src: 'open-meteo', fetched: Date.now() });
    try { localStorage.setItem('mztv-023-inverin', JSON.stringify(DATA)); } catch (e) { }
  } catch (e) { if (!DATA.src.includes('last reading')) DATA.src = DATA.fetched ? DATA.src.replace(' (cached)', '') + ' · last reading' : 'defaults (no connection)'; }

}
// smoothed copy the scene reads: a new reading eases in over about a minute
const SM = {}; const SMK = ['wind', 'gust', 'cloud', 'precip', 'vis', 'temp', 'rh', 'dew'];
const OVR = { wind: 'wind', gust: 'gust', rain: 'precip' };
function target(k) { for (const [q, key] of Object.entries(OVR)) if (key === k && Q.has(q)) return num(q, DATA[k]); if (k === 'gust' && Q.has('wind') && !Q.has('gust')) return num('wind', 7) * 1.6; return DATA[k]; }
const dirV = d => [Math.sin(rad(d)), Math.cos(rad(d))];
function smoothData(dt) { const k = CAPTURE || !SM.init ? 1 : Math.min(1, dt / 60); SM.init = true;
  for (const key of SMK) { const v = target(key); SM[key] = SM[key] == null ? v : SM[key] + (v - SM[key]) * k; }
  const v = dirV(Q.has('dir') ? num('dir', 240) : DATA.windDir), o = SM._dir || v; SM._dir = [o[0] + (v[0] - o[0]) * k, o[1] + (v[1] - o[1]) * k]; SM.windDir = (deg(Math.atan2(SM._dir[0], SM._dir[1])) + 360) % 360; }
const compass = d => ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'][Math.round(((d % 360) + 360) % 360 / 22.5) % 16];

/* ================= the wind field =================
   Gusts are frozen turbulence carried across the bog at the wind's speed (two scales, ~64 m patches and ~13 m puffs, travelling
   at slightly different speeds so the pattern keeps changing shape). Offsets are integrated, so a change of wind never makes it jump. */
const WIND = { t: null, off1: [0.31, 0.77], off2: [0.53, 0.12], cloud: [0.37, 0.81], W: 0, G: 0.5, dir: [0, 1], lay: [0.18, 0.13] };
const bendOf = s => s * s / (s * s + 38);
// memory: the lay of the grass. Molinia stays combed the way the last hours of wind pushed it.
const LAY_KEY = 'mztv-023-lay-v1';
if (!CAPTURE && Q.get('fresh') !== '1') { try { const l = JSON.parse(localStorage.getItem(LAY_KEY) || 'null'); if (l && isFinite(l.x) && isFinite(l.z)) WIND.lay = [l.x, l.z]; } catch (e) { } }
function saveLay() { if (CAPTURE) return; try { localStorage.setItem(LAY_KEY, JSON.stringify({ x: WIND.lay[0], z: WIND.lay[1], at: Date.now() })); } catch (e) { } }
const wrap = x => ((x % 1024) + 1024) % 1024;
function coverNow() { if (Q.has('cover')) return num('cover', 0.4); const wet = clamp(SM.precip / 2, 0, 1); return clamp(0.05 + 0.95 * Math.pow(SM.cloud / 100, 1.2) + wet * 0.1, 0, 1.02); }
function advance(t) {
  if (WIND.t == null) { WIND.t = t; smoothData(0); }
  const dt = t - WIND.t; if (dt < 0) { WIND.t = t; return; } if (dt === 0 && WIND.W) return;
  smoothData(dt); WIND.t = t;
  const d = rad(SM.windDir); WIND.dir = [Math.sin(d), -Math.cos(d)];                  // toward downwind (x, z)
  WIND.G = clamp((SM.gust - SM.wind) / Math.max(SM.wind, 1.5), 0.15, 1.5);
  WIND.W = Math.max(0, SM.wind * (1 + 0.14 * WIND.G * (vn1(t / 41) - 0.5) * 2));         // the wind breathes: slow lulls and surges
  const [dx, dz] = WIND.dir, W = WIND.W, st = Math.min(dt, 30);
  WIND.off1 = [wrap(WIND.off1[0] + dx * W * st / 64), wrap(WIND.off1[1] + dz * W * st / 64)];
  WIND.off2 = [wrap(WIND.off2[0] + dx * W * 1.12 * st / 13), wrap(WIND.off2[1] + dz * W * 1.12 * st / 13)];

function gustAt(x, z) { const o1 = WIND.off1, o2 = WIND.off2;
  const ax = x / 64 - o1[0], az = z / 64 - o1[1], n1 = vn(ax, az) * 0.62 + vn(ax * 2 + 17.3, az * 2 - 4.1) * 0.38;
  const bx = x / 13 - o2[0], bz = z / 13 - o2[1], n2 = vn(bx, bz) * 0.6 + vn(bx * 2 + 5.1, bz * 2 + 9.7) * 0.4;

function cloudAtDir(d) { if (d.y < 0.004) return 1; const c = fbm(d.x / (d.y + 0.06) * 1.3 - WIND.cloud[0], d.z / (d.y + 0.06) * 1.3 - WIND.cloud[1], 6), cov = coverNow(); return sstep(1 - cov, 1 - cov + 0.3, c); }

/* ================= the year: what colour the bog is today ================= */
const SEASON = [   // day of year · molinia base, molinia tip, heather, heather tip, sedge, sphagnum (sRGB)
  [15, 0x6b5a3e, 0xc9b48a, 0x3d2a24, 0x4a3128, 0x7a6a48, 0x8a6a3a],
  [105, 0x56603a, 0xb5a476, 0x35291f, 0x4a3a2a, 0x6f7a45, 0x8f7a3a],
  [160, 0x3f6a2e, 0x7fa04e, 0x34331f, 0x4c4a2a, 0x5f8a3e, 0x9a9a3a],
  [215, 0x3f672c, 0x8a9058, 0x4e2e40, 0x8a5076, 0x62843e, 0xa39a3c],
  [262, 0x436a2e, 0x97985a, 0x3e2c2c, 0x5c3c42, 0x66803f, 0xa08c3c],
  [290, 0x5e6034, 0xb89a5e, 0x3f2a26, 0x563a30, 0x767444, 0xa07a36],
  [330, 0x6e5a3c, 0xcaa878, 0x3b2923, 0x4c3228, 0x776a48, 0x8e6c3a]];
const SEASON_WORDS = [[15, 'winter · bleached straw'], [105, 'spring · new green through the straw'], [160, 'early summer · green'], [215, 'late summer · heather in flower'],
  [262, 'September · the heather fading, molinia turning'], [290, 'autumn · molinia gone russet'], [330, 'late autumn · straw']];
function seasonAt(doy) { let a = SEASON[SEASON.length - 1], b = SEASON[0], da = a[0] - 365, db = b[0];
