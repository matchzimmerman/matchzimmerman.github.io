<body>

<div id="info"></div>
<script>
'use strict';
/* =====================================================================
   SOUNDING — MZTV
   A low camera drifts across a ground that remembers where it has been.
   The ground is a live field simulation on a torus (no edge, no centre).
   Its governing operators mutate over hours under accumulated pressure;
   the camera's path, impacts and eras are written into the field and
   change what becomes possible next.

   URL params:
     ?info=0      hide the disclosure box      (key: i)
     ?audio=0     no sound
     ?fresh=1     ignore saved state, start a new ground
     ?seed=N      fixed seed for a fresh start
     ?rate=N      evolution clock multiplier (testing: 60 = an hour per minute)
     ?lines=270   internal vertical resolution (pixel size)
     ?ff=H        simulate H hours before first frame (slow: ~3 min per hour; testing only)
   Keys: i info · t force transition · (any key/click resumes audio in a normal browser)
   ===================================================================== */
(() => {
const Q = new URLSearchParams(location.search);
const RATE = Math.max(0.01, parseFloat(Q.get('rate') || '1'));
let SHOW_INFO = Q.get('info') !== '0';
const FRESH = Q.get('fresh') === '1';
const MUTE = Q.get('audio') === '0';
const LINES = Math.max(120, parseInt(Q.get('lines') || '270', 10));
const KEY = 'mztv-sounding-v1';

/* ---------------- utilities ---------------- */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const angLerp = (a, b, t) => a + wrapA(b - a) * t;
const R = { s: 1, next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } };
const rnd = () => R.next();
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); };
let NSEED = 1;
function hash1(i) { let x = Math.imul(i | 0, 374761393) ^ Math.imul(NSEED | 0, 668265263); x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function vnoise(t, ch) { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash1(i * 7 + ch * 1013), hash1((i + 1) * 7 + ch * 1013), u) * 2 - 1; }
function fbm(t, ch) { return vnoise(t, ch) * 0.6 + vnoise(t * 2.13 + 5.1, ch + 1) * 0.28 + vnoise(t * 4.7 + 1.7, ch + 2) * 0.12; }

/* ---------------- field ---------------- */
const N = 256, M = N - 1, NN = N * N;
let h = new Float32Array(NN), hn = new Float32Array(NN);
const w = new Float32Array(NN), wv = new Float32Array(NN);
const m = new Float32Array(NN), e = new Float32Array(NN);
const ta = new Float32Array(NN), tb = new Float32Array(NN), tc = new Float32Array(NN);

function samp(a, x, z) {
  x -= 0.5; z -= 0.5;
  const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0;
  const i0 = x0 & M, i1 = (x0 + 1) & M, j0 = (z0 & M) * N, j1 = ((z0 + 1) & M) * N;
  return (a[j0 + i0] * (1 - fx) + a[j0 + i1] * fx) * (1 - fz) + (a[j1 + i0] * (1 - fx) + a[j1 + i1] * fx) * fz;
}
function blur(src, dst, r) {
  const inv = 1 / (2 * r + 1);
  for (let y = 0; y < N; y++) {
    const row = y * N; let s = 0;
    for (let k = -r; k <= r; k++) s += src[row + (k & M)];
    for (let x = 0; x < N; x++) { tc[row + x] = s * inv; s += src[row + ((x + r + 1) & M)] - src[row + ((x - r) & M)]; }
  }
  for (let x = 0; x < N; x++) {
    let s = 0;
    for (let k = -r; k <= r; k++) s += tc[(k & M) * N + x];
    for (let y = 0; y < N; y++) { dst[y * N + x] = s * inv; s += tc[((y + r + 1) & M) * N + x] - tc[((y - r) & M) * N + x]; }
  }
}
function stamp(a, cx, cz, r, amt, sat) {
  const ext = Math.ceil(r * 3), inv = 1 / (2 * r * r);
  const ix = Math.floor(cx), iz = Math.floor(cz);
  for (let dz = -ext; dz <= ext; dz++) for (let dx = -ext; dx <= ext; dx++) {
    const px = ix + dx + 0.5 - cx, pz = iz + dz + 0.5 - cz;
    const g = Math.exp(-(px * px + pz * pz) * inv) * amt;
    const i = ((iz + dz) & M) * N + ((ix + dx) & M);
    if (sat) a[i] = Math.min(1, a[i] + g * (1 - a[i])); else a[i] += g;
  }
}
function ring(a, cx, cz, rad, wid, amt) {
  const ext = Math.ceil(rad + wid * 3), inv = 1 / (2 * wid * wid);
  const ix = Math.floor(cx), iz = Math.floor(cz);
  for (let dz = -ext; dz <= ext; dz++) for (let dx = -ext; dx <= ext; dx++) {
    const px = ix + dx + 0.5 - cx, pz = iz + dz + 0.5 - cz;
    const d = Math.sqrt(px * px + pz * pz) - rad;
    const i = ((iz + dz) & M) * N + ((ix + dx) & M);
    a[i] = Math.min(1, a[i] + amt * Math.exp(-d * d * inv));
  }
}

/* ---------------- genome ---------------- */
const OPS = ['ridges', 'erosion', 'drift', 'waves', 'terraces', 'uplift', 'faults', 'flood', 'canopy'];
const GR = {
  ridges: [0, 1], erosion: [0, 1], drift: [0, 1], waves: [0, 1], terraces: [0, 1], uplift: [-1, 1], faults: [0, 1], flood: [0, 1], canopy: [0, 1],
  r2: [3, 9], tk: [2, 12], waveC: [3.5, 8], waveDamp: [0.2, 0.95], tStep: [0.2, 0.55], flowSpd: [0.2, 1.4], swirl: [0, 1],
  seek: [-1, 1], speed: [1.8, 4.6], clear: [2, 6], pitch: [-0.42, -0.1], survey: [0, 1], hS: [5.5, 13], fov: [0.5, 0.72],
  cDen: [0.3, 1.5], contour: [0.2, 1], fog: [0.007, 0.018], light: [-Math.PI, Math.PI], echo: [0.05, 0.7], reg: [0, 1.4], evRate: [0.5, 1.6],
  bpm: [66, 84], swing: [0, 0.26], kickDen: [0.3, 1], chordDen: [0, 0.75], percDen: [0, 0.6], bassDen: [0.25, 0.75], drone: [0.2, 1]
};
const GD = { dither: 3, inkMap: 6, root: 6, mode: 3, drop: 2 };
const INKMAPS = [[3, 2, 3], [1, 3, 2], [2, 3, 1], [3, 1, 2], [2, 1, 3], [1, 2, 3]]; // contour, scar, crest
const ROOTS = [0, -2, 3, -4, -5, 2];
const MODES = [[0, 1, 3, 5, 7, 8, 10], [0, 2, 3, 5, 7, 8, 10], [0, 2, 3, 5, 7, 9, 10]];
const MODE_NAMES = ['phrygian', 'aeolian', 'dorian'];
const DITHER_NAMES = ['ordered', 'halftone', 'grain'];
const DESC = {
  ridges: 'ridges self-organise out of local contrast',
  erosion: 'the ground softens; worn paths resist',
  drift: 'the ground migrates and piles against old paths',
  waves: 'impacts ring outward; waves slow in worn ground',
  terraces: 'the ground settles into strata',
  upliftUp: 'worn paths rise into walls',
  upliftDown: 'worn paths sink into canyons',
  faults: 'strata crack along worn paths',
  flood: 'water fills the low ground',
  canopy: 'a second ground closes overhead'
};

function initialGenome() {
  return {
    ridges: 0.85, erosion: 0.12, drift: 0.4, waves: 0, terraces: 0, uplift: 0, faults: 0, flood: 0, canopy: 0,
    r2: 6, tk: 6, waveC: 5.5, waveDamp: 0.6, tStep: 0.33, flowSpd: 0.55, swirl: 0.5,
    seek: -0.7, speed: 3.0, clear: 3.0, pitch: -0.2, survey: 0.4, hS: 8, fov: 0.6,
    cDen: 0.7, contour: 0.85, fog: 0.011, light: 0.8, echo: 0.25, reg: 0.35, evRate: 1,
    bpm: 74, swing: 0.12, kickDen: 0.6, chordDen: 0.3, percDen: 0.25, bassDen: 0.55, drone: 0.5,
    dither: 0, inkMap: 0, root: 0, mode: 0, drop: 0,
    pal: [[0.16, 0.07, 4.9], [0.52, 0.11, 3.4], [0.77, 0.16, 1.25], [0.9, 0.19, 2.4]],
    dom: 'ridges'
  };
}
const cloneG = g => JSON.parse(JSON.stringify(g));
function mixG(a, b, s) {
  const o = {};
  for (const k in GR) o[k] = lerp(a[k], b[k], s);
  o.light = angLerp(a.light, b.light, s);
  for (const k in GD) o[k] = s < 0.5 ? a[k] : b[k];
  o.pal = a.pal.map((c, i) => [lerp(c[0], b.pal[i][0], s), lerp(c[1], b.pal[i][1], s), angLerp(c[2], b.pal[i][2], s)]);
  o.dom = s < 0.5 ? a.dom : b.dom;
  return o;
}

/* ---------------- state ---------------- */
let S;
function freshState(seed) {
  R.s = seed | 0; NSEED = seed | 0;
  S = {
    v: 1, seed, t: 1000 + (seed % 100000), clock: 0, real: 0, era: 1, transitions: 0, P: 0.35,
    phase: 'era', tr0: 0, trDur: 160, trS: 0, instab: 0,
    base: initialGenome(), from: null, to: null, G: null,
    caps: { ridges: 1, erosion: 1, drift: 1, waves: 0, terraces: 0, uplift: 0, faults: 0, flood: 0, canopy: 0 },
    lastDom: { ridges: 1 }, opHue: {}, history: [{ era: 1, dom: 'ridges', at: 0 }], events: 0, newCap: null,
    cam: { x: rnd() * N, z: rnd() * N, y: 8, vy: 0, yaw: rnd() * TAU, yawV: 0, pitch: -0.2, roll: 0, spd: 3 },
    dive: 0, stats: { hMean: 0, hStd: 0.6, mMean: 0, eMean: 0 },
    flowAng: rnd() * TAU, flowPh: rnd() * 10, imps: [], evT: 6, dripT: 2, near: 0.5, open: 0.3, traj: null,
    sunPh: 2.6 + rnd() * 0.6, wind: [0, 0], cloud: 0, rain: 0, haze: 0.3, sunEl: 0.3, sunAz: 0
  };
  S.traj = newTraj();
  S.G = S.base;
  for (let i = 0; i < NN; i++) { h[i] = (rnd() - 0.5) * 0.6; w[i] = wv[i] = m[i] = e[i] = 0; }
}

/* ---------------- evolution ---------------- */
function checkUnlock() {
  const c = S.caps, st = S.stats, n = S.transitions;
  if (!c.waves) return 'waves';
  if (!c.terraces && n >= 1 && st.mMean > 0.04) return 'terraces';
  if (!c.uplift && n >= 2 && st.mMean > 0.07) return 'uplift';
  if (!c.flood && n >= 3) return 'flood';
  if (!c.faults && c.terraces && c.uplift && st.eMean > 0.004) return 'faults';
  if (!c.canopy && n >= 5 && st.mMean > 0.1) return 'canopy';
  return null;
}
function mutatePal(p, dom) {
  const q = p.map(c => c.slice());
  q[0][2] = wrapA(p[0][2] + gauss() * 0.4);
  q[0][0] = clamp(p[0][0] + gauss() * 0.02, 0.12, 0.2);
  q[0][1] = clamp(p[0][1] + gauss() * 0.015, 0.035, 0.09);
  const bands = [[0.44, 0.6], [0.64, 0.8], [0.84, 0.94]];
  for (let k = 1; k <= 3; k++) {
    q[k][2] = wrapA(p[k][2] + gauss() * 0.45);
    q[k][0] = clamp(p[k][0] + gauss() * 0.04, bands[k - 1][0], bands[k - 1][1]);
    q[k][1] = clamp(p[k][1] + gauss() * 0.03, 0.09, 0.21);
  }
  // colour acquires behavioural association: an operator brings back its hue
  const home = initialGenome().pal;
  for (let k = 0; k < 4; k++) q[k][2] = angLerp(q[k][2], home[k][2], 0.3);
  if (S.opHue[dom] === undefined) S.opHue[dom] = q[3][2];
  else q[3][2] = angLerp(q[3][2], S.opHue[dom], 0.75);
  for (let k = 1; k <= 3; k++) for (let j = k + 1; j <= 3; j++) {
    if (Math.abs(wrapA(q[k][2] - q[j][2])) < 0.5) q[j][2] = wrapA(q[j][2] + 0.9);
  }
  return q;
}
function mutate(g) {
  const n = cloneG(g), st = S.stats;
  let nc = checkUnlock();
  if (S.forceDom) { nc = S.caps[S.forceDom] ? null : S.forceDom; }
  if (nc) { S.caps[nc] = 1; S.newCap = nc; } else S.newCap = null;
  let dom = S.forceDom || nc; S.forceDom = null;
  if (!dom) {
    const opts = OPS.filter(o => S.caps[o] && o !== g.dom);
    const wts = opts.map(o => 1 + (S.era - (S.lastDom[o] || 0)) * 1.5);
    let tot = wts.reduce((a, b) => a + b, 0), r = rnd() * tot;
    dom = opts[opts.length - 1];
    for (let i = 0; i < opts.length; i++) { r -= wts[i]; if (r <= 0) { dom = opts[i]; break; } }
  }
  S.lastDom[dom] = S.era + 1;
  let usign = Math.sign(g.uplift) || (rnd() < 0.5 ? 1 : -1);
  if (dom === 'uplift') usign = (st.eMean > 0.02 && rnd() < 0.6) ? -1 : (rnd() < 0.55 ? 1 : -1);
  for (const o of OPS) {
    if (!S.caps[o]) { n[o] = 0; continue; }
    const mag = Math.abs(g[o]);
    let v = mag * 0.5 + rnd() * 0.22;
    if (o === 'flood' || o === 'canopy') v = mag * 0.35 + (rnd() < 0.2 ? rnd() * 0.35 : 0);
    if (o === dom) v = 0.75 + rnd() * 0.25;
    n[o] = o === 'uplift' ? v * usign : v;
  }
  if (st.hStd < 0.3) n.ridges = Math.max(n.ridges, 0.6);
  if (Math.max(n.ridges, Math.abs(n.uplift), n.terraces) < 0.35) n.ridges = Math.max(n.ridges, 0.5);
  if (st.hStd > 1.1) n.erosion = Math.max(n.erosion, 0.5);
  const mut = (k, s) => { const [a, b] = GR[k]; n[k] = clamp(g[k] + gauss() * s * (b - a), a, b); };
  for (const k of ['r2', 'tk', 'waveC', 'waveDamp', 'tStep', 'flowSpd', 'swirl', 'speed', 'clear', 'pitch', 'survey', 'hS', 'fov',
    'cDen', 'contour', 'fog', 'echo', 'reg', 'evRate', 'bpm', 'swing', 'kickDen', 'chordDen', 'percDen', 'bassDen', 'drone']) mut(k, 0.17);
  n.light = wrapA(g.light + gauss() * 1.1);
  // worn world -> the camera begins to return to its own paths
  n.seek = clamp(g.seek * 0.3 + (rnd() < 0.25 + st.mMean ? 0.75 : -0.75) + gauss() * 0.2, -1, 1);
  // each era has a character
  const bump = (k, v, s = 0.6) => { n[k] = clamp(lerp(n[k], v, s), GR[k][0], GR[k][1]); };
  switch (dom) {
    case 'ridges': bump('tk', 9); bump('r2', 3 + rnd() * 6, 0.8); break;
    case 'erosion': bump('tk', 3); bump('fog', 0.016); bump('speed', 2.2, 0.4); break;
    case 'drift': bump('flowSpd', 1.3); bump('swirl', 0.9, 0.5); break;
    case 'waves': bump('waveDamp', 0.9); bump('echo', 0.6, 0.5); bump('evRate', 1.5, 0.6); n.ridges *= 0.6; n.erosion = Math.max(n.erosion, 0.45); bump('tk', 3, 0.5); break;
    case 'terraces': bump('tk', 2.5); bump('contour', 1); bump('cDen', 1.2, 0.4); break;
    case 'uplift': bump('hS', 12, 0.5); break;
    case 'faults': bump('reg', 1.2); bump('tStep', 0.45, 0.4); break;
    case 'flood': bump('survey', 0.1); bump('pitch', -0.14, 0.5); break;
    case 'canopy': bump('clear', 2.2); bump('speed', 2.2, 0.6); bump('survey', 0, 0.8); break;
  }

  if (rnd() < 0.4) n.inkMap = Math.floor(rnd() * GD.inkMap);
  if (rnd() < 0.3) n.mode = Math.floor(rnd() * GD.mode);
  if (rnd() < 0.35) n.root = Math.floor(rnd() * GD.root);

}
function newTraj() {
  const t = {};

}
function beginTransition() {

  S.from = cloneG(S.base); S.to = mutate(S.base); S.P = 1;
}
function endTransition() {
  S.base = S.to; S.G = S.base; S.from = S.to = null;
  S.phase = 'era'; S.transitions++; S.era++; S.traj = newTraj();
  S.P = 0.08 + 0.12 * rnd(); S.trS = 0;
  S.history.push({ era: S.era, dom: S.base.dom, at: S.clock });

/* ---------------- height helpers ---------------- */
const Hraw = (x, z) => samp(h, x, z) + 0.8 * samp(w, x, z);
const Hg = (x, z) => Hraw(x, z) * S.G.hS;

const Hc = (x, z) => canY() - Hraw(z + 71, 19 - x) * S.G.hS * 0.9;

/* ---------------- simulation ---------------- */
let advCount = 0;
// self-repair: if anything ever goes non-finite, regrow the ground from memory instead of dying
function heal() {

}
function slowStep(dt) {

  const r2 = Math.round(G.r2), r1 = Math.max(1, Math.round(G.r2 * 0.38));

  const mDecay = 1 - dt * RATE / 18000, eDecay = 1 - dt * RATE / 10800, mM = st.mMean;

      const lap = h[row + ((x + 1) & M)] + h[row + ((x - 1) & M)] + h[yu + x] + h[yd + x] - 4 * hi;

  if (!Number.isFinite(st.hStd) || !Number.isFinite(st.mMean)) heal();

  // the camera writes itself into the ground
  const c = S.cam;

const sxA = new Float32Array(N), cxA = new Float32Array(N), syA = new Float32Array(N), cyA = new Float32Array(N);
function advect(dt) {

setInterval(audioSchedule, 40);
setInterval(audioWatch, 1000);
setInterval(save, 60000);
addEventListener('pagehide', save);

let last = performance.now(), slowAcc = 0, ctlAcc = 0, infoAcc = 1;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60; dt = Math.min(dt, 0.1);
  const p0 = performance.now();
  try {
    evoStep(dt);
    camStep(dt);
    slowAcc += dt; let n = 0;
    while (slowAcc >= 0.1 && n++ < 2) { slowAcc -= 0.1; slowStep(0.1); }
    if (slowAcc > 0.3) slowAcc = 0;
    waveStep(dt);
    render();
    ctlAcc += dt; if (ctlAcc > 0.1) { ctlAcc = 0; audioControl(); }
    infoAcc += dt; if (infoAcc > 1) { infoAcc = 0; updateInfo(); }
  } catch (err) { console.error(err); }
  PERF.ms = PERF.ms * 0.95 + (performance.now() - p0) * 0.05;
}
const PERF = { ms: 0 };
requestAnimationFrame(frame);
window.MZ = { rebuildGraph, sky: (ph, cl, rn) => { if (ph !== undefined) S.sunPh = ph; S._wx = [cl, rn]; }, get S() { return S; }, F: { get h() { return h; }, w, m, e }, AU, PERF, save, force: (op) => { if (op) S.forceDom = op; S.P = 1; }, set: (o) => Object.assign(S.base, o) };
})();
