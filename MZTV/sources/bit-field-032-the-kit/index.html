function sceneCamera(id){let k=featured && simtime<featured.rollUntil+4?featured:kits[Math.floor((simtime/36)%3)],target=k.leader;
 const wander=Math.sin(simtime*.08);let eye,at,fov=55;
 switch(id){
 case 0:eye=v(4+Math.sin(simtime*.055)*4,24,52);at=v(0,12,-1);fov=58;break;
 case 1:eye=v(45,18,9+Math.sin(simtime*.075)*4);at=v(0,13,0);fov=51;break;
 case 2:eye=v(-17,5.6,18);at=v(-12,9,-2);fov=53;break;
 case 3:eye=add(target,v(8+Math.sin(simtime*.08)*4,8,33));at=add(target,v(0,.2,0));fov=29;break;
 case 4:eye=add(target,v(-12,-1,22));at=add(target,v(1,0,-1));fov=42;break;

function basis(cam){let f=norm(sub(cam.at,cam.eye)),r=norm(cross(f,v(0,1,0))),up=cross(r,f);return {eye:cam.eye,f,r,up,fov:cam.fov};}

 ctx.fillStyle=P.GLOW;ctx.beginPath();ctx.arc(x+w*.75+Math.sin(simtime*.005)*w*.13,y+h*.28,Math.max(7,w*.038),0,TAU);ctx.fill();

function hatchPoly(pts,kind){ // form-following carved hatch clipped to its projected surface

function scenery(rect,ca,detail){let renderList=[];let addPoly=(pts,col,ink,hatch)=>{let pp=pts.map(p=>proj(p,ca,rect));if(pp.some(p=>!p))return;let depth=pp.reduce((s,a)=>s+a.d,0)/pp.length;if(pp.every(p=>p.x<rect.x-5)||pp.every(p=>p.x>rect.x+rect.w+5)||pp.every(p=>p.y<rect.y-5)||pp.every(p=>p.y>rect.y+rect.h+5))return;

 for(const f of faces)addPoly(f.pts,f.fill,f.ink,detail&&f.hatch);

 function B(b){let f=b.mode==='rest'?v(0,0,-1):norm(b.vel);let right=norm(cross(f,v(0,1,0)));if(len(right)<.2)right=v(1,0,0);let up=norm(cross(right,f));let roll=b.roll,twist=b.twist;

 [[-.27,.04,.34],[.27,.04,.34],[.26,-.12,-.45],[-.26,-.12,-.45]],
 [[-.23,-.02,-.33],[-.55,-.035,-.87],[0,-.04,-.65]],
 [[.23,-.02,-.33],[.55,-.035,-.87],[0,-.04,-.65]],
 [[-.16,.1,.53],[.16,.1,.53],[0,.22,.69]]
 ];
 let color=birdColors[b.color],w1=b.color%2===0?P.SEA:P.PAPER;
 for(let n=0;n<ids.length;n++){let pt=ids[n].map(i=>local(...i));let pp=pt.map(p=>proj(p,ca,rect));if(pp.some(p=>!p))continue;
 let ink=n<2?(b.id%5===0?P.HOT:color):n===2?color:n<5?P.DEEP:P.GLOW;
 let depth=pp.reduce((s,a)=>s+a.d,0)/pp.length;

 }
 let head=local(0,.12,.63),tip=local(0,.08,.85);let hp=proj(head,ca,rect),bp=proj(tip,ca,rect);

 }
 for(const b of birds)B(b);
 renderList.sort((a,b)=>b.depth-a.depth);
 for(const ob of renderList){if(ob.kind==='face'){tri(ob.pts,ob.col,ob.ink,Math.max(.35,detail?.65:.38));if(ob.hatch)hatchPoly(ob.pts,ob.col);}else if(ob.kind==='line'){ctx.strokeStyle=ob.col;ctx.lineWidth=ob.stroke*clamp(rect.h/660,.4,1.2);ctx.beginPath();ctx.moveTo(ob.a.x,ob.a.y);ctx.lineTo(ob.b.x,ob.b.y);ctx.stroke();}else if(ob.kind==='birdHead'){ctx.fillStyle=ob.col;ctx.strokeStyle=P.INK;ctx.lineWidth=.75;ctx.beginPath();ctx.arc(ob.hp.x,ob.hp.y,ob.rad,0,TAU);ctx.fill();ctx.stroke();ctx.strokeStyle=P.HOT;ctx.beginPath();ctx.moveTo(ob.hp.x,ob.hp.y);ctx.lineTo(ob.bp.x,ob.bp.y);ctx.stroke();}}
}
function viewport(rect,id,details=true){const ca=basis(sceneCamera(id));ctx.save();ctx.beginPath();ctx.rect(rect.x,rect.y,rect.w,rect.h);ctx.clip();paintSky(rect,ca);scenery(rect,ca,details);
 // frame corner chips inside the observational film print
 if(details){ctx.fillStyle=P.PAPER;ctx.strokeStyle=P.INK;ctx.lineWidth=1.3;const t=`CAM ${String(id+1).padStart(2,'0')}  /  ${cameraNames[id]}`;ctx.font=`bold ${Math.max(9,Math.min(13,rect.w/95))}px ui-monospace,monospace`;let width=ctx.measureText(t).width+20;ctx.fillRect(rect.x+12,rect.y+rect.h-38,width,26);ctx.strokeRect(rect.x+12,rect.y+rect.h-38,width,26);ctx.fillStyle=P.INK;ctx.fillText(t,rect.x+22,rect.y+rect.h-20);}

function autoDirector(dt){shotSince+=dt;const meaningful=featured&&simtime<featured.rollUntil+3;const homeCount=birds.filter(b=>b.mode==='home').length;
 let desire=meaningful?3+(featured.id%2):homeCount>3?2:(Math.floor(simtime/19)%7);
 const minHold=meaningful?1.1:7.6,maxHold=meaningful?4.2:15;
 if(shotSince>minHold&&(shotSince>maxHold||(shotIdx!==desire && Math.random()<dt*(meaningful?1.1:.16)))){shotIdx=preferredShot>=0?preferredShot:desire;shotSince=0;shutter=.36;}
 if(preferredShot>=0)shotIdx=preferredShot;
}
function render(){ctx.fillStyle=P.INK;ctx.fillRect(0,0,CW,CH);let main={x:0,y:0,w:CW,h:CH};viewport(main,shotIdx,true);
 if(camMix){
 let smallH=Math.max(55,Math.min(CH*.193,150)),smallW=Math.max(90,Math.min(CW*.225,230)),gap=5;
 if(CW<620){smallW=CW*.258;smallH=smallW*.59;}

}
let last=0,frameN=0,paused=false;const frame=(now)=>{let dt=last?clamp((now-last)/1000,0,.055):.016;last=now;if(!paused){simtime+=dt;phase+=dt;let wind=1.8+.7*Math.sin(simtime*.022)+.8*Math.sin(simtime*.071);weather.wind=clamp(wind,.4,5.2);weather.dir=.4+Math.sin(simtime*.014)*.8;

 document.getElementById('counts').textContent=`${fly} IN FLIGHT · ${home} RETURNING · ${rest} AT REST`;
 if(simtime>eventUntil)document.getElementById('eventCard').classList.add('hidden');
 if(!notebook){let paragraph;if(home>0)paragraph='Watch the routes change. Returning birds leave the airborne formation at different moments.';
 else if(simtime<20)paragraph='Early light on the roof. Three kits move above the city. The loft and its doors remain below.';
 else if(featured&&simtime<featured.rollUntil+4)paragraph='A break. The rolling birds move through one another’s airspace. No camera was promised the perfect view.';
 else if(fly<6)paragraph='The roof is quieter. The birds that have returned settle on their habitual perches.';

 }}
 document.getElementById('recall').onclick=recall;document.getElementById('release').onclick=release;document.getElementById('feed').onclick=feed;

 document.getElementById('cameras').onclick=()=>{camMix=!camMix;document.getElementById('cameras').textContent=camMix?'SINGLE VIEW':'MULTICAM';observation(camMix?'Auxiliary lenses are visible. MZCAM continues choosing the main shot.':'One uninterrupted observational feed. The director is still working.');};
