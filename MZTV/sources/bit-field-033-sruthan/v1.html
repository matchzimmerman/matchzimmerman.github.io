<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · SRUTHÁN — a stream at the back of a field in Inverin, printed through a macro lens; the info box is printed in the current inks */
:root { --ink:#1b1f3a; --paper:#efe6cf; --hot:#f0603f; --deep:#2c3e7a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-sruthan-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 53.236, LON = -9.48;           // the back of a field above Inverin, Co. Galway
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const prnd = mulberry(4417);   // fixed salt: the place is the same every time
const pr = (a, b) => a + (b - a) * prnd();

/* ====================================================================== clock (Galway), always day */
const gFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Dublin', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
let lpMs = -1, lpVal = null;
function localParts(ms) { const k = Math.floor(ms / 1000); if (k === lpMs) return lpVal; const s = gFmt.format(new Date(ms)); const [h, m, sec] = s.split(':').map(Number); lpMs = k; lpVal = { h, m, sec, str: s, hour: h + m / 60 + sec / 3600 }; return lpVal; }
let simMs = Date.now();
if (Q.has('hour')) { const want = +Q.get('hour'); const cur = localParts(simMs).hour; simMs += (((want - cur) % 24 + 24) % 24) * 3600e3; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;
// the sun never sets here: it circles the sky once a day, low in the north at midnight, at its real height at noon
function sunPath(ms) {
  const h = localParts(ms).hour; const d = new Date(ms); const doy = Math.floor((d - new Date(d.getUTCFullYear(), 0, 0)) / 864e5);
  const decl = 23.44 * Math.sin(TAU * (doy - 81) / 365); const noonEl = Math.max(90 - LAT + decl, 16) * D2R;
  const k = (1 - Math.cos(TAU * h / 24)) / 2; const el = lerp(6.5 * D2R, noonEl, k); const az = TAU * h / 24;
  return { el, az };
}
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); };
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ====================================================================== noise */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

/* ====================================================================== the stream (metres; +x downstream = north, +z east) */
const E0 = 1.6;
const STEPS = [[-6.4, 0.16, 0.10], [-4.6, 0.30, 0.06], [-2.0, 0.10, 0.18], [1.2, 0.52, 0.045], [4.6, 0.09, 0.35], [6.8, 0.14, 0.10]];
const VORT = [[2.55, 0, 0.9, 0.42], [2.25, 0, -0.65, 0.3], [-3.2, 0, 0.55, 0.38], [-5.7, 0, -0.5, 0.22], [7.3, 0, 0.45, 0.25], [0.2, 0, -0.35, 0.3]];
const gauss = (x, m, s) => Math.exp(-Math.pow((x - m) / s, 2));
function Ebase(x) { let e = E0 - 0.015 * x; for (const [x0, d, h] of STEPS) e -= d * smoothstep(x0 - h, x0 + h, x); return e; }
let LEVEL = 0, QN = 1, REV = 1;
const Ez = (x) => Ebase(x) + LEVEL;
const cz = (x) => 0.55 * Math.sin(x * 0.42 + 0.3) + 0.22 * Math.sin(x * 1.13 + 1.7);
const wz0 = (x) => 0.62 + 0.18 * Math.sin(x * 0.77 + 2) + 0.55 * gauss(x, 2.4, 1.2) + 0.35 * gauss(x, -3.3, 1.0) - 0.2 * gauss(x, 1.2, 0.45) - 0.12 * gauss(x, -4.6, 0.3);
const wz = (x) => wz0(x) * (1 + LEVEL * 1.2);
const dz = (x) => 0.07 + 0.28 * gauss(x, 2.4, 1.3) + 0.2 * gauss(x, -3.3, 1.0) + 0.06 * gauss(x, -5.5, 0.6) + 0.04 * gauss(x, 7.4, 0.5);
VORT.forEach(v => { v[1] = cz(v[0]) + Math.sign(v[2]) * 0.5 * wz0(v[0]); });
const FLOW_STONES = [];   // filled by the world build: [x, z, r]
function flowAt(x, z) {
  const c = cz(x), w = wz(x); const dc = (cz(x + 0.01) - cz(x - 0.01)) / 0.02; const s = (z - c) / w; const prof = Math.max(0, 1 - s * s);
  const sp = QN * 0.03 / (w * Math.max(dz(x), 0.05)); let vx = sp * prof, vz = sp * prof * dc;
  for (const o of VORT) { const ddx = x - o[0], ddz = z - o[1]; const f = o[2] * Math.exp(-(ddx * ddx + ddz * ddz) / (o[3] * o[3])) * (0.5 + 0.5 * QN); vx += -ddz * f; vz += ddx * f; }
  for (const st of FLOW_STONES) { const ddx = x - st[0], ddz = z - st[1]; const r = Math.hypot(ddx, ddz); const R = st[2]; if (r < R * 1.8 && r > 1e-4) { const nx = ddx / r, nz = ddz / r; const dn = vx * nx + vz * nz; const k = 1 - smoothstep(R, R * 1.8, r); if (dn < 0) { vx -= nx * dn * k; vz -= nz * dn * k; } } }
  return [vx * REV, vz * REV];
}
const f4 = (n) => (+n).toFixed(4);
const GLSL_STREAM = /* glsl */`
uniform vec4 uStone[16]; uniform vec4 uVort[6]; uniform float uQ, uRev, uLevel;
float sst(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.,1.); return t*t*(3.-2.*t); }
float gss(float x,float m,float s){ float q=(x-m)/s; return exp(-q*q); }
float Ez(float x){ float e=${f4(E0)}-0.015*x; ${STEPS.map(s => `e-=${f4(s[1])}*sst(${f4(s[0] - s[2])},${f4(s[0] + s[2])},x);`).join(' ')} return e+uLevel; }
float cz(float x){ return 0.55*sin(x*0.42+0.3)+0.22*sin(x*1.13+1.7); }
float wz(float x){ return (0.62+0.18*sin(x*0.77+2.)+0.55*gss(x,2.4,1.2)+0.35*gss(x,-3.3,1.)-0.2*gss(x,1.2,0.45)-0.12*gss(x,-4.6,0.3))*(1.+uLevel*1.2); }
float dz(float x){ return 0.07+0.28*gss(x,2.4,1.3)+0.2*gss(x,-3.3,1.)+0.06*gss(x,-5.5,0.6)+0.04*gss(x,7.4,0.5); }
float footAt(float x){ float f=0.; ${STEPS.map(s => `f+=${f4(s[1] * 2.2)}*gss(x,${f4(s[0] + s[2] + 0.05)},${f4(0.08 + s[1] * 0.35)});`).join(' ')} return f; }
vec2 flowAt(vec2 p, float t){ float x=p.x; float c=cz(x), w=wz(x); float dc=(cz(x+0.01)-cz(x-0.01))/0.02; float s=(p.y-c)/w; float prof=max(0.,1.-s*s);
  float sp=uQ*0.03/(w*max(dz(x),0.05)); vec2 v=vec2(1.,dc)*sp*prof;
  for(int i=0;i<6;i++){ vec4 o=uVort[i]; vec2 d=p-o.xy; float f=o.z*exp(-dot(d,d)/(o.w*o.w))*(0.5+0.5*uQ); v+=vec2(-d.y,d.x)*f; }
  for(int i=0;i<16;i++){ vec4 st=uStone[i]; if(st.z<=0.) continue; vec2 d=p-st.xy; float r=length(d); float R=st.z;
    if(r<R*2.2){ vec2 n=d/max(r,1e-4); float dn=dot(v,n); float k=1.-smoothstep(R,R*1.8,r); if(dn<0.) v-=n*dn*k;
      float wake=smoothstep(R*2.2,R,r)*step(0.,dot(d,normalize(v+1e-5))); v+=vec2(-n.y,n.x)*0.35*length(v)*wake*sin(t*2.1+st.x*9.+r*20.); } }
  return v*uRev; }
`;

/* ---------- ground */
function terrainH(x, z) {
  const c = cz(x), w = wz0(x), e = Ebase(x); const dist = Math.abs(z - c) - w;
  const field = E0 + 0.5 - 0.012 * x + 0.22 * fbm(x * 0.11 + 3, z * 0.11) + 0.012 * z;
  if (dist < 0) { const s = (z - c) / w; const bed = e - dz(x) * Math.max(0, 1 - s * s) - 0.03 + 0.04 * (vnoise(x * 3.1, z * 3.1) - 0.5); return bed + (e - 0.035 - bed) * smoothstep(-0.14, 0, dist); }
  const bank = 0.6 + 0.5 * vnoise(x * 0.6, 7.3);
  return e + 0.02 + (field - e - 0.02) * smoothstep(0, bank, dist) + 0.035 * (vnoise(x * 4.3, z * 4.3) - 0.5) * smoothstep(0, 0.3, dist);
}
const fieldY = (x, z) => terrainH(x, z);

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'ATLANTIC PRINT', c: ['#1b1f3a', '#2c3e7a', '#3f9aa6', '#f0603f', '#f2c14e', '#efe6cf'] },
  { name: 'KELP & SALMON',  c: ['#13261f', '#2d5e4c', '#e58ea0', '#2fa7a0', '#f3d36b', '#f6efe4'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'BRUISE',         c: ['#1d1430', '#6a3b7d', '#8fd0c6', '#ff8c42', '#f4e04d', '#f7efe3'] },
  { name: 'BOG COTTON',     c: ['#182028', '#3b5a5e', '#9cc9b4', '#ef6b4a', '#efd98a', '#f7f3ea'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky   */ [DEEP, SEA, PAPER, 0.9, 1], /* 1 sun   */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 water */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam  */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 stone */ [INK, DEEP, SEA, 1.0, 0], /* 5 moss  */ [DEEP, SEA, GLOW, 0.95, 0],
  /* 6 bark  */ [INK, DEEP, GLOW, 1.0, 0], /* 7 dark  */ [INK, INK, DEEP, 0.3, 0], /* 8 bird  */ [INK, DEEP, PAPER, 0.8, 0],
  /* 9 pale  */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 leafH */ [INK, HOT, GLOW, 0.6, 0], /*11 earth */ [INK, DEEP, SEA, 0.9, 0],
  /*12 leafG */ [DEEP, GLOW, PAPER, 0.7, 0], /*13 cloud */ [SEA, PAPER, PAPER, 0.8, 0], /*14 grass */ [DEEP, SEA, GLOW, 1.0, 0],
  /*15 lamp  */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.4, dith: 0.12, wob: 7, outline: 1, hatch: 1.0 }, center: 38,
  uncanny: { next: rr(6, 12) * 60, counts: {}, last: {}, mem: {} }, rain: 1.5, rainAt: Date.now(), litter: [], fallen: 0, overFalls: 0, log: [], runSec: 0
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
{ const away = clamp((Date.now() - (S.rainAt || Date.now())) / 1000, 0, 7 * 86400); S.rain *= Math.exp(-away / (8 * 3600)); }   // the stream drained while the source was dark
const T0 = S.runSec || 0; simT = T0;
function save() { try { S.runSec = simT; S.rainAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: localParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
if (!S.log.length) logEv('the stream was found for the first time'); else logEv('the stream resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.015, 3000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect; uniform float uFocus, uAper;
uniform vec3 uSunD; uniform vec3 uCanC; uniform float uCanR, uCanY, uSway, uDapOn;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float screenAngle(vec3 w, vec3 T){
  vec4 a=uVP*vec4(w,1.); vec4 b=uVP*vec4(w+T,1.);
  vec2 d=b.xy/max(b.w,1e-4)-a.xy/max(a.w,1e-4); d.x*=uAspect;
  float ang=atan(d.y,d.x); if(ang<0.) ang+=3.14159265; return ang/3.14159265; }
float cocAt(float dist){ return clamp(abs(dist-uFocus)/max(dist,0.005)*uAper,0.,1.); }
vec4 pack(float sh, float id, float ang, float acc, float dist){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., fract(ang), step(0.5,acc)*0.5+0.49*cocAt(dist)); }
float dapple(vec3 w){                       // the leaning tree's canopy, projected along the sun
  if(uSunD.y<0.02) return 1.;
  vec2 p=w.xz+uSunD.xz/uSunD.y*(uCanY-w.y); vec2 q=(p-uCanC.xz)/uCanR;
  float inC=1.-smoothstep(0.7,1.05,length(q*vec2(1.25,1.)));
  float leaf=vn(p*2.1+vec2(uSway,uSway*0.6))*0.6+vn(p*5.7-vec2(uSway*1.7,uSway*0.4))*0.4;
  float hole=smoothstep(0.52,0.6,leaf);
  return mix(1.,mix(0.34,1.,hole),inC*uDapOn*step(w.y,uCanY-0.3)); }
`;
const SH = {   // shared uniforms
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 300 }, uFogShade: { value: 0.6 },
  uBreath: { value: 0 }, uDay: { value: 1 }, uKeyUp: { value: 1 },
  uFocus: { value: 1 }, uAper: { value: 0.2 }, uCanC: { value: V() }, uCanR: { value: 5 }, uCanY: { value: 6 }, uSway: { value: 0 }, uDapOn: { value: 1 },
  uStone: { value: Array.from({ length: 16 }, () => new THREE.Vector4()) }, uVort: { value: VORT.map(v => new THREE.Vector4(v[0], v[1], v[2], v[3])) },
  uQ: { value: 1 }, uRev: { value: 1 }, uLevel: { value: 0 }, uRain: { value: 0 }, uWindL: { value: V() },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uBreathOn, uCloth; uniform vec3 uWindL;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying float vC;
void main(){
  vC=0.;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  if(uCloth>2.5){   // grass blades bend with the wind; canopy leaves sway
    float hgt=max(position.y,0.); float ph=sin(uTime*(uCloth>3.5?1.1:2.3)+w.x*3.1+w.z*2.3)+0.5*sin(uTime*3.7+w.x*7.+w.z*5.);
    float k=uCloth>3.5?0.05:3.2*hgt*hgt;
    w.xz+=(uWindL.xz*(0.7+0.3*ph)+vec2(ph,ph*0.6)*0.06)*k; w.y-=k*0.15*length(uWindL.xz);
    vC=0.06*ph*hgt;
  }

}

  PU.uRain.value = clamp(WX.precip / 2, 0, 1); const rd = fromBearingTravel(WX.windDir); PU.uRainDir.value.set(rd.x * 0.35, -1).normalize(); PU.uTime.value = simT;

  const rs = document.documentElement.style; rs.setProperty('--ink', css(cwNow[0])); rs.setProperty('--paper', css(cwNow[5])); rs.setProperty('--hot', css(cwNow[3])); rs.setProperty('--deep', css(cwNow[1]));

/* ====================================================================== info box */

{ const sp = sunPath(simMs); SUND.copy(azElToVec(sp.az, sp.el)); }

for (let k = 0; k < 8; k++) { const L = LEAVES.find(l => l.state === 'off'); if (!L) break; const x = rr(-7, 7); L.state = 'float'; L.pos.copy(wp(x, rr(-0.6, 0.6), 0.003)); L.yaw = rr(0, TAU); }

}
let lastT = performance.now(), hudT = 0;
