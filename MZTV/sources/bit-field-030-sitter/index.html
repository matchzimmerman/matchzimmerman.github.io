<title>MZTV · BIT FIELD 030 · SITTER</title>
<!--
  MZTV · BIT FIELD 030 · SITTER
  A screen test that never ends. One sitter faces the camera, locked off, under one soft light.
  Every 30 seconds a new sitting begins: under a blink, the face moves a step through face space
  (jaw, nose, brow, lids, mouth, cheeks, skull, age, tone, hair). Nobody is ever the same person
  twice, and nobody is ever very different from the person before.
  The head, hair, brows, lashes and stubble were built in code (Blender, Python) on the CC0
  MakeHuman base mesh and exported neutral; every feature is applied live here as a field of
  soft displacements that moves skin, hair and eyes together.
  Over hours: the walk widens and the pull back to the middle weakens. The sitter remembers
  every face it has been and can drift back toward one (h2), the two sides of the face begin to
  drift apart (h6), composites of past sitters appear (h10), the performance develops quirks
  (h16), caricatures (h20), and the face can split (h30). Looks (gelatin, 1-bit, silkscreen,
  phosphor) change by era.

  Filmed by MZCAM (MZTV/lib/mzcam.js): the Bolex holds the frontal screen test; three drones fly
  coverage (eyes, mouth, profiles, three-quarters, behind, overhead, orbit, wide). The director
  cuts only inside a blink, and comes home to the frontal for every change of sitter.

  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?ff=H ?sit=SEC ?look=gelatin|bit|silk|phosphor ?bay=0 ?crew=0
  Keys:   I info · M mute · L next look · C camera bay
-->

    v: 1, seed: CFG.seed, rs: (CFG.seed * 2654435761) >>> 0, t: 0, k: 0,
    prev: zeroGenome(), cur: zeroGenome(), tgt: zeroGenome(), morph0: 0,
    archive: [],        // {k, g} for past sittings (dense recent, sparse old)
    event: 'first sitting', ref: -1, counts: { returns: 0, composites: 0, caricatures: 0, splits: 0 },
    look: CFG.look >= 0 ? CFG.look : 0, lookPrev: 0, lookT0: -1e9, lookEnd: 3 * 3600,
