<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Crossing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · CROSSING — full-frame print of a tidal river crossing; the info box is printed in the current inks */
:root { --ink:#1b1f3a; --paper:#efe6cf; --hot:#f0603f; --deep:#2c3e7a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-crossing-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 38.27, LON = -75.79;           // Wicomico River, Eastern Shore, Maryland
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();

/* ====================================================================== clock */
const nyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short' });
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; let lpMs = -1, lpVal = null;
function localParts(ms) { const k = Math.floor(ms / 1000); if (k === lpMs) return lpVal; const o = {}; nyFmt.formatToParts(new Date(ms)).forEach(q => o[q.type] = q.value);
  const h = +o.hour % 24, m = +o.minute, sec = +o.second; lpMs = k; lpVal = { h, m, sec, wd: WD.indexOf(o.weekday), str: `${String(h).padStart(2, '0')}:${o.minute}:${o.second}`, hour: h + m / 60 + sec / 3600 }; return lpVal; }
let simMs = Date.now();
if (Q.has('hour')) { const want = +Q.get('hour'); const cur = localParts(simMs).hour; simMs += (((want - cur) % 24 + 24) % 24) * 3600e3; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;   // seconds of sim since load (scaled by RATE)

/* ====================================================================== noise + terrain (fixed salt so the place is the same for every seed) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function nearEdge(x) { return -150 + 9 * Math.sin(x * 0.0061 + 0.4) + 16 * (fbm(x * 0.011, 1.7) - 0.5) - 26 * Math.exp(-Math.pow((x - 210) / 70, 2)); }
function farEdge(x) { return -392 + 14 * Math.sin(x * 0.0043 + 1.0) + 18 * (fbm(x * 0.010, 4.2) - 0.5) + 30 * Math.exp(-Math.pow((x + 240) / 90, 2)); }
const ZN = nearEdge(0), ZF = farEdge(0);
function roadW(x, z) { const ne = nearEdge(x), fe = farEdge(x); return (z > ne - 16 || z < fe + 16) ? Math.exp(-Math.pow(x / 4.4, 4)) : 0; }
function terrainH(x, z) {   // world axes: +x north, +z east; the river runs north–south between the near (east) and far (west) banks
  const ne = nearEdge(x), fe = farEdge(x); const dN = z - ne, dF = fe - z; const d = Math.max(dN, dF);
  const mid = (ne + fe) / 2, half = (ne - fe) / 2, q = (z - mid) / half;
  const bed = -1.0 - 4.8 * Math.max(0, 1 - q * q) - 1.2 * fbm(x * 0.01, z * 0.01);
  const knoll = Math.exp(-Math.pow((x - 70) / 80, 2) - Math.pow((z - (ZF - 95)) / 70, 2));
  let land = 0.55 + 0.6 * fbm(x * 0.02 + 3, z * 0.02) + 0.0035 * Math.max(0, d - 40) + 2.0 * smoothstep(90, 280, dN) + 3.2 * knoll;
  const cr = Math.abs(fbm(x * 0.0052 + 11, z * 0.0052 + 5) - 0.5); const rw = roadW(x, z);
  land -= 1.7 * (1 - smoothstep(0.005, 0.026, cr)) * smoothstep(10, 30, d) * (1 - rw) * (1 - knoll);
  const c = smoothstep(-7, 3, d);
  let h = bed + (land - bed) * c;
  if (rw > 0) { const roadH = d > 4 ? Math.max(land, 1.6) + 0.05 : lerp(-1.1, 1.65, smoothstep(-15, 4, d)); h = lerp(h, roadH, rw); }
  return h;
}

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;               // 0 new, π full
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)) };
}
// world axes: +x north, +z east, -z west (the open bay), y up
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); }; // (x,z) travel for a "from" bearing
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'MARSH SIGNAL',   c: ['#14183a', '#2346a8', '#5fd0b8', '#ff5a3c', '#ffd23f', '#f4efe2'] },
  { name: 'OYSTER RADIO',   c: ['#1a1530', '#4b3fb8', '#9fd6e8', '#ff6f91', '#f6e27a', '#f7f2ea'] },
  { name: 'CRAB SHELL',     c: ['#1b1b2e', '#2f5f8f', '#7ee0c3', '#ff4e2a', '#ffb03b', '#fbf3e6'] },
  { name: 'SPARTINA',       c: ['#16241c', '#2c5d58', '#c7e07a', '#ff5f6d', '#ffe08a', '#f3f1e2'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'TIDE TABLE',     c: ['#101a2c', '#1f5b8f', '#59c3e6', '#f2603f', '#eadf9c', '#f6f4ec'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky   */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun   */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 sea   */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam  */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 cliff */ [INK, DEEP, SEA, 1.0, 0], /* 5 grass */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 6 wood  */ [INK, DEEP, PAPER, 1.0, 0], /* 7 dark  */ [INK, INK, DEEP, 0.3, 0], /* 8 fabric*/ [INK, INK, DEEP, 1.0, 0],
  /* 9 white */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 boat  */ [INK, INK, HOT, 0.6, 0], /*11 iris  */ [INK, SEA, GLOW, 0.8, 0],
  /*12 path  */ [DEEP, GLOW, PAPER, 0.8, 0], /*13 cloud */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon  */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp  */ [GLOW, GLOW, PAPER, 0.0, 0],
];
/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 7.2, dith: 0.12, wob: 8, outline: 1, hatch: 1.0, angBias: 0 }, center: 38,
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} }, crossings: 0, carried: 0, turnedBack: 0, hist: [Array(24).fill(0), Array(24).fill(0)], log: [], runSec: 0
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
const T0 = S.runSec || 0; simT = T0;
function save() { try { S.runSec = simT; localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: localParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
if (!S.log.length) logEv('the crossing opened for the first time');
else logEv('the crossing resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.5, 40000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float screenAngle(vec3 w, vec3 T){
  vec4 a=uVP*vec4(w,1.); vec4 b=uVP*vec4(w+T,1.);
  vec2 d=b.xy/max(b.w,1e-3)-a.xy/max(a.w,1e-3); d.x*=uAspect;
  float ang=atan(d.y,d.x); if(ang<0.) ang+=3.14159265; return ang/3.14159265; }
vec4 pack(float sh, float id, float ang, float acc){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., fract(ang), acc); }
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 1600 }, uFogShade: { value: 0.6 },
  uBreath: { value: 0 }, uDay: { value: 1 }, uKeyUp: { value: 1 },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uBreathOn, uCloth, uClothH, uWalk, uMove; uniform vec3 uWindL;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying float vC;
void main(){
  vC=0.;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  if(uCloth>0.5&&uCloth<1.5){   // the dress: folds that deepen toward the hem, pushed by wind and by walking
    float t=1.-clamp(lp.y/uClothH,0.,1.); float a=atan(lp.x,lp.z); float fl=t*t;
    vec2 rd=normalize(lp.xz+vec2(1e-4));
    float fold=0.07*t*sin(a*9.+lp.y*1.3+sin(uTime*0.7+a)*0.8);
    float rip=0.045*sin(lp.y*5.5-uTime*2.2+a*3.)+0.035*sin(lp.y*2.1-uTime*1.3+a*5.+1.);
    lp.xz+=rd*(fold+rip*fl*(0.7+uMove)); vC=fold*4.5+rip*2.;
    lp.xz+=uWindL.xz*fl*0.42;
    lp.z-=uMove*fl*0.32+smoothstep(0.75,1.,t)*max(-lp.z,0.)*0.9; lp.x+=sin(uWalk*1.7)*0.07*fl*uMove;
    lp.y+=0.03*fl*sin(uWalk*3.4)*uMove;
  } else if(uCloth>1.5){         // the veil: a long ribbon from the crown, trailing and fluttering
    float t=clamp(-lp.y/2.3,0.,1.);
    float fl=sin(t*7.-uTime*3.1+lp.x*2.)*0.09*t+sin(t*3.-uTime*1.7)*0.06*t;
    lp.x*=0.3+1.5*t;
    lp.z-=t*(0.1+0.42*uMove)+fl*0.5+0.12*sqrt(t);
    lp.xz+=uWindL.xz*t*t*0.6;
    lp.x+=sin(t*5.-uTime*2.4)*0.07*t; vC=fl*2.5;
    lp.y+=t*t*(0.15*uMove+0.12*length(uWindL));
  }
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  if(uBreathOn>0.5){
    float steep=smoothstep(0.35,0.7,1.-n.y);
    float band=smoothstep(1.,8.,w.y)*(1.-smoothstep(48.,85.,w.y));
    float rip=0.6+0.4*sin(w.y*0.33-uTime*0.8+w.x*0.05+w.z*0.03);
    w.xyz+=vec3(n.x,0.,n.z)*uBreath*steep*band*rip;
  }
  vW=w.xyz; vN=n; vL=position; vT=mat3(modelMatrix)*lt;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const OBJ_FRAG = /* glsl */`
${COMMON}
uniform float uId, uMode, uEmit, uFace, uStackH, uTime;
uniform float uAmb, uDiff, uFogD, uFogShade;
uniform vec3 uKeyD, uCamP, uT;
varying vec3 vW, vN, vL, vT; varying float vC;
void rock(inout vec3 T, inout float sh, inout float acc){
  float n1=vn(vW.xz*0.06+vW.y*0.015);
  T=normalize(vec3(0.35*(n1-0.5),1.,0.35*(vn(vW.zx*0.05+3.1)-0.5)));
  float vein=abs(sin(vW.x*0.31+vW.z*0.27+n1*9.+vW.y*0.05));
  acc=step(vein,0.045)*step(0.58,vn(vW.xz*0.02+vW.y*0.03+7.));
  sh-=0.14*(1.-n1);
}
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
  float sh=uAmb+uDiff*max(dot(N,uKeyD),0.)+vC;
  float id=uId; vec3 T=uT; float acc=0.;
  if(uMode>0.5&&uMode<1.5){ rock(T,sh,acc); }
  else if(uMode>1.5&&uMode<2.5){
    bool grass=N.y>0.62&&vW.y>0.38;
    if(abs(vW.x)<4.4&&vW.y>0.2&&N.y>0.8){ id=12.; T=vec3(0.,0.,1.); sh+=0.05*(vn(vW.xz*0.3)-0.5); }
    else if(grass){ id=5.; T=normalize(vec3(0.6,0.,1.)+vec3(0.6*(vn(vW.xz*0.02)-0.5),0.,0.)); sh=sh*0.78+0.22*(vn(vW.xz*0.035)-0.5)+0.12*(vn(vW.xz*0.21)-0.5)-0.04; }
    else { id=4.; rock(T,sh,acc); if(vW.y<1.6) sh*=0.7; }
  }
  else if(uMode>2.5&&uMode<3.5){ T=length(vT)>0.01?normalize(vT):vec3(0.,1.,0.); }
  if(uFace>0.01){
    float a=atan(vL.x,vL.z); float hh=vL.y/uStackH+0.5;
    float ey=(hh-0.66)/(0.05*uFace+0.002);
    float e1=length(vec2((a-0.36)/0.15,ey)), e2=length(vec2((a+0.36)/0.15,ey));
    if(min(e1,e2)<1.){ id=7.; sh=0.06; acc=0.; }
  }
  float dist=length(vW-uCamP); float fog=1.-exp(-dist/uFogD);
  if(uEmit>0.){ sh=uEmit; fog*=0.4; }
  sh=mix(sh,uFogShade,fog);
  gl_FragColor=pack(sh,id,screenAngle(vW,T*0.6),acc*(1.-fog));
}`;
function objMat(id, mode = 0, T = V(0, 1, 0), extra = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: OBJ_VERT, fragmentShader: OBJ_FRAG, side: THREE.DoubleSide,
    uniforms: Object.assign({}, SH, { uId: { value: id }, uMode: { value: mode }, uT: { value: T.clone().normalize() },
      uEmit: { value: 0 }, uFace: { value: 0 }, uStackH: { value: 1 }, uBreathOn: { value: 0 },
      uCloth: { value: 0 }, uClothH: { value: 2 }, uWalk: { value: 0 }, uMove: { value: 0 }, uWindL: { value: V() } }, extra)
  });
}

/* ---------- sea */
const NW = 6, NC = 6;
const seaU = { uW: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) }, uW2: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) },
  uC: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) }, uCalm: { value: 1 }, uHt: { value: null }, uHtB: { value: new THREE.Vector4(-500, -450, 1000, 1200) },
  uChop: { value: 0.3 }, uSkyB: { value: 0.6 }, uTide: { value: 0 } };
const SEA_VERT = /* glsl */`
uniform vec4 uW[8]; uniform vec4 uW2[8]; uniform float uTime, uCalm, uTide; uniform vec3 uCamP;
varying vec3 vW; varying vec2 vXZ; varying float vCrest;
void main(){
  vec2 x0=position.xz; float fade=uCalm*(1.-smoothstep(1500.,5000.,length(x0-uCamP.xz)));
  vec3 d=vec3(0.); float crest=0.;
  for(int i=0;i<${NW};i++){ vec4 a=uW[i]; vec4 b=uW2[i];
    float ph=a.z*dot(a.xy,x0)-b.x*uTime+b.z; float A=a.w*fade;
    d.x+=b.y*A*a.x*cos(ph); d.z+=b.y*A*a.y*cos(ph); d.y+=A*sin(ph); crest+=b.y*A*a.z*sin(ph); }
  vec3 w=vec3(x0.x+d.x,d.y+uTide,x0.y+d.z); vW=w; vXZ=x0; vCrest=crest;
  gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);
}`;
const SEA_FRAG = /* glsl */`
${COMMON}
uniform vec4 uW[8]; uniform vec4 uW2[8]; uniform vec4 uC[8];
uniform sampler2D uHt; uniform vec4 uHtB;
uniform vec3 uKeyD, uCamP; uniform float uTide, uTime, uCalm, uAmb, uDiff, uFogD, uFogShade, uKeyUp, uSkyB, uDay;
varying vec3 vW; varying vec2 vXZ; varying float vCrest;
void main(){
  vec2 x0=vXZ; float dist=length(vW-uCamP);
  float fade=uCalm*(1.-smoothstep(1500.,5000.,length(x0-uCamP.xz)));
  vec3 n=vec3(0.,1.,0.);
  for(int i=0;i<${NW};i++){ vec4 a=uW[i]; vec4 b=uW2[i]; float ph=a.z*dot(a.xy,x0)-b.x*uTime+b.z; float A=a.w*fade;
    n.x-=A*a.z*a.x*cos(ph); n.z-=A*a.z*a.y*cos(ph); }
  float cf=uCalm*(1.-smoothstep(120.,900.,dist));
  for(int i=0;i<${NC};i++){ vec4 c=uC[i]; float w=sqrt(9.81*c.z); float ph=c.z*dot(c.xy,vW.xz)-w*uTime+float(i)*1.7;
    n.x-=c.w*cf*c.z*c.x*cos(ph); n.z-=c.w*cf*c.z*c.y*cos(ph); }
  n=normalize(n);
  vec3 Vd=normalize(uCamP-vW);
  float lam=max(dot(n,uKeyD),0.);
  float fres=pow(1.-max(dot(n,Vd),0.),4.);
  vec3 R=reflect(-Vd,n); float spec=pow(max(dot(R,uKeyD),0.),160.)*uKeyUp;
  float sh=uAmb*0.8+uDiff*0.35*lam+0.12*uSkyB+0.45*fres*uSkyB+spec*1.7;
  vec2 tuv=(vW.xz-uHtB.xy)/uHtB.zw; float ht=-30.;
  if(tuv.x>0.&&tuv.x<1.&&tuv.y>0.&&tuv.y<1.) ht=texture2D(uHt,tuv).r*80.-20.;
  float depth=uTide-ht;
  float bands=vn(vW.xz*0.08+vec2(uTime*0.05,0.));
  float shore=smoothstep(1.2,0.15,depth+(bands-0.5)*0.8-0.3*sin(uTime*0.55+depth*1.2));
  float crest=smoothstep(0.3,0.62,vCrest)*(0.55+0.7*vn(vW.xz*0.05+uTime*0.02));
  float foam=max(shore,crest)*(1.-smoothstep(1200.,3000.,dist));
  float id=2.;
  if(foam>0.5){ id=3.; sh=0.55+0.35*lam+0.15*bands+0.2*uDay; }
  vec3 T=normalize(vec3(-uW[0].y,0.,uW[0].x)+0.5*vec3(n.x,0.,n.z));
  float fog=1.-exp(-dist/(uFogD*1.6));
  sh=mix(sh,uFogShade,fog);
  gl_FragColor=pack(sh,id,screenAngle(vW,T*2.),0.);
}`;

/* ---------- sky */
const SKY_FRAG = /* glsl */`
${COMMON}
uniform vec3 uSunD, uCamP; uniform float uDay, uCloud, uTime; uniform vec2 uWind;
varying vec3 vW;
void main(){
  vec3 d=normalize(vW-uCamP); float el=d.y;
  float sg=pow(max(dot(d,uSunD),0.),5.)*smoothstep(-0.25,0.05,uSunD.y);
  float low=smoothstep(-0.28,0.,uSunD.y)*(1.-smoothstep(0.12,0.5,uSunD.y));
  float az=pow(max(dot(normalize(d.xz+1e-4),normalize(uSunD.xz+1e-4)),0.),2.);
  float band=(1.-smoothstep(0.,0.32,max(el,0.)))*az*low;
  float sh=mix(0.1,0.55,uDay)+0.38*sg-0.16*smoothstep(0.,0.7,el)*uDay+0.12*(1.-smoothstep(0.,0.2,el))*uDay+0.42*band;
  float id=0.; vec3 T=vec3(1.,0.,0.);
  if(el>0.){
    vec2 cp=d.xz/max(el,0.035)*500.+uWind*uTime*6.;
    float cl=vn(cp*0.0016)*0.62+vn(cp*0.0055+3.)*0.38;
    float thr=1.05-uCloud*0.75;
    float cov=smoothstep(thr,thr+0.12,cl)*smoothstep(0.01,0.09,el);
    if(cov>0.5){ id=13.; sh=mix(0.32,0.86,uDay)-0.45*(cl-thr)+0.28*sg; T=normalize(vec3(1.,0.15*(cl-0.6),0.)); }
  }
  gl_FragColor=pack(sh,id,screenAngle(uCamP+d*100.,T),0.);
}`;
const SKY_VERT = /* glsl */`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; gl_Position.z=gl_Position.w*0.99999; }`;

/* ---------- sun / moon disc with an eye */
const DISC_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.); gl_Position.z=gl_Position.w*0.99998; }`;
const DISC_FRAG = /* glsl */`
${COMMON}
uniform float uOpen, uBlink, uIsMoon, uIllum, uDim; uniform vec2 uGaze;
varying vec2 vUv;
void main(){
  vec2 p=vUv*2.-1.; float r=length(p); if(r>1.) discard;
  float id=uIsMoon>0.5?14.:1.;
  float sh=uIsMoon>0.5?0.55+0.4*uIllum:0.9-0.32*smoothstep(0.5,1.,r);
  sh*=uDim;
  float la=mod(atan(p.y,p.x),3.14159265)/3.14159265;
  float o=uOpen*(1.-uBlink);
  if(o>0.01){
    float x=p.x/0.66; float ey=p.y+0.03; float lid=0.4*o*(1.-x*x);
    if(abs(x)<1.&&abs(ey)<lid){
      vec2 ip=p-vec2(0.,-0.03)-uGaze*o; float ir=length(ip);
      if(ir<0.075){ id=7.; sh=0.04; }
      else if(ir<0.21){ id=11.; sh=0.3+0.6*(ir/0.21); la=mod(atan(ip.y,ip.x),3.14159265)/3.14159265; }
      else { id=9.; sh=0.9; la=0.; }
      if(length(ip-vec2(-0.05,0.06))<0.03) { id=9.; sh=1.; }
    } else if(abs(x)<1.08&&ey>0.&&ey<lid+0.045*o+0.012){ id=7.; sh=0.05; }
    else if(abs(x)<1.&&ey<0.&&ey>-lid-0.02*o){ id=7.; sh=0.12; }
    // the wing at the outer corner
    vec2 wq=p-vec2(0.66,0.0); float wl=dot(wq,normalize(vec2(1.,0.55)));
    if(o>0.35&&wl>0.&&wl<0.22*o&&abs(dot(wq,normalize(vec2(-0.55,1.))))<0.025){ id=7.; sh=0.05; }
  }
  gl_FragColor=pack(sh,id,la,0.);
}`;

const PT_VERT = /* glsl */`attribute float aLife; uniform float uScale; varying float vLife; varying vec3 vW;
void main(){ vLife=aLife; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vec4 mv=viewMatrix*w; gl_Position=projectionMatrix*mv;

const PT_FRAG = /* glsl */`${COMMON}
uniform vec3 uCamP; uniform float uFogD, uFogShade; varying float vLife; varying vec3 vW;
void main(){ if(vLife<=0.) discard; vec2 c=gl_PointCoord*2.-1.; if(dot(c,c)>1.) discard;

/* ---------- print pass: linocut lines through OBAS inks */
const PU = {
  uData: { value: rtData.texture }, uRes: { value: new THREE.Vector2(2, 2) },
  uPal: { value: Array.from({ length: 6 }, () => V()) },
  uTab: { value: MAT.map(m => V(m[0], m[1], m[2])) }, uHat: { value: MAT.map(m => m[3]) }, uSpk: { value: MAT.map(m => m[4]) },
  uPeriod: { value: 6 }, uDith: { value: 0.12 }, uWob: { value: 7 }, uOutline: { value: 1 }, uHatch: { value: 1 },
  uSeed: { value: rnd() * 100 }, uRain: { value: 0 }, uRainDir: { value: new THREE.Vector2(0.3, -1).normalize() }, uTime: { value: 0 },
};
const PRINT_FRAG = /* glsl */`
uniform sampler2D uData; uniform vec2 uRes; uniform vec3 uPal[6]; uniform vec3 uTab[16]; uniform float uHat[16]; uniform float uSpk[16];
uniform float uPeriod, uDith, uWob, uOutline, uHatch, uSeed, uRain, uTime; uniform vec2 uRainDir;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float b2(vec2 a){ a=floor(a); return fract(dot(a,vec2(0.5,a.y*0.75))); }
float b4(vec2 a){ return b2(0.5*a)*0.25+b2(a); }
float b8(vec2 a){ return b4(0.5*a)*0.25+b2(a); }
int idAt(vec2 fc){ return int(floor(texture2D(uData,fc/uRes).g*16.)); }
bool soft(int a,int b){
  bool sa=(a==0||a==13||a==1||a==14), sb=(b==0||b==13||b==1||b==14);
  if(sa&&sb) return true;
  if((a==2||a==3)&&(b==2||b==3)) return true;
  if((a==4||a==5)&&(b==4||b==5)) return false;
  return false; }
void main(){
  vec2 fc=gl_FragCoord.xy;
  vec4 d=texture2D(uData,fc/uRes);
  float s=d.r; int id=int(floor(d.g*16.)); float ang=d.b*3.14159265; float acc=d.a;
  vec3 tab=uTab[id]; float hs=uHat[id]*uHatch;
  vec2 dir=vec2(cos(ang),sin(ang));
  float u=dot(fc,vec2(-dir.y,dir.x));
  float wob=(vn(fc*0.011+uSeed)-0.5)*uWob+(vn(fc*0.047+uSeed*2.)-0.5)*uWob*0.35;
  float line=cos((u+wob)*6.2831853/uPeriod);
  float mid=1.-abs(2.*s-1.);
  float v=s+line*hs*0.3*(0.3+0.7*mid)+(b8(fc)-0.5)*uDith;
  int k=v<0.36?0:(v<0.69?1:2);
  float ink=k==0?tab.x:(k==1?tab.y:tab.z);
  if(uSpk[id]>0.5){ float h=hash(floor(fc/2.6)+uSeed); if(h>0.968){ if(s<0.28) ink=5.; else if(k==2) ink=tab.y; else if(k==1) ink=tab.x; } }
  if(acc>0.5) ink=3.;
  if(uOutline>0.5){
    int il=idAt(fc+vec2(-1.,0.)), iu=idAt(fc+vec2(0.,-1.));
    if((il!=id&&!soft(il,id))||(iu!=id&&!soft(iu,id))) ink=0.;
  }
  if(uRain>0.01){
    vec2 rp=vec2(dot(fc,vec2(-uRainDir.y,uRainDir.x)), dot(fc,uRainDir)+uTime*520.);
    vec2 cell=floor(rp/vec2(5.,46.)); float h=hash(cell+uSeed);
    if(h>1.-uRain*0.06 && fract(rp.y/46.)<0.35 && fract(rp.x/5.)<0.3) ink=(s<0.5)?float(tab.z):5.;
  }
  gl_FragColor=vec4(uPal[int(ink+0.5)],1.);
}`;
const BLIT_FRAG = /* glsl */`uniform sampler2D uTex; uniform vec2 uOut; varying vec2 vUv;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
void main(){ vec3 c=texture2D(uTex,vUv).rgb; float g=hash(floor(gl_FragCoord.xy*0.5)); c*=0.965+0.035*g; gl_FragColor=vec4(c,1.); }`;
const QUAD_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const printMat = new THREE.ShaderMaterial({ vertexShader: QUAD_VERT, fragmentShader: PRINT_FRAG, uniforms: PU, depthTest: false, depthWrite: false });
const blitMat = new THREE.ShaderMaterial({ vertexShader: QUAD_VERT, fragmentShader: BLIT_FRAG, uniforms: { uTex: { value: rtPrint.texture }, uOut: { value: new THREE.Vector2() } }, depthTest: false, depthWrite: false });

/* ====================================================================== world build */
const TER = { x0: -700, z0: -1000, sx: 1400, sz: 1400 };
{
  const g = new THREE.PlaneGeometry(TER.sx, TER.sz, 440, 440); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i) + TER.z0 + TER.sz / 2; p.setZ(i, z); p.setY(i, terrainH(x, z)); }
  g.computeVertexNormals();

  const N = 256, data = new Uint8Array(N * N * 4);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = TER.x0 + (i + 0.5) / N * TER.sx, z = TER.z0 + (j + 0.5) / N * TER.sz;
    const v = clamp((terrainH(x, z) + 20) / 80, 0, 1) * 255; const o = (j * N + i) * 4; data[o] = data[o + 1] = data[o + 2] = v; data[o + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat); tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  seaU.uHt.value = tex; seaU.uHtB.value.set(TER.x0, TER.z0, TER.sx, TER.sz);
}
// tree lines: the river disappears between low woods
{
  const ridge = (pts) => { const pos = [], idx = []; pts.forEach((q, i) => { pos.push(q[0], q[1], q[2], q[0], -6, q[2]); if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g; };
  const trees = (x, s) => 11 + 9 * fbm(x * 0.012 + s, 2.1) + 4 * vnoise(x * 0.09 + s, 5.5);
  const w = []; for (let x = -5000; x <= 5000; x += 30) w.push([x, trees(x, 1), -1250 - 260 * fbm(x * 0.0007, 3)]); scene.add(new THREE.Mesh(ridge(w), objMat(5, 0, V(0, 1, 0))));
  const e = []; for (let x = -5000; x <= 5000; x += 30) e.push([x, trees(x, 7) - 2, 640 + 200 * fbm(x * 0.0008, 8)]); scene.add(new THREE.Mesh(ridge(e), objMat(5, 0, V(0, 1, 0))));
  for (const sx of [-1, 1]) { const n = []; for (let z = -1500; z <= 900; z += 30) n.push([sx * (2600 + 400 * fbm(z * 0.001, sx)), trees(z, 20 + sx) - 3, z]); scene.add(new THREE.Mesh(ridge(n), objMat(5, 0, V(0, 1, 0)))); }
}

const SEA_C = V(0, 0, (ZN + ZF) / 2);
{
  const RINGS = 190, SEG = 192, K = 0.035, RMAX = 9000, den = Math.exp(RINGS * K) - 1;
  const pos = [0, 0, 0], idx = [];
  for (let i = 1; i <= RINGS; i++) { const r = RMAX * (Math.exp(i * K) - 1) / den;
    for (let j = 0; j < SEG; j++) { const a = j / SEG * TAU; pos.push(SEA_C.x + Math.cos(a) * r, 0, SEA_C.z + Math.sin(a) * r); } }
  for (let j = 0; j < SEG; j++) idx.push(0, 1 + (j + 1) % SEG, 1 + j);
  for (let i = 1; i < RINGS; i++) for (let j = 0; j < SEG; j++) {
    const a = 1 + (i - 1) * SEG + j, b = 1 + (i - 1) * SEG + (j + 1) % SEG, c = 1 + i * SEG + j, d = 1 + i * SEG + (j + 1) % SEG; idx.push(a, b, c, b, d, c); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.ShaderMaterial({ vertexShader: SEA_VERT, fragmentShader: SEA_FRAG, uniforms: Object.assign({}, SH, seaU), side: THREE.DoubleSide });

// merged wood
const BOXES = [];
function addBox(w, h, d, m4, T, list = BOXES) { const g = new THREE.BoxGeometry(w, h, d); g.applyMatrix4(m4); const n = g.attributes.position.count; const t = new Float32Array(n * 3);
  const tv = T.clone().transformDirection(m4); for (let i = 0; i < n; i++) { t[i * 3] = tv.x; t[i * 3 + 1] = tv.y; t[i * 3 + 2] = tv.z; } g.setAttribute('aT', new THREE.BufferAttribute(t, 3)); list.push(g); }
const M4 = (x, y, z, ry = 0, rx = 0, rz = 0) => new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(1, 1, 1));
function beam(a, b, t, list = BOXES) { const len = a.distanceTo(b); const o = new THREE.Object3D(); o.position.copy(a).add(b).multiplyScalar(0.5); o.lookAt(b); o.updateMatrix(); addBox(t, t, len, o.matrix, V(0, 0, 1), list); }
// dolphins (piling rows) either side of each slip

  for (let k = 0; k < 6; k++) { const z = e + sg * (3 + k * 4.2); for (const sx of [-5.6, 5.6]) addBox(0.42, 8.2, 0.42, M4(sx + (rnd() - 0.5) * 0.15, -1.6, z, rnd() * 0.4, (rnd() - 0.5) * 0.04, (rnd() - 0.5) * 0.05), V(0, 1, 0)); }
  for (const sx of [-5.6, 5.6]) beam(V(sx, 2.0, e + sg * 3), V(sx, 1.7, e + sg * 24), 0.16);
  addBox(0.5, 3.2, 0.5, M4(-4.3, 0.8, e + sg * 1.5), V(0, 1, 0));   // cable post
}

        else if (r < 0.75) { o.state = 'perch'; o.until = rr(60, 300); } else { o.until = rr(40, 140); o.orbit.c.set(rr(-200, 200), 0, SEA_C.z + rr(-70, 70)); } } }
    else if (o.state === 'dive') { tgt = o.dive.clone().setY(waveH(o.dive.x, o.dive.z, t));
      if (o.pos.distanceTo(tgt) < 1.5) { spawnSpray(tgt, 0.9, 30, 0.8); const l = AUD.lens(tgt); AUD.pend.push({ s: 0.6, v: l.g * 1.4, pan: l.pan }); o.state = 'soar'; o.until = rr(60, 200);
        if (rnd() < 0.3) logEv('an osprey hit the water'); } }
    else { tgt = NEST.clone().setY(12.2).add(V(i ? 0.6 : -0.6, 0, 0)); if (o.until <= 0) { o.state = 'soar'; o.until = rr(60, 200); } }
    const to = tgt.clone().sub(o.pos); const dist = to.length(); const perching = o.state === 'perch' && dist < 2;
    const speed = perching ? 0 : o.state === 'dive' ? clamp(dist * 0.9, 6, 22) : clamp(dist * 0.35, 3, 13);
    o.vel.lerp(dist > 0.01 ? to.normalize().multiplyScalar(speed) : V(), 1 - Math.exp(-dt * (o.state === 'dive' ? 2.5 : 1.1)));
    if (perching) o.pos.lerp(tgt, 0.1); else o.pos.addScaledVector(o.vel, dt);
    if (!isFinite(o.pos.x)) { o.pos.set(0, 50, SEA_C.z); o.vel.set(0, 0, 0); o.state = 'soar'; }
    const m = o.mesh; m.position.copy(o.pos); if (o.vel.lengthSq() > 0.05) { m.rotation.y = Math.atan2(o.vel.x, o.vel.z); m.rotation.x = clamp(o.vel.y * 0.04, -0.9, 0.5); }
    o.ph += dt * (perching ? 0 : 3.4); const flap = perching ? -1.1 : o.state === 'dive' ? -0.7 : Math.sin(o.ph) * 0.35 + 0.08;

}
let SHORE_ENV = 0;
function shoreTick(dt, t) {
  let env = 0;
  for (const pr of PROBES) { const h = waveH(pr.p.x, pr.p.z, t) - WATER_Y; pr.cool -= dt;
    const wake = ferry.state === 'crossing' ? Math.exp(-Math.pow((pr.p.z - ferry.pos.z) / 60, 2)) * clamp(ferry.v, 0, 1.3) * 0.5 : 0;
    const thr = 0.55 * (WAVE_AMP + 0.03) * (1 - 0.5 * wake);
    if (pr.prev < thr && h >= thr && pr.cool <= 0 && live.calm > 0.5) { pr.cool = rr(2.5, 6); const s = clamp(WAVE_AMP * 6 + wake, 0.15, 1.1);
      const l = AUD.lens(pr.p.clone().setY(1)); AUD.pend.push({ s, v: l.g * 1.1 * s, pan: l.pan }); }
    pr.prev = h; env += Math.max(0, h) / (WAVE_AMP + 0.05) / (1 + pr.p.distanceTo(camera.position) / 120); }
  SHORE_ENV = lerp(SHORE_ENV, env * 0.5, 1 - Math.exp(-dt * 3));
  for (let i = 0; i < SPRAY_N; i++) { if (sprayLife[i] <= 0) continue; sprayLife[i] -= dt * 0.8; sprayVel[i * 3 + 1] -= 9.8 * dt;
    sprayPos[i * 3] += sprayVel[i * 3] * dt; sprayPos[i * 3 + 1] += sprayVel[i * 3 + 1] * dt; sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt; if (sprayPos[i * 3 + 1] < WATER_Y - 1) sprayLife[i] = 0; }
  sprayGeo.attributes.position.needsUpdate = true; sprayGeo.attributes.aLife.needsUpdate = true;
}

function step(dt) {
  dt = Math.min(dt, 0.25); const sdt = dt * RATE; simT += sdt; simMs += sdt * 1000;
  if (!WX.live) Object.assign(WXT, synthWx(simMs));
  for (const k of ['wind', 'cloud', 'precip', 'temp', 'hum']) WX[k] = lerp(WX[k], WXT[k], 1 - Math.exp(-sdt / 90));
  { const d = ((WXT.windDir - WX.windDir + 540) % 360) - 180; WX.windDir += d * (1 - Math.exp(-sdt / 120)); }
  TIDE.h = tideAt(simMs); TIDE.cur = clamp((tideAt(simMs + 600e3) - tideAt(simMs - 600e3)) / 0.074, -1, 1);
  live.breath = lerp(live.breath, live.ev === 'breath' ? 0.75 * Math.sin(simT * TAU / 38) * smoothstep(0, 20, live.evT) * smoothstep(0, 20, live.evDur - live.evT) : 0, 1 - Math.exp(-sdt * 2));
  WATER_Y = TIDE.h + live.breath; seaU.uTide.value = WATER_Y;
  if (simT - lastWxRebuild > 2) { rebuildWaves(); lastWxRebuild = simT; }
  SUNM = sunMoon(simMs); SUND.copy(azElToVec(SUNM.sun.az, SUNM.sun.el)); MOOND.copy(azElToVec(SUNM.moon.az, SUNM.moon.el));
  paxTick(sdt); ferryTick(sdt, simT); cableTick(); heronTick(sdt, simT); ospreyTick(sdt, simT); shoreTick(sdt, simT);
  S.tension += sdt / S.epochLen * (live.ev ? 0.3 : 1);

  live.calm = lerp(live.calm, live.ev === 'hush' ? 0.04 : 1, 1 - Math.exp(-sdt / (live.ev === 'hush' ? 4 : 2.5)));
  if (simT >= DIR.until && DIR.pendingCut < 0) DIR.pendingCut = chooseShot();
  if (DIR.pendingCut >= 0 && (!AUD.ctx || AUD.ctx.state !== 'running' || AUD.cur16 !== DIR.last16)) { cut(DIR.pendingCut); DIR.pendingCut = -1; }
  DIR.last16 = AUD.cur16;
  CREW.forEach(c => c.upd(c, simT));

}

/* ====================================================================== render */
function applyLook(dt) {
  const c = DIR.look || CREW[DIR.cur]; camera.position.copy(c.p);
  const wy = waveH(camera.position.x, camera.position.z, simT) + 0.6; if (camera.position.y < wy) camera.position.y = wy;
  camera.lookAt(c.tgt); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  if (!isFinite(camera.position.x)) { camera.position.set(20, 8, ZN + 40); camera.lookAt(0, 0, SEA_C.z); }
  SH.uVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); SH.uAspect.value = camera.aspect; SH.uCamP.value.copy(camera.position); SH.uTime.value = simT;
  const sEl = SUNM.sun.el, mEl = SUNM.moon.el;
  const day = smoothstep(-0.2, 0.18, sEl); SH.uDay.value = day; SH.uSunD.value.copy(SUND);
  const cloudDim = 1 - 0.55 * WX.cloud;
  if (sEl > -0.06) { SH.uKeyD.value.copy(SUND); SH.uDiff.value = (0.18 + 0.62 * smoothstep(-0.06, 0.35, sEl)) * cloudDim; SH.uKeyUp.value = smoothstep(-0.03, 0.05, sEl) * (1 - 0.7 * WX.cloud); }
  else { SH.uKeyD.value.copy(mEl > 0 ? MOOND : V(0, 1, 0)); SH.uDiff.value = mEl > 0 ? 0.2 * SUNM.illum * cloudDim : 0.04; SH.uKeyUp.value = mEl > 0 ? 0.6 * SUNM.illum * (1 - WX.cloud) : 0; }
  SH.uAmb.value = 0.14 + 0.3 * day + 0.08 * WX.cloud * day;
  SH.uFogD.value = clamp(2200 - 1400 * smoothstep(72, 100, WX.hum) - 500 * clamp(WX.precip, 0, 2), 450, 2400);
  SH.uFogShade.value = 0.12 + 0.55 * day;
  seaU.uCalm.value = live.calm; seaU.uSkyB.value = 0.25 + 0.6 * day;
  skyU.uCloud.value = WX.cloud; const wd = fromBearingTravel(WX.windDir); skyU.uWind.value.set(wd.x, wd.y).multiplyScalar(WX.wind);
  sky.position.copy(camera.position);
  const place = (m, dir, deg, up) => { m.position.copy(camera.position).addScaledVector(dir, 15000); m.quaternion.copy(camera.quaternion); const s = 2 * 15000 * Math.tan(deg * D2R); m.scale.set(s, s, 1); m.visible = up; };
  place(sunM, SUND, 3.3, sEl > -0.08); place(moonM, MOOND, 1.6, mEl > -0.05 && sEl < 0.1);
  sunM.material.uniforms.uDim.value = 1 - 0.35 * WX.cloud; moonM.material.uniforms.uIllum.value = SUNM.illum;
  const night = sEl < 0.03; LAMPS.forEach(l => { const on = night && l.on(); l.mesh.material.uniforms.uId.value = on ? 15 : 7; l.mesh.material.uniforms.uEmit.value = on ? 1 : 0; });
  if (cwMix < 1) cwMix = Math.min(1, cwMix + dt / 45);
  const target = COLORWAYS[S.colorway].c.map(hexV);
  for (let i = 0; i < 6; i++) { cwNow[i].copy(cwFrom[i]).lerp(target[i], smoothstep(0, 1, cwMix)); PU.uPal.value[i].copy(cwNow[i]); }
  const gm = S.grammar; PU.uPeriod.value = gm.period * IH / 720; PU.uDith.value = gm.dith; PU.uWob.value = gm.wob * IH / 720; PU.uOutline.value = gm.outline; PU.uHatch.value = gm.hatch;
  PU.uRain.value = clamp(WX.precip / 2, 0, 1); const rd = fromBearingTravel(WX.windDir); PU.uRainDir.value.set(rd.x * 0.35, -1).normalize(); PU.uTime.value = simT;
  const css = (v) => '#' + v.toArray().map(x => Math.round(clamp(x, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
  const rs = document.documentElement.style; rs.setProperty('--ink', css(cwNow[0])); rs.setProperty('--paper', css(cwNow[5])); rs.setProperty('--hot', css(cwNow[3])); rs.setProperty('--deep', css(cwNow[1]));
}
function render() {
  renderer.setRenderTarget(rtData); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
  quad.material = printMat; renderer.setRenderTarget(rtPrint); renderer.render(postScene, postCam);
  quad.material = blitMat; renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* ====================================================================== info box */
const hud = document.getElementById('hud'); hud.hidden = !INFO;
const tapBtn = document.getElementById('tap');
function ferryWords() {
  if (!ferryman.visible && ferry.state === 'docked') return 'tied up for the night';
  if (ferry.state === 'crossing') return `crossing ${ferry.from === 0 ? 'west' : 'east'} · ${Math.round((ferry.from === 0 ? ferry.u : 1 - ferry.u) * 100)}%`;
  const b = PAX.filter(p => p.state === 'board').length ? ' · loading' : PAX.filter(p => p.state === 'disembark').length ? ' · unloading' : '';
  return `at the ${ferry.side ? 'far' : 'near'} slip${b}`;
}
function hudUpdate() {
  if (!INFO) return; const g = localParts(simMs); const sEl = SUNM.sun.el / D2R; const sAz = (SUNM.sun.az / D2R + 360) % 360;
  const bpm = (240 / AUD.barSec).toFixed(0);
  const wN = queue(0).filter(p => p.state === 'wait').length, wF = queue(1).filter(p => p.state === 'wait').length, ab = PAX.filter(p => p.state === 'ride').length;
  const ev = live.ev ? `<div class="ev">NOW · ${EVT[live.ev].label}</div>` : '';
  hud.innerHTML = `<div class="t"><span>MZ WORLD · CROSSING</span><span>EPOCH ${S.epoch} · ${COLORWAYS[S.colorway].name}</span></div>
  <div class="r"><span>WICOMICO RIVER ${g.str} · sun ${sEl.toFixed(0)}° ${compass(sAz)}</span><span>${WX.live ? 'LIVE' : 'SIMULATED'} WEATHER</span></div>
  <div class="r"><span>TIDE ${TIDE.h >= 0 ? '+' : ''}${TIDE.h.toFixed(2)} m · ${Math.abs(TIDE.cur) < 0.25 ? 'slack' : TIDE.cur > 0 ? 'flooding' : 'ebbing'}</span><span>→ water, bar ${AUD.barSec.toFixed(1)} s (${bpm} bpm)</span></div>
  <div class="r"><span>WIND ${WX.wind.toFixed(1)} m/s ${compass(WX.windDir)} · CLOUD ${(WX.cloud * 100).toFixed(0)}%</span><span>→ chop, slaps, sky</span></div>
  <div class="r"><span>HUMIDITY ${WX.hum.toFixed(0)}%${WX.precip > 0.05 ? ' · RAIN ' + WX.precip.toFixed(1) + ' mm' : ''}</span><span>→ haze ${(SH.uFogD.value | 0)} m, echo</span></div>
  <div class="r"><span>FERRY ${ferryWords()}</span><span>→ bass on ${NOTE[AUD.deg(AUD.ferryDeg()) % 12]}</span></div>
  <div class="r"><span>WAITING east ${wN} · west ${wF} · aboard ${ab} · CROSSINGS ${S.crossings}</span><span>${CREW[DIR.cur].name} · tension ${Math.min(99, S.tension * 100) | 0}%</span></div>
  ${ev}<div class="log">${S.log.slice(0, 4).map(l => `<div>${l.t} — ${l.text}</div>`).join('')}</div>
  <div class="cr">MATCH ZIMMERMAN CREATIVE MEDIA GROUP · MZTV</div>`;
}

/* ====================================================================== loop, keys, API */
addEventListener('resize', resize); resize();
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('[gl] context lost'); });
renderer.domElement.addEventListener('webglcontextrestored', () => { resize(); seaU.uHt.value.needsUpdate = true; console.warn('[gl] context restored'); });
TIDE.h = tideAt(simMs); WATER_Y = TIDE.h; rebuildWaves(); SUNM = sunMoon(simMs); SUND.copy(azElToVec(SUNM.sun.az, SUNM.sun.el)); MOOND.copy(azElToVec(SUNM.moon.az, SUNM.moon.el));
// the crossing was running before you arrived: start mid-day state, then pre-warm a few minutes
if (serviceOpen() && rnd() < 0.5) { ferry.u = 1; ferry.side = 1; }
ferryman.visible = serviceOpen();
function spawnPax(side, kind, r) { const p = PAX.find(q => q.state === 'off' && q.kind === kind); if (!p) return; p.state = 'arrive'; p.side = side; p.r = r; p.slot = -1; p.mesh.visible = true; p.wait = 0; }
if (serviceOpen()) { spawnPax(ferry.side, 'car', 60); spawnPax(1 - ferry.side, 'walker', 40); if (rnd() < 0.6) spawnPax(1 - ferry.side, 'car', 280); }
cut(Q.has('cam') ? clamp(+Q.get('cam'), 0, CREW.length - 1) : Math.floor(rnd() * CREW.length));
if (Q.has('cam')) DIR.until = 1e12;
{ const rs = RATE; for (let i = 0; i < 900; i++) step(0.25 / rs); AUD.pend.length = 0; }
function frame(dt) {
  try { step(dt); applyLook(dt); render(); AUD.frame(dt); }
  catch (e) { console.error(e); }
}
let lastT = performance.now(), hudT = 0;
function raf(now) { const dt = (now - lastT) / 1000; lastT = now; frame(dt); hudT += dt; if (hudT > 0.5) { hudT = 0; hudUpdate(); } requestAnimationFrame(raf); }
if (!CAPTURE) requestAnimationFrame(raf);
addEventListener('beforeunload', save);
addEventListener('keydown', (e) => { const k = e.key.toLowerCase();
  if (k === 'i') { INFO = !INFO; hud.hidden = !INFO; if (INFO) hudUpdate(); }
  if (k === 'm') AUD.mute();
  if (k === 'r' && !live.ev) { logEv('a hand on the river (human intervention)'); S.tension = 1; }
  AUD.start(); });
addEventListener('pointerdown', () => AUD.start());
tapBtn.addEventListener('click', () => AUD.start());
AUD.init(); applyLook(0); hudUpdate();
window.MZ = {
  tick(dt = 1 / 30) { frame(dt); hudUpdate(); },
  advance(sec, dt = 0.25) { for (let t = 0; t < sec; t += dt) step(dt); applyLook(sec); render(); hudUpdate(); },
  force(name) { if (live.ev) endEvent(); if (name === 'rupture') { rupture('forced by hand'); return; } startEvent(name, true); },
  cam(i) { cut(i); DIR.until = 1e12; },
  look(p, t, fov = 30) { DIR.look = p ? { p: V(...p), tgt: V(...t), fov } : null; },
  seekHour(h) { const cur = localParts(simMs).hour; simMs += (((h - cur) % 24 + 24) % 24) * 3600e3; },
  ink(i) { S.colorway = i; cwMix = 1; cwFrom = COLORWAYS[i].c.map(hexV); },
  get state() { return { S, live: { ...live }, WX: { ...WX }, TIDE: { ...TIDE }, cam: CREW[DIR.cur].name, ferry: { state: ferry.state, side: ferry.side, u: ferry.u }, ferryman: ferryman.visible,

  setWx(o) { Object.assign(WXT, o); Object.assign(WX, o); WX.live = true; },
  analyser() { return AUD.an; }, audio: AUD, geo: { ZN, ZF, DOCK },
};
</script>
