 S.pressure=clamp(S.pressure+slow1*.065);S.openness=clamp(S.openness+slow2*.07);S.motion=clamp(S.motion+slow3*.055);S.pan=Math.sin(ms*.000000217+SIG.coupling*3.4);return S

function influenceAt(u,v,t){let fx=0,fy=0,e=0;for(let i=0;i<turnForces.length;i++){const a=turnForces[i],ang=a.phase+t*a.rate*(.6+S.motion*1.8)+Math.sin(t*.0000073+i)*.28,cx=.5+Math.cos(ang)*(a.orbit+.03*Math.sin(t*.000011+i)),cy=.5+Math.sin(ang*1.137)*(a.orbit*.62+.04*Math.cos(t*.000009+i*.7));let dx=u-cx,dy=v-cy,r2=dx*dx+dy*dy+.0022,inv=a.weight/r2;fx+=-dy*inv;fy+=dx*inv;e+=a.weight*Math.exp(-r2*(16+30*S.density))}
 const rr=Math.hypot(u-.5,v-.5)+1e-4,aa=Math.atan2(v-.5,u-.5);fx+=Math.cos(aa*3+t*.000021)*(.15+.55*S.bridge)/(rr+.18);fy+=Math.sin(aa*2-t*.000018)*(.12+.48*S.gap)/(rr+.22);return [fx,fy,e]}

 [-.62,-.18,.22,.64].forEach((pan,i)=>{let o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),p=mkPan(pan);o.type=i%2?'triangle':'sine';g.gain.value=.0001;f.type='lowpass';f.frequency.value=900+i*260;o.connect(f);f.connect(g);if(p){g.connect(p);p.connect(master)}else g.connect(master);o.start();pads.push({o,g,f,p,pan})});
