<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World White Cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · WHITE CUBE — one sculpture, one vacuum, many observers; the info box is printed in the current inks */
:root { --ink:#1b1d22; --paper:#f1eee6; --hot:#c8392e; --deep:#3a404a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: light }
html, body { height:100%; margin:0; background:var(--paper); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(500px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
@media (max-width:560px) { #hud { font-size:9.5px; padding:8px 10px } }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
#plan { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:220px; height:220px;
  border:2px solid var(--ink); background:var(--paper); display:none }
</style>

<div id="hud" hidden></div>
<canvas id="plan" width="440" height="440"></canvas>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<!-- the drone crew, director and flight model are shared with 48 PLANT, TRACKSIDE and SITTER -->
<script src="../../lib/mzcam.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const KEY = 'mzworld-white-cube-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }
const TZ = 'America/New_York';             // the log keeps real local time; nothing else here is located
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const TV = (p) => V(p.x, p.y, p.z);           // MZCam vector → THREE
const MV = (p) => MZCam.V(p.x, p.y, p.z);     // THREE → MZCam vector
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length) % a.length];

/* ====================================================================== clock */
const fmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
function localParts(ms) {
  const o = {}; for (const p of fmt.formatToParts(new Date(ms))) o[p.type] = p.value;
  const h = +o.hour % 24, m = +o.minute, sec = +o.second;
  return { h, m, sec, str: `${h < 10 ? '0' : ''}${h}:${o.minute}:${o.second}`, hour: h + m / 60 + sec / 3600 };
}
let simMs = Date.now();
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;
// the Timex is stopped: it reads 8:55:15 in every photograph and in the video
const CLOCK_STOPPED = 8 * 3600 + 55 * 60 + 15;
const dial = (s) => { s = ((s % 43200) + 43200) % 43200; const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = Math.floor(s % 60); return `${h || 12}:${m < 10 ? '0' : ''}${m}:${x < 10 ? '0' : ''}${x}`; };

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'TOLEX',          c: ['#1b1d22', '#3a404a', '#9ea7ab', '#c8392e', '#e8c35a', '#f1eee6'] },
  { name: 'TIMEX',          c: ['#1a1a1e', '#44464f', '#b9b3a3', '#d24b3a', '#efe2b8', '#f6f3ec'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'PALLET',         c: ['#21180f', '#5a4330', '#a99f85', '#d06a2c', '#e9c98a', '#f3ece0'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'CASSETTE',       c: ['#14161f', '#2e3b5c', '#8fa6b8', '#e0563f', '#f0d28c', '#eff0ea'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const MAT = [
  /* 0 void    */ [SEA, PAPER, PAPER, 0.22, 0], /* 1 floor   */ [DEEP, SEA, PAPER, 0.4, 0],  /* 2 tolex   */ [INK, DEEP, SEA, 0.45, 0],
  /* 3 grilleD */ [INK, DEEP, SEA, 1.0, 0],     /* 4 grilleS */ [DEEP, SEA, PAPER, 1.0, 0], /* 5 panel   */ [INK, SEA, PAPER, 0.6, 0],
  /* 6 wood    */ [INK, DEEP, SEA, 1.0, 0],     /* 7 dark    */ [INK, INK, DEEP, 0.3, 0],   /* 8 red     */ [INK, HOT, HOT, 0.35, 0],
  /* 9 white   */ [SEA, PAPER, PAPER, 0.4, 0],  /*10 silver  */ [DEEP, SEA, PAPER, 0.7, 0], /*11 board   */ [INK, DEEP, GLOW, 0.8, 1],
  /*12 case    */ [INK, INK, DEEP, 0.5, 0],     /*13 drone   */ [INK, DEEP, SEA, 0.4, 0],  /*14 screen  */ [INK, DEEP, GLOW, 0.35, 0],
  /*15 lamp    */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 6.4, dith: 0.11, wob: 6, outline: 1, hatch: 1.0 }, center: 38, key: { az: 2.2, el: 1.05 },
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} }, log: [], runSec: 0, savedAt: Date.now(), logKind: {},
  att: {}, known: {}, seen: {}, clock: CLOCK_STOPPED, clockRun: 0, scuff: '', cuts: 0,
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
simT = S.runSec || 0;
function save() { try { S.runSec = simT; S.savedAt = Date.now(); S.scuff = scuffEncode(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: localParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
function logOnce(kind, text, gapMin = 45) { const l = S.logKind[kind]; if (l != null && simT - l < gapMin * 60 && l <= simT) return; S.logKind[kind] = simT; logEv(text); }
if (!S.log.length) logEv('the sculpture was found as it is, in an empty white room'); else logEv('the white cube resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const NEAREST = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false };
const rtData = new THREE.WebGLRenderTarget(2, 2, { ...NEAREST, depthBuffer: true });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const rtKin = new THREE.WebGLRenderTarget(96, 72, { ...NEAREST, depthBuffer: true });     // what the Kinect sees
const rtFeed = new THREE.WebGLRenderTarget(192, 120, { ...NEAREST, depthBuffer: true });  // a drone's lens, for the iMac
const DUMMY = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); DUMMY.needsUpdate = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.03, 80);
const kinCam = new THREE.PerspectiveCamera(43, 4 / 3, 0.05, 30);
const feedCam = new THREE.PerspectiveCamera(40, 16 / 10, 0.03, 80);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform float uPerPx, uWobPx, uPxK;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
vec4 pack(float sh, float id, float line, float acc){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., clamp(line,0.,1.), acc>0.5?1.:0.); }
// hatching carved into the surface (as SRUTHÁN v3): lines run along T, spaced in the surface's own coordinates,
// and the spacing follows distance in octaves so the print keeps its density on screen. A still object keeps a still pattern.
float lineAt(vec3 W, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float s=dot(W,A), t=dot(W,B); float wk=uWobPx/max(uPerPx,0.1)*1.35;
  float l0=cos((s+((vn(vec2(s,t)/(p0*7.)+3.1)-.5)*wk+extra)*p0)*6.2831853/p0);
  float l1=cos((s+((vn(vec2(s,t)/(p1*7.)+3.1)-.5)*wk+extra)*p1)*6.2831853/p1);
  return 0.5+0.5*mix(l0,l1,f); }
// a physical pitch (a weave, a grain) that steps out to every 2nd, 4th… thread with distance
float pitchLine(float s, float t, float dist, float pitch){
  float per=uPerPx*max(dist,0.05)*uPxK;
  float L=log2(max(per/pitch,1.)); float f=smoothstep(0.,1.,fract(L));
  float p0=pitch*exp2(floor(L)), p1=p0*2.;
  float wk=uWobPx/max(uPerPx,0.1)*0.4;
  float w0=(vn(vec2(s/(p0*5.),t/(p0*11.))+1.7)-.5)*wk*p0, w1=(vn(vec2(s/(p1*5.),t/(p1*11.))+1.7)-.5)*wk*p1;
  return 0.5+0.5*mix(cos((s+w0)*6.2831853/p0), cos((s+w1)*6.2831853/p1), f); }
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uTime: { value: 0 }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.62 }, uDiff: { value: 0.6 }, uFogD: { value: 9 }, uFogShade: { value: 0.93 },
  uPerPx: { value: 6 }, uWobPx: { value: 6 }, uPxK: { value: 0.0012 },
  uFb: { value: 0 }, uDr: { value: Array.from({ length: 7 }, () => new THREE.Vector4(0, -9, 0, 0)) },
  uKin: { value: DUMMY }, uFeed: { value: DUMMY }, uScuff: { value: DUMMY }, uNum: { value: DUMMY },
  uScr: { value: 0 }, uWake: { value: 0 }, uFbC: { value: V(0, -9, 0) }, uFbR: { value: 0.3 },
};
const OBJ_VERT = /* glsl */`
uniform float uMover;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying vec2 vUv;
void main(){
  vec4 w=modelMatrix*vec4(position,1.);
  vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); vL=uMover>0.5?position:w.xyz; vT=mat3(modelMatrix)*aT; vUv=uv;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const OBJ_FRAG = /* glsl */`
${COMMON}
uniform float uId, uMode, uEmit, uTime, uAmb, uDiff, uFogD, uFogShade, uMover, uAlb, uBW, uAccOn, uFbAcc, uFb, uScr, uWake;
uniform vec3 uKeyD, uCamP, uT, uFbC; uniform float uFbR; uniform vec4 uDr[7];
uniform sampler2D uKin, uFeed, uScuff, uNum;
varying vec3 vW, vN, vL, vT; varying vec2 vUv;
float sdBox(vec2 p, vec2 a, vec2 b){ vec2 c=(a+b)*.5, h=(b-a)*.5; vec2 d=abs(p-c)-h; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float footprint(vec2 p){   // the pallet, the case and the iMac's cabinet, as they sit on the floor
  return min(min(sdBox(p,vec2(-.72,-.45),vec2(.32,.77)), sdBox(p,vec2(.28,.22),vec2(.86,.70))), sdBox(p,vec2(.02,-.90),vec2(.56,-.42))); }
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
  float dist=length(vW-uCamP);
  float sh=uAmb+uDiff*max(dot(N,uKeyD),0.);
  sh-=0.16*(1.-smoothstep(0.,0.35,vW.y))*step(0.01,vW.y)*step(uMode,0.5);   // a little occlusion where things meet the floor
  float id=uId; vec3 T=uT; float acc=0.; float line=-1.;
  float fog=1.-exp(-dist/uFogD);
  if(uMode>0.5&&uMode<1.5){          // the floor: paper, with the sculpture's contact shadow, the drones' shadows and the scuffs they leave
    id=1.; T=vec3(1.,0.,0.15); sh+=0.2;
    vec2 sp=vW.xz+uKeyD.xz*0.22;
    float fp=footprint(sp);
    sh-=0.85*(1.-smoothstep(0.,0.32,fp))+0.3*(1.-smoothstep(0.,1.3,fp));
    float edge=max(abs(vW.x),abs(vW.z)); sh-=0.7*smoothstep(5.94,5.995,edge)*(1.-fog);
    for(int i=0;i<7;i++){ vec4 d=uDr[i]; if(d.y<0.) continue; vec2 q=vW.xz-(d.xz+uKeyD.xz*d.y*0.18); float r=0.1+0.07*d.y;
      sh-=0.9*exp(-dot(q,q)/(r*r))/(1.+0.9*d.y); }
    float sc=texture2D(uScuff,(vW.xz+6.)/12.).r; sh-=0.3*sc; if(sc>0.08) line=min(lineAt(vL,N,vec3(0.,0.,1.),dist,0.),lineAt(vL,N,T,dist,0.));
  }
  else if(uMode>1.5&&uMode<2.5){     // walls and ceiling: the vacuum
    id=0.; T=vec3(0.,1.,0.); sh-=0.7*(1.-smoothstep(0.,0.03,vW.y))*(1.-fog);
  }
  else if(uMode>2.5&&uMode<3.5){     // grille cloth: a weave with a physical pitch; it shivers when the stack feeds back
    vec3 A=cross(vec3(0.,1.,0.),N); A=dot(A,A)<1e-4?vec3(1.,0.,0.):normalize(A);
    float s=dot(vL,A), t=vL.y; s+=uFb*0.004*sin(t*70.+uTime*36.);
    line=min(pitchLine(s,t,dist,0.0055),pitchLine(t,s,dist,0.0055));
    sh-=0.05*(vn(vec2(s,t)*9.)-0.5);
    float rd=length(vW-uFbC); if(uFb>0.25&&rd<uFbR&&fract(rd*14.-uTime*2.6)<0.22) acc=1.;   // the howl, as rings across the cloth
  }
  else if(uMode>3.5&&uMode<4.5){     // weathered wood: grain along the board, nail heads along its edges
    vec3 Tw=length(vT)>0.01?normalize(vT):vec3(0.,1.,0.); T=Tw;
    float a=uMover>0.5?vL.x:dot(vL,normalize(cross(N,Tw)+1e-5)), b=uMover>0.5?vL.y:dot(vL,Tw);
    sh+=0.12*(vn(vec2(a*55.,b*2.5))-0.5)-0.06*smoothstep(0.6,0.9,vn(vec2(a*8.,b*0.9)+5.));
    if(uBW>0.&&uMover>0.5&&abs(N.z)>0.5&&fract(b/0.085)<0.14&&abs(abs(a)-(uBW-0.013))<0.007){ id=7.; sh=0.12; }
  }
  else if(uMode>4.5&&uMode<5.5){     // a screen: off, the iMac's warm field, the Kinect's view, or another drone's lens
    id=14.; T=vec3(0.,1.,0.);
    vec3 Vd=normalize(uCamP-vW); float fres=pow(1.-max(dot(N,Vd),0.),2.);
    float mode=uScr<0.?(uWake>0.5?3.:1.):uScr;
    if(mode>2.5){   // the feed: a print inside the print
      vec4 f=texture2D(uFeed,vUv); sh=0.15+0.85*f.r; line=f.b; if(floor(f.g*16.)==13.) sh*=0.5;
    } else if(mode>1.5){   // the Kinect: drones in front of it, drawn as contours with its speckle inside
      vec2 px=vec2(1./96.,1./72.);
      float me=floor(texture2D(uKin,vUv).g*16.);
      float e=0., ea=0.; for(int k=0;k<4;k++){ vec2 o=k==0?vec2(px.x,0.):k==1?vec2(-px.x,0.):k==2?vec2(0.,px.y):vec2(0.,-px.y);
        float nb=floor(texture2D(uKin,vUv+o).g*16.); if((me==13.)!=(nb==13.)) e=1.; if(me!=nb) ea=1.; }
      sh=0.1+0.04*step(0.5,fract(vUv.y*36.))+fres*0.1;
      if(ea>0.5) sh=0.5;
      if(me==13.) sh=hash(floor(vUv*vec2(96.,72.))+floor(uTime*8.))>0.7?0.55:0.22;
      if(e>0.5) sh=0.95;
      line=0.5;
    } else if(mode>0.5){   // the iMac as the video shows it: a warm field with darker weather moving through it
      float g=vn(vUv*vec2(2.2,1.6)+vec2(uTime*0.01,0.))*0.6+vn(vUv*6.+3.)*0.4;
      sh=0.62+0.32*vUv.y+0.14*(g-0.5)-0.25*smoothstep(0.62,0.9,g);
    } else { sh=0.08+0.35*fres+0.05*(vn(vUv*7.)-0.5); id=7.; }
  }
  else if(uMode>5.5&&uMode<6.5){     // the clock's face: hour and minute ticks, typeset numerals
    vec2 p=vL.xy; float r=length(p); float a=atan(p.x,p.y);
    float m=abs(fract(a/(6.2831853/60.)+0.5)-0.5), hr=abs(fract(a/(6.2831853/12.)+0.5)-0.5);
    id=9.; sh=0.92;
    if(r>0.132&&r<0.145&&m<0.05) { id=7.; sh=0.1; }
    if(r>0.124&&r<0.145&&hr<0.035) { id=7.; sh=0.08; }
    float nm=texture2D(uNum,p/0.3+0.5).r; if(nm>0.5&&r<0.125) { id=7.; sh=0.08; }
    line=0.5;
  }
  else if(uMode>6.5&&uMode<7.5){     // the circuit board in the case: brown board, terminal strips, red wire everywhere
    vec2 p=vL.xy; id=11.; sh=0.42+0.1*(vn(p*30.)-0.5);
    float strip=step(abs(fract(p.y*7.+0.2)-0.5),0.07)*step(0.35,vn(vec2(p.x*9.,floor(p.y*7.+0.2))));
