<title>MZTV · BIT FIELD 045 · SITTERS</title>
<!--
  MZTV · BIT FIELD 045 · SITTERS
  A shelf of screen tests. On the left, one sitter is drawn in a locked-off black-and-white screen
  test over 15 minutes (30 sittings of 30 s): it begins as a rough draft and drifts toward a
  person of its own, coarse form first, while the scanner reviews every sitting (BUILD, ANALYZE,
  INTERPRET, RETURN). Detail is earned: each level becomes available as the portrait goes on, but
  is only drawn after a clean sitting (no fault above threshold); the worst faults are fixed first.
  When the portrait is done it is printed in colour and placed on the right, in the next cube of
  a white 3x3 shelf, where it floats and turns on its own. Its sweater, skin and hair bounce onto
  the walls of its own box. When the shelf is full the next sitter starts a new one, and the full
  shelf is archived in miniature along the top, so the whole progression stays on screen.

  Memory: every sitter is kept. From shelf 3 a new sitter descends from a composite of earlier
  ones, so families form across shelves. Shelf number unlocks asymmetry (2), quirks (2), lineage
  (3), caricature (4) and split faces (6); the screen-test look changes with every shelf.
  Sound: each filled cube holds a quiet voice from its sitter's note that swells as the face turns
  toward you; every placement lands as a thump and a chime into the echo.

  Faces: BIT FIELD 030 · SITTER's head, hair and clothes (Blender, Python, CC0 MakeHuman base mesh),
  loaded from ../bit-field-030-sitter/data/. Every feature is a live field of soft displacements.

  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?ff=H ?sit=SEC ?portrait=MIN
          ?look=gelatin|bit|silk|phosphor ?lite=N ?warm=0
  Keys:   I info · M mute · L next look
-->

'use strict';
/* ------------------------------------------------------------------ config */
const Q = new URLSearchParams(location.search);
const qn = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const fin = x => Number.isFinite(x);
const LOOKS = ['gelatin', 'bit', 'silk', 'phosphor'];
const CFG = {
  info: Q.get('info') !== '0', fresh: Q.get('fresh') === '1', audio: Q.get('audio') !== '0', warm: Q.get('warm') !== '0',
  seed: Math.floor(qn('seed', 45)), rate: clamp(qn('rate', 1), 0.05, 400), lines: clamp(Math.round(qn('lines', 360) / 4) * 4, 180, 1080),
  ff: clamp(qn('ff', 0), 0, 240), sit: clamp(qn('sit', 30), 5, 600), portrait: clamp(qn('portrait', 15), 1, 240), lite: clamp(qn('lite', 1), 0.02, 1),
  look: LOOKS.indexOf(Q.get('look')),

const SPP = () => Math.max(8, Math.round(CFG.portrait * 60 / CFG.sit));   // sittings per portrait
const STORE = 'mztv-bf045-sitters-v1';

const PIVOT = [0, 5.6, 0.1];     // the studio sitter sways about the neck
const HEADP = [0, 6.75, 0.45];   // a shelf sitter turns about the middle of the bust
/* ------------------------------------------------------------------ seeded rng */
function RNG(s) { this.s = (s >>> 0) || 1; }

/* ------------------------------------------------------------------ face space

  ['chin length',    [0.00, 6.30, 1.30], [0.35, 0.16, 0.40], [0.000,-0.030, 0.015], 0],

  ['cheek hollow',   [0.48, 6.72, 1.08], [0.20, 0.18, 0.26], [-0.015, 0.00,-0.030], 1],

  ['mouth width',    [0.20, 6.615,1.48], [0.08, 0.07, 0.10], [0.018, 0.000, 0.000], 1],

  ['folds',          [0.20, 6.72, 1.48], [0.04, 0.16, 0.08], [0.000, 0.000,-0.022], 1],
  ['jowls',          [0.42, 6.38, 1.12], [0.16, 0.12, 0.20], [0.010,-0.020, 0.010], 1],
  ['brow ridge',     [0.28, 7.50, 1.35], [0.30, 0.10, 0.25], [0.000,-0.012, 0.030], 1],
  ['brow height',    [0.30, 7.52, 1.30], [0.22, 0.10, 0.20], [0.000, 0.022, 0.000], 1],

  ['hooded lids',    [0.31, 7.43, 1.36], [0.20, 0.06, 0.12], [0.000,-0.010, 0.010], 1],
  ['skull width',    [0.78, 7.65, 0.35], [0.35, 0.55, 0.60], [0.060, 0.000, 0.000], 1],
  ['face width',     [0.72, 6.95, 0.60], [0.25, 0.35, 0.45], [0.035, 0.000, 0.000], 1],
  ['neck',           [0.42, 6.00, 0.40], [0.22, 0.35, 0.35], [0.040, 0.000, 0.000], 1],
  ['long face',      [0.00, 6.40, 1.20], [0.60, 0.40, 0.60], [0.000,-0.030, 0.000], 0],
  ['forehead',       [0.00, 7.90, 1.25], [0.50, 0.30, 0.40], [0.000, 0.000,-0.030], 0],
  ['cheek fat',      [0.50, 6.70, 1.05], [0.30, 0.30, 0.35], [0.020,-0.020, 0.025], 1],
];
const NF = F.length;
// detail level at which each feature starts to be drawn: the sitter learns coarse form first
const LEVEL = { 'skull width': 0, 'face width': 0, 'jaw width': 0, 'long face': 0, 'neck': 0, 'chin length': 0, 'forehead': 0,
  'cheekbones': 0.25, 'cheek fat': 0.25, 'cheek hollow': 0.3, 'nose length': 0.25, 'brow ridge': 0.3, 'brow height': 0.3, 'lips': 0.3, 'chin': 0.25, 'eye depth': 0.35,
  'nostrils': 0.5, 'nose bridge': 0.45, 'mouth width': 0.45, 'mouth corners': 0.55, 'folds': 0.5, 'jowls': 0.55, 'under eyes': 0.5, 'hooded lids': 0.6 };
// age writes itself into the face
const AGEF = { 'folds': 1.3, 'jowls': 1.3, 'under eyes': 1.1, 'hooded lids': 0.9, 'cheek hollow': 0.6, 'mouth corners': -0.7 };
const FLV = F.map(f => LEVEL[f[0]] || 0), FAG = F.map(f => AGEF[f[0]] || 0);
const DSCALE = 2.5;   // one gene step ≈ 0.5–1.5 cm: a different person, not a different expression
// expand to bump instances: [featureIndex, side(0 centre/L=+x, 1 R=-x)]
const BUMPS = [];
for (let i = 0; i < NF; i++) { BUMPS.push([i, 0]); if (F[i][4]) BUMPS.push([i, 1]); }
const NB = BUMPS.length;
// non-shape genes
const XG = ['lids', 'age', 'tone', 'grey', 'stubble', 'iris', 'brows', 'restless'];
const XR = { lids: [0, 0.32], age: [0, 1], tone: [0, 1], grey: [0, 1], stubble: [0, 1], iris: [0, 1], brows: [0.3, 1], restless: [0, 1] };
const HAIRS = ['pulled back', 'short', 'shaved'], CLOTHES = ['fleece', 'sweater'];

function zeroGenome() { const g = { L: new Array(NF).fill(0), R: new Array(NF).fill(0), x: {}, hair: 0, clothes: 0 }; for (const k of XG) g.x[k] = lerp(XR[k][0], XR[k][1], 0.35); return g; }
function cloneG(g) { return { L: g.L.slice(), R: g.R.slice(), x: Object.assign({}, g.x), hair: g.hair, clothes: g.clothes }; }
function mixG(a, b, t) { const g = cloneG(a); for (let i = 0; i < NF; i++) { g.L[i] = lerp(a.L[i], b.L[i], t); g.R[i] = lerp(a.R[i], b.R[i], t); } for (const k of XG) g.x[k] = lerp(a.x[k], b.x[k], t); return g; }
function okG(g) { if (!g || !g.L || !g.R || !g.x) return false; for (let i = 0; i < NF; i++) if (!fin(g.L[i]) || !fin(g.R[i])) return false; for (const k of XG) if (!fin(g.x[k])) return false; return true; }


/* ------------------------------------------------------------------ the sitters' colours: what each one wears, and what its box catches */
const CLOTH = [
  ['amber', [0.80, 0.50, 0.13]], ['oxblood', [0.52, 0.10, 0.11]], ['teal', [0.07, 0.42, 0.42]], ['cobalt', [0.12, 0.23, 0.60]],
  ['moss', [0.33, 0.43, 0.12]], ['rust', [0.70, 0.27, 0.09]], ['plum', [0.40, 0.15, 0.40]], ['mustard', [0.80, 0.68, 0.18]],
  ['tomato', [0.85, 0.24, 0.15]], ['sea', [0.18, 0.50, 0.58]], ['bone', [0.82, 0.77, 0.66]], ['ink', [0.09, 0.10, 0.14]],
];
const skinOf = g => { const t = g.x.tone; return [lerp(0.80, 0.38, t), lerp(0.60, 0.24, t), lerp(0.50, 0.17, t)]; };

/* ------------------------------------------------------------------ state */
let S = null;
function newState() {
  return {
    v: 1, seed: CFG.seed, rs: (CFG.seed * 2654435761) >>> 0, t: 0, k: 0,
    prev: zeroGenome(), cur: zeroGenome(), tgt: zeroGenome(), morph0: 0,
    event: 'first sitting', counts: { lineage: 0, caricatures: 0, splits: 0, unfinished: 0 },
    look: CFG.look >= 0 ? CFG.look : 0, lookPrev: 0, lookT0: -1e9,
    quirk: 'none', quirkEnd: 0, pal: [0, 0, 0, 0],
    person: 0, j: 0, dest: null, destFrom: null, parents: [], col: 0, kind: '',
    detailTarget: 0.1, detailNow: 0.1, detailEarned: 0.1, clean: 0, detailT: 0, committedK: -1, review: null,
    shelfNo: 1, shelf: new Array(9).fill(null), shelves: [], placedAt: -1e9, placedCube: -1, archivedAt: -1e9,
    log: [],
  };
}
const R = { s: 1, f() { const r = new RNG(this.s); const v = r.f(); this.s = r.s; return v; }, n() { const r = new RNG(this.s); const v = r.n(); this.s = r.s; return v; }, r(a, b) { return a + (b - a) * this.f(); } };
const H = () => S.t / 3600;
const SH = () => S.shelfNo;
const UNLOCK = { asym: 2, quirks: 2, lineage: 3, caricature: 4, split: 6 };
const pad = (n, w) => String(n).padStart(w, '0');
const allPlaced = () => S.shelves.flatMap(s => s.members).concat(S.shelf).filter(Boolean);

function randomPerson() {
  const g = zeroGenome(), spread = 0.85 + 0.5 * clamp((SH() - 1) / 8, 0, 1);
  for (let i = 0; i < NF; i++) { g.L[i] = clamp(R.n() * spread, -2.0, 2.0); g.R[i] = g.L[i]; }
  const age = R.f();
  g.x = { lids: R.r(0, 0.22), age, tone: R.f(), grey: clamp(age * 1.2 - 0.3 + R.n() * 0.12, 0, 1), stubble: R.f() < 0.45 ? R.r(0.35, 1) : R.r(0, 0.1),
    iris: R.f(), brows: R.r(0.45, 1), restless: R.f() };
  g.hair = Math.floor(R.f() * 3); g.clothes = R.f() < 0.5 ? 0 : 1;
  return g;
}
function pickColour() {
  const used = new Set(S.shelf.filter(Boolean).map(m => m.col)); let c = 0;
  for (let tries = 0; tries < 12; tries++) { c = Math.floor(R.f() * CLOTH.length); if (!used.has(c)) break; }
  return c;
}
// a new sitter sits down: a rough draft that drifts toward a person of its own
function newPortrait() {
  S.person++; S.j = 0; S.kind = '';
  S.dest = randomPerson();
  let ev = 'sitter ' + pad(S.person, 3) + ' sits down';
  if (SH() >= UNLOCK.split && R.f() < 0.12) { for (let i = 0; i < NF; i++) if (F[i][4]) S.dest.R[i] = clamp(-S.dest.L[i] + R.n() * 0.4, -2.4, 2.4); S.kind = 'split'; S.counts.splits++; ev += ' · the halves will disagree'; }
  else if (SH() >= UNLOCK.caricature && R.f() < 0.22) { const i = Math.floor(R.f() * NF), s = R.f() < 0.5 ? -1 : 1; S.dest.L[i] = S.dest.R[i] = s * R.r(2.3, 2.9); S.kind = 'caricature · ' + F[i][0]; S.counts.caricatures++; ev += ' · caricature of ' + F[i][0]; }
  let seed = zeroGenome(); S.parents = [];
  if (SH() >= UNLOCK.lineage) {
    const pool = allPlaced();
    if (pool.length >= 2) {
      const n = 2 + (R.f() < 0.4 ? 1 : 0), ps = [];
      for (let t = 0; t < 12 && ps.length < n; t++) { const m = pool[Math.floor(R.f() * pool.length)]; if (!ps.includes(m)) ps.push(m); }
      let c = cloneG(ps[0].g); for (let i = 1; i < ps.length; i++) c = mixG(c, ps[i].g, 1 / (i + 1));
      seed = mixG(seed, c, 0.8); S.dest = mixG(S.dest, c, 0.35); S.dest.hair = R.f() < 0.5 ? ps[0].g.hair : S.dest.hair;
      S.parents = ps.map(m => m.n); S.counts.lineage++; ev += ' · descends from ' + S.parents.map(n => pad(n, 3)).join(' + ');
    }
  }
  for (let i = 0; i < NF; i++) { seed.L[i] = clamp(seed.L[i] + R.n() * 0.15, -2.2, 2.2); seed.R[i] = seed.L[i]; }
  seed.hair = S.dest.hair; seed.clothes = S.dest.clothes;
  S.destFrom = cloneG(seed); S.col = pickColour();
  S.detailTarget = S.detailEarned = S.detailNow = 0.1; S.clean = 0;
  return { seed, ev };
}
function stepGenome(base) {
  const g = cloneG(base), n = SPP(), D = S.dest || zeroGenome();
  const pull = 1 - Math.pow(0.06, 1 / Math.max(2, n - 4));      // ~94% of the way by the last few sittings
  const sig = 0.05 + 0.04 * clamp((SH() - 1) / 6, 0, 1);          // the walk widens a little with every shelf
  const bound = 2.3 + 0.6 * clamp((SH() - 1) / 8, 0, 1);
  const asym = SH() < UNLOCK.asym ? 0 : 0.15 + 0.35 * clamp((SH() - UNLOCK.asym) / 8, 0, 1);
  for (let i = 0; i < NF; i++) {
    const shared = R.n() * sig;
    g.L[i] = clamp(g.L[i] + (D.L[i] - g.L[i]) * pull + shared + (F[i][4] ? R.n() * sig * asym : 0), -bound, bound);
    g.R[i] = F[i][4] ? clamp(g.R[i] + (D.R[i] - g.R[i]) * pull + shared + R.n() * sig * asym, -bound, bound) : g.L[i];
    if (F[i][4] && asym === 0 && S.kind !== 'split') g.R[i] = g.L[i] = (g.L[i] + g.R[i]) / 2;
  }
  for (const k of XG) { const [a, b] = XR[k]; g.x[k] = clamp(g.x[k] + R.n() * sig * 0.1 * (b - a) + (D.x[k] - g.x[k]) * pull, a, b); }

}
function journey() { if (!S.dest || !S.destFrom) return 0; let a = 0, b = 0; for (let i = 0; i < NF; i++) { a += Math.abs(S.cur.L[i] - S.dest.L[i]); b += Math.abs(S.destFrom.L[i] - S.dest.L[i]); } return clamp(1 - a / (b + 1e-6), 0, 1); }
const roundG = g => { const r = v => Math.round(v * 1000) / 1000, o = cloneG(g); o.L = o.L.map(r); o.R = o.R.map(r); for (const k of XG) o.x[k] = r(o.x[k]); return o; };
// the portrait is done: printed in colour and placed in the next cube. A full shelf is archived first.
function place() {
  let i = S.shelf.findIndex(m => !m);
  if (i < 0) {
    S.shelves.push({ no: S.shelfNo, members: S.shelf, at: S.t });
    if (S.shelves.length > 160) S.shelves.splice(0, S.shelves.length - 160);
    logLine('R', 'shelf ' + pad(S.shelfNo, 2) + ' complete · archived along the top · a new shelf begins', 'c');
    S.shelfNo++; S.shelf = new Array(9).fill(null); i = 0; S.archivedAt = S.t;
    if (CFG.look < 0) { S.lookPrev = S.look; S.look = (S.look + 1 + Math.floor(R.f() * 3)) % LOOKS.length; S.lookT0 = S.t; }
  }
  const d = clamp(S.detailNow, 0.1, 1);
  S.shelf[i] = { n: S.person, g: roundG(S.cur), d: Math.round(d * 1000) / 1000, col: S.col, yaw0: Math.round(R.r(0, 360)), spin: Math.round((R.f() < 0.5 ? -1 : 1) * R.r(5, 10) * 10) / 10,
    bob: Math.round(R.r(0, 628)) / 100, born: S.t, parents: S.parents.slice(), kind: S.kind };
  if (d < 0.95) S.counts.unfinished++;
  S.placedAt = S.t; S.placedCube = i;
  logLine('R', 'sitter ' + pad(S.person, 3) + ' placed · shelf ' + pad(S.shelfNo, 2) + ' cube ' + (i + 1) + ' · in ' + CLOTH[S.col][0] + ' · drawn at ' + Math.round(d * 100) + '%' + (d < 0.95 ? ' (unfinished)' : ''), 'c');
}
// detail levels: 0.10, 0.19 … 1.00. Each becomes available as the portrait goes on; the review decides when it is drawn.
const DSTEP = 0.09;
const levelOf = d => Math.round((d - 0.1) / DSTEP);
function cleanNeed() { return levelOf(S.detailEarned) + 1 >= 5 ? 2 : 1; }
function detailGoal() { return Math.min(S.detailTarget, S.detailEarned); }
function easeDetail() { const el = S.t - (fin(S.detailT) ? S.detailT : S.t); if (el > 0) S.detailNow += (detailGoal() - S.detailNow) * (1 - Math.exp(-el / 18)); S.detailT = S.t; }

function newSitting() {
  commitReview();
  S.k++; S.prev = cloneG(S.cur); S.morph0 = S.t; S.applied = '';
  const n = SPP();
  if (!S.dest || S.j >= n - 1) {
    if (S.dest) place();
    const p = newPortrait(); S.tgt = p.seed; S.event = p.ev;
  } else {
    S.j++;
    let g;
    if (S.j >= n - 1) { g = cloneG(S.cur); S.plan = []; S.event = 'final sitting · sitter ' + pad(S.person, 3) + ' holds still for the shelf'; }
    else { g = stepGenome(S.cur); if (S.plan && S.plan.length) applyPlan(g); S.event = 'drawing sitter ' + pad(S.person, 3) + ' · sitting ' + S.j + ' of ' + (n - 1); }
    if (!okG(g)) { g = cloneG(okG(S.destFrom) ? S.destFrom : zeroGenome()); S.event = 'regrown from memory'; }
    S.tgt = g;
  }

  const gg = S.tgt, f = rootFor(gg);
  setP(g.d1.frequency, f * 2, 3); setP(g.d2.frequency, f * 3 * (1 + 0.004 * (SH() >= UNLOCK.split ? 1 : 0)), 3);
  let asym = 0; for (let i = 0; i < NF; i++) if (F[i][4]) asym += Math.abs(gg.L[i] - gg.R[i]); asym /= NF;
  setP(g.dLP.frequency, clamp(260 + 220 * asym + 120 * gg.x.age, 200, 700), 2);
  setP(g.dG.gain, 0.03 + 0.012 * clamp(asym, 0, 1), 2);
  const inhale = clamp(PERF.breath, 0, 1); setP(g.bG.gain, S.quirk === 'still' ? 0 : 0.03 * inhale * inhale, 0.15); setP(g.bLP.frequency, 300 + 200 * inhale, 0.3);
  if (g.cubes) for (let i = 0; i < 9; i++) { const m = S.shelf[i], cu = g.cubes[i];
    if (!m) { setP(cu.v.gain, 0, 1.5); continue; }
    const ps = memberPose(m, i, S.t), face = Math.max(0, Math.cos(ps.yaw)), row = Math.floor(i / 3);
    setP(cu.o.frequency, clamp(rootFor(m.g) * [4, 6, 8][row], 60, 900), 2); setP(cu.v.gain, 0.0042 * ps.a * (0.3 + 0.7 * face * face), 0.3); }
}
function audioUnlock() { if (MUTE) return; if (!AU.ctx) { if (!AU.busy) { AU.busy = true; createContext().finally(() => { AU.busy = false; }); } } else if (AU.ctx.state !== 'running') AU.ctx.resume().catch(() => { }); }

addEventListener('pointerdown', audioUnlock);
addEventListener('keydown', e => {
  audioUnlock();
  const k = e.key.toLowerCase();
  if (k === 'i') { CFG.info = !CFG.info; info(); drawLog(); }
  if (k === 'm') { MUTE = !MUTE; if (AU.g) setP(AU.g.out.gain, MUTE ? 0 : 1, 0.2); }
  if (k === 'l' && S) { S.lookPrev = S.look; S.look = (S.look + 1) % LOOKS.length; S.lookT0 = S.t; }
});
setInterval(audioSchedule, 40); setInterval(audioWatch, 1000); setInterval(audioControl, 100);

/* ------------------------------------------------------------------ persistence */
function save() { try { if (S) localStorage.setItem(STORE, JSON.stringify({ S: Object.assign({}, S, { log: (S.log || []).slice(-30) }), R: R.s, BL: { next: BL.next - S.t }, savedAt: Date.now() })); } catch (e) { } }
const okM = m => !!m && okG(m.g) && fin(m.n) && fin(m.d) && fin(m.col) && m.col >= 0 && m.col < CLOTH.length && fin(m.born) && fin(m.spin) && fin(m.yaw0) && fin(m.bob);
function load() {
  try { const raw = localStorage.getItem(STORE); if (!raw) return false; const o = JSON.parse(raw);
    if (!o || !o.S || o.S.v !== 1 || !okG(o.S.cur) || !okG(o.S.tgt) || !okG(o.S.prev)) return false;
    S = o.S; R.s = o.R >>> 0 || 1;
    S.shelf = Array.isArray(S.shelf) && S.shelf.length === 9 ? S.shelf.map(m => okM(m) ? m : null) : new Array(9).fill(null);
    S.shelves = (Array.isArray(S.shelves) ? S.shelves : []).filter(s => s && Array.isArray(s.members) && s.members.length === 9).map(s => ({ no: s.no, at: s.at, members: s.members.map(m => okM(m) ? m : null) }));
    if (!okG(S.dest)) S.dest = null; if (!okG(S.destFrom)) S.destFrom = null;
    for (const k of ['detailNow', 'detailTarget', 'detailEarned']) if (!fin(S[k])) S[k] = 0.1;
    if (!fin(S.clean)) S.clean = 0; if (!fin(S.j)) S.j = 0; if (!fin(S.col) || !CLOTH[S.col]) S.col = 0; if (!Array.isArray(S.parents)) S.parents = [];
    if (!fin(S.shelfNo) || S.shelfNo < 1) S.shelfNo = 1; S.detailT = S.t; S.committedK = -1; S.log = S.log || [];
    return true; } catch (e) { return false; }
}
setInterval(save, 60000); addEventListener('beforeunload', save);

/* ------------------------------------------------------------------ boot */
function runTo(end) { let guard = 0; while (S.t < end && guard++ < 400000) { S.t = Math.min(end, (S.k + 1) * CFG.sit); advance(0); } S.morph0 = S.t - MORPH; S.prev = cloneG(S.tgt); S.cur = cloneG(S.tgt); S.detailNow = detailGoal(); S.detailT = S.t; }
const MZ = {
  force(op) { if (!S) return;
    if (op === 'sit') { S.t = (S.k + 1) * CFG.sit; advance(0); }
    else if (op === 'place') { S.j = SPP() - 1; S.t = (S.k + 1) * CFG.sit; advance(0); }
    else if (op === 'fill') { let g = 0; while (S.shelf.some(m => !m) && g++ < 12) { S.j = SPP() - 1; S.t = (S.k + 1) * CFG.sit; advance(0); } }
    else if (op === 'look') { S.lookPrev = S.look; S.look = (S.look + 1) % 4; S.lookT0 = S.t - 30; }
    else if (op === 'portrait') { runTo(S.t + (SPP() - S.j) * CFG.sit + 1); }
    else if (op === 'nan') { S.tgt.L[3] = NaN; }
  },
  state: () => S, perf: () => PERF, cfg: CFG, audio: () => AU, fr: () => FR,
};
window.MZ = MZ;
(async function boot() {
  resize();
  if (CFG.fresh) { try { localStorage.removeItem(STORE); } catch (e) { } }
  let fresh = false;
  if (!load()) { S = newState(); R.s = S.rs; fresh = true; S.t = 0; newSitting(); S.prev = cloneG(S.tgt); S.cur = cloneG(S.tgt); }
  try {
    const [meta, bin] = await Promise.all([fetch(DATA_URL + 'sitter.json').then(r => r.json()), fetch(DATA_URL + 'sitter.bin').then(r => r.arrayBuffer())]);
    DATA = decodeData(meta, bin);
    // pre-warm: it was running before you arrived (two sitters on the shelf, a third half drawn)
    if (fresh && CFG.warm && !CFG.ff) runTo(S.t + (2.5 * SPP()) * CFG.sit + 11);
    if (CFG.ff > 0) runTo(S.t + CFG.ff * 3600);
    initGL();
  } catch (err) { console.error(err); infoEl.textContent = 'SITTERS · could not load the sitter (' + err.message + ')'; }
  for (const m of S.shelf) if (m && S.t - m.born < 8) m.born = S.t - 8 - Math.random() * 20;   // arrivals during the warm-up are already settled
  info(); last = performance.now(); requestAnimationFrame(frame);
  if (!MUTE) audioUnlock();
})();
</script>
