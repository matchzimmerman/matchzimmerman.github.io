<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZTV · BIT FIELD 028 · TRACKSIDE · v1</title>
<!--
  MZTV · BIT FIELD 028 · TRACKSIDE
  A full Grand Prix (Silverstone 2025, 52 laps) replayed in real time from timing telemetry.
  Every orb is a car carrying its own data: position on the circuit, speed, rpm, gear, throttle,
  brake, DRS. A crew of five drone cameras (MZCAM, the camera system extracted from 48 PLANT)
  flies the circuit: trackside drones race ahead of the action to marks at key corners and
  whip-pan with the cars as they pass; a chase drone rides behind; a high drone orbits; a low
  drone waits on the straights. The director cuts only to a drone that is on its mark, and
  only on the 16th note.
  The live lens is the microphone: you hear every car from where the camera is.

  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?t=SEC ?capture=1 ?bay=0
  Keys:   I info · C camera bay · M mute
-->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f6efd9; --dim: rgba(246,239,217,0.62); --bg: rgba(11,20,51,0.78); --pink: #ff3d8b; --lime: #c4f24a; --line: rgba(246,239,217,0.22); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1433; }
  canvas { display: block; }
  #v { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #info { position: fixed; left: 1.6vh; bottom: 1.6vh; max-width: 46vw; font: 400 1.18vh/1.45 "JetBrains Mono", ui-monospace, monospace; color: var(--ink);
          background: var(--bg); border-left: 3px solid var(--pink); padding: 1vh 1.3vh; letter-spacing: 0.02em; }
  #info b { font-weight: 700; } #info .d { color: var(--dim); } #info .k { color: var(--lime); } #info .p { color: var(--pink); }
  #info .log { margin-top: 0.6vh; border-top: 1px solid var(--line); padding-top: 0.5vh; color: var(--dim); white-space: pre; }
  .mzcam-bay { position: fixed; right: 1.2vh; top: 1.2vh; width: 19vh; display: flex; flex-direction: column; gap: 0.7vh; }
  .mzcam-plan { width: 19vh; height: 19vh; border: 1px solid var(--line); }
  .mzcam-mon { position: relative; border: 1px solid var(--line); background: #0b1433; }
  .mzcam-mon canvas { width: 19vh; height: 10.69vh; image-rendering: pixelated; }
  .mzcam-mon.live { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
  .mzcam-lab { font: 400 0.95vh/1.3 "JetBrains Mono", monospace; color: var(--ink); background: var(--bg); padding: 0.25vh 0.5vh; border-left: 4px solid #f4dc2a; white-space: nowrap; overflow: hidden; }
  #load { position: fixed; left: 1.6vh; top: 1.6vh; font: 400 1.3vh "JetBrains Mono", monospace; color: var(--dim); }
</style>

<body>
<canvas id="v"></canvas>
<canvas id="hud"></canvas>
<div id="info"></div>
<div id="load">TRACKSIDE · loading telemetry</div>
<script src="../../lib/mzcam.js"></script>
<script>
'use strict';
const { V, add, sub, mul, dot, cross, len, norm, lerp, clamp, fin } = MZCam;

/* ------------------------------------------------------------------ config */
const Q = new URLSearchParams(location.search);
const qn = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const CFG = {
  info: Q.get('info') !== '0', fresh: Q.get('fresh') === '1', audio: Q.get('audio') !== '0',
  seed: qn('seed', 28), rate: clamp(qn('rate', 1), 0.05, 60), lines: clamp(Math.round(qn('lines', 540)), 180, 1080),
  t: Q.has('t') ? qn('t', 0) : null, capture: Q.get('capture') === '1', bay: Q.get('bay') !== '0',
};
const STORE = 'mztv-bf028-trackside-v1';
const GAP = 90; // seconds of empty circuit between runs of the race

/* ------------------------------------------------------------------ palette (inks for the print pass) */
const INK = {
  night: '#0b1433', ground: '#14245a', grid: '#22398a', track: '#3557c4', sky: '#2a3f94', haze: '#6f86e6',
  cream: '#f6efd9', pink: '#ff3d8b', coral: '#ff6a3d', lime: '#c4f24a', yellow: '#f4dc2a',
};
const INKS = Object.values(INK);
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

/* ------------------------------------------------------------------ seeded random */
let rs = (CFG.seed * 2654435761) >>> 0;
const rnd = () => { rs ^= rs << 13; rs >>>= 0; rs ^= rs >> 17; rs ^= rs << 5; rs >>>= 0; return rs / 4294967296; };
const hrand = (a, b) => { let h = (a * 374761393 + b * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

/* ------------------------------------------------------------------ memory */
let MEM = { v: 1, epoch: 0, run: 1, lastRun: -1, marks: {}, log: [] };
try { if (!CFG.fresh) { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.v === 1) MEM = Object.assign(MEM, s); } } catch (e) {}
function save() { if (CFG.t !== null || CFG.capture) return; try { localStorage.setItem(STORE, JSON.stringify(MEM)); } catch (e) {} }
function logLine(s) { MEM.log.unshift(`${fmtClock()} ${s}`); MEM.log.length = Math.min(MEM.log.length, 40); }

/* ------------------------------------------------------------------ race data */
let R = null; // {meta, cars, L, step, cx, cz, tx, tz, curv, n}
async function loadRace() {
  const [meta, bin] = await Promise.all([fetch('data/race.json').then(r => r.json()), fetch('data/race.bin').then(r => r.arrayBuffer())]);
  const N = meta.n, T = meta.track, n = T.c.length, L = T.len, step = T.step;
  const cx = new Float32Array(n), cz = new Float32Array(n), tx = new Float32Array(n), tz = new Float32Array(n), curv = new Float32Array(n);
  for (let i = 0; i < n; i++) { cx[i] = T.c[i][0]; cz[i] = T.c[i][2]; }
  for (let i = 0; i < n; i++) { const a = (i - 2 + n) % n, b = (i + 2) % n; const dx = cx[b] - cx[a], dz = cz[b] - cz[a], l = Math.hypot(dx, dz) || 1; tx[i] = dx / l; tz[i] = dz / l; }
  for (let i = 0; i < n; i++) { const a = (i - 8 + n) % n, b = (i + 8) % n; curv[i] = (tx[a] * tz[b] - tz[a] * tx[b]) / (16 * step); } // signed 1/radius
  const cars = meta.cars.map((c, ci) => {
    const o = c.off, dS = new Uint16Array(bin, o, N), lat = new Int8Array(bin, o + 2 * N, N);
    const spd = new Uint8Array(bin, o + 3 * N, N), rpm = new Uint8Array(bin, o + 4 * N, N), thr = new Uint8Array(bin, o + 5 * N, N), flg = new Uint8Array(bin, o + 6 * N, N);
    const S = new Float32Array(N); let acc = c.base;
    for (let k = 0; k < N; k++) { if (c.first !== null && k >= c.first && k <= c.last) acc += (k === c.first ? 0 : dS[k]); S[k] = acc / 10; }
    if (c.first !== null) for (let k = 0; k < c.first; k++) S[k] = S[c.first];
    if (c.last !== null) for (let k = c.last + 1; k < N; k++) S[k] = S[c.last];
    return { i: ci, code: c.code, num: c.num, first: c.first, last: c.last, S, lat, spd, rpm, thr, flg, pits: c.pits,
             st: { vis: 0, S: 0, s: 0, lat: 0, v: 0, rpm: 0, thr: 0, brake: 0, drs: 0, gear: 0, pos: V(), dir: V(1, 0, 0), pit: false, live: false, lap: 0 } };
  });
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; for (let i = 0; i < n; i++) { x0 = Math.min(x0, cx[i]); x1 = Math.max(x1, cx[i]); z0 = Math.min(z0, cz[i]); z1 = Math.max(z1, cz[i]); }
  R = { meta, cars, L, step, n, cx, cz, tx, tz, curv, N, hz: meta.hz, dur: meta.dur, bounds: { x0, x1, z0, z1 } };
}
// centerline sample at lap distance s (metres)
function trackAt(s) {
  const L = R.L, u = (((s % L) + L) % L) / R.step, i = Math.floor(u) % R.n, j = (i + 1) % R.n, k = u - Math.floor(u);
  const tx = lerp(R.tx[i], R.tx[j], k), tz = lerp(R.tz[i], R.tz[j], k), tl = Math.hypot(tx, tz) || 1;
  return { x: lerp(R.cx[i], R.cx[j], k), z: lerp(R.cz[i], R.cz[j], k), tx: tx / tl, tz: tz / tl, i };
}
const worldAt = (s, lat, y = 0) => { const t = trackAt(s); return V(t.x - t.tz * lat, y, t.z + t.tx * lat); };

/* ------------------------------------------------------------------ race clock */
const CYCLE = () => R.dur + GAP;
let CLOCK = { tau: 0, run: 1 };
let virtualNow = Date.now() / 1000; // capture mode wall clock (s)
const wallS = () => (CFG.capture ? virtualNow : Date.now() / 1000);
function initClock() {
  if (CFG.t !== null) { MEM.epoch = wallS() - CFG.t / CFG.rate; return; }
  if (!MEM.epoch || CFG.fresh) { MEM.epoch = wallS() - (R.meta.lightsOut - 12) / CFG.rate; MEM.run = 1; }
}
function tickClock() {
  const raw = (wallS() - MEM.epoch) * CFG.rate, c = CYCLE();
  const run = Math.floor(raw / c), tau = raw - run * c;
  CLOCK.tau = tau; CLOCK.cycleRun = run;
  if (CFG.t === null && run !== MEM.lastRun) { if (MEM.lastRun >= 0 && run > MEM.lastRun) { MEM.run += run - MEM.lastRun; logLine(`RUN ${MEM.run} · the grid forms again`); } MEM.lastRun = run; }
}
const fmtClock = () => { if (!R) return '--:--'; const t = CLOCK.tau - R.meta.lightsOut, s = Math.abs(Math.floor(t)); return `${t < 0 ? '-' : ''}${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

/* ------------------------------------------------------------------ car state */
function cr(a, b, c, d, k) { const k2 = k * k, k3 = k2 * k; return 0.5 * (2 * b + (-a + c) * k + (2 * a - 5 * b + 4 * c - d) * k2 + (-a + 3 * b - 3 * c + d) * k3); }
function sampleS(car, tau) {
  const N = R.N, u = clamp(tau * R.hz, 0, N - 1.001), i = Math.floor(u), k = u - i;
  const g = j => car.S[clamp(j, 0, N - 1)];
  return cr(g(i - 1), g(i), g(i + 1), g(i + 2), k);
}
function sampleLat(car, tau) {
  const N = R.N, u = clamp(tau * R.hz, 0, N - 1.001), i = Math.floor(u), k = u - i;
  const g = j => car.lat[clamp(j, car.first ?? 0, car.last ?? N - 1)] / 4;
  return cr(g(i - 1), g(i), g(i + 1), g(i + 2), k);
}
const ORB = 1.7; // orb radius, metres
function updateCars(tau) {
  const N = R.N, idx = tau * R.hz;
  for (const car of R.cars) {
    const st = car.st;
    if (car.first === null) { st.vis = 0; st.live = false; continue; }
    const i = Math.floor(idx);
    // on the grid before their first sample only if that is lights out; gone 8 s after their last
    const pre = i < car.first, post = i > car.last;
    let vis = 1;
    if (pre) vis = car.first <= R.meta.lightsOut * R.hz + 6 && tau > 2 ? 1 : 0;
    if (post) vis = clamp(1 - (idx - car.last) / (8 * R.hz), 0, 1);
    if (tau > R.dur) vis = 0;
    st.vis = vis; st.live = vis > 0 && !post; st.grid = pre;
    if (vis <= 0) continue;
    const k = clamp(i, 0, N - 1);
    const S = sampleS(car, tau), S2 = sampleS(car, tau + 0.1);
    st.S = S; st.lap = Math.max(1, Math.floor(S / R.L) + 1);
    st.lat = sampleLat(car, tau); st.pit = Math.abs(st.lat) > 9;
    const has = st.live && !pre;
    st.v = has ? Math.max(0, (S2 - S) / 0.1) : 0;
    st.rpm = has ? car.rpm[k] * 60 : pre ? 4200 : 0; st.thr = has ? car.thr[k] : 0;
    const f = car.flg[k]; st.brake = has && (f & 1) ? 1 : 0; st.drs = has && (f & 2) ? 1 : 0; st.gear = has ? Math.min(8, f >> 4) : 0;
    const p0 = worldAt(S, st.lat, ORB), p1 = worldAt(S + 2, sampleLat(car, tau + 0.05), ORB);
    st.pos = p0; st.dir = norm(sub(p1, p0));
    st.vel = mul(st.dir, st.v);
  }
}
function running() { return R.cars.filter(c => c.st.live && c.st.vis > 0.5); }
function order() { return running().slice().sort((a, b) => b.st.S - a.st.S); }

/* ------------------------------------------------------------------ race control: flags, weather */
function flagAt(tau) {
  let f = 'GREEN', drs = false;
  for (const e of R.meta.events) {
    if (e[0] > tau) break;
    const m = e[2];
    if (m.includes('VIRTUAL SAFETY CAR DEPLOYED')) f = 'VSC';
    else if (m.includes('SAFETY CAR DEPLOYED')) f = 'SC';
    else if (m.includes('TRACK CLEAR') || m.includes('ENDING') || m.includes('IN THIS LAP')) f = m.includes('TRACK CLEAR') ? 'GREEN' : f + ' IN';
    else if (m.includes('DRS ENABLED')) drs = true; else if (m.includes('DRS DISABLED')) drs = false;
    else if (m.includes('CHEQUERED')) f = 'CHEQUERED';
  }
  if (tau < R.meta.lightsOut) f = 'GRID'; if (tau > R.dur) f = 'EMPTY';
  return { f, drs };
}
function weatherAt(tau) { let w = R.meta.weather[0]; for (const x of R.meta.weather) { if (x[0] > tau) break; w = x; } return { air: w[1], hum: w[2], rain: w[3], wind: w[4], dir: w[5] }; }

/* ------------------------------------------------------------------ key points on the circuit */
let KP = [];
function buildKeyPoints() {
  const L = R.L, kps = [];
  const clearOfTrack = (p, sOwn) => { // a mark must not sit on another part of the track
    for (let i = 0; i < R.n; i += 2) { const s = i * R.step, ds = Math.abs((((s - sOwn) % L) + L * 1.5) % L - L / 2); if (ds < 120) continue;
      if (Math.hypot(R.cx[i] - p.x, R.cz[i] - p.z) < 22) return false; }
    return true;
  };
  const markFor = (s, side, dist, h) => { const t = trackAt(s); return V(t.x - t.tz * dist * side, h, t.z + t.tx * dist * side); };
  for (const c of R.meta.track.corners) {
    const s = c.d, i = Math.floor(((s % L) + L) % L / R.step) % R.n, k = R.curv[i];
    const outside = k > 0 ? -1 : 1; // lateral side away from the centre of the turn
    const variants = [];
    for (const [side, dist, h, kind] of [[outside, 34, 9, 'OUTSIDE'], [-outside, 24, 4, 'APEX'], [outside, 60, 22, 'HIGH']]) {
      for (const sOff of [-30, 0, 30]) { const p = markFor(s + sOff, side, dist, h); if (clearOfTrack(p, s)) { variants.push({ pos: p, kind, look: worldAt(s, 0, 0.5) }); break; } }
    }
    if (variants.length) kps.push({ id: 'T' + c.n, s, kind: 'corner', variants });
  }
  // straights: long runs of low curvature
  let run = []; const straights = [];
  for (let j = 0; j < R.n * 1.1; j++) { const i = j % R.n; if (Math.abs(R.curv[i]) < 1 / 900) run.push(j); else { if (run.length * R.step > 380) straights.push(run.slice()); run = []; } }
  straights.forEach((rn, q) => {
    const s = rn[Math.floor(rn.length * 0.62)] * R.step, variants = [];
    for (const side of [1, -1]) { const p = markFor(s, side, 11, 1.4); if (clearOfTrack(p, s)) variants.push({ pos: p, kind: 'LOW', look: worldAt(s, 0, 0.5) }); }
    if (variants.length && !kps.some(k => k.kind === 'straight' && Math.abs(k.s - s) < 300)) kps.push({ id: 'S' + (q + 1), s: s % L, kind: 'straight', variants });
  });
  KP = kps;
}
const markScore = kp => (MEM.marks[kp.id] || 0);

/* ------------------------------------------------------------------ crew (MZCAM) + producer */
let crew, bay, PROD;
const ROLE_COL = { track: '#f4dc2a', low: '#f4dc2a', chase: '#f4dc2a', high: '#f4dc2a' };
function initCrew() {
  crew = new MZCam.Crew({
    drones: [{ name: 'CAM 1', role: 'track' }, { name: 'CAM 2', role: 'track' }, { name: 'CAM 3', role: 'low' }, { name: 'CAM 4', role: 'chase' }, { name: 'CAM 5', role: 'high' }].map(d => ({ ...d, col: INK.yellow })),
    speed: 150, accel: 90, cruise: 45, minAlt: 1, arrive: 2, size: 2.2, tallyCol: INK.pink,
    gate: t => AU.gate(t),
    onCut: (from, to) => { PROD.lastRole[to.role] = crew.now; AU.onCut(); },
  });
  PROD = { target: null, since: -1e9, lastRole: {}, overtakes: [], lastOrder: null, battle: null, story: '' };
  if (CFG.bay) {
    bay = new MZCam.Bay(crew, { parent: document.body, w: 192, h: 108, planW: 300, planH: 300, bounds: R.bounds, every: 2,
      render: (ctx, w, h, P, viewer) => renderView(ctx, w, h, P, viewer, true), planBg: drawPlanBg });
  }
}
const carById = i => (i == null ? null : R.cars[i]);
function tgtCar() { const c = carById(PROD.target); return c && c.st.vis > 0.5 ? c : null; }
const nextAbs = (S, s) => S + (((s - S) % R.L) + R.L) % R.L;

function pickTarget(t, force) {
  const ord = order().filter(c => !c.st.pit);
  if (!ord.length) { PROD.target = null; return; }
  const cur = tgtCar();
  const recentOT = PROD.overtakes.find(o => t - o.t < 25 && R.cars[o.by].st.live && !R.cars[o.by].st.pit);
  if (!force && cur && !cur.st.pit && t - PROD.since < 40 && !(recentOT && recentOT.by !== cur.i && t - recentOT.t < 3)) return;
  let pick = null, story = '';
  if (recentOT) { pick = R.cars[recentOT.by]; story = `#${pick.num} just went through`; }
  if (!pick) { // closest battle near the front
    let best = null;
    for (let q = 1; q < Math.min(ord.length, 12); q++) { const a = ord[q - 1], b = ord[q]; const gap = (a.st.S - b.st.S) / Math.max(20, b.st.v); if (gap < 1.1 && (!best || q + gap * 4 < best.sc)) best = { sc: q + gap * 4, car: b, front: a, gap }; }
    if (best && hrand(Math.floor(t / 40), 3) < 0.8) { pick = best.car; story = `#${best.car.num} hunting #${best.front.num} · ${best.gap.toFixed(2)}s`; }
  }
  if (!pick) { const r = hrand(Math.floor(t / 40), 7); pick = r < 0.55 ? ord[0] : ord[Math.floor(hrand(Math.floor(t / 40), 9) * ord.length)]; story = pick === ord[0] ? `#${pick.num} leads` : `#${pick.num} · P${ord.indexOf(pick) + 1}`; }
  if (!cur || pick.i !== cur.i) { PROD.target = pick.i; PROD.since = t; PROD.story = story; logLine(`FOLLOW ${story}`); }
  else PROD.story = story;
}

// --- shots ---
function trackShot(kp, variant, carI) {
  const car = R.cars[carI], startS = car.st.S;
  const sAbs = nextAbs(startS + 25, kp.s);
  const sh = {
    kind: kp.kind === 'straight' ? 'low' : 'track', kp, car: carI, sAbs, mark: { pos: variant.pos },
    label: `${kp.kind === 'straight' ? 'LOW · STRAIGHT ' + kp.id.slice(1) : 'TRACKSIDE ' + kp.id} · ${variant.kind}`,
    pan: variant.kind === 'LOW' ? 11 : variant.kind === 'APEX' ? 9 : 7, minHold: 2.2, maxHold: 11, passed: false,
    eta() { const c = car.st; return c.vis > 0.5 && c.live ? (sAbs - c.S) / Math.max(12, c.v) : 1e9; },
    aim(t, d) {
      const c = car.st;
      const entry = worldAt(kp.s - 110, 0, 1);
      const dist = c.vis > 0.5 ? len(sub(c.pos, d.pos)) : 1e9;
      const look = dist < 420 ? add(c.pos, mul(c.vel || V(), 0.06)) : entry;
      const D = len(sub(look, d.pos)), frame = variant.kind === 'LOW' ? 30 : variant.kind === 'APEX' ? 16 : 28;
      return { look, fov: clamp(2 * Math.atan(frame / Math.max(1, D)) * 180 / Math.PI, variant.kind === 'LOW' ? 34 : 7, variant.kind === 'LOW' ? 62 : 48) };
    },
    win: variant.kind === 'LOW' ? 2.6 : 4.2,
    ready() { const e = this.eta(); return e > 0.5 && e < this.win; },
    want() { const e = this.eta(); return e < this.win && e > 0.5 ? 5 : 0.2; },
    done(t, d, cr) { const c = car.st; if (c.vis < 0.5 || !c.live) return true; if (c.S > sAbs + 140) { if (!this.passed) { this.passed = true; } return true; } return this.eta() > 40; },
    onAir() { MEM.marks[kp.id] = (MEM.marks[kp.id] || 0) + 1; },
  };
  return sh;
}
function chaseShot(carI) {
  const car = R.cars[carI], side = hrand(carI, Math.floor(crew.now / 30)) < 0.5 ? -1 : 1;
  return {
    kind: 'chase', car: carI, label: `CHASE · #${car.num}`, pan: 6, minHold: 4, maxHold: 13,
    pose(t) { const c = car.st; if (c.vis < 0.3) return null; const n = V(-c.dir.z, 0, c.dir.x); return { pos: add(c.pos, add(mul(c.dir, -26), add(mul(n, side * 6), V(0, 8, 0)))) }; },
    aim() { const c = car.st; return { look: add(c.pos, mul(c.dir, 25)), fov: 42 }; },
    want() { const l = PROD.lastRole.chase || -1e9; return car.st.live ? (crew.now - l < 10 ? 0.8 : 2) : 0; },
    done() { return car.i !== PROD.target || car.st.vis < 0.5; },
  };
}
function highShot(carI) {
  const car = R.cars[carI], a0 = hrand(carI, 11) * 6.283, dir = hrand(carI, 12) < 0.5 ? -1 : 1;
  return {
    kind: 'high', car: carI, label: `HIGH · #${car.num}`, pan: 1.6, minHold: 6, maxHold: 16,
    pose(t) { const c = car.st; if (c.vis < 0.3) return null; const a = a0 + dir * t * 0.05; return { pos: V(c.pos.x + Math.cos(a) * 240, 150, c.pos.z + Math.sin(a) * 240) }; },

function produce(t) {
  const tc = tgtCar();
  for (const d of crew.drones) {
    if (d.id === crew.live && d.shot && !crew._done(d)) continue;
    const isDone = !d.shot || crew._done(d);
    if (!isDone) continue;
    if (d.id === crew.live) continue; // the live shot finishes on air; it is replaced after the cut
    if (!tc) { // empty circuit or nothing worth following: survey
      if (d.role === 'high') crew.assign(d, highSurvey());
      else { const kp = KP[Math.floor(hrand(d.id + 7 * MEM.run, Math.floor(t / 20)) * KP.length)]; crew.assign(d, surveyShot(kp, kp.variants[0])); }
      continue;
    }
    if (d.role === 'chase') { crew.assign(d, chaseShot(tc.i)); continue; }
    if (d.role === 'high') { crew.assign(d, highShot(tc.i)); continue; }
    // trackside / low: race ahead of the target to a key point it will reach after the drone can get there
    const want = d.role === 'low' ? 'straight' : 'corner';
    const taken = new Set(crew.drones.filter(o => o !== d && o.shot && o.shot.kp).map(o => o.shot.kp.id));
    let best = null;
    for (const kp of KP) {

      const fly = len(sub(v.pos, d.pos)) / (crew.o.speed * 0.7) + 2.5;

      const sc = (1 + Math.log1p(markScore(kp)) * 0.35) / (1 + eta / 12) * (0.75 + 0.5 * hrand(kp.s | 0, Math.floor(t)));
      if (!best || sc > best.sc) best = { sc, kp, v };

    if (best) crew.assign(d, trackShot(best.kp, best.v, tc.i));
    else if (!d.shot) { const kp = KP.find(k => k.kind === want) || KP[0]; crew.assign(d, surveyShot(kp, kp.variants[0])); }

}

    const prev = new Map(PROD.lastOrder.map((id, q) => [id, q]));

  for (const d of crew.drones) { const g = crew._goal(d, 0); if (g) { d.pos = g.pos; d.arrivedAt = 0; d.vel = V(); } }
  for (let k = 0; k < 30; k++) { crew.update(1 / 30, k / 30); }
  const start = crew.drones.find(d => d.role === 'chase' && crew.ready(d)) || crew.drones.find(d => crew.ready(d)); if (start) crew.cutTo(start);
  simT = 1; logLine(MEM.log.length ? `SOURCE RELOADED · resumed at ${fmtClock()}` : `RUN ${MEM.run} · crew on the circuit · ${KP.length} key points`);
  if (CFG.audio) await buildAudio();
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'i') { CFG.info = !CFG.info; updateInfo(); }
    else if (k === 'c' && bay) bay.show(!bay.on);
    else if (k === 'm') { AU.muted = !AU.muted; if (AU.N) setP(AU.N.master, AU.N.master.gain, AU.muted ? 0 : 0.62, 'mg', 0.1); }
  });
  addEventListener('pointerdown', () => { if (AU.ac && AU.ac.state === 'suspended') AU.ac.resume(); if (CFG.audio && !AU.ac) buildAudio(); });
  addEventListener('beforeunload', save);
  updateInfo();
  if (CFG.capture) {
    window.MZ = { tick(dt = 1 / 30) { virtualNow += dt; step(dt); draw(); updateInfo(); }, crew, R, CLOCK, AU, PROD, KP, MEM };
  } else {
    window.MZ = { crew, R, CLOCK, AU, PROD, KP, MEM, cut: i => crew.cutTo(crew.drones[i]) };
    requestAnimationFrame(loop);
  }
}
boot().catch(e => { console.error(e); const l = document.getElementById('load'); if (l) l.textContent = 'TRACKSIDE · telemetry failed to load · retrying'; setTimeout(() => location.reload(), 15000); });
</script>
