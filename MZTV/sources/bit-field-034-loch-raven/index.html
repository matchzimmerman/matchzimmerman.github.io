<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Loch Raven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · LOCH RAVEN — surface-anchored six-ink hydraulic engraving */
:root { --ink:#1c2b36; --paper:#ece4cd; --hot:#b87454; --deep:#3c5162; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q=new URLSearchParams(location.search);
const CAPTURE=Q.get('capture')==='1', RATE=Math.max(0.01,+(Q.get('rate')||1));
const LINES=+(Q.get('lines')||(innerWidth<700?480:720)), AUDIO_WANTED=Q.get('audio')!=='0';
let INFO=Q.get('info')!=='0'; const SEED=+(Q.get('seed')||1), LIVE_WX=Q.get('live')!=='0';
const KEY='mzworld-loch-raven-v1'+(Q.has('seed')?'-s'+SEED:'');
if(Q.get('fresh')==='1'){try{localStorage.removeItem(KEY)}catch(e){}}
const LAT=39.43038,LON=-76.54358,TAU=Math.PI*2,D2R=Math.PI/180;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(SEED*7919+Date.now()%100000),rr=(a,b)=>a+(b-a)*rnd();

/* ====================================================================== clock */
const eastern=new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function localParts(ms){const str=eastern.format(new Date(ms)),[h,m,sec]=str.split(':').map(Number);return {h,m,sec,str,hour:h+m/60+sec/3600}}
let simMs=Date.now();
if(Q.has('hour')){const want=+Q.get('hour'),cur=localParts(simMs).hour;simMs+=(((want-cur)%24+24)%24)*3600e3}
if(Q.has('ff'))simMs+=(+Q.get('ff'))*60e3;
let simT=0;

/* ====================================================================== noise + terrain (sculptural, NOT surveyed DEM) */
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+104729;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}
function terrainH(x,z){
 const bank=smoothstep(94,250,Math.abs(x))*52;
 const woods=7*fbm(x*.013+9,z*.011+3);
 const upstream=z>13?-9:-1;
 const valley=2+bank+woods+upstream+0.012*Math.abs(z);
 return valley;
}

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;               // 0 new, π full
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)) };
}
// World axes: +x crest direction, +z upstream, -z downstream; artistic local frame
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); }; // (x,z) travel for a "from" bearing
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
 {name:'LOCH RAVEN SLATE',c:['#1c2b36','#3c5162','#477b76','#b87454','#cbbf96','#ece4cd']},
 {name:'SPILLWAY LIMESTONE',c:['#24323e','#4b626c','#729a93','#b16f5e','#dfc88c','#f0e7d6']},
 {name:'WARREN WATERLINE',c:['#223340','#385561','#6e9690','#b96654','#d7ba82','#eee5cf']},
 {name:'OCTOBER CANOPY',c:['#2a303c','#536575','#718a67','#bd6849','#d6ad6e','#f2e5cb']},
 {name:'SIGNAL FLARE',c:['#24123a','#5b3fd1','#6fd3c1','#ff7a8a','#ffd24a','#fbf3e4']},
 {name:'PISTACHIO NIGHT',c:['#10202b','#1f4a6e','#b6d97a','#ff5a7a','#f9e7b0','#eef4ea']},
 {name:'ULTRAMARINE',c:['#0c1440','#1f3bb3','#44b8e8','#ff6a1a','#ffd0a1','#fff7ec']},
 {name:'GUNPOWDER FOG',c:['#292c35','#48565d','#73918f','#b77b64','#b7b099','#e9e2d8']}
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky   */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun   */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 sea   */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam  */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 cliff */ [INK, DEEP, SEA, 1.0, 0], /* 5 grass */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 6 wood  */ [INK, DEEP, PAPER, 1.0, 0], /* 7 dark  */ [INK, INK, DEEP, 0.3, 0], /* 8 fabric*/ [INK, INK, DEEP, 1.0, 0],
  /* 9 white */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 path  */ [INK, INK, HOT, 0.6, 0], /*11 autumn*/ [INK, SEA, GLOW, 0.8, 0],
  /*12 path  */ [DEEP, GLOW, PAPER, 0.8, 0], /*13 cloud */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon  */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp  */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF=()=>({
 v:1,born:Date.now(),epoch:1,epochStart:0,epochLen:rr(50,95)*60,tension:0,colorway:0,cwVisits:[1,0,0,0,0,0,0,0],
 grammar:{period:7.2,dith:.12,wob:7,outline:1,hatch:1,angBias:0},center:38,
 uncanny:{next:rr(6,12)*60,counts:{},last:{},mem:{}},
 rainStore:.35,stageTrend:0,stageLast:21.8,inspections:0,inspected:{},log:[],runSec:0
});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)S=Object.assign(DEF(),o)}}catch(e){}
const T0=S.runSec||0;simT=T0;
function save(){try{S.runSec=simT;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function logEv(text){S.log.unshift({t:localParts(simMs).str,text});if(S.log.length>40)S.log.length=40}
if(!S.log.length)logEv('the water and concrete woke for the first time');
else logEv('Loch Raven resumed · epoch '+S.epoch);

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.5, 40000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float screenAngle(vec3 w, vec3 T){
  vec4 a=uVP*vec4(w,1.); vec4 b=uVP*vec4(w+T,1.);
  vec2 d=b.xy/max(b.w,1e-3)-a.xy/max(a.w,1e-3); d.x*=uAspect;
  float ang=atan(d.y,d.x); if(ang<0.) ang+=3.14159265; return ang/3.14159265; }
uniform float uPerPx,uWobPx,uPxK;
float lineAt(vec3 P,vec3 N,vec3 T,float dist,float extra){
  vec3 A=cross(N,T);
  if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.));
  if(dot(A,A)<1e-6) A=vec3(1.,0.,0.);
  A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  float per=max(.0002,uPerPx*max(dist,.01)*uPxK);
  float L=log2(per);
  float f=smoothstep(0.,1.,fract(L)),p0=exp2(floor(L)),p1=p0*2.;
  float s=dot(P,A), t=dot(P,B);
  float w=uWobPx/max(uPerPx,.1)*1.35;
  float l0=cos((s+(vn(vec2(s,t)/(p0*7.)+3.1)-.5)*w*p0+extra)*6.2831853/p0);
  float l1=cos((s+(vn(vec2(s,t)/(p1*7.)+3.1)-.5)*w*p1+extra)*6.2831853/p1);
  return .5+.5*mix(l0,l1,f);
}
vec4 pack(float sh,float id,float line,float acc){
 return vec4(clamp(sh,0.,1.),(id+0.5)/16.,clamp(line,0.,1.),acc);
}
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 1600 }, uFogShade: { value: 0.6 },
  uBreath: { value: 0 }, uDay: { value: 1 }, uKeyUp: { value: 1 },
  uPerPx: { value: 7.2 }, uWobPx: { value: 8 }, uPxK: { value: .001 },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uBreathOn, uCloth, uClothH, uWalk, uMove; uniform vec3 uWindL;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying float vC;
void main(){
  vC=0.;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  if(uCloth>0.5&&uCloth<1.5){   // the dress: folds that deepen toward the hem, pushed by wind and by walking
    float t=1.-clamp(lp.y/uClothH,0.,1.); float a=atan(lp.x,lp.z); float fl=t*t;
    vec2 rd=normalize(lp.xz+vec2(1e-4));
    float fold=0.07*t*sin(a*9.+lp.y*1.3+sin(uTime*0.7+a)*0.8);
    float rip=0.045*sin(lp.y*5.5-uTime*2.2+a*3.)+0.035*sin(lp.y*2.1-uTime*1.3+a*5.+1.);
    lp.xz+=rd*(fold+rip*fl*(0.7+uMove)); vC=fold*4.5+rip*2.;
    lp.xz+=uWindL.xz*fl*0.42;
    lp.z-=uMove*fl*0.32+smoothstep(0.75,1.,t)*max(-lp.z,0.)*0.9; lp.x+=sin(uWalk*1.7)*0.07*fl*uMove;
    lp.y+=0.03*fl*sin(uWalk*3.4)*uMove;
  } else if(uCloth>1.5){         // the veil: a long ribbon from the crown, trailing and fluttering
    float t=clamp(-lp.y/2.3,0.,1.);
    float fl=sin(t*7.-uTime*3.1+lp.x*2.)*0.09*t+sin(t*3.-uTime*1.7)*0.06*t;
    lp.x*=0.3+1.5*t;
    lp.z-=t*(0.1+0.42*uMove)+fl*0.5+0.12*sqrt(t);
    lp.xz+=uWindL.xz*t*t*0.6;
    lp.x+=sin(t*5.-uTime*2.4)*0.07*t; vC=fl*2.5;
    lp.y+=t*t*(0.15*uMove+0.12*length(uWindL));
  }
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  if(uBreathOn>0.5){
    float steep=smoothstep(0.35,0.7,1.-n.y);
    float band=smoothstep(1.,8.,w.y)*(1.-smoothstep(48.,85.,w.y));
    float rip=0.6+0.4*sin(w.y*0.33-uTime*0.8+w.x*0.05+w.z*0.03);
    w.xyz+=vec3(n.x,0.,n.z)*uBreath*steep*band*rip;
  }
  vW=w.xyz; vN=n; vL=position; vT=mat3(modelMatrix)*lt;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const OBJ_FRAG = /* glsl */`
${COMMON}
uniform float uId, uMode, uEmit, uFace, uStackH, uTime, uGhostMode, uGhost;
uniform float uAmb, uDiff, uFogD, uFogShade;
uniform vec3 uKeyD, uCamP, uT;
varying vec3 vW, vN, vL, vT; varying float vC;
void rock(inout vec3 T, inout float sh, inout float acc){
  float n1=vn(vW.xz*0.06+vW.y*0.015);
  T=normalize(vec3(0.35*(n1-0.5),1.,0.35*(vn(vW.zx*0.05+3.1)-0.5)));
  float vein=abs(sin(vW.x*0.31+vW.z*0.27+n1*9.+vW.y*0.05));
  acc=step(vein,0.045)*step(0.58,vn(vW.xz*0.02+vW.y*0.03+7.));
  sh-=0.14*(1.-n1);
}
void main(){
  if(uGhostMode>0.5 && hash(floor(vW.xz*3.1+vW.y*.19)) > 0.36*uGhost) discard;
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
  float sh=uAmb+uDiff*max(dot(N,uKeyD),0.)+vC;
  float id=uId; vec3 T=uT; float acc=0.;
  if(uMode>0.5&&uMode<1.5){ rock(T,sh,acc); }
  else if(uMode>1.5&&uMode<2.5){
    bool grass=N.y>0.74&&vW.y>2.6;
    if(grass){ id=5.; T=normalize(vec3(0.6,0.,1.)+vec3(0.5*(vn(vW.xz*0.012)-0.5),0.,0.)); sh+=0.1*(vn(vW.xz*0.09)-0.5); }
    else { id=4.; rock(T,sh,acc); if(vW.y<1.6) sh*=0.7; }
  }
  else if(uMode>2.5&&uMode<3.5){ T=length(vT)>0.01?normalize(vT):vec3(0.,1.,0.); }
  if(uFace>0.01){
    float a=atan(vL.x,vL.z); float hh=vL.y/uStackH+0.5;
    float ey=(hh-0.66)/(0.05*uFace+0.002);
    float e1=length(vec2((a-0.36)/0.15,ey)), e2=length(vec2((a+0.36)/0.15,ey));
    if(min(e1,e2)<1.){ id=7.; sh=0.06; acc=0.; }
  }
  float dist=length(vW-uCamP); float fog=1.-exp(-dist/uFogD);
  if(uEmit>0.){ sh=uEmit; fog*=0.4; }
  sh=mix(sh,uFogShade,fog);
  gl_FragColor=pack(sh,id,lineAt(vW,N,T,dist,0.),acc*(1.-fog));
}`;
function objMat(id, mode = 0, T = V(0, 1, 0), extra = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: OBJ_VERT, fragmentShader: OBJ_FRAG, side: THREE.DoubleSide,
    uniforms: Object.assign({}, SH, { uId: { value: id }, uMode: { value: mode }, uT: { value: T.clone().normalize() },
      uEmit: { value: 0 }, uFace: { value: 0 }, uStackH: { value: 1 }, uBreathOn: { value: 0 },
      uCloth: { value: 0 }, uClothH: { value: 2 }, uWalk: { value: 0 }, uMove: { value: 0 }, uWindL: { value: V() }, uGhostMode: {value:0}, uGhost: {value:1} }, extra)
  });
}

/* ---------- advected hydraulic water: every frame still resolves to six inks */
const WATER_FRAG=/* glsl */`
${COMMON}
uniform float uTime,uFlow,uFall,uWindSpeed,uAmb,uDiff,uFogD,uFogShade;
uniform vec3 uKeyD,uCamP,uT;
varying vec3 vW,vN,vL,vT;varying float vC;
void main(){
 vec3 N=normalize(vN);
 if(!gl_FrontFacing)N=-N;
 float d=length(uCamP-vW);
 float speed=uFall>.5?1.8+uFlow*.085:.14+uWindSpeed*.07;
 vec2 coord=uFall>.5?vW.yz:vW.xz;
 vec2 drift=vec2(uTime*speed*.095,uTime*speed*.047);
 float a=vn(coord*.13+drift),b=vn(coord*.36-drift*1.7+11.);
 float streak=.66*a+.34*b;
 float foam=uFall>.5?smoothstep(.46,.66,streak+uFlow*.005):smoothstep(.74,.88,streak);
 float id=foam>.5?3.:2.;
 float sh=uAmb*.75+uDiff*.17*max(dot(N,uKeyD),0.)+.12+streak*.19;
 if(id>2.5)sh=.65+.2*streak;
 vec3 tangent=uFall>.5?vec3(0.,-1.,-1.):vec3(1.,0.,.23);
 // Ink follows the advected water, while concrete and shoreline marks remain still.
 vec3 moving=vW+(uFall>.5?vec3(0.,uTime*speed*.65,uTime*speed*.45):vec3(uTime*speed*.26,0.,uTime*speed*.04));
 float line=lineAt(moving,N,tangent,d,0.);
 float fog=1.-exp(-d/uFogD);

    this.water.forEach((s, i) => { s.g.gain.setTargetAtTime((0.025 + 0.19 * shore + 0.05 * (.1+HYD.q/65)) * calm, t, 0.25); s.f.frequency.setTargetAtTime(170 + 330 * shore + 40 * (.1+HYD.q/65), t, 0.3); });
    this.wind.g.gain.setTargetAtTime(Math.pow(WX.wind, 1.3) * 0.0032 * (live.ev === 'hush' ? 0.2 : 1), t, 0.8); this.wind.f.frequency.setTargetAtTime(220 + WX.wind * 22, t, 1);
    this.wind.p.pan.setTargetAtTime(0.5 * Math.sin(simT * 0.07), t, 1);
    this.rain.g.gain.setTargetAtTime(clamp(WX.precip, 0, 4) * 0.02, t, 1);
    this.padBus.gain.setTargetAtTime((0.25 + 0.35 * (1 - SH.uDay.value)) * (live.ev === 'hush' ? 0.1 : 1), t, 2);
    this.padLP.frequency.setTargetAtTime(420 + clamp(WX.temp, 0, 25) * 22, t, 2);
    this.sub.g.gain.setTargetAtTime(Math.abs(live.breath) / 2.4 * 0.22 * (0.5 + 0.5 * Math.sin(simT * TAU / ((8+HYD.q/20) * 1.5))), t, 0.3);
    this.grind.g.gain.setTargetAtTime(live.ev === 'warren' ? live.apparition * 0.09 * (0.6 + 0.4 * Math.sin(simT * 0.9)) : 0, t, 0.5);
    const fb = clamp(0.32 + (WX.hum - 70) / 100 + (live.ev ? 0.12 : 0), 0.2, 0.68); this.echo.fbL.gain.setTargetAtTime(fb, t, 1); this.echo.fbR.gain.setTargetAtTime(fb, t, 1);
    this.room.rOut.gain.setTargetAtTime(0.4 + 0.3 * clamp(WX.precip, 0, 1) + 0.2 * (1 - SH.uDay.value), t, 2);
    this.wreO.forEach((o, i) => o.detune.setTargetAtTime(6 * Math.sin(simT * 0.3 + i), t, 0.5));
  },
};
let SHORE_ENV = 0;
const NOISE_WORKLET = `class N extends AudioWorkletProcessor{constructor(o){super();this.b=!!(o.processorOptions&&o.processorOptions.brown);this.l=[0,0];}
process(_,outs){const o=outs[0];for(let c=0;c<o.length;c++){const d=o[c];let l=this.l[c]||0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(this.b){l=(l+0.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}this.l[c]=l;}return true;}}
registerProcessor('mz-noise',N);`;
const OUT_GAIN = 0.4;

/* ====================================================================== camera crew (nine independent observational operators) */
const CREW=[
 {name:'SPILLWAY',fov:43,p:V(4,52,-132),upd(c,t){c.tgt.set(Math.sin(t/75)*8,10,1)}},
 {name:'WEST WORKS',fov:48,p:V(-126,41,-36),upd(c,t){c.tgt.set(-61,25,17)}},
 {name:'CREST ROAD',fov:46,p:V(-48,33,20),upd(c,t){c.tgt.set(lerp(-12,25,.5+.5*Math.sin(t/48)),30,3)}},
 {name:'KEEPER',fov:40,p:V(-91,34,17),upd(c,t){const want=keeper.pos.clone().add(V(-7,3.1,11));c.p.lerp(want,.025);c.tgt.lerp(keeper.pos.clone().add(V(4,1.3,0)),.035)}},
 {name:'TAILWATER',fov:51,p:V(41,9,-89),upd(c,t){c.tgt.set(-12+12*Math.sin(t/83),15,0)}},
 {name:'EAST GAUGE',fov:32,p:V(89,36,21),upd(c,t){c.tgt.set(79,32,3)}},
 {name:'UPSTREAM',fov:50,p:V(-103,46,138),upd(c,t){c.tgt.set(0,25,1)}},
 {name:'LONG LENS',fov:18,p:V(171,64,-208),upd(c,t){c.tgt.set(6,24,4)}},
 {name:'WATERLINE',fov:38,p:V(31,23,108),upd(c,t){c.tgt.set(-9,20,163+9*Math.sin(t/60))}}
];
for(const c of CREW)c.tgt=V(0,20,0);
const DIR={cur:0,until:0,pendingCut:-1,last16:-1,look:null};
function cut(i){DIR.cur=clamp(Math.floor(i),0,CREW.length-1);DIR.until=simT+rr(8,19);DIR.pendingCut=-1}
function chooseShot(){
 const weights=CREW.map((c,i)=>Math.max(.2,1+(i===3&&keeper.state==='walk'?2.3:0)+(i===0&&HYD.q>2?1.5:0)+(i===8 && HYD.level < 21 ? 0.5 : 0)-(DIR.cur === i ? .65 : 0)));
 let r=rnd()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return i}return 0;
}

/* ====================================================================== sim */
let SUNM=sunMoon(simMs),SUND=V(),MOOND=V();
let cwNow=COLORWAYS[S.colorway].c.map(hexV),cwFrom=cwNow.map(v=>v.clone()),cwMix=1;
function keeperTick(dt){
 const hour=localParts(simMs).hour,tooWet=WX.precip>2||WX.wind>15,off=hour<5.5||hour>21;
 if(keeper.state==='dwell'){
  keeper.still+=dt;keeper.dwell-=dt;
  if(keeper.dwell<=0){
   if(off||tooWet){keeper.target='WEST';keeper.dwell=rr(180,540);}
   else{
    const keys=['WEST','WEST_GAUGE','SPILL','EAST_GAUGE','EAST'];
    keeper.target=keys[Math.floor(rnd()*keys.length)];
    keeper.dwell=rr(45,140);
   }
   if(Math.abs(keeper.x-STOPS[keeper.target].x)>.4){keeper.state='walk';keeper.still=0;}
  }
 }else{
  const goal=STOPS[keeper.target].x,dir=Math.sign(goal-keeper.x);
  const dist=Math.min(1.12*dt,Math.abs(goal-keeper.x));
  keeper.x+=dir*dist;keeper.walked+=dist;keeper.dir.set(dir,0,0);
  if(Math.abs(keeper.x-goal)<.05){
   keeper.x=goal;keeper.state='dwell';keeper.dwell=rr(75,210);keeper.still=0;
   keeper.stopName=STOPS[keeper.target].name;
   if(keeper.target.includes('GAUGE')){
    S.inspections++;S.inspected[keeper.target]=(S.inspected[keeper.target]||0)+1;
    logEv('keeper checked '+keeper.stopName+' · inspection '+S.inspections);
   }else if(rnd()<.22)logEv('keeper reached '+keeper.stopName);
  }
 }
 if(!Number.isFinite(keeper.x))keeper.x=-88;
 keeper.pos.set(keeper.x,CREST+.4,3);keeper.visible=!(off||tooWet)&&keeper.state!=='dwell'||(!(off||tooWet)&&keeper.target!=='WEST');
 const m=keeper.mesh;m.visible=keeper.visible;m.position.copy(keeper.pos);m.rotation.y=keeper.dir.x>=0?Math.PI/2:-Math.PI/2;
 if(keeper.state==='walk')m.position.y+=.035*Math.sin(keeper.walked*8);
 keeper.move=lerp(keeper.move,keeper.state==='walk'?1:0,1-Math.exp(-dt*2));
}
function birdsTick(dt){
 for(let i=0;i<birds.length;i++){
  const b=birds[i];b.a+=dt*b.speed*(1+WX.wind*.025);
  const x=Math.cos(b.a)*b.r,z=120+i*34+Math.sin(b.a)*b.r;
  b.p.set(x,HYD.level+.17,z);b.mesh.position.copy(b.p);b.mesh.rotation.y=-b.a;
 }
}
function step(dt){
 dt=clamp(dt,0,.25);const d=dt*RATE;simT+=d;simMs+=d*1000;
 if(!WX.live||Date.now()-WX.at>2*3600e3){
  if(WX.live&&Date.now()-WX.at>2*3600e3){WX.live=false;logEv('stale weather · simulated fallback')}
  Object.assign(WXT,synthWx(simMs));
 }
 for(const k of ['wind','cloud','precip','temp','hum'])WX[k]=lerp(WX[k],WXT[k],1-Math.exp(-d/90));
 let wd=((WXT.windDir-WX.windDir+540)%360)-180;WX.windDir+=wd*(1-Math.exp(-d/120));
 hydraulicsTick(d);SUNM=sunMoon(simMs);SUND.copy(azElToVec(SUNM.sun.az,SUNM.sun.el));MOOND.copy(azElToVec(SUNM.moon.az,SUNM.moon.el));
 keeperTick(d);birdsTick(d);
 S.tension+=d/S.epochLen*(live.ev?.3:1);
 uncannyTick(d);
 live.calm=lerp(live.calm,live.ev==='hush'?.015:1,1-Math.exp(-d/4));
 live.apparition=lerp(live.apparition,live.ev==='warren'?smoothstep(0,17,live.evT)*smoothstep(0,17,live.evDur-live.evT):0,1-Math.exp(-d/3));
 live.breath=lerp(live.breath,live.ev==='warren'?.9*Math.sin(simT/9)*live.apparition:0,1-Math.exp(-d));
 GHOST.visible=live.apparition>.07&&HYD.level<20.6;
 GHOST.position.y=HYD.level+.08;
 GHOST.children.forEach(m=>{m.material.uniforms.uGhost.value=live.apparition});
 gauges.forEach(g=>{g.needle.rotation.z=.2*Math.sin(simT*.05+g.x)+.15*clamp(HYD.q/20,0,1)});
 SHORE_ENV=lerp(SHORE_ENV,HYD.q/32,1-Math.exp(-d*.8));
 if(HYD.q>1&&rnd()<d*.34){const p=V(rr(-35,35),-.2,-35),v=AUD.lens(p);AUD.pend.push({s:clamp(HYD.q/30,0,1),v:v.g*.4,pan:v.pan})}
 if(simT>=DIR.until&&DIR.pendingCut<0)DIR.pendingCut=chooseShot();
 if(DIR.pendingCut>=0&&(!AUD.ctx||AUD.ctx.state!=='running'||AUD.cur16!==DIR.last16)){cut(DIR.pendingCut);DIR.pendingCut=-1}
 DIR.last16=AUD.cur16;CREW.forEach(c=>c.upd(c,simT));
 if(simT-(S._saved||0)>60){S._saved=simT;save()}
}

/* ====================================================================== render */
function applyLook(dt){
 const c=DIR.look||CREW[DIR.cur];
 camera.position.copy(c.p);camera.lookAt(c.tgt);camera.fov=c.fov;
 camera.updateProjectionMatrix();camera.updateMatrixWorld();
 if(!Number.isFinite(camera.position.x)){camera.position.set(1,50,-110);camera.lookAt(0,18,0)}
 SH.uVP.value.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
 SH.uAspect.value=camera.aspect;SH.uCamP.value.copy(camera.position);SH.uTime.value=simT;
 const se=SUNM.sun.el,me=SUNM.moon.el,day=smoothstep(-.2,.18,se),cloudDim=1-.55*WX.cloud;
 SH.uDay.value=day;SH.uSunD.value.copy(SUND);
 if(se>-.06){SH.uKeyD.value.copy(SUND);SH.uDiff.value=(.18+.62*smoothstep(-.06,.35,se))*cloudDim;
 SH.uKeyUp.value=smoothstep(-.03,.05,se)*(1-.7*WX.cloud)}
 else{SH.uKeyD.value.copy(me>0?MOOND:V(0,1,0));SH.uDiff.value=me>0?.2*SUNM.illum*cloudDim:.04;
 SH.uKeyUp.value=me>0?.6*SUNM.illum*(1-WX.cloud):0}
 SH.uAmb.value=.13+.3*day+.08*WX.cloud*day;
 SH.uFogD.value=clamp(1800-1100*smoothstep(72,100,WX.hum)-350*clamp(WX.precip,0,2),400,2200);
 SH.uFogShade.value=.12+.55*day;SH.uBreath.value=0;
 skyU.uCloud.value=WX.cloud;const wd=fromBearingTravel(WX.windDir);skyU.uWind.value.set(wd.x,wd.y).multiplyScalar(WX.wind);
 sky.position.copy(camera.position);
 const place=(m,dir,deg,up)=>{m.position.copy(camera.position).addScaledVector(dir,15000);m.quaternion.copy(camera.quaternion);const scale=2*15000*Math.tan(deg*D2R);m.scale.set(scale,scale,1);m.visible=up};
 place(sunM,SUND,3.3,se>-.08);place(moonM,MOOND,1.6,me>-.05&&se<.1);
 sunM.material.uniforms.uOpen.value=0;moonM.material.uniforms.uOpen.value=0;
 sunM.material.uniforms.uDim.value=1-.35*WX.cloud;moonM.material.uniforms.uIllum.value=SUNM.illum;
 if(cwMix<1)cwMix=Math.min(1,cwMix+dt/45);
 const target=COLORWAYS[S.colorway].c.map(hexV);
 for(let i=0;i<6;i++){cwNow[i].copy(cwFrom[i]).lerp(target[i],smoothstep(0,1,cwMix));PU.uPal.value[i].copy(cwNow[i])}
 const g=S.grammar;PU.uPeriod.value=g.period*IH/720;PU.uDith.value=g.dith;
 PU.uWob.value=g.wob*IH/720;PU.uOutline.value=g.outline;PU.uHatch.value=g.hatch;
 SH.uPerPx.value=g.period*IH/720;SH.uWobPx.value=g.wob*IH/720;
 SH.uPxK.value=2*Math.tan(camera.fov*D2R/2)/Math.max(64,IH);
 PU.uRain.value=clamp(WX.precip/2,0,1);PU.uRainDir.value.set(wd.x*.35,-1).normalize();PU.uTime.value=simT;
 const css=v=>'#'+v.toArray().map(x=>Math.round(clamp(x,0,1)*255).toString(16).padStart(2,'0')).join('');
 const rs=document.documentElement.style;rs.setProperty('--ink',css(cwNow[0]));rs.setProperty('--paper',css(cwNow[5]));
 rs.setProperty('--hot',css(cwNow[3]));rs.setProperty('--deep',css(cwNow[1]));
}
function render(){
 renderer.setRenderTarget(rtData);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,camera);
 quad.material=printMat;renderer.setRenderTarget(rtPrint);renderer.render(postScene,postCam);
 quad.material=blitMat;renderer.setRenderTarget(null);renderer.render(postScene,postCam);
}

/* ====================================================================== info box */
const hud=document.getElementById('hud');hud.hidden=!INFO;
const tapBtn=document.getElementById('tap');
function hudUpdate(){
 if(!INFO)return;
 const t=localParts(simMs),e=SUNM.sun.el/D2R,az=(SUNM.sun.az/D2R+360)%360;
 const kd=keeper.visible?(keeper.state==='walk'?'walking toward '+STOPS[keeper.target].name:'at '+keeper.stopName):'off duty';
 const dg=STOPS[keeper.target].deg;
 const recent=S.log.slice(0,4).map(l=>'<div>'+l.t+' — '+l.text+'</div>').join('');
 const ev=live.ev?'<div class="ev">NOW · '+EVT[live.ev].label+' · '+live.why+'</div>':'';
 hud.innerHTML='<div class="t"><span>MZ WORLD · LOCH RAVEN</span><span>EPOCH '+S.epoch+' · '+COLORWAYS[S.colorway].name+'</span></div>'+
 '<div class="r"><span>BALTIMORE COUNTY '+t.str+' · sun '+e.toFixed(0)+'° '+compass(az)+'</span><span>'+(WX.live?'LIVE':'SIMULATED')+' WEATHER</span></div>'+
 '<div class="r"><span>SPILLWAY FLOW INDEX '+HYD.q.toFixed(1)+' · MODELLED</span><span>→ curtain, bar '+AUD.barSec.toFixed(1)+' s</span></div>'+
 '<div class="r"><span>RESERVOIR DATUM '+HYD.level.toFixed(1)+' · MODELLED</span><span>→ waterline, Warren threshold</span></div>'+
 '<div class="r"><span>WIND '+WX.wind.toFixed(1)+' m/s '+compass(WX.windDir)+' · CLOUD '+Math.round(WX.cloud*100)+'%</span><span>→ leaves, sky</span></div>'+
 '<div class="r"><span>RAIN '+WX.precip.toFixed(1)+' mm/h · HUMIDITY '+WX.hum.toFixed(0)+'%</span><span>→ rain store, echo</span></div>'+
 '<div class="r"><span>KEEPER '+kd+' · CHECKS '+S.inspections+'</span><span>→ bass '+NOTE[AUD.deg(dg)%12]+'</span></div>'+
 '<div class="r"><span>CAMERA '+CREW[DIR.cur].name+'</span><span>TENSION '+Math.min(99,Math.floor(S.tension*100))+'%</span></div>'+
 ev+'<div class="log">'+recent+'</div><div class="cr">MATCH ZIMMERMAN CREATIVE MEDIA GROUP · MZTV</div>';
}

/* ====================================================================== loop, keys, API */
addEventListener('resize',resize);resize();
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();console.warn('[gl] context lost')});
renderer.domElement.addEventListener('webglcontextrestored',()=>{resize();console.warn('[gl] context restored')});
SUNM=sunMoon(simMs);SUND.copy(azElToVec(SUNM.sun.az,SUNM.sun.el));MOOND.copy(azElToVec(SUNM.moon.az,SUNM.moon.el));
hydraulicsTick(.016);birdsTick(0);
const initialHour=localParts(simMs).hour;
if(initialHour>=5.5&&initialHour<=21){
 const k=['WEST_GAUGE','SPILL','EAST_GAUGE'][Math.floor(rnd()*3)];
 keeper.x=STOPS[k].x;keeper.target=k;keeper.stopName=STOPS[k].name;
}
keeperTick(.016);
cut(Q.has('cam')?clamp(+Q.get('cam'),0,CREW.length-1):Math.floor(rnd()*CREW.length));
if(Q.has('cam'))DIR.until=1e12;
CREW.forEach(c=>c.upd(c,simT));
function frame(dt){
 try{step(dt);applyLook(dt);render();AUD.frame(dt)}
 catch(e){console.error('[Loch Raven frame]',e)}
}
let lastT=performance.now(),hudT=0;
function raf(now){
 const dt=clamp((now-lastT)/1000,0,.25);lastT=now;frame(dt);
 hudT+=dt;if(hudT>.5){hudT=0;hudUpdate()}requestAnimationFrame(raf);
}
if(!CAPTURE)requestAnimationFrame(raf);
addEventListener('beforeunload',save);
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='i'){INFO=!INFO;hud.hidden=!INFO;if(INFO)hudUpdate()}
 if(k==='m')AUD.mute();
 if(k==='r'&&!live.ev){logEv('human intervention · pressure on the rupture');S.tension=1}
 AUD.start();
});
addEventListener('pointerdown',()=>AUD.start());
tapBtn.addEventListener('click',()=>AUD.start());
AUD.init();hudUpdate();
window.MZ={
 tick(dt=1/30){frame(dt);hudUpdate()},
 advance(sec,dt=.25){for(let t=0;t<sec;t+=dt)step(Math.min(dt,sec-t));applyLook(.25);render();hudUpdate()},
 force(name){if(live.ev)endEvent();if(name==='rupture'){rupture('forced by hand');return}startEvent(name,true);hydraulicsTick(.016)},
 cam(i){cut(i);DIR.until=1e12},
 look(p,t,fov=30){DIR.look=p?{p:V(...p),tgt:V(...t),fov}:null},
 ink(i){const n=clamp(Math.floor(i),0,COLORWAYS.length-1);S.colorway=n;cwMix=1;cwFrom=COLORWAYS[n].c.map(hexV);cwNow=cwFrom.map(v=>v.clone())},
 grammar(g){Object.assign(S.grammar,g)},
 seekHour(h){const cur=localParts(simMs).hour;simMs+=(((h-cur)%24+24)%24)*3600e3},
 rain(mm){HYD.rainStore=clamp(HYD.rainStore+Math.max(0,mm)/10,0,3.4);S.rainStore=HYD.rainStore;logEv('manual rain store +'+mm+' mm (simulated)')},
 h:(x,z)=>terrainH(x,z),
 get keeperPos(){return keeper.pos.toArray()},
 get keeperDir(){return keeper.dir.toArray()},
 get sunDir(){return SUND.toArray()},
 keeperWalk(from,to){if(!STOPS[from]||!STOPS[to])return;keeper.x=STOPS[from].x;keeper.target=to;keeper.state='walk';keeper.visible=true},
 geo:{LAT,LON,CREST,LIP,SPILL_HALF,DAM_HALF,STOPS},
 get state(){return {S,live:{...live},WX:{...WX},HYD:{...HYD},cam:CREW[DIR.cur].name,keeper:{target:keeper.target,state:keeper.state,visible:keeper.visible,pos:keeper.pos.toArray()}}},
 setWx(o){Object.assign(WXT,o);Object.assign(WX,o);WX.live=true;WX.at=Date.now()},
 analyser(){return AUD.an},
 audio:AUD
};
</script>
