<!--

  A live field tuned to the September 2026 nor'easter. Real data, abstract ecology.
  Data (all fetched live in the browser, no keys):
    Open-Meteo forecast grid 32–47N / 85–55W @1.5°: pressure, wind, gusts, rain, cloud (hourly, past 24h + next 72h)
    Open-Meteo marine: wave height / period / direction at 10 offshore points
    NOAA NWS: latest station observations (KORF KBWI KACY KJFK KBOS KACK) + active alerts NC→ME
    NOAA CO-OPS: water level vs astronomical prediction (surge) at 6 tide gauges
  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?rate=N ?lines=N ?ff=H (shift clock by H hours) ?capture=1
  Keys: i info · t force a grammar rupture

.hide{display:none}

function audioSchedule() {

const VB = { t: 0, step: 0, bar: 0 };

const FADE_IN = new Float32Array(64).map((_, i) => Math.sin(i / 63 * Math.PI / 2)), FADE_OUT = new Float32Array(64).map((_, i) => Math.cos(i / 63 * Math.PI / 2));

function audioUnlock() { if (MUTE) return; if (!AU.ctx) { if (!AU.busy) { AU.busy = true; createContext().finally(() => { AU.busy = false; }); } } else if (AU.ctx.state !== 'running') AU.ctx.resume().catch(() => { }); }
addEventListener('pointerdown', audioUnlock); addEventListener('keydown', audioUnlock);

/* ================= info + log ================= */
const infoEl = document.getElementById('info'), logEl = document.getElementById('log'), legendEl = document.getElementById('legend'), noteEl = document.getElementById('note');
function applyInfo() { for (const e of [infoEl, logEl, legendEl, noteEl]) e.classList.toggle('hide', !SHOW_INFO); }
/* ---- NOAA note: the forecasters' own words, rotated from the local NWS offices' Area Forecast Discussions ---- */
const OFFICES = [['BOX', 'NWS Boston'], ['OKX', 'NWS New York'], ['PHI', 'NWS Philadelphia/Mt Holly'], ['AKQ', 'NWS Wakefield VA']];
const NOTES = {}; let noteIdx = 0;
function afdSection(txt, name) { const m = txt.match(new RegExp('\\n\\.' + name + '\\.\\.\\.([\\s\\S]*?)(?:\\n&&|\\n\\.[A-Z][A-Z /]+\\.\\.\\.)')); return m ? m[1].trim() : ''; }
function afdItems(sec) {
  return sec.split(/\n\s*(?:-|\d\)|\.?KEY MESSAGE \d\.\.\.)\s+/).map(q => q.replace(/\s*\n\s*/g, ' ').replace(/^[-\d).\s]+/, '').replace(/\.\.\./g, '… ').replace(/\s+/g, ' ').trim()).filter(q => q.length > 20);
}
async function fetchNotes() {
  await Promise.all(OFFICES.map(async ([id, name]) => {
    try {
      const l = await getJSON('https://api.weather.gov/products/types/AFD/locations/' + id); const it = l['@graph'] && l['@graph'][0]; if (!it) return;
      if (NOTES[id] && NOTES[id].pid === it.id) return;
      const p = await getJSON('https://api.weather.gov/products/' + it.id), txt = '\n' + (p.productText || '');

      if (!items.length) { items = afdItems(afdSection(txt, 'SYNOPSIS')); kind = 'synopsis'; }

      const changed = afdSection(txt, 'WHAT HAS CHANGED').replace(/\s*\n\s*/g, ' ').replace(/\.\.\./g, '… ').trim();
      const first = !NOTES[id];
      NOTES[id] = { pid: it.id, name, t: Date.parse(p.issuanceTime), items, kind, changed: (/^no significant change/i.test(changed) && changed.length < 60) ? '' : changed };
      if (!first) log(`${name.toUpperCase()} issued a new forecast discussion`);

}
function clip(s, n) { return s.length <= n ? s : s.slice(0, s.lastIndexOf(' ', n)) + ' …'; }

  const n = NOTES[keys[noteIdx % keys.length]];

  noteEl.innerHTML = `<span class="h">WHAT THE FORECASTERS SAY</span> <i>${esc(n.name)} · ${esc(dt(n.t))} · ${n.kind}</i><br>${body}` +
    (n.changed ? `<br><i>what changed: ${esc(clip(n.changed, 170))}</i>` : '') + `<br><i>${keys.map((k, i) => (i === noteIdx % keys.length ? '■' : '□')).join(' ')} rotating every 40 s</i>`;
}
setInterval(() => { noteIdx++; renderNote(); }, 40e3);
addEventListener('keydown', e => { if (e.key === 'i' || e.key === 'I') { SHOW_INFO = !SHOW_INFO; applyInfo(); } if (e.key === 't' || e.key === 'T') { rupture(S.phase, 'manual'); } });

  L.push(`<span class="h">MZTV · BIT FIELD 016 · ONSHORE</span>   ${clock}`);

  G.push(`rings from the low = the kick · colours = storm phase (${(SCOPES[S.phase] || SCOPES.DEEPENING).name})`);
  G.push(`<span class="h">SOUND FOLLOWS</span>`);

/* ================= main loop ================= */
let lastFrame = performance.now(), lastSec = 0, lastMin = 0, frameAcc = 0;
function secondTick() {

}
let lastRAF = performance.now();

{
  const cg = loadCache('grid', ['P', 'U', 'V', 'G', 'R', 'C'], NG); if (cg && cg.d.times.length > 2) { DATA.grid = cg.d; DATA.gridAt = cg.at; }

}
if (!S.log.length) log('BROADCAST OPEN · tuned to the East Coast nor\'easter');
if (DATA.grid) { onGridUpdate(null); }
for (let c = 0; c < CN; c++) STAINc[c] = 1 - Math.exp(-S.rain[c] / 30);
analyze(true); inkTargets();
for (let k = 0; k < 160; k++) inkStep(0.12);   // pre-warm: the weather was already moving before you arrived
renderLog(); renderInfo(); render();

  setTimeout(() => { fetchAlerts(); setInterval(fetchAlerts, 10 * 60e3); }, 3000);

}
if (!MUTE) { audioUnlock(); }
if (!CAPTURE) requestAnimationFrame(frame);
addEventListener('beforeunload', persist);
let captSub = 0;
function captureTick(dt) {

}
window.MZ = { S, A, DATA, AU, PAT, rupture, force: ph => rupture(ph, 'forced'), analyze, persist, onGridUpdate, fieldsAt,
  poison: () => { R0.fill(NaN); G0.fill(NaN); }, get ink() { return R0; }, snapPalette: () => paletteStep(999), tick: captureTick, NOTES, get W() { return W; }, get H() { return H; } };
