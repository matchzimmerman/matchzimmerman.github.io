<script>
'use strict';
/* =====================================================================
   STIGMERGY — MZTV BIT FIELD 015
   Tens of thousands of agents on a torus lay trail and follow trail;
   transport networks form out of that feedback alone. Three stacked
   planes: the live trail on top, the channels it has worn (minutes to
   hours) below, the deep sediment (hours) at the bottom. Memory steers
   the agents, thickens old routes, and returns old hubs as food.
   A packet rides the strongest vein; the camera follows it; the sound
   is what the packet crosses.

   URL params:
     ?info=0      hide the disclosure box      (key: i)
     ?audio=0     no sound
     ?fresh=1     ignore saved state, start a new ground
     ?seed=N      fixed seed for a fresh start
     ?rate=N      evolution clock multiplier (testing: 60 = an hour per minute)
     ?lines=270   internal vertical resolution (pixel size)
     ?agents=N    agent count (default 22000)
     ?ff=H        simulate H hours of evolution before first frame (testing: ~25 s per hour)
     ?capture=1   frames advance only when MZ.tick(dt) is called (offline rendering)
   Keys: i info · t force transition · (any key/click resumes audio in a normal browser)
   ===================================================================== */
(() => {
const Q = new URLSearchParams(location.search);
const RATE = Math.max(0.01, parseFloat(Q.get('rate') || '1'));
let SHOW_INFO = Q.get('info') !== '0';
const FRESH = Q.get('fresh') === '1';
const MUTE = Q.get('audio') === '0';
const LINES = Math.max(120, parseInt(Q.get('lines') || '270', 10));
const NA = clampI(parseInt(Q.get('agents') || '22000', 10), 2000, 80000);
const CAPTURE = Q.get('capture') === '1';
const KEY = 'mztv-stigmergy-v1';
function clampI(v, a, b) { return Number.isFinite(v) ? Math.max(a, Math.min(b, v)) : a; }

/* ---------------- utilities ---------------- */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const angLerp = (a, b, t) => a + wrapA(b - a) * t;
const R = { s: 1, next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } };
const rnd = () => R.next();
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); };
let NSEED = 1;
function hash1(i) { let x = Math.imul(i | 0, 374761393) ^ Math.imul(NSEED | 0, 668265263); x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function vnoise(t, ch) { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash1(i * 7 + ch * 1013), hash1((i + 1) * 7 + ch * 1013), u) * 2 - 1; }
function fbm(t, ch) { return vnoise(t, ch) * 0.6 + vnoise(t * 2.13 + 5.1, ch + 1) * 0.28 + vnoise(t * 4.7 + 1.7, ch + 2) * 0.12; }
const wrapN = v => ((v % N) + N) % N;
const nearest = (v, ref) => ref + wrapA((v - ref) / N * TAU) / TAU * N;   // closest torus copy of v to ref

/* ---------------- field ---------------- */
const N = 256, NN = N * N, SIM_DT = 1 / 30;
let T = new Float32Array(NN), Tb = new Float32Array(NN);     // live trail, colony A (+ swap buffer)
let U = new Float32Array(NN), Ub = new Float32Array(NN);     // live trail, colony B
const M = new Float32Array(NN);    // channels: what the trail has worn (minutes up, an hour down)
const D = new Float32Array(NN);    // sediment: what the channels have held (tens of minutes up, hours down)
const K = new Float32Array(NN);    // the packet's own trace
const ax = new Float32Array(NA), az = new Float32Array(NA), ah = new Float32Array(NA);
let uActive = false;
const idx = (x, z) => ((z & 255) << 8) | (x & 255);
function samp(a, x, z) {
  x = wrapN(x); z = wrapN(z);
  const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0, x1 = (x0 + 1) & 255, z1 = (z0 + 1) & 255;
  const r0 = z0 << 8, r1 = z1 << 8;
  return (a[r0 | x0] * (1 - fx) + a[r0 | x1] * fx) * (1 - fz) + (a[r1 | x0] * (1 - fx) + a[r1 | x1] * fx) * fz;
}

/* ---------------- genome ---------------- */
const FORMS = ['network', 'meander', 'knots', 'streams', 'cells'];
const TOGGLES = ['food', 'territory', 'reinforce', 'cuts'];
const OPS = FORMS.concat(TOGGLES);
const ARCH = {
  network: { SA: 0.39, RA: 0.785, SO: 8, SS: 1.0, jit: 0.05, decay: 0.1 },
  meander: { SA: 1.0, RA: 0.3, SO: 5, SS: 1.0, jit: 0.02, decay: 0.1 },
  knots: { SA: 0.25, RA: 1.3, SO: 14, SS: 1.2, jit: 0.02, decay: 0.08 },
  streams: { SA: 0.6, RA: 0.25, SO: 18, SS: 1.6, jit: 0.25, decay: 0.05 },
  cells: { SA: 1.2, RA: 1.2, SO: 4, SS: 0.7, jit: 0.02, decay: 0.12 }
};
const MORPH = ['SA', 'RA', 'SO', 'SS', 'jit', 'decay'];
const GR = {
  SA: [0.2, 1.3], RA: [0.2, 1.4], SO: [3, 18], SS: [0.6, 1.8], jit: [0.01, 0.3], decay: [0.04, 0.14],
  dep: [3.5, 6], mem: [0, 0.45], food: [0, 1], territory: [0, 1], reinforce: [0, 1], cuts: [0, 1],
  hgt: [55, 130], pitch: [-1.2, -0.6], speed: [5, 13], lead: [10, 40], gap1: [6, 18], gap2: [14, 40], fog: [0.0012, 0.0045], survey: [0, 1],
  contour: [0.2, 1], reg: [0, 1.4], echo: [0.05, 0.7], hatch: [0.3, 1], evRate: [0.6, 1.5],
  bpm: [70, 92], swing: [0, 0.22], kickDen: [0.3, 1], chordDen: [0, 0.7], percDen: [0, 0.6], bassDen: [0.25, 0.75], drone: [0.2, 1], pluck: [0.5, 1]
};
const GD = { dither: 3, inkMap: 6, root: 5, mode: 3, drop: 2 };
const INKMAPS = [[1, 2, 3], [2, 1, 3], [1, 3, 2], [2, 3, 1], [1, 2, 2], [2, 3, 3]]; // sediment contour (never the live ink), colony B, rings
const ROOTS = [0, -2, 3, 5, -4];
const MODES = [[0, 1, 3, 5, 7, 8, 10], [0, 1, 4, 5, 7, 8, 10], [0, 2, 3, 5, 7, 8, 10]];
const MODE_NAMES = ['phrygian', 'phrygian dominant', 'aeolian'];
const NOTE_NAMES = ['D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B', 'C', 'C#'];
const DITHER_NAMES = ['ordered', 'halftone', 'grain'];
const DESC = {
  network: 'trails braid into a fine transport network',
  meander: 'trails fold into a slow labyrinth',
  knots: 'trails gather into knots and radiate spokes',
  streams: 'a few long streams sweep the whole ground',
  cells: 'the network breaks into cells and drifting bodies',
  food: 'old hubs in the sediment feed the network',
  territory: 'a second colony claims ground; borders form',
  reinforce: 'worn channels thicken into trunks',
  cuts: 'the ground is cut; the network heals across the wound'
};
function initialGenome() {
  return Object.assign({}, ARCH.network, {
    dep: 5, mem: 0.15, food: 0, territory: 0, reinforce: 0, cuts: 0,
    hgt: 85, pitch: -0.9, speed: 8, lead: 22, gap1: 10, gap2: 24, fog: 0.0024, survey: 0.4,
    contour: 0.7, reg: 0.35, echo: 0.25, hatch: 0.6, evRate: 1,
    bpm: 78, swing: 0.1, kickDen: 0.6, chordDen: 0.3, percDen: 0.25, bassDen: 0.5, drone: 0.5, pluck: 0.8,
    dither: 0, inkMap: 0, root: 0, mode: 0, drop: 0,
    // bg dark teal · sediment teal · channel amber · live phosphor green (OKLCH, hue in radians)
    pal: [[0.19, 0.04, 3.55], [0.44, 0.075, 3.35], [0.73, 0.14, 1.2], [0.89, 0.19, 2.45]],
    form: 'network', dom: 'network'
  });
}
const cloneG = g => JSON.parse(JSON.stringify(g));
function mixG(a, b, s) {
  const o = {};
  for (const k in GR) o[k] = lerp(a[k], b[k], s);
  for (const k in GD) o[k] = s < 0.5 ? a[k] : b[k];
  o.pal = a.pal.map((c, i) => [lerp(c[0], b.pal[i][0], s), lerp(c[1], b.pal[i][1], s), angLerp(c[2], b.pal[i][2], s)]);
  o.form = s < 0.5 ? a.form : b.form; o.dom = s < 0.5 ? a.dom : b.dom;
  return o;
}

/* ---------------- state ---------------- */
let S;
function freshState(seed) {
  R.s = seed | 0; NSEED = seed | 0;
  S = {
    v: 1, seed, clock: 0, real: 0, era: 1, transitions: 0, P: 0.12,
    phase: 'era', tr0: 0, trDur: 180, trS: 0, instab: 0,
    base: initialGenome(), from: null, to: null, G: null,
    caps: { network: 1, meander: 1, knots: 1, streams: 1, cells: 0, food: 0, territory: 0, reinforce: 0, cuts: 0 },
    lastDom: { network: 1 }, opHue: {}, history: [{ era: 1, dom: 'network', at: 0 }], newCap: null,
    pk: { x: rnd() * N, z: rnd() * N, h: rnd() * TAU, lost: 0, jn: 0, jcool: 0, w: 0, tn: 0, mm: 0, b: 3 },
    pk2: null,
    cam: { x: 0, z: 0, y: 85, yaw: 0, yawV: 0, pitch: -0.9, roll: 0 },
    tRef: 20, uRef: 20, stats: { cov: 0.2, flux: 0.3, mMean: 0, dMean: 0, dMax: 0, junc: 0, jpm: 0 },
    food: [], foodAt: -1e9, cut: null, cutT: 60, rings: [], crossings: 0, heard: 0, jHist: [], vHist: [],
    sunAz: rnd() * TAU, sunEl: 0.6, traj: null
  };
  S.traj = newTraj();
  S.G = S.base;
  for (let i = 0; i < NA; i++) { ax[i] = rnd() * N; az[i] = rnd() * N; ah[i] = rnd() * TAU; }
  T.fill(0); U.fill(0); M.fill(0); D.fill(0); K.fill(0);
}

/* ---------------- evolution ---------------- */
function checkUnlock() {
  const c = S.caps, st = S.stats, n = S.transitions;
  if (!c.cells && n >= 1) return 'cells';
  if (!c.reinforce && n >= 1 && st.mMean > 0.05) return 'reinforce';
  if (!c.food && n >= 3 && st.dMax > 0.3) return 'food';
  if (!c.territory && n >= 5 && st.dMean > 0.12) return 'territory';
  if (!c.cuts && n >= 8 && c.reinforce && st.dMean > 0.2) return 'cuts';
  return null;
}
function mutatePal(p, dom) {
  const q = p.map(c => c.slice());
  q[0][2] = p[0][2] + gauss() * 0.25;
  q[0][0] = clamp(p[0][0] + gauss() * 0.02, 0.14, 0.23);
  q[0][1] = clamp(p[0][1] + gauss() * 0.012, 0.025, 0.07);
  const bands = [[0.38, 0.52], [0.64, 0.8], [0.84, 0.94]];
  for (let k = 1; k <= 3; k++) {
    q[k][2] = p[k][2] + gauss() * 0.35;
    q[k][0] = clamp(p[k][0] + gauss() * 0.04, bands[k - 1][0], bands[k - 1][1]);
    q[k][1] = clamp(p[k][1] + gauss() * 0.03, 0.06, 0.21);
  }
  // identity holds: every mutation is pulled back toward the home palette, and each ink keeps to its family
  // (bg: black-teal · sediment: teal · channels: amber↔ochre↔olive · live: phosphor green↔amber)
  const home = initialGenome().pal;
  const HUES = [[3.2, 4.0], [2.7, 3.8], [0.85, 1.9], [1.1, 2.6]];
  if (S.opHue[dom] === undefined) S.opHue[dom] = q[2][2];
  else q[2][2] = angLerp(q[2][2], S.opHue[dom], 0.7);
  for (let k = 0; k < 4; k++) { q[k][2] = angLerp(q[k][2], home[k][2], 0.45); q[k][2] = clamp(q[k][2], HUES[k][0], HUES[k][1]); }
  if (Math.abs(q[3][2] - q[2][2]) < 0.45) q[3][2] = clamp(q[2][2] + (q[2][2] < 1.75 ? 0.8 : -0.8), HUES[3][0], HUES[3][1]);
  return q;
}
function applyForm(n, g, form, keep) {
  const a = ARCH[form];
  for (const k of MORPH) { const [lo, hi] = GR[k]; n[k] = clamp(lerp(a[k], g[k], keep) + gauss() * 0.06 * (hi - lo), lo, hi); }
  n.form = form;
}
function mutate(g) {
  const n = cloneG(g);
  let nc = checkUnlock();
  if (S.forceDom) nc = S.caps[S.forceDom] ? null : S.forceDom;
  if (nc) { S.caps[nc] = 1; S.newCap = nc; } else S.newCap = null;
  let dom = S.forceDom || nc; S.forceDom = null;
  if (!dom) {
    const opts = OPS.filter(o => S.caps[o] && o !== g.dom);
    const wts = opts.map(o => 1 + (S.era - (S.lastDom[o] || 0)) * 1.5);
    let tot = wts.reduce((a, b) => a + b, 0), r = rnd() * tot;
    dom = opts[opts.length - 1];
    for (let i = 0; i < opts.length; i++) { r -= wts[i]; if (r <= 0) { dom = opts[i]; break; } }
  }
  S.lastDom[dom] = S.era + 1;
  if (FORMS.includes(dom)) applyForm(n, g, dom, 0.2);
  else if (rnd() < 0.45) { const f = FORMS.filter(o => S.caps[o] && o !== g.form); applyForm(n, g, f[Math.floor(rnd() * f.length)], 0.4); }
  else applyForm(n, g, g.form, 0.75);
  for (const o of TOGGLES) {
    if (!S.caps[o]) { n[o] = 0; continue; }
    n[o] = o === dom ? 0.75 + rnd() * 0.25 : clamp(g[o] * 0.4 + (rnd() < 0.25 ? rnd() * 0.4 : 0), 0, 1);
  }
  const mut = (k, s) => { const [a, b] = GR[k]; n[k] = clamp(g[k] + gauss() * s * (b - a), a, b); };
  for (const k of ['dep', 'mem', 'hgt', 'pitch', 'speed', 'lead', 'gap1', 'gap2', 'fog', 'survey', 'contour', 'reg', 'echo', 'hatch', 'evRate',
    'bpm', 'swing', 'kickDen', 'chordDen', 'percDen', 'bassDen', 'drone', 'pluck']) mut(k, 0.17);
  // a worn world: the colony starts to trust its own channels
  n.mem = clamp(n.mem + S.stats.mMean * 0.2, 0, 0.45);
  const bump = (k, v, s = 0.6) => { n[k] = clamp(lerp(n[k], v, s), GR[k][0], GR[k][1]); };
  switch (dom) {
    case 'network': bump('pluck', 1); bump('chordDen', 0.45, 0.4); break;
    case 'meander': bump('bpm', 72, 0.5); bump('speed', 6); bump('hatch', 0.9, 0.4); break;
    case 'knots': bump('pitch', -1.15, 0.5); bump('hgt', 70, 0.4); bump('kickDen', 0.85, 0.5); break;
    case 'streams': bump('hgt', 120); bump('speed', 12); bump('pitch', -0.7, 0.5); bump('percDen', 0.1, 0.5); break;
    case 'cells': bump('gap1', 16); bump('percDen', 0.5, 0.5); bump('bassDen', 0.3, 0.5); break;
    case 'food': bump('drone', 0.9); bump('chordDen', 0.6, 0.5); break;
    case 'territory': bump('percDen', 0.45, 0.5); bump('reg', 1.0, 0.4); break;
    case 'reinforce': bump('mem', 0.35, 0.5); bump('bassDen', 0.7, 0.5); bump('echo', 0.55, 0.5); break;
    case 'cuts': bump('reg', 1.2, 0.5); bump('echo', 0.6, 0.5); n.drop = 1; break;
  }
  if (rnd() < 0.35) n.dither = (g.dither + 1 + Math.floor(rnd() * 2)) % GD.dither;
  if (rnd() < 0.4) n.inkMap = Math.floor(rnd() * GD.inkMap);
  n.mode = rnd() < 0.5 ? 0 : Math.floor(rnd() * GD.mode);       // D phrygian is home
  n.root = rnd() < 0.45 ? 0 : Math.floor(rnd() * GD.root);
  if (dom !== 'cuts' && rnd() < 0.3) n.drop = 1 - g.drop;
  n.pal = mutatePal(g.pal, dom);
  n.dom = dom;
  return n;
}
function newTraj() {
  const t = {};
  for (const k of ['SA', 'RA', 'SO', 'hgt', 'pitch', 'speed', 'gap1', 'gap2', 'bpm', 'swing', 'echo', 'mem']) t[k] = gauss() * (GR[k][1] - GR[k][0]) * 0.25 / 1800;
  return t;
}
function beginTransition() {
  S.phase = 'trans'; S.tr0 = S.clock; S.trDur = 180;
  S.from = cloneG(S.base); S.to = mutate(S.base); S.P = 1;
}
function endTransition() {
  S.base = S.to; S.G = S.base; S.from = S.to = null;
  S.phase = 'era'; S.transitions++; S.era++; S.traj = newTraj();
  S.P = 0.05 + 0.1 * rnd(); S.trS = 0; S.instab = 0;
  S.history.push({ era: S.era, dom: S.base.dom, at: S.clock });
  if (S.history.length > 60) S.history.shift();
  if (S.base.food > 0.05) placeFood();
}
function evoStep(dt) {
  const edt = dt * RATE * S.G.evRate;
  S.real += dt; S.clock += edt;
  const st = S.stats;
  if (S.phase === 'era') {
    const B = S.base;
    for (const k in S.traj) { const [a, b] = GR[k]; B[k] += S.traj[k] * edt; if (B[k] < a || B[k] > b) { B[k] = clamp(B[k], a, b); S.traj[k] *= -1; } }
    // pressure: a settled network, a saturated or starved ground, and the packet riding worn channels
    const stasis = 1 - clamp(st.flux / 0.35, 0, 1);
    const sat = st.cov > 0.42 ? (st.cov - 0.42) * 4 : st.cov < 0.05 ? (0.05 - st.cov) * 12 : 0;
    const worn = clamp(S.pk.mm, 0, 1);
    S.P += edt * (1 / 2400 + stasis / 2700 + sat / 900 + worn / 3600);
    const young = S.clock - (S.history[S.history.length - 1].at || 0) < 480;   // every era gets at least 8 minutes
    if (S.forced || (!young && S.P >= 1)) { S.forced = false; beginTransition(); }
    else if (young) S.P = Math.min(S.P, 0.9);
    S.G = S.base; S.instab = 0;
  }
  if (S.phase === 'trans') {
    S.trS = clamp((S.clock - S.tr0) / S.trDur, 0, 1);
    S.G = mixG(S.from, S.to, sstep(0.12, 0.88, S.trS));
    S.instab = Math.pow(Math.sin(Math.PI * S.trS), 2) * 0.8;
    if (S.trS >= 1) endTransition();
  }
  // a low sun circles every 47 minutes; its height drifts
  S.sunAz = wrapA(S.sunAz + edt * TAU / 2820);
  S.sunEl = 0.5 + 0.28 * fbm(S.clock / 1100, 17);
  if (S.G.food > 0.05 && S.clock - S.foodAt > 600) placeFood();
  if (S.G.food <= 0.05 && S.food.length) S.food = [];
}

/* ---------------- memory ---------------- */
// old hubs return as food: the strongest sediment peaks, never too close together
function placeFood() {
  S.foodAt = S.clock;
  const cand = [];
  for (let bz = 0; bz < 16; bz++) for (let bx = 0; bx < 16; bx++) {
    let best = 0, bi = 0;
    for (let z = 0; z < 16; z += 2) for (let x = 0; x < 16; x += 2) { const i = idx(bx * 16 + x, bz * 16 + z); if (D[i] > best) { best = D[i]; bi = i; } }
    if (best > 0.08) cand.push({ x: bi & 255, z: bi >> 8, s: best });
  }
  cand.sort((a, b) => b.s - a.s);
  const out = [];
  for (const c of cand) {
    if (out.length >= 5) break;
    if (out.every(o => { const dx = wrapA((c.x - o.x) / N * TAU) / TAU * N, dz = wrapA((c.z - o.z) / N * TAU) / TAU * N; return dx * dx + dz * dz > 1600; })) out.push(c);
  }
  const mx = out.length ? out[0].s : 1;
  S.food = out.map(o => ({ x: o.x, z: o.z, s: clamp(o.s / mx, 0.4, 1) }));
}
function memStep(edt) {
  const iT = 1 / S.tRef, iU = 1 / S.uRef;
  const upM = 1 - Math.exp(-edt / 150), dnM = 1 - Math.exp(-edt / 3600);
  const upD = 1 - Math.exp(-edt / 1800), dnD = 1 - Math.exp(-edt / 21600);
  for (let i = 0; i < NN; i++) {
    let tn = T[i] * iT; if (uActive) tn = Math.max(tn, U[i] * iU * 0.8);
    tn = tn > 1 ? 1 : tn >= 0 ? tn : 0;          // a poisoned trail never reaches memory
    const m = M[i]; M[i] = m + (tn - m) * (tn > m ? upM : dnM);
    const d = D[i], mm = M[i]; D[i] = d + (mm - d) * (mm > d ? upD : dnD);
  }
}

/* ---------------- simulation ---------------- */
function diffuse(src, dst, decay, reinf) {
  for (let z = 0; z < N; z++) {
    const zu = ((z + 255) & 255) << 8, zc = z << 8, zd = ((z + 1) & 255) << 8;

    for (let i = 0; i < NA; i++) { ag[i * 3] = Math.round(ax[i] * 256) & 0xffff; ag[i * 3 + 1] = Math.round(az[i] * 256) & 0xffff; ag[i * 3 + 2] = Math.round(((wrapA(ah[i]) + Math.PI) / TAU) * 65535); }
    const st = Object.assign({}, S, { rings: [], jHist: [], vHist: [], cut: null, rs: R.s });
    localStorage.setItem(KEY, JSON.stringify({ st, na: NA, M: b64(new Uint8Array(mi.buffer)), D: b64(new Uint8Array(di.buffer)), ag: b64(new Uint8Array(ag.buffer)), savedAt: Date.now() }));
  } catch (err) { }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return false;
    const d = JSON.parse(raw); if (!d.st || d.st.v !== 1) return false;
    const mi = new Uint16Array(unb64(d.M).buffer), di = new Uint16Array(unb64(d.D).buffer);
    if (mi.length !== NN || di.length !== NN) return false;
    for (let i = 0; i < NN; i++) { M[i] = mi[i] / 65535; D[i] = di[i] / 65535; T[i] = 0; U[i] = 0; K[i] = 0; }
    S = d.st; R.s = d.st.rs | 0; NSEED = S.seed | 0; delete S.rs;
    const ag = new Uint16Array(unb64(d.ag).buffer), n = Math.min(NA, (ag.length / 3) | 0);
    for (let i = 0; i < NA; i++) {
      if (i < n) { ax[i] = ag[i * 3] / 256; az[i] = ag[i * 3 + 1] / 256; ah[i] = ag[i * 3 + 2] / 65535 * TAU - Math.PI; }
      else { ax[i] = rnd() * N; az[i] = rnd() * N; ah[i] = rnd() * TAU; }
    }
    S.G = S.phase === 'trans' && S.from && S.to ? mixG(S.from, S.to, sstep(0.12, 0.88, S.trS)) : S.base;
    return true;
  } catch (err) { return false; }
}

/* ---------------- disclosure box ---------------- */
const info = document.getElementById('info');
function fmtT(s) { s = Math.floor(s); const hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60; return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }
function updateInfo() {
  const [bg, i1, i2, i3] = palRGB.map(c => c.map(v => Math.round(v * 255)));
  document.body.style.background = `rgb(${bg})`;
  if (!SHOW_INFO) { info.style.display = 'none'; return; }
  info.style.display = 'block';
  info.style.background = `rgba(${bg},0.84)`; info.style.borderColor = `rgb(${i1})`; info.style.color = `rgb(${i3})`;
  const G = S.G, st = S.stats, p = S.pk;
  const lvl = o => FORMS.includes(o) ? (o === G.form ? 1 : 0) : G[o];
  const rules = OPS.filter(o => S.caps[o]).map(o => { const v = lvl(o); return v > 0.6 ? `<span class="hi">${o.toUpperCase()}</span>` : v > 0.12 ? o : `<span class="lo">${o}</span>`; }).join(' ');
  const locked = OPS.filter(o => !S.caps[o]).length;
  const bar = n => { const f = Math.round(clamp(n, 0, 1) * 12); return '▮'.repeat(f) + '▯'.repeat(12 - f); };
  const now = S.phase === 'trans'
    ? `rules deforming → ${DESC[S.to.dom]}${S.newCap ? '  [new rule: ' + S.newCap + ']' : ''}`
    : DESC[G.dom] + (TOGGLES.includes(G.dom) ? ` · form: ${G.form}` : '');
  const w = p.w;
  const vein = p.lost > 1.5 ? 'searching for a vein' : p.mm > 0.55 && w > 4.5 ? 'riding a worn trunk' : w > 5.5 ? 'riding a thick vein' : w > 3 ? 'riding a vein' : 'on a thin new vein';
  const L = [];
  L.push(`<span style="color:rgb(${i2})">MZTV / STIGMERGY</span>   era ${String(S.era).padStart(2, '0')} · running ${fmtT(S.real)}${RATE !== 1 ? ' · evolution ×' + RATE : ''}`);
  L.push(`<span class="k">now      </span>${now}`);
  L.push(`<span class="k">rules    </span>${rules}${locked ? `<span class="lo">  +${locked} not yet possible</span>` : ''}`);
  L.push(`<span class="k">planes   </span>live trail ${Math.round(st.cov * 100)}% · channels ${Math.round(st.mMean * 100)}% · sediment ${Math.round(st.dMean * 100)}%${S.food.length && G.food > 0.05 ? ` · ${S.food.length} hubs fed from sediment` : ''}`);
  L.push(S.phase === 'trans'
    ? `<span class="k">pressure </span><span style="color:rgb(${i2})">${bar(S.trS)}</span> transition ${Math.round(S.trS * 100)}%`
    : `<span class="k">pressure </span>${bar(S.P)} rises as the network settles, saturates, or retraces itself`);
  L.push(`<span class="k">packet   </span>${vein} · hears ${st.vpm || 0} veins/min · crosses ${st.jpm} junctions/min${S.pk2 ? ' · second packet on colony B' : ''}`);
  L.push(`<span class="k">sound    </span>sub = the vein under the packet · plucks = veins entering earshot, accents = junctions (ringed)`);
  L.push(`<span class="k">         </span>kick = ground covered · chords extend with loops · echo = channel depth`);
  L.push(`<span class="k">         </span>${NOTE_NAMES[((ROOTS[G.root] % 12) + 12) % 12]} ${MODE_NAMES[G.mode]} · ${Math.round(G.bpm)} bpm · ${DITHER_NAMES[G.dither]} dither`);
  info.innerHTML = L.join('\n');
}
addEventListener('keydown', ev => {
  if (ev.key === 'i') { SHOW_INFO = !SHOW_INFO; updateInfo(); }
  if (ev.key === 't' && S.phase === 'era') S.forced = true;
});

/* ---------------- boot ---------------- */
let seed = Q.get('seed') ? (parseInt(Q.get('seed'), 10) >>> 0) : ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
if (FRESH || !load()) {
  freshState(seed);
  // pre-history: long streams swept this ground once; their channels are already worn into the sediment
  const keep = cloneG(S.base);
  S.G = Object.assign(cloneG(S.base), ARCH.streams);
  for (let i = 0; i < 70; i++) { simStep(); if (i % 10 === 9) { stats(); memStep(40); } }
  for (let i = 0; i < NN; i++) { D[i] = M[i] * 0.3; M[i] *= 0.3; }
  S.G = S.base = keep;
  for (let i = 0; i < 110; i++) { simStep(); if (i % 10 === 9) { stats(); memStep(6); } }
  stats();
  S.real = 0; S.clock = 0;
} else {
  for (let i = 0; i < 50; i++) { simStep(); if (i % 10 === 9) stats(); }
  stats();
}
// start on a vein: drop the packet onto the strongest trail we can find near it
{ let best = -1, bx = S.pk.x, bz = S.pk.z; for (let k = 0; k < 400; k++) { const x = rnd() * N, z = rnd() * N, v = Tn(x, z); if (v > best) { best = v; bx = x; bz = z; } } if (Tn(S.pk.x, S.pk.z) < 0.4) { S.pk.x = bx; S.pk.z = bz; } }
S.cam.x = S.pk.x - Math.cos(S.pk.h) * 60; S.cam.z = S.pk.z - Math.sin(S.pk.h) * 60; S.cam.yaw = S.pk.h; S.cam.y = S.G.hgt; S.cam.pitch = S.G.pitch;
for (let i = 0; i < 90; i++) { packets(SIM_DT); camStep(SIM_DT); }
const FF = parseFloat(Q.get('ff') || '0');
if (FF > 0) { const steps = Math.round(FF * 3600); for (let i = 0; i < steps; i++) { simStep(); evoStep(1 / RATE); if (i % 6 === 5) memStep(6); cutStep(1 / RATE); if (i % 30 === 29) stats(); packets(SIM_DT); camStep(SIM_DT); } S.rings = []; }
try { initGL(); } catch (err) { console.error(err); glOK = false; }
if (!MUTE && !CAPTURE) { createContext().catch(() => { }); }
setInterval(audioSchedule, 40);
setInterval(audioWatch, 1000);
setInterval(save, 60000);
addEventListener('pagehide', save);

let last = performance.now(), simAcc = 0, memAcc = 0, ctlAcc = 0, infoAcc = 1, statAcc = 0, healAcc = 0;
function frame(now, fixedDt) {
  if (!CAPTURE) requestAnimationFrame(frame);
  let dt = fixedDt || (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60; dt = Math.min(dt, 0.1);
  const p0 = performance.now();
  try {
    evoStep(dt);
    simAcc += dt; let n = 0;
    while (simAcc >= SIM_DT && n++ < 2) { simAcc -= SIM_DT; simStep(); dirty = true; }
    if (simAcc > SIM_DT * 3) simAcc = 0;
    memAcc += dt; if (memAcc >= 0.2) { memStep(memAcc * RATE * S.G.evRate); memAcc = 0; }
    cutStep(dt);
    packets(dt); camStep(dt);
    statAcc += dt; if (statAcc >= 1) { statAcc = 0; stats(); }
    healAcc += dt; if (healAcc >= 1) { healAcc = 0; heal(); }
    render();
    ctlAcc += dt; if (ctlAcc > 0.1) { ctlAcc = 0; audioControl(); }
    infoAcc += dt; if (infoAcc > 1) { infoAcc = 0; updateInfo(); }
  } catch (err) { console.error(err); }
  PERF.ms = PERF.ms * 0.95 + (performance.now() - p0) * 0.05;
}
const PERF = { ms: 0 };
if (!CAPTURE) requestAnimationFrame(frame);
window.MZ = {
  tick: dt => frame(performance.now(), dt), get S() { return S; }, F: { get T() { return T; }, get U() { return U; }, M, D, K }, AU, PERF, save, stats, rebuildGraph, recreateContext,
  force: op => { if (op) S.forceDom = op; S.forced = true; }, cut: doCut, set: o => Object.assign(S.base, o)
};
})();
