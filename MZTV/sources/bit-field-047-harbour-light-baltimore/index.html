<style>

</style></head><body>
<canvas id="screen" aria-label="Generative Baltimore harbour, c.1957, seen by slow crane cameras, with the Domino Sugars sign reflected in the water"></canvas>
<div id="info"></div>
<script>
'use strict';
/* =====================================================================
   MZTV · BIT FIELD 047 · HARBOUR LIGHT · BALTIMORE 1957
   The working harbour of Baltimore in its last peak years, c.1957,
   built as a 3D place in real metres and filmed by slow crane cameras
   on the Pratt Street piers, Fells Point and a crane barge in the
   Northwest Branch. Every camera faces into one 120° arc (SE → SW):
   across the water to the Domino Sugars refinery and its neon sign
   (lit since April 1951), the Bethlehem Key Highway yard under Federal
   Hill, the B&O grain elevator on Locust Point and Fort McHenry.
   The sun is Baltimore's real sun; the weather is Baltimore's live
   weather. At night the sign lies in the water.
   ===================================================================== */
const Q=new URLSearchParams(location.search);
const qn=(k,d)=>{const v=Number(Q.get(k));return Q.has(k)&&Number.isFinite(v)?v:d;};
const LINKED=window.MZTV_LINKED===true;
const OPT={
  info:Q.get('info')!=='0', fresh:Q.get('fresh')==='1', audio:Q.get('audio')!=='0',
  seed:qn('seed',47)|0, rate:Math.max(.05,Math.min(240,qn('rate',1))), lines:Math.max(90,Math.min(400,qn('lines',216)|0)),
  ff:Math.max(0,Math.min(96,qn('ff',0))), capture:Q.get('capture')==='1', live:Q.get('live')!=='0',
  hour:Q.has('hour')?qn('hour',20):null, held:(Q.get('held')||'').toLowerCase(), focus:(Q.get('focus')||'').toLowerCase(),
  cam:Q.has('cam')?qn('cam',0)|0:-1, ships:Q.get('ships')==='1', fps:Math.max(8,Math.min(60,qn('fps',30))), shot:(Q.get('shot')||'').toLowerCase()
};
const MEMORY_ON=!OPT.capture;
const STORE=LINKED?'mztv-harbour-light-baltimore-play-v1':'mztv-harbour-light-baltimore-v1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const fin=(v,d)=>Number.isFinite(v)?v:d, D2R=Math.PI/180;
const ease5=e=>{e=clamp(e,0,1);return e*e*e*(e*(e*6-15)+10);};
const angDiff=(a,b)=>((a-b+540)%360)-180;

/* ---------- deterministic randomness ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash3(a,b,c){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,2147483647)+OPT.seed*97;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
const PERM=new Uint8Array(512);{const r=mulberry(OPT.seed*7919+11),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=r()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)PERM[i]=p[i&255];}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
  const a=PERM[PERM[X]+Y],b=PERM[PERM[X+1]+Y],c=PERM[PERM[X]+Y+1],d=PERM[PERM[X+1]+Y+1];
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return((a+(b-a)*u)+((c+(d-c)*u)-(a+(b-a)*u))*v)/255;}
function fbm3(x,y){return vn(x,y)*.55+vn(x*2.03+17.1,y*2.03+3.7)*.3+vn(x*4.1+5.3,y*4.1+41.9)*.15;}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

/* ---------- the place: metres east (x) and north (z) of the Domino Sugars sign ---------- */
const ORIGIN={lat:39.2748,lon:-76.6003};
const LL=(lat,lon)=>[(lon-ORIGIN.lon)*86190,(lat-ORIGIN.lat)*111000];
const BALT={lat:39.2848,lon:-76.6100};          // weather point: the Inner Harbor
// open water of the Inner Harbor, the Northwest Branch and the Patapsco (approximate 1957 shoreline)
const WATER=[[-1100,1300],[-164,1290],[-100,1150],[150,1000],[400,880],[612,800],[900,700],[1300,560],[1750,400],[2400,200],[3000,-100],[3600,-400],[4500,-900],
  [6000,-2000],[9000,-3400],[16000,-3200],[16000,-9500],[7000,-6100],[3500,-4500],[2200,-2600],[1850,-1330],[1700,-1100],[1400,-700],[1100,-350],[800,-120],[700,40],
  [400,120],[150,205],[-100,262],[-300,385],[-600,525],[-800,705],[-1100,745]];
const MASK={x0:-2400,z0:-10000,res:25,nx:0,nz:0,d:null};
function buildMask(){
  MASK.nx=Math.ceil((16500-MASK.x0)/MASK.res);MASK.nz=Math.ceil((2400-MASK.z0)/MASK.res);MASK.d=new Uint8Array(MASK.nx*MASK.nz);
  const P=WATER,n=P.length;
  for(let j=0;j<MASK.nz;j++){const z=MASK.z0+(j+.5)*MASK.res;const xs=[];
    for(let i=0,k=n-1;i<n;k=i++){const [xi,zi]=P[i],[xk,zk]=P[k];if((zi>z)!==(zk>z))xs.push(xi+(z-zi)/(zk-zi)*(xk-xi));}
    xs.sort((a,b)=>a-b);
    for(let q=0;q+1<xs.length;q+=2){const a=Math.max(0,Math.floor((xs[q]-MASK.x0)/MASK.res)),b=Math.min(MASK.nx-1,Math.floor((xs[q+1]-MASK.x0)/MASK.res));for(let i=a;i<=b;i++)MASK.d[j*MASK.nx+i]=1;}
  }
}
function isWater(x,z){const i=((x-MASK.x0)*.04)|0,j=((z-MASK.z0)*.04)|0;if(i<0||j<0||i>=MASK.nx||j>=MASK.nz)return z<-3000; return MASK.d[j*MASK.nx+i]===1;}

/* ---------- inks: four light moods, six inks each (dark → light), plus the neon ---------- */
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const MOODS={
  night:  ['#0b1230','#1b2a5e','#334f8f','#6a86b4','#bcc2b4','#f1e8cf'].map(hex),
  dawn:   ['#221f4f','#4f5d9c','#9eacc6','#e6c98c','#f5e09c','#fffae2'].map(hex),
  evening:['#24123a','#5e2458','#b4404a','#ea8338','#fbc74e','#fff2c6'].map(hex),
  day:    ['#2a2e5c','#5f6b9e','#a9b2b8','#e9c886','#f6e5ad','#fffbee'].map(hex)
};
const NEON=hex('#ff4326'),NEON2=hex('#ffa06a'),NEONDEEP=hex('#9a1832'),LAMPC=hex('#ffbf63'),WINC=hex('#ffe09a');
const rgba32=c=>(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0];
const NEON32=rgba32(NEON),NEON2_32=rgba32(NEON2),DEEP32=rgba32(NEONDEEP),LAMP32=rgba32(LAMPC),WIN32=rgba32(WINC);

/* ---------- solar position (NOAA, simplified) ---------- */
function solar(lat,lon,ms){
  const d=ms/86400000+2440587.5-2451545,g=(357.529+.98560028*d)*D2R,q=280.459+.98564736*d;
  const L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*D2R,e=(23.439-3.6e-7*d)*D2R;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=(18.697374558+24.06570982441908*d)%24,lst=(gmst*15+lon)*D2R;
  let ha=lst-ra;ha=Math.atan2(Math.sin(ha),Math.cos(ha));
  const la=lat*D2R,el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha));
  const az=(Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(dec)*Math.cos(la))/D2R+180+360)%360;
  return{elev:el/D2R,az,ha:ha*12/Math.PI};
}
/* Baltimore clock (America/New_York), cached */
let tzCache={at:-1e12,off:-18000};
function nyOffset(ms){
  if(Math.abs(ms-tzCache.at)<600000)return tzCache.off;
  let off=-18000;try{const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(ms));
    const o={};for(const x of p)o[x.type]=+x.value;const asUTC=Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute);off=Math.round((asUTC-Math.floor(ms/60000)*60000)/60000)*60;}catch(e){}
  tzCache={at:ms,off};return off;
}
let LOCAL={h:12,day:0,off:-18000};
function updateClock(){
  let ms=simT*1000;const off=nyOffset(ms);LOCAL.off=off;
  let loc=ms/1000+off;
  if(OPT.hour!=null){const dayStart=Math.floor(loc/86400)*86400;loc=dayStart+clamp(OPT.hour,0,23.99)*3600+((simT-T0/1000)%86400);ms=(loc-off)*1000;}
  LOCAL.h=((loc%86400)+86400)%86400/3600;LOCAL.day=Math.floor(loc/86400);LOCAL.ms=ms;
}

/* ---------- canvases ---------- */
const cv=$('screen'),g=cv.getContext('2d',{alpha:false});
function mkC(){const c=document.createElement('canvas');return[c,c.getContext('2d',{willReadFrequently:true})];}
const [mk,mg]=mkC(),[rk,rg]=mkC(),[ek,eg]=mkC(),[erk,erg]=mkC(); // silhouettes / reflected silhouettes / lights / reflected lights
let W=384,H=216,SCALE=5,img=null,px32=null,LB=null,DB=null,HZ=null;
const GS=3;let SG=null,RG=null,GW=0,GH=0,bMap=null,B1=null,B2=null,B3=null,B4=null,BT=null,EA=null,EB=null,EC=null,NA=null,horizL=null;
const ecls=(r,g,b)=>r>g*1.6?(r>200?1:4):(r>200&&b<120?2:3);
function resize(){
  const vw=Math.max(1,innerWidth),vh=Math.max(1,innerHeight);
  SCALE=Math.max(1,Math.round(vh/OPT.lines));H=Math.ceil(vh/SCALE);W=Math.ceil(vw/SCALE);
  cv.width=W;cv.height=H;cv.style.width=W*SCALE+'px';cv.style.height=H*SCALE+'px';
  for(const c of[mk,rk,ek,erk]){c.width=W;c.height=H;}
  img=g.createImageData(W,H);px32=new Uint32Array(img.data.buffer);
  const N=W*H;LB=new Float32Array(N);DB=new Float32Array(N);HZ=new Float32Array(N);
  bMap=new Float32Array(N);B1=new Float32Array(N);B2=new Float32Array(N);B3=new Float32Array(N);B4=new Float32Array(N);BT=new Float32Array(N);
  EA=new Float32Array(N);EB=new Float32Array(N);EC=new Uint8Array(N);NA=new Float32Array(N);
  GW=Math.ceil(W/GS)+2;GH=Math.ceil(H/GS)+2;SG=new Float32Array(GW*GH);RG=new Float32Array(GW*GH);horizL=new Float32Array(W);
}

/* ---------- camera ---------- */
const CAM={x:0,y:20,z:1000,yaw:180,pitch:0,fov:40,F:300,f:[0,0,1],r:[1,0,0],u:[0,1,0],mir:false};
function setBasis(c){
  const cy=Math.cos(c.yaw*D2R),sy=Math.sin(c.yaw*D2R),cp=Math.cos(c.pitch*D2R),sp=Math.sin(c.pitch*D2R);
  c.f=[sy*cp,sp,cy*cp];c.r=[cy,0,-sy];c.u=[-sy*sp,cp,-cy*sp];c.F=(W/2)/Math.tan(c.fov*D2R/2);
}
function mirrorOf(c){const m={...c,y:-c.y,pitch:-c.pitch,mir:true};setBasis(m);return m;}
// project to camera space; returns [sx,sy,cz]
const NEAR=2;
function toCam(c,x,y,z,o){const dx=x-c.x,dy=y-c.y,dz=z-c.z;
  o[0]=dx*c.r[0]+dz*c.r[2];o[1]=dx*c.u[0]+dy*c.u[1]+dz*c.u[2];o[2]=dx*c.f[0]+dy*c.f[1]+dz*c.f[2];return o;}
function scr(c,cx,cy,cz,o,i){const k=c.F/cz;o[i]=W/2+cx*k;o[i+1]=H/2-(c.mir?-1:1)*cy*k;}
const TMP=[0,0,0],CL=[],CLo=[];
// fill a 3D polygon (flat array x,y,z,...) with near-plane clipping
function poly3(ctx,c,P){
  const n=P.length/3;CL.length=0;let behind=0;
  for(let i=0;i<n;i++){toCam(c,P[i*3],P[i*3+1],P[i*3+2],TMP);CL.push(TMP[0],TMP[1],TMP[2]);if(TMP[2]<NEAR)behind++;}
  if(behind===n)return false;
  let pts=CL;
  if(behind){CLo.length=0;for(let i=0;i<n;i++){const j=(i+1)%n,az=CL[i*3+2],bz=CL[j*3+2];
      if(az>=NEAR)CLo.push(CL[i*3],CL[i*3+1],az);
      if((az>=NEAR)!==(bz>=NEAR)){const t=(NEAR-az)/(bz-az);CLo.push(lerp(CL[i*3],CL[j*3],t),lerp(CL[i*3+1],CL[j*3+1],t),NEAR);}}
    pts=CLo;}
  const m=pts.length/3;if(m<3)return false;
  ctx.beginPath();const k0=c.F/pts[2];ctx.moveTo(W/2+pts[0]*k0,H/2-(c.mir?-1:1)*pts[1]*k0);
  for(let i=1;i<m;i++){const k=c.F/pts[i*3+2];ctx.lineTo(W/2+pts[i*3]*k,H/2-(c.mir?-1:1)*pts[i*3+1]*k);}
  ctx.closePath();return true;
}
function line3(ctx,c,x1,y1,z1,x2,y2,z2,wm){
  toCam(c,x1,y1,z1,TMP);let a0=TMP[0],a1=TMP[1],a2=TMP[2];toCam(c,x2,y2,z2,TMP);let b0=TMP[0],b1=TMP[1],b2=TMP[2];
  if(a2<NEAR&&b2<NEAR)return;
  if(a2<NEAR){const t=(NEAR-a2)/(b2-a2);a0=lerp(a0,b0,t);a1=lerp(a1,b1,t);a2=NEAR;}
  if(b2<NEAR){const t=(NEAR-b2)/(a2-b2);b0=lerp(b0,a0,t);b1=lerp(b1,a1,t);b2=NEAR;}
  const s=c.mir?-1:1,ka=c.F/a2,kb=c.F/b2;
  ctx.lineWidth=clamp(wm*c.F/((a2+b2)/2),.7,4);
  ctx.beginPath();ctx.moveTo(W/2+a0*ka,H/2-s*a1*ka);ctx.lineTo(W/2+b0*kb,H/2-s*b1*kb);ctx.stroke();
}
function point3(ctx,c,x,y,z,sizeM,o){toCam(c,x,y,z,TMP);if(TMP[2]<NEAR)return false;const k=c.F/TMP[2];
  o[0]=W/2+TMP[0]*k;o[1]=H/2-(c.mir?-1:1)*TMP[1]*k;o[2]=Math.max(.6,sizeM*k);o[3]=TMP[2];return o[0]>-8&&o[0]<W+8&&o[1]>-8&&o[1]<H+8;}
const PT=[0,0,0,0];

/* ---------- light and air (set each frame) ---------- */
const AIR={sky:0,vis:9000,sunUp:0,amb:.3,dif:.5,sunH:[0,-1],light:.6,night:0};
function hazeAt(d){return clamp(1-Math.exp(-d/AIR.vis),0,1);}
function depth01(d){return clamp(Math.log(Math.max(d,30)/30)/Math.log(300),0,1);} // 30 m → 0, 9 km → 1
// silhouette colour: R = haze, G = depth, B = tone (paint × light)
function sil(d,tone){return`rgb(${(hazeAt(d)*255)|0},${(depth01(d)*255)|0},${(clamp(tone,0,1)*255)|0})`;}
function faceTone(tone,nx,nz){const s=nx*AIR.sunH[0]+nz*AIR.sunH[1];return tone*(AIR.amb+AIR.sky+AIR.dif*Math.max(0,s));}

/* ---------- the drawing passes ---------- */
// pass = {c: camera, m: silhouette ctx, e: lights ctx}
function occlude(p){p.e.globalCompositeOperation='destination-out';p.e.fillStyle='#000';p.e.fill();p.e.globalCompositeOperation='source-over';}
function drawPoly(p,P,d,tone){if(!poly3(p.m,p.c,P))return;p.m.fillStyle=sil(d,tone);p.m.fill();occlude(p);}
let LIGHTS_N=0;
const rgbaS=(col,a)=>`rgba(${col[0]},${col[1]},${col[2]},${a.toFixed(3)})`;
function light(p,x,y,z,sz,col,a){if(typeof col!=='string')col=rgbaS(col,a);if(!point3(p.e,p.c,x,y,z,sz,PT))return;LIGHTS_N++;p.e.fillStyle=col;const s=Math.min(PT[2],2.2);p.e.fillRect(PT[0]-s/2,PT[1]-s/2,s,s);}

/* oriented box: centre (x,z), half-length hx along heading yaw, half-width hz, from y0 to y1 */
function boxFaces(b){
  const ca=Math.sin(b.yaw*D2R),cb=Math.cos(b.yaw*D2R); // along = (sin,cos) in (x,z)
  const ax=ca*b.hx,az=cb*b.hx,bx=cb*b.hz,bz=-ca*b.hz;
  const C=[[b.x-ax-bx,b.z-az-bz],[b.x+ax-bx,b.z+az-bz],[b.x+ax+bx,b.z+az+bz],[b.x-ax+bx,b.z-az+bz]];
  b.C=C;b.N=[[-cb,ca],[ca,cb],[cb,-ca],[-ca,-cb]];// normals of edges C0-C1 (−b side), C1-C2 (+a), C2-C3 (+b), C3-C0 (−a)
}
function drawBox(p,b,d){
  const c=p.c,C=b.C;
  for(let i=0;i<4;i++){const j=(i+1)%4,n=b.N[i],mx=(C[i][0]+C[j][0])/2,mz=(C[i][1]+C[j][1])/2;
    if(n[0]*(c.x-mx)+n[1]*(c.z-mz)<=0)continue;
    drawPoly(p,[C[i][0],b.y0,C[i][1],C[j][0],b.y0,C[j][1],C[j][0],b.y1,C[j][1],C[i][0],b.y1,C[i][1]],d,faceTone(b.tone,n[0],n[1]));
    if(b.win&&AIR.night>.2)windows(p,b,C[i],C[j],n,d,i);}
  if(b.gable){const a=b.gable;// ridge along heading at height y1+a
    const ca=Math.sin(b.yaw*D2R),cb=Math.cos(b.yaw*D2R),r0=[b.x-ca*b.hx,b.z-cb*b.hx],r1=[b.x+ca*b.hx,b.z+cb*b.hx],yr=b.y1+a;
    for(const s of[-1,1]){const n=[cb*s,-ca*s];const e0=s<0?C[0]:C[3],e1=s<0?C[1]:C[2];
      if(n[0]*(c.x-b.x)+n[1]*(c.z-b.z)>0||c.y>yr)drawPoly(p,[e0[0],b.y1,e0[1],e1[0],b.y1,e1[1],r1[0],yr,r1[1],r0[0],yr,r0[1]],d,faceTone(b.tone*1.1,n[0]*.6,n[1]*.6)+.04);}
    for(const s of[-1,1]){const n=[ca*s,cb*s],e0=s<0?C[0]:C[1],e1=s<0?C[3]:C[2],r=s<0?r0:r1;
      if(n[0]*(c.x-r[0])+n[1]*(c.z-r[1])>0)drawPoly(p,[e0[0],b.y1,e0[1],e1[0],b.y1,e1[1],r[0],yr,r[1]],d,faceTone(b.tone,n[0],n[1]));}
  }else if(c.y>b.y1&&!p.c.mir)drawPoly(p,[C[0][0],b.y1,C[0][1],C[1][0],b.y1,C[1][1],C[2][0],b.y1,C[2][1],C[3][0],b.y1,C[3][1]],d,b.tone*(AIR.amb*.8+AIR.dif*.5*AIR.sunUp)+.03);
}
function windows(p,b,A,B,n,d,face){
  const len=Math.hypot(B[0]-A[0],B[1]-A[1]),nx=Math.max(1,Math.floor(len/b.win)),ny=Math.max(1,Math.floor((b.y1-b.y0-2)/3.6));
  if(d/len>60)return;
  const lit=b.lit*AIR.night*.5,sz=.9,seed=b.id*31+face*7,cs=rgbaS(WINC,.75);if(LIGHTS_N>4000)return;
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const h=hash3(seed+i,j,LOCAL.day+Math.floor(LOCAL.h*2+hash3(i,j,seed)*6));if(h>lit)continue;
    const t=(i+.5)/nx;light(p,lerp(A[0],B[0],t)+n[0]*.3,b.y0+2.2+j*3.6,lerp(A[1],B[1],t)+n[1]*.3,sz,cs);}
}

/* ---------- vessels of 1957, drawn as two crossed profiles ----------
   bayline   Old Bay Line night steamer (City of Norfolk / City of Richmond), white, one tall stack
   reefer    a United Fruit banana boat, white hull
   freighter Liberty/Victory-type cargo ship, dark hull, midship house, kingposts and booms
   sugarship a raw-sugar freighter at the Domino wharf
   tug       Baker-Whiteley / Curtis Bay harbour tug, tall stack
   carfloat  B&O car float with boxcars (towed on the hip by a tug)
   skipjack  Chesapeake oyster dredger, sails down; deadrise, buyboat: bay workboats         */

function drawShip(p,o,d){
  const S=SHIPS[o.k],c=p.c,hd=o.hd*D2R,fx=Math.sin(hd),fz=Math.cos(hd),sx=fz,sz=-fx; // forward, starboard
  const r=o.roll||0,cu=Math.cos(r),su=Math.sin(r),y0=o.lift||0;
  // the side of the hull facing the camera decides where the end profile sits
  const side=(c.x-o.x)*sx+(c.z-o.z)*sz>0?1:-1;
  const vv=(u,v,w,P)=>{P.push(o.x+fx*u+sx*(w+v*su),y0+v*cu,o.z+fz*u+sz*(w+v*su));};
  const toward=(c.x-o.x)*fx+(c.z-o.z)*fz>0?1:-1; // camera ahead (+) or astern (−)
  const sunS=(sx*AIR.sunH[0]+sz*AIR.sunH[1])*side,sunF=(fx*AIR.sunH[0]+fz*AIR.sunH[1])*toward;
  const dist=d;
  // end profile (at mid-length), then the long profile
  const ends=()=>{for(const q of S.end){const P=[];for(let i=0;i<q.p.length;i+=2)vv(0,q.p[i+1],q.p[i],P);drawPoly(p,P,dist,q.t*(AIR.amb+AIR.sky+AIR.dif*Math.max(0,sunF)));}};
  const prof=()=>{for(const q of S.prof){const P=[];for(let i=0;i<q.p.length;i+=2)vv(q.p[i],q.p[i+1],0,P);drawPoly(p,P,dist,q.t*(AIR.amb+AIR.sky+AIR.dif*Math.max(0,sunS)));}};
  if(Math.abs((c.x-o.x)*fx+(c.z-o.z)*fz)>Math.abs((c.x-o.x)*sx+(c.z-o.z)*sz)*1.6){prof();ends();}else{ends();prof();}
  p.m.strokeStyle=sil(d,.12*AIR.amb+.05);
  for(const l of S.lines){const a=[],b=[];vv(l[0],l[1],0,a);vv(l[2],l[3],0,b);line3(p.m,c,a[0],a[1],a[2],b[0],b[1],b[2],l[4]);}
  if(AIR.night>.15){for(const L of S.lights){const P=[];vv(L[0],L[1],L[2]==='w'?side*S.B*.42:0,P);
    const col=L[2]==='w'?WINC:L[2]==='g'?[120,255,160]:LAMPC;light(p,P[0],P[1],P[2],L[2]==='w'?.8:1.1,col,L[2]==='w'?.75*AIR.night*(o.dark?0:1):.95*AIR.night);}}
}

function along(P,s){ // s in metres from start

/* ---------- the camera: shots on cranes ---------- */

/* ---------- eras: WORKING · VEIL · GLASS · LONG TAKE ---------- */

  if(ERA.name==='LONG TAKE'){if(simT>ERA.until){setEra('WORKING');ERA.pressure=0;MEM.takes++;MEM.lastTake=simT;logEv('the long take ended; cutting again');}}
  else if(ERA.pressure>1&&(MEM.hours>3||OPT.capture)&&age>900&&simT-MEM.lastTake>3*3600){setEra('LONG TAKE');ERA.until=simT+1100+hash3(MEM.takes,3,3)*700;SHOT=null;logEv('a crane began one long take');}

    if(tgt!==ERA.name){setEra(tgt);logEv(tgt==='VEIL'?'haze came off the water; the neon blooms':tgt==='GLASS'?'the branch went to glass; the sign lies whole':'the harbour is working again');}}

function updateFocus(){
  if(OPT.focus==='0'||OPT.focus==='off'){FOC.G=FOC.A=FOC.T=FOC.R=FOC.soft=0;FOC.from=FOC.to='off';FOC.left=0;return;}
  const t=simT-EPOCH,b=Math.floor(t/FOCUS_BLOCK),fr=t-b*FOCUS_BLOCK,dur=120+hash3(b,2,53)*60;
  const e=ease5(fr/dur),p=focusParams(b-1),q=focusParams(b);

/* ---------- palette ---------- */
let MOOD=null,PAL=[],PALr=[],SUN=null,NEON_ON=0;
function computeLight(){
  const sol=OPT.held==='evening'?{elev:3,az:238}:OPT.held==='night'?{elev:-25,az:300}:OPT.held==='dawn'?{elev:2,az:118}:OPT.held==='day'?{elev:30,az:190}:solar(39.285,-76.61,LOCAL.ms);
  SUN=sol;const e=sol.elev,aw=sol.az>180?1:0;
  const wN=1-sstep(-11,-3.5,e),wD=sstep(12,24,e)*(1-wN),wL=1-wN-wD;MOOD={e,aw:sstep(150,210,sol.az),wN,wD,wL};
  const over=sstep(55,100,WXS.cloud)*.4+sstep(0,2,WXS.rain)*.2;
  const drift=Math.sin(simT/5400)*.03+MEM.pigment;
  PAL=[];for(let i=0;i<6;i++){const c=[0,0,0];for(let k=0;k<3;k++){const low=lerp(MOODS.dawn[i][k],MOODS.evening[i][k],MOOD.aw);c[k]=MOODS.night[i][k]*wN+MOODS.day[i][k]*wD+low*wL;}

    if(i>=2&&i<=4){o[0]*=1+drift;o[2]*=1-drift*.8;}PAL.push(o.map(v=>clamp(v|0,0,255)));}
  PALr=PAL.map(rgba32);
  // light on things
  const sunUp=sstep(-2,10,e)*(1-sstep(60,100,WXS.cloud)*.6);
  AIR.sunUp=sunUp;AIR.sunH=[Math.sin(sol.az*D2R),Math.cos(sol.az*D2R)];
  AIR.amb=lerp(.14,.36,sstep(-8,15,e))*(1-wN*.4);AIR.dif=.5*sunUp;AIR.sky=.2*sstep(-4,12,e);AIR.night=1-sstep(-7,1,e);
  // the air of 1957: soft-coal haze from a working city, then fog

  // the nearest working tug: its engine is heard
  let best=0,pan=0;for(const o of LIVE){if(o.k!=='tug'||!o.mv)continue;const d=Math.hypot(o.x-CAM.x,o.z-CAM.z),v=200/(d+200);if(v>best){best=v;pan=screenPan(o.x,o.z);}}TUGNEAR=best;TUGPAN=pan;
  INDUST=clamp(1-Math.hypot(CAM.x-0,CAM.z-170)/1400,0,1);
  if(MEMORY_ON){const h=dt/3600;for(const st of STATIONS)if(st.unlock>0&&MEM.hours<st.unlock&&MEM.hours+h>=st.unlock)logEv('a crane went up at '+st.name.toLowerCase());MEM.hours+=h;if(WXS.wind<3)MEM.calm+=h;if(ERA.name==='VEIL')MEM.fog+=h;if(WXS.gust>14)MEM.storm+=h;MEM.pigment*=Math.exp(-h/12);
    const nt=AIR.night>.5;if(lastNight===false&&nt){MEM.nights++;logEv('the sign came on over the branch');}lastNight=nt;}
  for(const key in ST)if(!Number.isFinite(ST[key]))ST[key]=0;
  if(!Number.isFinite(ERA.pressure))ERA.pressure=0;
}
function prewarm(){ // the harbour was running before you arrived
  const steps=OPT.ff>0?Math.min(OPT.ff*360,40000):300;const dt=OPT.ff>0?10:1;simT-=steps*dt;
  for(let i=0;i<steps;i++){step(dt);}
}
let lastRaf=performance.now(),acc=0,lastSaveAt=0,lastInfo=0,frames=0,lastErr=0;
function loop(now){
  requestAnimationFrame(loop);
  if(OPT.capture&&window.MZ&&MZ.captureHold)return;
  const dtR=Math.min(.5,(now-lastRaf)/1000);lastRaf=now;acc+=dtR;if(acc<1/OPT.fps)return;
  const dt=Math.min(acc,.5)*OPT.rate;acc=0;
  try{step(dt);render();frames++;
    if(now-lastInfo>1000){updateInfo();lastInfo=now;}
    if(now-lastSaveAt>60000){save();lastSaveAt=now;}
  }catch(e){if(now-lastErr>5000){console.error(e);lastErr=now;}for(const key in ST)ST[key]=fin(ST[key],0);SHOT=null;}
}
addEventListener('resize',resize);
function gesture(){if(AU.ctx){if(AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{});}else startAudio();}
addEventListener('keydown',e=>{if(e.key==='i'||e.key==='I')info.classList.toggle('off');gesture();});
addEventListener('pointerdown',gesture);
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

/* ---------- test / capture handles ---------- */
window.MZ={
  get state(){return{simT,local:{...LOCAL},era:ERA.name,amt:{...ERA.amt},pressure:ERA.pressure,mem:JSON.parse(JSON.stringify(MEM)),st:{...ST},wx:{...WXS},sun:SUN,mood:MOOD,
    cam:{x:CAM.x,y:CAM.y,z:CAM.z,yaw:CAM.yaw,pitch:CAM.pitch,fov:CAM.fov},shot:SHOT&&{...SHOT,lastTg:undefined},live:LIVE.map(o=>o.name||o.k),smoke:SMOKE.length,neon:NEON_ON,signpx:SIGNPX,W,H,focus:{...FOC},audio:AU.ctx&&AU.ctx.state};},
  force(op){
    if(op==='take'){setEra('LONG TAKE');ERA.until=simT+1500;ERA.amt.take=1;SHOT=null;}
    else if(op==='glass'){setEra('GLASS');ERA.amt.glass=1;}
    else if(op==='veil'){setEra('VEIL');ERA.amt.veil=1;}
    else if(op==='working'){setEra('WORKING');for(const k in ERA.amt)ERA.amt[k]=0;}
    else if(op.startsWith('focus:'))OPT.focus=op.slice(6);
    else if(op.startsWith('cam:')){OPT.cam=+op.slice(4);SHOT=null;}
    else if(op.startsWith('shot:')){OPT.shot=op.slice(5);SHOT=null;}
    else if(op==='storm'){Object.assign(WX,{wind:16,gust:24,cloud:95,low:80,rain:2,hum:90,vis:5000,ok:true});Object.assign(WXS,WX);}
    else if(op==='calm'){Object.assign(WX,{wind:.6,gust:1.5,cloud:15,low:0,rain:0,hum:60,vis:30000,ok:true});Object.assign(WXS,WX);}
    else if(op==='fog'){Object.assign(WX,{wind:1.5,gust:3,cloud:100,low:100,rain:0,hum:99,vis:900,ok:true});Object.assign(WXS,WX);}
    else if(op==='unlock'){MEM.hours=Math.max(MEM.hours,6);MEM.learned=1;}
    else if(op==='poison'){ST.chop=NaN;ST.cloudX=Infinity;ERA.pressure=NaN;CAM.x=NaN;}
    else if(op==='next')SHOT=null;
  },
  hour(h){OPT.hour=h;SHOT=null;}, held(m){OPT.held=m;},
  step(sec,n=1){for(let i=0;i<n;i++)step(sec);render();updateInfo();},
  audio:AU, rebuild, save, captureHold:false
};

buildMask();resize();buildWorld();buildNearBoats();load();updateClock();computeLight();prewarm();
if(MEMORY_ON&&!MEM.log.length)logEv('the cranes went up on the piers');
fetchWX();setInterval(fetchWX,10*60*1000);
if(OPT.audio&&!OPT.capture){startAudio().then(()=>{if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{});});}
{step(.01);render();updateInfo();}
requestAnimationFrame(loop);
</script>
