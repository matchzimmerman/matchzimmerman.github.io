<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZ World Inverin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · INVERIN — full-frame print of a living coast; the info box is printed in the current inks */
:root { --ink:#1b1f3a; --paper:#efe6cf; --hot:#f0603f; --deep:#2c3e7a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(470px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-inverin-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 53.236, LON = -9.48;           // Inverin, Galway Bay
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();

/* ====================================================================== clock */
const dublin = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Dublin', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
function galwayParts(ms) { const s = dublin.format(new Date(ms)); const [h, m, sec] = s.split(':').map(Number); return { h, m, sec, str: s, hour: h + m / 60 + sec / 3600 }; }
let simMs = Date.now();
if (Q.has('hour')) { const want = +Q.get('hour'); const cur = galwayParts(simMs).hour; simMs += (((want - cur) % 24 + 24) % 24) * 3600e3; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;   // seconds of sim since load (scaled by RATE)

/* ====================================================================== noise + terrain (fixed salt so the place is the same for every seed) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function coastZ(x) {
  let z = 3 * Math.sin(x * 0.021) + 9 * (fbm(x * 0.018, 3.1) - 0.47);
  z -= 165 * Math.exp(-Math.pow((x + 135) / 42, 2));   // west headland
  z -= 230 * Math.exp(-Math.pow((x - 245) / 55, 2));   // far headland across the bay
  return z;
}
function landTop(x, z) {
  const hd = Math.exp(-Math.pow((x + 135) / 60, 2)), hr = Math.exp(-Math.pow((x - 245) / 70, 2));
  return 23 + 8 * fbm(x * 0.008 + 5, z * 0.008) + 0.035 * Math.max(0, z) + 24 * hd + 15 * hr;
}
function terrainH0(x, z) {
  const ripple = 2.4 * (vnoise(x * 0.17, 7.7) - 0.5) + 1.3 * (vnoise(x * 0.5, 2.2) - 0.5);
  const d = z - coastZ(x) + ripple;
  const top = landTop(x, z);
  const sea = -6 + Math.min(0, d) * 0.03 - 2 * fbm(x * 0.01, z * 0.01);
  const c = smoothstep(-1.5, 3.5, d);
  let h = sea + (top - sea) * c;
  h -= (1 - smoothstep(3.5, 14, d)) * c * 3.0;
  const g = Math.exp(-Math.pow((x - 20) / 10, 2)) * smoothstep(-4, 0, d) * (1 - smoothstep(60, 80, d));
  const slope = Math.max(0.8, Math.min(top, 0.8 + d * 0.5));
  return h + (slope - h) * g;
}

const FINES = [{ x0: -120, x1: 50, z0: -22, z1: 215 }, { x0: 50, x1: 152, z0: -45, z1: 95 }];
const inFine = (x, z) => FINES.some(F => x > F.x0 + 1.5 && x < F.x1 - 1.5 && z > F.z0 + 1.5 && z < F.z1 - 1.5);
/* ====================================================================== INVERIN: one ground for every place in it */
const CC = { x: -62, z: 150 }; const CC_Y = terrainH0(-62, 150);   // TWISTED TREE's clearing, inland of the west headland
const STREAM_C = [[-36, 196], [-30, 168], [-41, 138], [-36, 112], [-52, 84], [-50, 58], [-68, 34], [-72, 10], [-76, -2], [-78, -14]];   // SRUTHÁN, from the wood down to the sea
const crom = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
const STREAM = (() => { const C = STREAM_C, out = [];
  for (let i = 0; i < C.length - 1; i++) { const p0 = C[Math.max(0, i - 1)], p1 = C[i], p2 = C[i + 1], p3 = C[Math.min(C.length - 1, i + 2)];
    for (let k = 0; k < 40; k++) { const t = k / 40; out.push([crom(p0[0], p1[0], p2[0], p3[0], t), crom(p0[1], p1[1], p2[1], p3[1], t)]); } }
  out.push(C[C.length - 1]);
  let L = 0; const pts = out.map((p, i) => { if (i) L += Math.hypot(p[0] - out[i - 1][0], p[1] - out[i - 1][1]); const m = 1.1 * Math.sin(L * 0.19) + 0.5 * Math.sin(L * 0.47 + 1); return { x: p[0] + m, z: p[1] + 0.6 * m, s: L, e: 0, w: 0.75 + 0.3 * Math.sin(L * 0.11 + 2) + 0.3 * Math.sin(L * 0.31) }; });
  pts.forEach((p, i) => { const g = terrainH0(p.x, p.z); p.e = i ? Math.min(pts[i - 1].e - 0.012, g - 0.25) : g - 0.25; });
  for (let r = 0; r < 12; r++) { const o = pts.map(p => p.e); pts.forEach((p, i) => { if (i && i < pts.length - 1) p.e = Math.min(o[i - 1], (o[i - 1] + o[i] + o[i + 1]) / 3); }); }
  return { pts, L };
})();
const SB = { x0: Math.min(...STREAM.pts.map(p => p.x)) - 9, x1: Math.max(...STREAM.pts.map(p => p.x)) + 9, z0: Math.min(...STREAM.pts.map(p => p.z)) - 9, z1: Math.max(...STREAM.pts.map(p => p.z)) + 9 };
function streamNear(x, z) { let best = 1e9, bi = 0; const P = STREAM.pts; for (let i = 0; i < P.length; i += 4) { const d = (P[i].x - x) ** 2 + (P[i].z - z) ** 2; if (d < best) { best = d; bi = i; } }
  for (let i = Math.max(0, bi - 4); i <= Math.min(P.length - 1, bi + 4); i++) { const d = (P[i].x - x) ** 2 + (P[i].z - z) ** 2; if (d < best) { best = d; bi = i; } } return { d: Math.sqrt(best), p: P[bi] }; }
function terrainH(x, z) {
  let y = terrainH0(x, z);
  { const q = Math.exp(-Math.pow((x - 100) / 44, 2)), W = Math.max(0, (q - 0.06) / 0.94); if (W > 0) { const d = z - coastZ(x), top = landTop(x, z); const b = d < 0 ? Math.max(-6, 0.25 + d * 0.42) : d < 16 ? 0.25 + d * 0.085 : 1.61 + (top - 1.61) * smoothstep(16, 88, d); y = lerp(y, b + 0.25 * (vnoise(x * 0.4, z * 0.4) - 0.5), W); } }
  const dc2 = (x - CC.x) ** 2 + (z - CC.z) ** 2;
  if (dc2 < 2500) y = lerp(y, CC_Y, Math.exp(-dc2 / 260)) + 0.32 * Math.exp(-dc2 / 7);
  if (x > SB.x0 && x < SB.x1 && z > SB.z0 && z < SB.z1) { const n = streamNear(x, z); const k = 1 - smoothstep(n.p.w * 0.7, n.p.w + 4.2, n.d);
    if (k > 0) { const end = 1 - smoothstep(STREAM.L - 16, STREAM.L - 3, n.p.s); const bed = n.p.e - 0.32 * (1 - smoothstep(0, n.p.w, n.d)); y = lerp(y, bed, k * end); } }
  return y;
}

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;               // 0 new, π full
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)) };
}
// world axes: +x north, +z east, -z west (the open bay), y up
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); }; // (x,z) travel for a "from" bearing
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'ATLANTIC PRINT', c: ['#1b1f3a', '#2c3e7a', '#3f9aa6', '#f0603f', '#f2c14e', '#efe6cf'] },
  { name: 'BRUISE',         c: ['#1d1430', '#6a3b7d', '#8fd0c6', '#ff8c42', '#f4e04d', '#f7efe3'] },
  { name: 'KELP & SALMON',  c: ['#13261f', '#2d5e4c', '#e58ea0', '#2fa7a0', '#f3d36b', '#f6efe4'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'RUST TIDE',      c: ['#2a1712', '#6b2f2a', '#5f8f9b', '#e46a2b', '#d9c38a', '#f1e7d6'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
// material ids → [dark, mid, light] ink roles, hatch strength, speckle
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky   */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun   */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 sea   */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam  */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 cliff */ [INK, DEEP, SEA, 1.0, 0], /* 5 grass */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 6 wood  */ [INK, DEEP, PAPER, 1.0, 0], /* 7 dark  */ [INK, INK, DEEP, 0.3, 0], /* 8 fabric*/ [INK, INK, DEEP, 1.0, 0],
  /* 9 white */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 boat  */ [INK, INK, HOT, 0.6, 0], /*11 iris  */ [INK, SEA, GLOW, 0.8, 0],
  /*12 path  */ [DEEP, GLOW, PAPER, 0.8, 0], /*13 cloud */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon  */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp  */ [GLOW, GLOW, PAPER, 0.0, 0],
];

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 7.2, dith: 0.12, wob: 8, outline: 1, hatch: 1.0, angBias: 0 }, center: 38,
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} }, pierExt: 0, reachTonight: null, log: [], runSec: 0
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
// sim seconds restart at 0 each load; carry clocks as offsets
const T0 = S.runSec || 0; simT = T0;
function save() { try { S.runSec = simT; localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: galwayParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
if (!S.log.length) logEv('the headland woke for the first time');
else logEv('the headland resumed (epoch ' + S.epoch + ')');

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.5, 40000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH);
}

/* ====================================================================== shaders */
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float screenAngle(vec3 w, vec3 T){
  vec4 a=uVP*vec4(w,1.); vec4 b=uVP*vec4(w+T,1.);
  vec2 d=b.xy/max(b.w,1e-3)-a.xy/max(a.w,1e-3); d.x*=uAspect;
  float ang=atan(d.y,d.x); if(ang<0.) ang+=3.14159265; return ang/3.14159265; }
vec4 pack(float sh, float id, float ang, float acc){ return vec4(clamp(sh,0.,1.), (id+0.5)/16., fract(ang), acc); }
`;
const SH = {   // shared uniforms (same objects referenced by every material)
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 1600 }, uFogShade: { value: 0.6 },
  uBreath: { value: 0 }, uDay: { value: 1 }, uKeyUp: { value: 1 }, uHold: { value: 0 }, uWrInv: { value: new THREE.Matrix4() },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uBreath, uBreathOn, uCloth, uClothH, uWalk, uMove; uniform vec3 uWindL;
attribute vec3 aT;
varying vec3 vW, vN, vL, vT; varying float vC;
void main(){
  vC=0.;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  if(uCloth>0.5&&uCloth<1.5){   // the dress: folds that deepen toward the hem, pushed by wind and by walking
    float t=1.-clamp(lp.y/uClothH,0.,1.); float a=atan(lp.x,lp.z); float fl=t*t;
    vec2 rd=normalize(lp.xz+vec2(1e-4));
    float fold=0.07*t*sin(a*9.+lp.y*1.3+sin(uTime*0.7+a)*0.8);
    float rip=0.045*sin(lp.y*5.5-uTime*2.2+a*3.)+0.035*sin(lp.y*2.1-uTime*1.3+a*5.+1.);
    lp.xz+=rd*(fold+rip*fl*(0.7+uMove)); vC=fold*4.5+rip*2.;
    lp.xz+=uWindL.xz*fl*0.42;
    lp.z-=uMove*fl*0.32+smoothstep(0.75,1.,t)*max(-lp.z,0.)*0.9; lp.x+=sin(uWalk*1.7)*0.07*fl*uMove;
    lp.y+=0.03*fl*sin(uWalk*3.4)*uMove;
  } else if(uCloth>1.5){         // the veil: a long ribbon from the crown, trailing and fluttering
    float t=clamp(-lp.y/2.3,0.,1.);
    float fl=sin(t*7.-uTime*3.1+lp.x*2.)*0.09*t+sin(t*3.-uTime*1.7)*0.06*t;
    lp.x*=0.3+1.5*t;
    lp.z-=t*(0.1+0.42*uMove)+fl*0.5+0.12*sqrt(t);
    lp.xz+=uWindL.xz*t*t*0.6;
    lp.x+=sin(t*5.-uTime*2.4)*0.07*t; vC=fl*2.5;
    lp.y+=t*t*(0.15*uMove+0.12*length(uWindL));
  }
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  if(uBreathOn>0.5){
    float steep=smoothstep(0.35,0.7,1.-n.y);
    float band=smoothstep(1.,8.,w.y)*(1.-smoothstep(48.,85.,w.y));
    float rip=0.6+0.4*sin(w.y*0.33-uTime*0.8+w.x*0.05+w.z*0.03);

const PRINT_FRAG = /* glsl */`
uniform sampler2D uData; uniform vec2 uRes; uniform vec3 uPal[6]; uniform vec3 uTab[16]; uniform float uHat[16]; uniform float uSpk[16];

function sealTick(dt, t) {

let wxLogT = 0;
function step(dt) {

}

/* ====================================================================== render */

/* ====================================================================== info box */
const hud = document.getElementById('hud'); hud.hidden = !INFO;
const tapBtn = document.getElementById('tap');

/* ====================================================================== loop, keys, API */
addEventListener('resize', resize); resize();
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('[gl] context lost'); });
renderer.domElement.addEventListener('webglcontextrestored', () => { resize(); seaU.uHt.value.needsUpdate = true; console.warn('[gl] context restored'); });
rebuildWaves(); SUNM = sunMoon(simMs); SUND.copy(azElToVec(SUNM.sun.az, SUNM.sun.el)); MOOND.copy(azElToVec(SUNM.moon.az, SUNM.moon.el));
cut(Q.has('cam') ? clamp(+Q.get('cam'), 0, CREW.length - 1) : Math.floor(rnd() * CREW.length));
if (Q.has('cam')) DIR.until = 1e12;
// a keeper who is already out, if the day is up
if (SUNM.sun.el > 0 && WX.precip < 1.5 && rnd() < 0.8) { const k = ['CLIFF', 'LANDING', 'PIER_END', 'STAIR_TOP'][Math.floor(rnd() * 4)]; keeper.s = STOPS[k].s; keeper.target = k; keeper.stopName = STOPS[k].name; keeper.visible = true; keeper.dwell = rr(30, 200); }
function frame(dt) {
  try { step(dt); worldTick(dt); applyLook(dt); render(); AUD.frame(dt); }
  catch (e) { console.error(e); }
}
let lastT = performance.now(), hudT = 0;
function raf(now) { const dt = (now - lastT) / 1000; lastT = now; frame(dt); hudT += dt; if (hudT > 0.5) { hudT = 0; hudUpdate(); } requestAnimationFrame(raf); }
if (!CAPTURE) requestAnimationFrame(raf);
addEventListener('beforeunload', save);
addEventListener('keydown', (e) => { const k = e.key.toLowerCase();
  if (k === 'i') { INFO = !INFO; hud.hidden = !INFO; if (INFO) hudUpdate(); }
  if (k === 'm') AUD.mute();
  if (k === 'r' && !live.ev) { logEv('a hand on the headland (human intervention)'); S.tension = 1; }
  AUD.start(); });
addEventListener('pointerdown', () => AUD.start());
tapBtn.addEventListener('click', () => AUD.start());
if (WALK.on && !Q.has('hour') && SUNM.sun.el < 0.12) { const cur = galwayParts(simMs).hour; simMs += (((14.5 - cur) % 24 + 24) % 24) * 3600e3; }
AUD.init(); hudUpdate();
window.MZ = {
  tick(dt = 1 / 30) { frame(dt); hudUpdate(); },
  advance(sec, dt = 0.25) { for (let t = 0; t < sec; t += dt) step(dt); applyLook(sec); render(); hudUpdate(); },
  force(name) { if (live.ev) endEvent(); if (name === 'rupture') { rupture('forced by hand'); return; } if (name === 'reach') { S.reachTonight = true; S.pierExt = MAXBAYS * 0.6; return; } startEvent(name, true); },
  cam(i) { cut(i); DIR.until = 1e12; },
  look(p, t, fov = 30) { DIR.look = p ? { p: V(...p), tgt: V(...t), fov } : null; },
  get keeperPos() { return keeper.pos.toArray(); },
  get keeperDir() { return keeper.dir.toArray(); },
  get sunDir() { return SUND.toArray(); },
  geo: { PIER_X, DECK, zL, zT, PIER_END_Z, HOUSE: HOUSE.toArray() },
  keeperWalk(from, to) { keeper.s = STOPS[from].s; keeper.target = to; keeper.state = 'walk'; keeper.visible = true; keeper.nextDwell = 600; },
  h: (x, z) => terrainH(x, z), coast: (x) => coastZ(x),
  ink(i) { S.colorway = i; cwMix = 1; cwFrom = COLORWAYS[i].c.map(hexV); },
  grammar(g) { Object.assign(S.grammar, g); },
  seekHour(h) { const cur = galwayParts(simMs).hour; simMs += (((h - cur) % 24 + 24) % 24) * 3600e3; },
  get state() { return { S, live: { ...live }, WX: { ...WX }, cam: CREW[DIR.cur].name, keeper: { target: keeper.target, state: keeper.state, visible: keeper.visible }, boat: boat.state }; },
  setWx(o) { Object.assign(WXT, o); Object.assign(WX, o); WX.live = true; },
  analyser() { return AUD.an; },
  audio: AUD,
  walk: { get s() { return { x: WALK.x, y: WALK.y, z: WALK.z, yaw: WALK.yaw, place: WALK.place }; }, go: (k) => walkTo(k), get layer() { return WR.layer; }, sim(n, dt = 0.05) { for (let i = 0; i < n; i++) walkStep(dt); }, wr: (u, y, v) => WR.toW(u, y, v).toArray(), get ramp() { return { A: WR.ramp.A.toArray(), B: WR.ramp.B.toArray() }; }, hit: (x, z, y) => WR.hit(x, z, y), set(x, z, yaw, pitch = -0.06) { WALK.x = x; WALK.z = z; WALK.yaw = yaw; WALK.pitch = pitch; WALK.y = groundAt(x, z); }, kneel(v) { WALK.kneeling = v; }, press(k, v) { WALK.keys[k] = v; }, stream: STREAM.pts.filter((_, i) => i % 40 === 0).map(p => [p.x, p.z]), cc: CC },
};
</script>
