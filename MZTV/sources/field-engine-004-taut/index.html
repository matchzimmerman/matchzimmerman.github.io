<script>
/*
  MZTV · FIELD ENGINE 004 · TAUT
  A membrane held under tension by a small chord of voices. Public incident records
  (time + position only, one equal impulse per incident) are replayed in order and
  strike it. Each impulse rings out and fades; the damage it leaves heals toward a
  floor, never to zero. Damaged ground carries waves more slowly (they bend) and
  absorbs them (dead ground); past a threshold the membrane tears. Voices whose
  ground dies fall silent and try to regrow on intact ground; when none is left
  they are gone. The field does not reset.

  Params: ?info=0 ?fresh=1 ?audio=0 ?seed=N ?pace=MIN (real minutes per record day, default 4)
          ?ff=H (fast-forward H hours of replay at boot) ?capture=1 ?testdata=1 (synthetic records, tests only)
  Keys:   I info · M mute
*/
'use strict';
const Q = new URLSearchParams(location.search);
const KEY = 'mztv-fe004-v1', RKEY = 'mztv-fe004-records-v1';
const SHOW_INFO = Q.get('info') !== '0';
const AUDIO_ON = Q.get('audio') !== '0';
const PACE = Math.max(0.05, +(Q.get('pace') || 4));          // real minutes per record day
const DATA_PER_REAL = 1440 / PACE;                             // record-ms per real-ms
const TEST = Q.get('testdata') === '1';
const CAPTURE = Q.get('capture') === '1';
const SEED = +(Q.get('seed') || 7);
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const DATA_API = 'https://services1.arcgis.com/UWYHeuuJISiGmgXx/arcgis/rest/services/NIBRS_GroupA_Crime_Data/FeatureServer/0/query';
const W = 480, H = 270;           // membrane resolution
const SW = 240, SH = 135;         // saved damage map
const RW = 64, RH = 36;           // readback map
const SUB = 4;                    // wave steps per frame
const RATIOS = [1.0, 1.594, 2.136, 2.653, 3.156];   // circular-membrane mode ratios
const F0 = 49.0;                                      // Hz, lowest voice
const HOME = { bg: [13, 18, 48], mid: [58, 84, 222], lit: [236, 233, 255], res: [176, 222, 92] };

// ---------- rng ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fin = (v, d = 0) => Number.isFinite(v) ? v : d;

// ---------- state ----------
const S = {
  v: 1, born: Date.now(), elapsed: 0,
  play: null, idx: 0, applied: 0, pressure: 0, live: false,
  voices: RATIOS.map((r, i) => ({ i, r, x: 0, y: 0, life: 1, low: 0, state: 'sing', until: 0, moves: 0 })),
  knock: { off: new Array(13).fill(0), a: 0 },
  marks: {}, log: [], pal: null, gain: 6, quietRec: 0,
};
// initial voice placement: a loose pentagon on the membrane
S.voices.forEach((v, i) => { const a = i / 5 * Math.PI * 2 + 0.4; v.x = W * (0.5 + 0.30 * Math.cos(a)); v.y = H * (0.5 + 0.30 * Math.sin(a)); });
S.pal = JSON.parse(JSON.stringify(HOME));

function logl(s) { S.log.push([S.elapsed, s]); if (S.log.length > 60) S.log.splice(0, S.log.length - 60); }

// ---------- records ----------
let REC = [];         // [{t, x, y}] sorted, mapped to membrane coords
let RAW = [];         // [[t, lat, lon]]
let recStatus = 'loading', recNewest = 0, recFirst = 0;
const liveQueue = [];

function mapRecords(raw) {
  if (!S.geo && raw.length) {
    const la = raw.map(r => r[1]).sort((a, b) => a - b), lo = raw.map(r => r[2]).sort((a, b) => a - b);
    const q = (a, p) => a[Math.floor(clamp(p, 0, 1) * (a.length - 1))];
    S.geo = { la0: q(la, .02), la1: q(la, .98), lo0: q(lo, .02), lo1: q(lo, .98) };
  }
  // obscure the geography: percentile bounds -> rotate -> stretch to fill -> smooth warp.
  // Continuous, so neighbours stay neighbours; the outline no longer reads as a map.
  if (!raw.length) return [];
  const { la0, la1, lo0, lo1 } = S.geo;
  const pts = raw.map(r => {
    let u = (r[2] - lo0) / Math.max(1e-9, lo1 - lo0) - 0.5, v = (r[1] - la0) / Math.max(1e-9, la1 - la0) - 0.5;
    const A = 2.31; const ru = u * Math.cos(A) - v * Math.sin(A), rv = u * Math.sin(A) + v * Math.cos(A);
    return [ru, rv];
  });
  if (S.geo.mnx == null) {
    const xs = pts.map(p => p[0]).sort((a, b) => a - b), ys = pts.map(p => p[1]).sort((a, b) => a - b);
    const q = (a, p) => a[Math.floor(p * (a.length - 1))];
    Object.assign(S.geo, { mnx: q(xs, .01), mxx: q(xs, .99), mny: q(ys, .01), mxy: q(ys, .99) });
  }
  const { mnx, mxx, mny, mxy } = S.geo;
  return raw.map((r, i) => {
    let x = (pts[i][0] - mnx) / Math.max(1e-9, mxx - mnx), y = (pts[i][1] - mny) / Math.max(1e-9, mxy - mny);
    const wx = 0.07 * Math.sin(y * 5.1 + 1.3) + 0.04 * Math.sin(x * 3.7 + y * 2.2);
    const wy = 0.07 * Math.sin(x * 4.3 + 0.7) + 0.04 * Math.cos(y * 6.1 - x * 1.9);
    x = clamp(0.06 + 0.88 * (x + wx), 0.04, 0.96); y = clamp(0.07 + 0.86 * (y + wy), 0.05, 0.95);
    return { t: r[0], x: x * W, y: y * H };
  });
}
function dedupe(raw) {
  // one record row per incident: rows sharing a minute and ~100 m are one event (no victim-count scaling)
  const seen = new Set(), out = [];
  for (const r of raw) {
    if (!Number.isFinite(r[0]) || !Number.isFinite(r[1]) || !Number.isFinite(r[2]) || Math.abs(r[1]) < 1 || Math.abs(r[2]) < 1) continue;
    const k = Math.round(r[0] / 60000) + ':' + r[1].toFixed(3) + ':' + r[2].toFixed(3);
    if (seen.has(k)) continue; seen.add(k); out.push(r);
  }
  return out.sort((a, b) => a[0] - b[0]);
}
async function arcgis(params) {
  const u = DATA_API + '?' + new URLSearchParams(Object.assign({ f: 'json' }, params));
  const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json(); if (j.error) throw new Error(j.error.message || 'arcgis'); return j;
}

async function fetchSince(afterMs) {
  const out = []; let off = 0;
  for (let page = 0; page < 40; page++) {
    const where = afterMs ? `Shooting='Y' AND CrimeDateTime > timestamp '${tsql(afterMs)}'` : `Shooting='Y'`;
    const j = await arcgis({ where, outFields: 'CrimeDateTime,Latitude,Longitude', returnGeometry: 'false', orderByFields: 'CrimeDateTime ASC', resultRecordCount: '2000', resultOffset: String(off) });
    const f = j.features || [];
    for (const g of f) { const a = g.attributes || {}; out.push([+a.CrimeDateTime, +a.Latitude, +a.Longitude]); }

}

  const r = mulberry(4242), out = []; let t = Date.UTC(2023, 0, 1);
  const hubs = [[39.29, -76.62], [39.31, -76.58], [39.27, -76.65], [39.33, -76.66], [39.30, -76.55]];
  for (let i = 0; i < 2600; i++) {
    t += -Math.log(1 - r()) * 86400000 * (r() < 0.15 ? 0.08 : 0.55);
    const h = hubs[Math.floor(Math.pow(r(), 1.6) * hubs.length)];
    out.push([t, h[0] + (r() - .5) * 0.05 + (r() - .5) * 0.02, h[1] + (r() - .5) * 0.07 + (r() - .5) * 0.03]);
  }
  return out;
}
function setRecords(raw) {
  RAW = dedupe(raw); REC = mapRecords(RAW);
  recFirst = REC.length ? REC[0].t : 0; recNewest = REC.length ? REC[REC.length - 1].t : 0;
  if (S.play == null && REC.length) S.play = recFirst - 86400000;
  // resume by time, not index, so revisions in the source never replay or skip records
  if (S.lastT != null && !S.live) { let i = 0; while (i < REC.length && REC[i].t <= S.lastT) i++; S.idx = i; }
  // records cached so the field keeps receiving if the source is briefly unreachable
  if (!TEST) try { localStorage.setItem(RKEY, JSON.stringify(RAW.map(r => [r[0], +r[1].toFixed(5), +r[2].toFixed(5)]))); } catch (e) {}
}
async function loadRecords() {
  if (TEST) { setRecords(testRecords()); recStatus = 'TEST DATA (synthetic)'; return; }
  try { const c = JSON.parse(localStorage.getItem(RKEY) || 'null'); if (Array.isArray(c) && c.length) { setRecords(c); recStatus = 'cached'; } } catch (e) {}
  try {
    const add = await fetchSince(RAW.length ? RAW[RAW.length - 1][0] : 0);
    const before = recNewest; setRecords(RAW.concat(add)); recStatus = 'receiving';
    if (before && add.length) logl(`${add.length} new records arrived`);
  } catch (e) { recStatus = RAW.length ? 'cached · source unreachable' : 'source unreachable · retrying'; setTimeout(loadRecords, 60000); return; }
  setTimeout(refreshRecords, 20 * 60000);
}
async function refreshRecords() {
  if (TEST) return;
  try {
    const add = dedupe(await fetchSince(recNewest));
    if (add.length) {
      const prevNewest = recNewest; setRecords(RAW.concat(add)); recStatus = 'receiving';
      if (S.live) { liveQueue.length = 0; for (const r of REC) if (r.t > (S.lastT || prevNewest)) liveQueue.push(r); S.idx = REC.length - liveQueue.length; logl(`${add.length} new records arrived`); }
    }
  } catch (e) { recStatus = 'cached · source unreachable'; }
  setTimeout(refreshRecords, 20 * 60000);
}

// ---------- WebGL ----------
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('info').textContent = 'WebGL2 unavailable'; throw new Error('no webgl2'); }
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const SIM = `#version 300 es
precision highp float;
uniform sampler2D A; uniform sampler2D B;
uniform vec4 uVoice[5]; uniform float uVoiceAmp[5];
uniform vec4 uHit[8]; uniform float uWave; uniform float uDt; uniform float uHeal; uniform float uTension;
layout(location=0) out vec4 oA; layout(location=1) out vec4 oB;
float U(ivec2 q){ if(q.x<0||q.y<0||q.x>=${W}||q.y>=${H}) return 0.; return texelFetch(A,q,0).r; }
float P0(ivec2 q){ if(q.x<0||q.y<0||q.x>=${W}||q.y>=${H}) return 0.; return texelFetch(A,q,0).g; }
void main(){

  vec4 a = texelFetch(A,q,0); vec4 b = texelFetch(B,q,0);
  float u=a.r, up=a.g, E=a.b; float T=b.r, P=b.g;
  vec2 x = vec2(q)+.5;
  // impulses: equal force, a wave bump plus damage that heals toward a floor
  for(int i=0;i<8;i++){ vec4 h=uHit[i]; if(h.w<=0.) continue; vec2 d=x-h.xy; float r2=dot(d,d);
    T += h.w*.55*exp(-r2/72.)*(1.-T);
    P += h.w*.045*exp(-r2/32.)*(1.-P); }
  T = T*exp(-uHeal*uDt*(1.-.75*P));          // scarred ground heals slower
  float hl = clamp(1.-P-.6*T,0.,1.);

    float lap = U(q+ivec2(1,0))+U(q-ivec2(1,0))+U(q+ivec2(0,1))+U(q-ivec2(0,1))-4.*u;
    float lapP = P0(q+ivec2(1,0))+P0(q-ivec2(1,0))+P0(q+ivec2(0,1))+P0(q-ivec2(0,1))-4.*up;
    float c2 = .25*uTension*mix(.28,1.,hl);
    float dmp = .004+.03*(1.-hl);

    for(int i=0;i<5;i++){ vec2 d=x-uVoice[i].xy; f += uVoiceAmp[i]*uVoice[i].z*exp(-dot(d,d)/12.5); }
    for(int i=0;i<8;i++){ vec4 h=uHit[i]; if(h.z<=0.) continue; vec2 d=x-h.xy; f += h.z*exp(-dot(d,d)/9.); }
    un = 2.*u-up+c2*lap-dmp*(u-up)+.06*(lap-lapP)+f*hl;
    if(torn>.5) un=0.;

    oA = vec4(un,u,E,1.);
  } else { if(!(abs(u)<8.)) u=0.; if(!(abs(up)<8.)) up=0.; if(!(E>=0.&&E<64.)) E=0.; oA = vec4(u*(1.-torn),up*(1.-torn),E,1.); }
  if(!(T>=0.&&T<=1.)) T=0.; if(!(P>=0.&&P<=1.)) P=0.;

const DISP = `#version 300 es
precision highp float;
uniform sampler2D A; uniform sampler2D B; uniform vec2 uRes; uniform float uPx; uniform float uGain; uniform float uTime;
uniform vec3 cBg, cMid, cLit, cRes; uniform vec2 uReg; uniform vec4 uVoice[5]; uniform float uVoiceLife[5];
out vec4 o;
vec4 bil(sampler2D t, vec2 p){ p-= .5; ivec2 i=ivec2(floor(p)); vec2 f=fract(p);
  ivec2 m=ivec2(${W - 1},${H - 1});
  vec4 a=texelFetch(t,clamp(i,ivec2(0),m),0), b=texelFetch(t,clamp(i+ivec2(1,0),ivec2(0),m),0),
       c=texelFetch(t,clamp(i+ivec2(0,1),ivec2(0),m),0), d=texelFetch(t,clamp(i+ivec2(1,1),ivec2(0),m),0);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }

void main(){
  vec2 fc = vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  ivec2 cell = ivec2(floor(fc/uPx));
  vec2 gridN = vec2(ceil(uRes.x/uPx), ceil(uRes.y/uPx));
  vec2 sp = (vec2(cell)+.5)/gridN*vec2(${W}.,${H}.);
  vec4 a = bil(A, sp); vec4 b = bil(B, sp);
  float u=a.r, E=a.b, T=b.r, P=b.g, hl=b.b;

  tone *= mix(.45, 1., smoothstep(.25, .95, hl));      // dead ground goes dark and still

  if(T>.04){ float ls = fract((float(cell.x)+float(cell.y))*.25); if(ls < T*.55) col = mix(col, cBg, .75); }

const RB = `#version 300 es

let prog = {}, tex = {}, fbo = {}, quad, ping = 0, glOK = false, fmt;

function audioTick() {

// knock: the membrane's own Euclidean pulse, E(5,13). Each impulse displaces one step; the offset heals but not fully.
const EU = (() => { const k = 5, n = 13, p = []; for (let i = 0; i < n; i++) p.push(((i * k) % n) < k ? 1 : 0); return p; })();

  const ctx = A.ctx, G = A.G; if (!ctx || !G || ctx.state !== 'running') return;

// ---------- persistence ----------
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

let savedMap = null;

function save() {
  if (!glOK) return;
  try { savedMap = snapshotDamage(); const o = Object.assign({}, S, { map: b64(savedMap) }); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
}
function load() {
  try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!o || o.v !== 1) return null;
    for (const k of ['born', 'elapsed', 'play', 'idx', 'applied', 'pressure', 'live', 'marks', 'log', 'pal', 'gain', 'knock', 'geo', 'lastT', 'hiP']) if (o[k] !== undefined) S[k] = o[k];
    if (Array.isArray(o.voices) && o.voices.length === 5) S.voices = o.voices.map((v, i) => Object.assign({}, S.voices[i], v));
    S.elapsed = fin(S.elapsed); S.pressure = fin(S.pressure); S.gain = clamp(fin(S.gain, 6), 1.5, 40); S.applied = fin(S.applied);
    for (const n of ['bg', 'mid', 'lit', 'res']) if (!S.pal[n] || S.pal[n].some(x => !Number.isFinite(x))) S.pal[n] = HOME[n].slice();
    S.voices.forEach(v => { v.x = clamp(fin(v.x, W / 2), 4, W - 4); v.y = clamp(fin(v.y, H / 2), 4, H - 4); v.life = clamp(fin(v.life, 1), 0, 1); });

// ---------- info ----------
const infoEl = document.getElementById('info'); let infoOn = SHOW_INFO && !CAPTURE;

function renderInfo() {
  infoEl.classList.toggle('off', !infoOn); if (!infoOn) return;
  const P = S.pal; infoEl.style.background = rgb(P.bg, 0.86); infoEl.style.color = rgb(P.lit); infoEl.style.borderColor = rgb(P.res);
  const vs = S.voices.map(v => v.state === 'gone' ? '×' : v.state === 'sing' ? (v.life > 0.5 ? '●' : '◐') : '○').join(' ');
  const pending = Math.max(0, REC.length - S.idx);
  const L = [];
  L.push(`<b>FIELD ENGINE 004 · TAUT</b>   <span class="d">${fmtT(S.elapsed)} running</span>`);
  L.push(`<span class="d">a membrane held at tension by five voices. impulses arrive from a public record stream (time + position only), one equal impulse per record, in order${S.live ? ', as records appear' : ` · ${PACE} min per record day`}</span>`);
  L.push(`<span class="d">impulse → wave + damage · damage heals toward a floor, never to zero · damaged ground: slower waves (they bend), absorbs (dead) · past 0.5 it tears</span>`);
  L.push(`<span class="d">voice pitch ← tension under it · voice level ← energy there · on dead ground a voice falls silent, then regrows on intact ground if any is left · gaps → recovery · clusters → pressure → slower healing, longer echoes</span>`);
  L.push(`record day <b>${String(recordDay()).padStart(4, '0')}</b> / ${recordDays() || '—'} · impulses ${S.applied} · source: ${recStatus}${S.live ? ' · live' : ''}`);
  L.push(`residue <b>${meanP.toFixed(3)}</b> · torn ${(tornFrac * 100).toFixed(1)}% · pressure ${pressN().toFixed(2)} · tension ${tension().toFixed(3)} · voices ${vs}${A.ctx && A.ctx.state !== 'running' ? ' · sound: click to start' : ''}${A.muted ? ' · muted' : ''}`);
  for (const [t, s] of S.log.slice(-5)) L.push(`<span class="d">${fmtT(t)}</span> ${s}`);

// ---------- main ----------
let last = performance.now(), rbClock = 0, saveClock = 0, infoClock = 0, audioClock = 0;
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (!document.hidden || CAPTURE) S.elapsed += dt;
  resize();
  if (glOK) {
    advance(dt);
    voiceUniforms();
    // rings: equal amplitude for every impulse, scaled to the field's own typical motion
    hitN = 0; hitBuf.fill(0);
    const imp = 3.2 / Math.max(1.5, S.gain);
    while (pending.length && hitN < 6) { const r = pending.shift(); queueHit(r.x, r.y, imp, 1); }
    while (knockBumps.length && hitN < 8) { const [x, y] = knockBumps.shift(); queueHit(x, y, imp * 0.35, 0); }
    for (let s = 0; s < SUB; s++) simStep(true, dt / SUB, s === 0 && hitN > 0);
    rbClock += dt; if (rbClock > 0.5) { rbClock = 0; readback(); analyse(); voiceTick(0.5); marks(); }
    paletteTick(dt);

  audioClock += dt; if (audioClock > 0.1) { audioClock = 0; audioTick(); }
  infoClock += dt; if (infoClock > 0.5) { infoClock = 0; renderInfo(); }
  saveClock += dt; if (saveClock > 60) { saveClock = 0; save(); }
  requestAnimationFrame(frame);
}

// voices oscillate inside the shader through a per-substep phase; keep it in double precision here
const _simStep = simStep;
simStep = function (wave, dt, hits) {
  for (let i = 0; i < 5; i++) {
    const v = S.voices[i]; const f = 0.5 / (64 / v.r);   // cycles per step
    vPhase[i] = (vPhase[i] + f) % 1;
    const amp = vBuf[i * 4 + 2] || 0.006; vBuf[i * 4 + 2] = Math.abs(amp);
    vAmp[i] = (v.state === 'gone' ? 0 : v.life) * Math.sin(vPhase[i] * Math.PI * 2);
  }
  _simStep(wave, dt, hits);
};

function fastForward(hours) {
  // replay `hours` of broadcast time into the damage maps without the wave: heal across each gap, then stamp
  if (!REC.length || hours <= 0) return;
  const target = S.play + hours * 3600 * 1000 * DATA_PER_REAL;
  let passes = 0;
  while (S.idx < REC.length && REC[S.idx].t <= target && passes < 40000) {
    const gapReal = (REC[S.idx].t - S.play) / DATA_PER_REAL / 1000;
    if (gapReal > 0.5) { simStep(false, gapReal, false); passes++; }
    S.pressure *= Math.exp(-(REC[S.idx].t - S.play) / 86400000 / 6); S.elapsed += Math.max(0, gapReal); S.play = REC[S.idx].t;

    }
    simStep(false, 0, true); passes++;
    if (passes % 400 === 0) { readback(); analyse(); voiceTick(Math.min(30, gapReal)); marks(); }
  }
  const rest = Math.max(0, (target - S.play) / DATA_PER_REAL / 1000);
  if (rest > 0) { simStep(false, rest, false); S.elapsed += rest; }
  S.play = Math.max(S.play, Math.min(target, recNewest));
  if (S.idx >= REC.length) { S.live = true; S.play = recNewest; }
  readback(); analyse(); marks();
  logl(`fast-forwarded ${hours} h of replay`);
}

const saved = load();
savedMap = saved;
glInit(saved);
for (let i = 0; i < 700; i++) { voiceUniforms(); simStep(true, 1 / 240, false); }   // pre-warm: it was running before you arrived
readback(); analyse();
if (!S.log.length) logl('membrane drawn taut · five voices holding it');
else logl('resumed from memory');
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'i') infoOn = !infoOn; if (k === 'm') { A.muted = !A.muted; } audioStart(); if (A.ctx) A.ctx.resume(); });
addEventListener('pointerdown', () => { audioStart(); if (A.ctx) A.ctx.resume(); });
audioStart();
setInterval(knockSched, 40);

addEventListener('beforeunload', save);
loadRecords().then(() => { const ff = +(Q.get('ff') || 0); if (ff > 0) fastForward(ff); });
requestAnimationFrame(frame);

function tick(dt, drawIt) {
  S.elapsed += dt; advance(dt); voiceUniforms();
  hitN = 0; hitBuf.fill(0); const imp = 3.2 / Math.max(1.5, S.gain);
  while (pending.length && hitN < 6) { const r = pending.shift(); queueHit(r.x, r.y, imp, 1); }

}
