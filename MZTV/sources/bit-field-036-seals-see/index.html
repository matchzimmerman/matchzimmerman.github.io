<meta charset="utf-8">

<title>MZ World Seals See</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MZ WORLD · TO SEE WHAT SEALS SEE — the home seen from the bay, printed; the info box is printed in the current inks */
:root { --ink:#1b1f3a; --paper:#efe6cf; --hot:#f0603f; --deep:#2c3e7a; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
html, body { height:100%; margin:0; background:var(--ink); overflow:hidden }
canvas { display:block; width:100%; height:100% }
#hud { position:fixed; left:calc(20px + env(safe-area-inset-left,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(490px, calc(100vw - 40px)); box-sizing:border-box; padding:11px 13px 10px; font:400 11px/1.5 var(--mono);
  color:var(--ink); background:color-mix(in srgb, var(--paper) 90%, transparent); border:2px solid var(--ink);
  letter-spacing:.01em; font-variant-numeric:tabular-nums; pointer-events:none }
#hud b { font-weight:600 }
#hud .t { display:flex; justify-content:space-between; gap:12px; font-weight:600; letter-spacing:.08em; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:6px }
#hud .r { display:grid; grid-template-columns:1fr auto; gap:0 10px }
#hud .r span:last-child { color:var(--deep); text-align:right }
#hud .ev { color:var(--hot); font-weight:600 }
#hud .log { margin-top:6px; padding-top:5px; border-top:1px dashed var(--ink); min-height:3em }
#hud .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#hud .cr { margin-top:6px; font-size:10px; letter-spacing:.06em; opacity:.8 }
#tap { position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); top:calc(20px + env(safe-area-inset-top,0px)); font:600 11px/1 var(--mono);
  color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:8px 10px; letter-spacing:.08em; cursor:pointer }
</style>

<div id="hud" hidden></div>
<button id="tap" type="button" hidden>CLICK FOR SOUND</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ====================================================================== params */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.get('capture') === '1';
const RATE = Math.max(0.01, +(Q.get('rate') || 1));
const LINES = +(Q.get('lines') || 720);
let INFO = Q.get('info') !== '0';
const AUDIO_WANTED = Q.get('audio') !== '0';
const SEED = +(Q.get('seed') || 1);
const LIVE_WX = Q.get('live') !== '0';
const KEY = 'mzworld-seals-see-v1' + (Q.has('seed') ? '-s' + SEED : '');
if (Q.get('fresh') === '1') { try { localStorage.removeItem(KEY); } catch (e) {} }

const LAT = 53.236, LON = -9.48;           // the Inverin shore of Galway Bay
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(SEED * 7919 + (Date.now() % 100000));
const rr = (a, b) => a + (b - a) * rnd();
const fixed = mulberry(36036);             // the place is the same for every seed
const fr = (a, b) => a + (b - a) * fixed();

/* ====================================================================== clock (Galway) */
const dublin = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Dublin', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
function galwayParts(ms) { const s = dublin.format(new Date(ms)); const [h, m, sec] = s.split(':').map(Number); return { h, m, sec, str: s, hour: h + m / 60 + sec / 3600 }; }
let simMs = Date.now();
if (Q.has('hour')) { const want = +Q.get('hour'); const cur = galwayParts(simMs).hour; simMs += (((want - cur) % 24 + 24) % 24) * 3600e3; }
if (Q.has('ff')) simMs += (+Q.get('ff')) * 60e3;
let simT = 0;

/* ====================================================================== noise + the shore (metres; +x north = inland, +z east, -x south = the bay) */
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 104729; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function ridged(x, y) { let s = 0, a = 0.55, f = 1; for (let i = 0; i < 3; i++) { s += a * (1 - Math.abs(2 * vnoise(x * f, y * f) - 1)); f *= 2.1; a *= 0.5; } return s; }
// where the water's edge sits at mean sea level, as a function of z
function coastX(z) {
  return 4 * Math.sin(z * 0.011 + 0.6) + 8 * (fbm(z * 0.012 + 2.3, 1.7) - 0.5)
    - 30 * Math.exp(-Math.pow((z + 88) / 30, 2))      // the rocky point to the south-west
    + 9 * Math.exp(-Math.pow((z - 45) / 55, 2));       // the sandy cove
}
// how rocky the shore is here (0 sand, 1 rock): rock toward the point and the far end, sand in the cove
function rockMask(x, z) {
  const d = x - coastX(z);
  const west = smoothstep(-8, -55, z), east = smoothstep(150, 210, z);
  const patch = smoothstep(0.62, 0.78, fbm(x * 0.045 + 11, z * 0.045));
  return clamp(Math.max(west, east, patch * 0.8) * (1 - smoothstep(14, 26, d)), 0, 1);
}
function terrainH(x, z) {
  const d = x - coastX(z);
  let h;
  if (d < -80) h = Math.max(-16, -3.66 + (d + 80) * 0.012);           // the bay floor shelving away
  else if (d < 0) h = 0.5 + d * 0.052;                                 // the foreshore, bared by the tide
  else if (d < 16) h = 0.5 + d * 0.14 + 0.7 * Math.exp(-Math.pow((d - 13) / 3, 2));   // upper beach, storm ridge
  else h = 2.74 + Math.min(d - 16, 110) * 0.115 + Math.max(0, d - 126) * 0.06 + 2.2 * (fbm(x * 0.011, z * 0.011) - 0.5) * smoothstep(16, 40, d);
  h += 55 * smoothstep(500, 1500, d) * (0.6 + 0.6 * fbm(z * 0.002, 4.4));                // the land rising to the uplands
  const rm = rockMask(x, z);
  if (rm > 0.01) { const r = ridged(x * 0.09, z * 0.09); h += rm * (1.9 * r * r - 0.35) * (d < 18 ? 1 : 0.3); }
  if (d < 2 && rm < 0.5) h += (0.018 * Math.sin(x * 2.3 + 1.7 * Math.sin(z * 0.21) + 2 * vnoise(x * 0.3, z * 0.3)) + 0.01 * Math.sin(x * 1.1 - z * 0.7)) * (1 - rm * 2) * smoothstep(-70, -10, d);   // sand ripples
  return h;
}

/* ====================================================================== sun + moon */
function sunMoon(ms) {
  const d = ms / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * D2R, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R, e = (23.439 - 0.00000036 * d) * D2R;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const lst = (gmst * 15 + LON) * D2R, la = LAT * D2R;
  const place = (lon, lat) => {
    const ra = Math.atan2(Math.cos(e) * Math.sin(lon) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
    const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
    const ha = lst - ra;
    const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
    const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
    return { el, az };
  };
  const sun = place(L, 0);
  const Lm = (218.316 + 13.176396 * d) * D2R, Mm = (134.963 + 13.064993 * d) * D2R, F = (93.272 + 13.229350 * d) * D2R;
  const mlon = Lm + 6.289 * D2R * Math.sin(Mm), mlat = 5.128 * D2R * Math.sin(F);
  const moon = place(mlon, mlat);
  const phase = ((mlon - L) % TAU + TAU) % TAU;
  return { sun, moon, illum: 0.5 * (1 - Math.cos(phase)), phase };
}
// world axes: +x north, +z east, y up
const azElToVec = (az, el) => V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
const fromBearingTravel = (deg) => { const b = deg * D2R; return new THREE.Vector2(-Math.cos(b), -Math.sin(b)); };
const compass = (deg) => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ====================================================================== palettes (6 inks: INK DEEP SEA HOT GLOW PAPER) */
const COLORWAYS = [
  { name: 'ATLANTIC PRINT', c: ['#1b1f3a', '#2c3e7a', '#3f9aa6', '#f0603f', '#f2c14e', '#efe6cf'] },
  { name: 'WRACK',          c: ['#1d1b12', '#4b4a24', '#7fa39a', '#d8693a', '#d9c25a', '#efe7d2'] },
  { name: 'STATIONERY',     c: ['#141a3a', '#2f4a8f', '#8fb0c8', '#c8343f', '#e9cf7a', '#f4efe2'] },
  { name: 'SIGNAL FLARE',   c: ['#24123a', '#5b3fd1', '#6fd3c1', '#ff7a8a', '#ffd24a', '#fbf3e4'] },
  { name: 'PISTACHIO NIGHT',c: ['#10202b', '#1f4a6e', '#b6d97a', '#ff5a7a', '#f9e7b0', '#eef4ea'] },
  { name: 'ULTRAMARINE',    c: ['#0c1440', '#1f3bb3', '#44b8e8', '#ff6a1a', '#ffd0a1', '#fff7ec'] },
  { name: 'LICHEN',         c: ['#22261d', '#4b5b3a', '#a7c5a0', '#d9475b', '#e8d27c', '#f3eedf'] },
  { name: 'HAYSTACK',       c: ['#231a10', '#6b4a22', '#5f9a98', '#e0583a', '#f0cf6a', '#f7f0dc'] },
];
const hexV = (h) => { const n = parseInt(h.slice(1), 16); return V(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
// material ids → [dark, mid, light] ink roles, hatch strength, speckle   (ids are packed /32)
const INK = 0, DEEP = 1, SEA = 2, HOT = 3, GLOW = 4, PAPER = 5;
const MAT = [
  /* 0 sky   */ [DEEP, HOT, PAPER, 0.9, 1], /* 1 sun   */ [HOT, GLOW, PAPER, 1.0, 0], /* 2 sea   */ [INK, DEEP, SEA, 1.0, 0],
  /* 3 foam  */ [SEA, PAPER, PAPER, 0.7, 0], /* 4 rock  */ [INK, DEEP, SEA, 1.0, 0], /* 5 grass */ [DEEP, SEA, GLOW, 0.9, 0],
  /* 6 wood  */ [INK, DEEP, PAPER, 1.0, 0], /* 7 dark  */ [INK, INK, DEEP, 0.3, 0], /* 8 cloth */ [INK, INK, DEEP, 1.0, 0],
  /* 9 lime  */ [DEEP, PAPER, PAPER, 0.5, 0], /*10 steel */ [DEEP, SEA, PAPER, 0.8, 0], /*11 weed  */ [INK, DEEP, GLOW, 1.0, 0],
  /*12 sand  */ [DEEP, GLOW, PAPER, 0.8, 1], /*13 cloud */ [SEA, PAPER, PAPER, 0.8, 0], /*14 moon  */ [DEEP, SEA, PAPER, 0.8, 0],
  /*15 lamp  */ [GLOW, GLOW, PAPER, 0.0, 0], /*16 under */ [INK, DEEP, SEA, 1.0, 0], /*17 hay   */ [DEEP, GLOW, PAPER, 0.9, 0],
  /*18 paint */ [INK, SEA, GLOW, 0.9, 0], /*19 seal  */ [INK, DEEP, SEA, 0.9, 1], /*20 bottle*/ [SEA, PAPER, PAPER, 0.4, 0],
];
while (MAT.length < 32) MAT.push([INK, DEEP, PAPER, 1, 0]);

/* ====================================================================== persistent state (memory) */
const DEF = () => ({
  v: 1, born: Date.now(), epoch: 1, epochStart: 0, epochLen: rr(50, 95) * 60, tension: 0, colorway: 0, cwVisits: [1, 0, 0, 0, 0, 0, 0, 0],
  grammar: { period: 7.2, dith: 0.12, wob: 8, outline: 1, hatch: 1.0 }, center: 38,
  uncanny: { next: rr(4, 9) * 60, counts: {}, last: {}, mem: {} },
  bottle: null, voyages: 1, finds: 0, cairns: [], haul: 0, haulPref: [1, 1, 1], trips: 0, log: [], runSec: 0, savedAt: Date.now()
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(DEF(), o); } } catch (e) {}
const T0 = S.runSec || 0; simT = T0;
let bottle = null;   // the thread (built below)
function save() { try { S.runSec = simT; S.savedAt = Date.now(); S.bottle = bottle ? bottle.toJSON() : S.bottle; localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function logEv(text) { S.log.unshift({ t: galwayParts(simMs).str, text }); if (S.log.length > 40) S.log.length = 40; }
// cairns stand for two days, then the weather takes them
{ const now = Date.now(); const before = S.cairns.length; S.cairns = S.cairns.filter(c => now - c.at < 48 * 3600e3); if (S.cairns.length < before) S._fell = before - S.cairns.length; }
if (!S.log.length) logEv('the bay woke for the first time');
else logEv('the bay resumed (epoch ' + S.epoch + ')' + (S._fell ? ` · ${S._fell} cairn${S._fell > 1 ? 's' : ''} had fallen` : ''));
delete S._fell;

/* ====================================================================== renderer + targets */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = true;
document.body.prepend(renderer.domElement);
let W = 2, H = 2, IW = 2, IH = 2;
const rtData = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false });
const rtPrint = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.12, 40000);
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  IH = Math.min(LINES, H); IW = Math.round(IH * W / H);
  rtData.setSize(IW, IH); rtPrint.setSize(IW, IH);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  PU.uRes.value.set(IW, IH); SH.uScr.value.set(IW, IH);
}

/* ====================================================================== shaders */
const NW = 6, NC = 6;
const COMMON = /* glsl */`
uniform mat4 uVP; uniform float uAspect; uniform float uFocus, uAper; uniform float uPerPx, uWobPx, uPxK;
uniform vec3 uSunD; uniform vec2 uScr; uniform float uOU, uOUy, uTide, uUwD;
uniform vec4 uW[8]; uniform vec4 uW2[8]; uniform float uCalm;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float cocAt(float dist){ return clamp(abs(dist-uFocus)/max(dist,0.005)*uAper,0.,1.); }
vec4 pack(float sh, float id, float line, float acc, float dist){ return vec4(clamp(sh,0.,1.), (id+0.5)/32., clamp(line,0.,1.), step(0.5,acc)*0.5+0.49*cocAt(dist)); }
// the hatching is carved into the surface (SRUTHÁN v3): lines run along T, spaced across it in the surface's own coordinates;
// spacing follows distance in octaves so the print keeps its density on screen. A still thing keeps a still pattern.
float lineAt(vec3 W, vec3 N, vec3 T, float dist, float extra){
  vec3 A=cross(N,T); if(dot(A,A)<1e-6) A=cross(N,vec3(0.,1.,0.)); if(dot(A,A)<1e-6) A=vec3(1.,0.,0.); A=normalize(A);
  vec3 B=cross(A,N); B=dot(B,B)<1e-6?vec3(0.,0.,1.):normalize(B);
  float s=dot(W,A), t=dot(W,B);
  // spacing in the surface's own units, chosen from how fast the surface runs past the pixels (foreshortening included),
  // then snapped to octaves so the carved pattern stays put; grazing fields keep clean lines instead of aliasing to static
  float ds=length(vec2(dFdx(s),dFdy(s)));
  float per=uPerPx*(1.+1.6*cocAt(dist))*max(ds,max(dist,0.01)*uPxK*0.35);
  float L=log2(max(per,1e-5)); float f=smoothstep(0.,1.,fract(L)); float p0=exp2(floor(L)), p1=p0*2.;
  float wk=uWobPx/max(uPerPx,0.1)*1.35;
  float l0=cos((s+((vn(vec2(s,t)/(p0*7.)+3.1)-.5)*wk+extra)*p0)*6.2831853/p0);
  float l1=cos((s+((vn(vec2(s,t)/(p1*7.)+3.1)-.5)*wk+extra)*p1)*6.2831853/p1);
  return 0.5+0.5*mix(l0,l1,f); }
// the seal's eye: a lens that sits on the waterline. Below the meniscus the print is under water.
float ouLine(){ float x=gl_FragCoord.x/uScr.x; return uOUy+0.011*sin(x*10.+uTime*1.9)+0.005*sin(x*27.-uTime*2.7); }
bool underView(){ return uOU>0.5 && gl_FragCoord.y/uScr.y<ouLine(); }
float seaLevel(vec2 p){ float y=uTide; for(int i=0;i<${NW};i++){ vec4 a=uW[i]; vec4 b=uW2[i]; y+=a.w*uCalm*sin(a.z*dot(a.xy,p)-b.x*uTime+b.z); } return y; }
`;
const SH = {   // shared uniforms (the same objects referenced by every material)
  uVP: { value: new THREE.Matrix4() }, uAspect: { value: 1.78 }, uTime: { value: 0 },
  uSunD: { value: V(0, 1, 0) }, uKeyD: { value: V(0, 1, 0) }, uCamP: { value: V() },
  uAmb: { value: 0.3 }, uDiff: { value: 0.6 }, uFogD: { value: 2400 }, uFogShade: { value: 0.6 },
  uDay: { value: 1 }, uKeyUp: { value: 1 }, uFocus: { value: 100 }, uAper: { value: 0 },
  uPerPx: { value: 6 }, uWobPx: { value: 7 }, uPxK: { value: .0012 }, uScr: { value: new THREE.Vector2(2, 2) },
  uOU: { value: 0 }, uOUy: { value: 0.5 }, uTide: { value: 0 }, uUwD: { value: 14 },
  uW: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) }, uW2: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) }, uCalm: { value: 1 },
  uWindL: { value: V() }, uWet: { value: 0.6 }, uWhite: { value: 0.3 },
};
const OBJ_VERT = /* glsl */`
uniform float uTime, uCloth, uMover, uBend, uBendH; uniform vec3 uWindL;
attribute vec3 aT; attribute vec2 aShore;
varying vec3 vW, vN, vL, vT; varying float vC; varying vec2 vShore;
void main(){
  vC=0.; vShore=aShore;
  vec4 lp=vec4(position,1.); vec3 ln=normal; vec3 lt=aT;
  if(uBend>0.001){ float k=clamp(lp.y/uBendH,0.,1.); k=k*k; lp.x-=uBend*k*uBendH*0.55; lp.y-=uBend*k*k*uBendH*0.18; }   // bowing toward the bay (-x)
  #ifdef USE_INSTANCING
    lp=instanceMatrix*lp; ln=mat3(instanceMatrix)*ln; lt=mat3(instanceMatrix)*lt;
  #endif
  vec4 w=modelMatrix*lp; vec3 n=normalize(mat3(modelMatrix)*ln);
  if(uCloth>2.5){   // kelp fronds stream and sway in the swell; grass tufts bend with the wind
    float hgt=max(position.y,0.); float ph=sin(uTime*(uCloth>3.5?2.1:0.7)+w.x*0.9+w.z*0.7)+0.5*sin(uTime*1.3+w.x*2.+w.z*1.7);
    float k=uCloth>3.5?hgt*hgt*1.4:0.22*hgt;
    w.xz+=(uCloth>3.5?uWindL.xz:vec2(0.5,0.3))*k*(0.6+0.4*ph)+vec2(ph,ph*0.6)*k*0.25;
    vC=0.05*ph;
  }
  vW=w.xyz; vN=n; vL=uMover>0.5?lp.xyz:w.xyz; vT=mat3(modelMatrix)*lt;   // movers carry their pattern with them
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const OBJ_FRAG = /* glsl */`
uniform float uTime;
${COMMON}
uniform float uId, uMode, uEmit, uAccAll;
uniform float uAmb, uDiff, uFogD, uFogShade, uWet, uKeyUp;
uniform vec3 uKeyD, uCamP, uT, uWindL;
varying vec3 vW, vN, vL, vT; varying float vC; varying vec2 vShore;
void rock(vec3 N, inout vec3 T, inout float sh, inout float acc, inout float id){
  float n1=vn(vW.xz*0.9+vW.y*0.6);

// the bay was going before you arrived: seals already out if the tide is low, us already on the shore some days
SEALS.forEach((s, i) => { const r = SEAL_ROCKS[s.rock]; if (TIDE.h < r.top - 0.6 && rnd() < 0.7 && !SEALS.some(o => o !== s && o.rock === s.rock && o.slot === s.slot && o.state === 'hauled')) s.state = 'hauled';
  else { s.pos.set(REEF_C.x - 20 + rr(-20, 20), 0, REEF_C.z + rr(-25, 25)); s.wander.copy(s.pos); } });
if (SUNM.sun.el > 0.06 && WX.precip < 1.2 && TIDE.h < 0.6 && rnd() < 0.6) { const z = rr(-25, 60); wePresent(V(edgeX(z) + 4, 0, z)); WEp.state = 'comb'; WEp.combUntil = simT + rr(10, 40) * 60; }

for (let i = 0; i < 40; i++) step(0.25);   // pre-warm ten seconds

}
