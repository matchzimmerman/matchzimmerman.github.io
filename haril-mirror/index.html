<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#08080b"/>
<title>HARIL // GESTURE FIELD</title>
<style>
:root{--bg:#08080b;--ink:#f5f0e8;--fire:#ff5a2f;--acid:#dcff68;--cyan:#78f2da;--dim:#77727d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#131019 0,#08080b 62%)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
.top{position:absolute;z-index:8;top:max(13px,env(safe-area-inset-top));left:max(15px,env(safe-area-inset-left));right:max(15px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-transform:uppercase;letter-spacing:.14em;font-size:8px;color:var(--dim)}
.brand b{color:var(--ink)} .live{display:inline-block;width:6px;height:6px;margin-right:7px;background:var(--fire);box-shadow:0 0 10px rgba(255,90,47,.9)}
#loopCount{color:var(--ink)}
#start{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .35s ease}
#start.hide{opacity:0}
.startInner{text-align:center;transform:translateY(-2vh)}
.big{font:900 clamp(52px,16vw,104px)/.78 Arial,Helvetica,sans-serif;letter-spacing:-.075em;text-transform:uppercase}
.big span{color:var(--fire)}
.small{margin-top:22px;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#8b858f}
#flash{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;font:900 clamp(42px,13vw,86px)/.85 Arial,Helvetica,sans-serif;letter-spacing:-.07em;text-align:center;text-transform:uppercase;color:var(--ink);mix-blend-mode:difference;transition:opacity .18s,transform .18s}
#flash.on{opacity:.9;transform:translate(-50%,-50%) scale(1)}
.controls{position:absolute;z-index:12;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(13px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;pointer-events:auto}
button{height:45px;border:1px solid rgba(245,240,232,.2);background:rgba(8,8,11,.62);backdrop-filter:blur(12px);color:var(--ink);font:800 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;border-radius:2px}
button:active{background:var(--ink);color:var(--bg)}
button.hot{border-color:var(--fire);color:var(--fire)}
#hint{position:absolute;z-index:7;left:0;right:0;bottom:max(70px,calc(env(safe-area-inset-bottom) + 58px));text-align:center;pointer-events:none;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#5e5964;transition:opacity .35s}
#mode{position:absolute;z-index:7;left:max(15px,env(safe-area-inset-left));bottom:max(75px,calc(env(safe-area-inset-bottom) + 64px));pointer-events:none;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#67616c}
#mode b{color:var(--acid)}
@media(min-width:700px){.controls{width:620px;left:50%;right:auto;transform:translateX(-50%)}#mode{left:30px}}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas><div id="grain"></div>
<div class="top"><div class="brand"><span class="live"></span><b>HARIL</b> // GESTURE FIELD</div><div><span id="loopCount">0</span> LOOPS</div></div>
<div id="start"><div class="startInner"><div class="big">DRAW<br><span>SOUND.</span></div><div class="small">touch anywhere · drag · hold · use two fingers</div></div></div>
<div id="flash">MUTATE</div>
<div id="mode">SYMMETRY <b id="symTxt">4</b> · ROOT <b id="rootTxt">D</b></div>
<div id="hint">release a gesture and it comes back</div>
<div class="controls"><button class="hot" id="mutate">MUTATE</button><button id="undo">UNDO LOOP</button><button id="clear">NEW FIELD</button></div>
</div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),start=document.getElementById('start'),flash=document.getElementById('flash');
const loopCount=document.getElementById('loopCount'),symTxt=document.getElementById('symTxt'),rootTxt=document.getElementById('rootTxt'),hint=document.getElementById('hint');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1),started=false,last=performance.now(),now=0;
let audio=null,master=null,delay=null,feedback=null,beatTimer=null,beat=0;
let active=new Map(),strokes=[],loops=[],bursts=[],ripples=[];
let symmetry=4,rootMidi=50,rootName='D',palette=0,mutation=0;
const roots=[{m:48,n:'C'},{m:50,n:'D'},{m:53,n:'F'},{m:55,n:'G'},{m:57,n:'A'}];
const scales=[[0,2,4,7,9,12,14,16],[0,3,5,7,10,12,15,17],[0,2,5,7,9,12,14,17]];
const pals=[['#ff5a2f','#f5f0e8','#dcff68'],['#78f2da','#f5f0e8','#ff5a2f'],['#dcff68','#f5f0e8','#78f2da']];
function resize(){W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function initAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.28;delay=audio.createDelay(.8);delay.delayTime.value=.24;feedback=audio.createGain();feedback.gain.value=.28;delay.connect(feedback);feedback.connect(delay);delay.connect(master);master.connect(audio.destination);beatTimer=setInterval(pulse,90)}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function noteFrom(xp,yp){const sc=scales[mutation%scales.length];const idx=Math.max(0,Math.min(sc.length-1,Math.floor((xp/W)*sc.length)));const oct=yp<H*.33?12:yp>H*.72?-12:0;return rootMidi+sc[idx]+oct}
function tone(midi,vel=.5,dur=.23,type='pluck',when=0){if(!audio)return;const t=Math.max(audio.currentTime,when||audio.currentTime);const o=audio.createOscillator(),o2=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type==='bass'?'sine':(mutation%2?'triangle':'sine');o2.type='triangle';o.frequency.setValueAtTime(hz(midi),t);o2.frequency.setValueAtTime(hz(midi)*2.003,t);f.type='lowpass';f.frequency.setValueAtTime(700+vel*4200,t);f.Q.value=3+vel*4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045+vel*.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);o2.connect(f);f.connect(g);g.connect(master);g.connect(delay);o.start(t);o2.start(t);o.stop(t+dur+.03);o2.stop(t+dur+.03)}
function chord(px,py){const m=noteFrom(px,py);[0,7,12].forEach((d,i)=>tone(m+d,.35,.8,'pad',audio.currentTime+i*.025));ripples.push({x:px,y:py,r:10,a:1,big:true})}
function kick(){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(92,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(master);o.start();o.stop(t+.18)}
function hat(){if(!audio)return;const n=audio.createBuffer(1,Math.floor(audio.sampleRate*.045),audio.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=n;f.type='highpass';f.frequency.value=4200;g.gain.value=.022;s.connect(f);f.connect(g);g.connect(master);s.start()}
function pulse(){if(!started||!audio||audio.state!=='running')return;beat++;if(loops.length){if(beat%7===0)kick();if(beat%4===0&&loops.length>1)hat()}}
function color(i=0){return pals[palette%pals.length][i%3]}
function mirrorPoints(px,py){const pts=[],cx=W/2,cy=H/2,dx=px-cx,dy=py-cy;for(let i=0;i<symmetry;i++){const a=i*Math.PI*2/symmetry,ca=Math.cos(a),sa=Math.sin(a);pts.push([cx+dx*ca-dy*sa,cy+dx*sa+dy*ca]);if(symmetry>=6)pts.push([cx-dx*ca-dy*sa,cy-dx*sa+dy*ca])}return pts}
function stamp(px,py,size,alpha=1,ci=0,rot=0){const pts=mirrorPoints(px,py);x.save();x.globalAlpha=alpha;x.fillStyle=color(ci);for(const [mx,my] of pts){x.save();x.translate(mx,my);x.rotate(rot);const s=Math.max(2,Math.round(size/3)*3);if((mutation+ci)%3===0){x.fillRect(-s/2,-s/2,s,s)}else if((mutation+ci)%3===1){x.beginPath();x.arc(0,0,s*.55,0,Math.PI*2);x.fill()}else{x.beginPath();x.moveTo(0,-s*.7);x.lineTo(s*.62,s*.42);x.lineTo(-s*.62,s*.42);x.closePath();x.fill()}x.restore()}x.restore()}
function lineMirror(a,b,alpha=.6,ci=1){const A=mirrorPoints(a.x,a.y),B=mirrorPoints(b.x,b.y);x.strokeStyle=color(ci);x.globalAlpha=alpha;x.lineWidth=1.2;for(let i=0;i<Math.min(A.length,B.length);i++){x.beginPath();x.moveTo(A[i][0],A[i][1]);x.lineTo(B[i][0],B[i][1]);x.stroke()}x.globalAlpha=1}
function begin(e){e.preventDefault();initAudio();if(audio&&audio.state==='suspended')audio.resume();if(!started){started=true;start.classList.add('hide');setTimeout(()=>start.style.display='none',400)}
const p={id:e.pointerId,x:e.clientX,y:e.clientY,ox:e.clientX,oy:e.clientY,lastX:e.clientX,lastY:e.clientY,t:performance.now(),lastNote:0,pts:[],events:[],held:false,holdTimer:null};active.set(e.pointerId,p);c.setPointerCapture?.(e.pointerId);p.pts.push({x:p.x,y:p.y,t:0,s:12});const m=noteFrom(p.x,p.y);tone(m,.6,.38);p.events.push({t:0,m,v:.6,x:p.x,y:p.y});bursts.push({x:p.x,y:p.y,a:1,s:16});p.holdTimer=setTimeout(()=>{if(active.has(e.pointerId)){p.held=true;chord(p.x,p.y)}},520)}
function move(e){const p=active.get(e.pointerId);if(!p)return;e.preventDefault();const nx=e.clientX,ny=e.clientY,dx=nx-p.lastX,dy=ny-p.lastY,dist=Math.hypot(dx,dy),elapsed=performance.now()-p.t;const speed=Math.min(1,dist/28);p.x=nx;p.y=ny;if(dist>7){const m=noteFrom(nx,ny),tm=performance.now();if(tm-p.lastNote>55){tone(m,.25+speed*.75,.18+speed*.18);p.events.push({t:elapsed,m,v:.25+speed*.75,x:nx,y:ny});p.lastNote=tm;bursts.push({x:nx,y:ny,a:.6+.4*speed,s:7+speed*14})}p.pts.push({x:nx,y:ny,t:elapsed,s:5+speed*18});p.lastX=nx;p.lastY=ny;if(p.held&&Math.random()<.13)chord(nx,ny)}}
function end(e){const p=active.get(e.pointerId);if(!p)return;e.preventDefault();clearTimeout(p.holdTimer);const dur=Math.max(250,performance.now()-p.t);if(p.pts.length<2)p.pts.push({x:p.x+1,y:p.y+1,t:dur,s:14});const st={pts:p.pts.slice(),alpha:1,ci:loops.length%3};strokes.push(st);const loop={pts:p.pts.slice(),events:p.events.slice(),start:performance.now(),len:Math.max(2600,Math.min(6200,dur*2.3)),ci:loops.length%3,lastCycle:-1,lastEvent:-1};loops.push(loop);if(loops.length>8){loops.shift();strokes.shift()}loopCount.textContent=loops.length;hint.style.opacity=loops.length?'0':'1';active.delete(e.pointerId);ripples.push({x:p.x,y:p.y,r:8,a:1,big:false});tone(noteFrom(p.x,p.y)-12,.35,.55,'bass')}
c.addEventListener('pointerdown',begin,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',end,{passive:false});c.addEventListener('pointercancel',end,{passive:false});
function playLoop(L,t){const phase=((t-L.start)%L.len+L.len)%L.len,cycle=Math.floor((t-L.start)/L.len);if(cycle!==L.lastCycle){L.lastCycle=cycle;L.lastEvent=-1}const scaled=L.events.map(ev=>({at:(ev.t/Math.max(1,L.pts[L.pts.length-1].t))*L.len,...ev}));for(let i=L.lastEvent+1;i<scaled.length;i++){if(phase>=scaled[i].at){tone(scaled[i].m,scaled[i].v*.45,.16);L.lastEvent=i}else break}if(L.pts.length){const total=Math.max(1,L.pts[L.pts.length-1].t),target=(phase/L.len)*total;let q=L.pts[0];for(let i=1;i<L.pts.length;i++){if(L.pts[i].t>=target){q=L.pts[i];break}}stamp(q.x,q.y,10+(q.s||8)*.45,.35,L.ci,phase*.001)}}
function drawGrid(t){x.save();x.strokeStyle='rgba(245,240,232,.035)';x.lineWidth=1;const step=Math.max(34,Math.min(58,W/8));const ox=(t*.008)%step;for(let xx=-step+ox;xx<W+step;xx+=step){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,H);x.stroke()}for(let yy=-step+ox*.7;yy<H+step;yy+=step){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}x.restore()}
function render(t){now=t;const dt=Math.min(32,t-last);last=t;x.fillStyle='rgba(8,8,11,.22)';x.fillRect(0,0,W,H);drawGrid(t);
for(const s of strokes){for(let i=1;i<s.pts.length;i++){if(i%2===0)lineMirror(s.pts[i-1],s.pts[i],.08,s.ci);if(i%3===0)stamp(s.pts[i].x,s.pts[i].y,Math.min(15,s.pts[i].s||8),.075,s.ci,i*.17)}}
for(const p of active.values()){for(let i=1;i<p.pts.length;i++){const a=p.pts[i-1],b=p.pts[i];if(i>Math.max(1,p.pts.length-32)){lineMirror(a,b,.6,1);stamp(b.x,b.y,b.s||10,.46,i%3,i*.19)}}}
for(const L of loops)playLoop(L,t);
for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.a-=dt*.0018;b.s+=dt*.025;stamp(b.x,b.y,b.s,b.a,0,b.s*.03);if(b.a<=0)bursts.splice(i,1)}
for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=dt*(r.big?.09:.055);r.a-=dt*.0011;x.save();x.globalAlpha=Math.max(0,r.a*.45);x.strokeStyle=r.big?color(2):color(0);x.lineWidth=1;for(const [mx,my] of mirrorPoints(r.x,r.y)){x.beginPath();x.arc(mx,my,r.r,0,Math.PI*2);x.stroke();if(r.big){x.beginPath();x.arc(mx,my,r.r*.55,0,Math.PI*2);x.stroke()}}x.restore();if(r.a<=0)ripples.splice(i,1)}
requestAnimationFrame(render)}requestAnimationFrame(render);
function showFlash(txt){flash.textContent=txt;flash.classList.add('on');setTimeout(()=>flash.classList.remove('on'),520)}
document.getElementById('mutate').onclick=()=>{initAudio();if(audio&&audio.state==='suspended')audio.resume();mutation++;palette=(palette+1)%pals.length;symmetry=[4,6,8][mutation%3];const rr=roots[(roots.findIndex(r=>r.m===rootMidi)+1)%roots.length];rootMidi=rr.m;rootName=rr.n;symTxt.textContent=symmetry;rootTxt.textContent=rootName;showFlash('MUTATE');loops.forEach((L,i)=>{L.ci=(L.ci+1)%3;L.events.forEach(ev=>ev.m=noteFrom(ev.x,ev.y))});chord(W*.5,H*.5)};
document.getElementById('undo').onclick=()=>{if(loops.length){loops.pop();strokes.pop();loopCount.textContent=loops.length;showFlash('UNDO')}};
document.getElementById('clear').onclick=()=>{loops=[];strokes=[];bursts=[];ripples=[];loopCount.textContent='0';x.fillStyle='#08080b';x.fillRect(0,0,W,H);hint.style.opacity='1';showFlash('NEW FIELD')};
})();
</script>
</body>
</html>
