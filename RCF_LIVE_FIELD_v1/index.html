<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>RCF // LIVE FIELD — MZCMG</title>
<style>
:root{--bg:#090909;--fg:#f4f1e8;--hi:#e6ff00;--line:#ffffff2c;--panel:#0b0b0bd9}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input{font:inherit} canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;image-rendering:auto}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.brand{font-weight:900;font-size:11px;letter-spacing:.08em;line-height:1.35;text-transform:uppercase;text-shadow:0 1px 0 #000}.brand b{color:var(--hi)}
.status{font-size:10px;line-height:1.45;text-align:right;opacity:.8}.panel{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:min(1060px,96vw);padding:8px;background:var(--panel);border:1px solid #ffffff20;backdrop-filter:blur(12px);box-shadow:0 8px 32px #0008}
button{height:34px;padding:0 11px;border:1px solid #ffffff3a;background:#101010;color:var(--fg);font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:0;cursor:pointer}button:hover,button.on{background:var(--hi);color:#000;border-color:var(--hi)}button.danger:hover{background:#ff3b30;color:#fff;border-color:#ff3b30}
#signal{height:34px;min-width:210px;flex:1 1 330px;background:#050505;border:1px solid #ffffff3a;color:var(--fg);outline:none;padding:0 10px;font-size:12px;border-radius:0}#signal:focus{border-color:var(--hi)}
.legend{font-size:9px;opacity:.55;line-height:1.4;max-width:340px}.meter{width:78px;height:34px;border:1px solid #ffffff30;position:relative;background:#050505;overflow:hidden}.meter i{position:absolute;left:0;bottom:0;height:100%;width:0;background:var(--hi);transition:width .04s linear;mix-blend-mode:screen}.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:900;color:white;text-shadow:0 1px 2px #000}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:9;background:#e6ff00;color:#000;font-weight:900;font-size:11px;padding:8px 12px;text-transform:uppercase;letter-spacing:.05em;opacity:0;transition:.25s;pointer-events:none}#toast.show{opacity:1}
body.clean #hud{opacity:0;transition:.25s} body.clean #hud:hover{opacity:1}
@media(max-width:700px){.legend{display:none}.status{font-size:8px}.panel{width:100%;max-height:150px;overflow:auto}.bottom{align-items:flex-end}button{height:32px;padding:0 8px;font-size:9px}.meter{height:32px}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="toast"></div>
<div id="hud">
  <div class="top">
    <div class="brand"><b>RCF // LIVE FIELD</b><br>MZCMG + Match Zimmerman Creative Media Group</div>
    <div class="status"><span id="modeLabel">FIELD</span> / <span id="countLabel">0 SIGNALS</span><br><span id="clock">00:00:00</span></div>
  </div>
  <div class="bottom">
    <div class="panel">
      <input id="signal" autocomplete="off" maxlength="90" placeholder="TYPE A SIGNAL / PHRASE / QUESTION…" />
      <button id="add">Add signal</button><button id="speak">Speak</button><button id="mic">Live mic</button>
      <div class="meter"><i id="meterFill"></i><span>INPUT</span></div>
      <button id="auto">Auto field</button><button id="mode">Field</button><button id="pulse">Pulse</button><button id="record">Rec</button><button id="shot">PNG</button><button id="full">Full</button><button id="clear" class="danger">Clear</button>
      <div class="legend">DRAG = inject force · TAP = field impulse · DOUBLE TAP = pin signal · SPACE = pulse · M = mic · A = auto · V = visual mode · H = hide UI</div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const c=document.querySelector('#field'), ctx=c.getContext('2d',{alpha:false});
const input=document.querySelector('#signal'), meterFill=document.querySelector('#meterFill');
const $=s=>document.querySelector(s), TAU=Math.PI*2;
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2), t=0,last=0,mode=0,auto=false,micOn=false,level=0,bass=0,treble=0,rec=null,recChunks=[],pointer={x:W/2,y:H/2,px:W/2,py:H/2,down:false};
let nodes=[], motes=[], ripples=[], audioCtx=null, analyser=null, freq=null, source=null, autoTimer=0, clean=false;
const modes=['FIELD','ORGANIC BIT','GLYPH MASS','GHOST MAP'];
const palette=['#e6ff00','#ff4fd8','#00f5ff','#ff6b00','#7b5cff','#f4f1e8','#49ff6d'];
const seedPhrases=['EMBODIED EXPERIENCE','SIGNAL','MEMORY','PRESSURE','RESONANCE','COHERENCE','BEHAVIOR','ALGORITHM','MANIPULATION','TRANSACTION','RECOVERY','NOISE','ATTENTION','FIELD'];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rndFrom(h,n=0){let x=Math.sin((h+n*1013)*12.9898)*43758.5453;return x-Math.floor(x)}
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim()}
function grams(s){s=norm(s).replace(/ /g,'_');let a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return new Set(a)}
function sim(a,b){let A=a.g,B=b.g,hit=0;A.forEach(x=>{if(B.has(x))hit++});return hit/Math.max(1,new Set([...A,...B]).size)}
function addSignal(text,x,y,flash=true){text=(text||'').trim();if(!text)return;const h=hash(text+performance.now().toFixed(0));const n={text:text.toUpperCase(),h,g:grams(text),x:x??W*(.16+.68*rndFrom(h,1)),y:y??H*(.18+.64*rndFrom(h,2)),vx:(rndFrom(h,3)-.5)*1.8,vy:(rndFrom(h,4)-.5)*1.8,r:18+rndFrom(h,5)*36,mass:.7+rndFrom(h,6)*2.2,charge:rndFrom(h,7)>.48?1:-1,color:palette[Math.floor(rndFrom(h,8)*palette.length)],age:0,pinned:false,pulse:0};nodes.push(n);if(nodes.length>32)nodes.splice(0,nodes.length-32);for(let i=0;i<24;i++) spawnMote(n.x,n.y,n.color,3.5);ripples.push({x:n.x,y:n.y,r:0,a:1,color:n.color});if(flash)toast('SIGNAL ENTERED // '+n.text.slice(0,28)); updateCount();return n}
function spawnMote(x=Math.random()*W,y=Math.random()*H,color=palette[Math.floor(Math.random()*palette.length)],speed=1){const a=Math.random()*TAU,s=Math.random()*speed;motes.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*210,max:280,size:1+Math.random()*2.4,color});if(motes.length>800)motes.splice(0,motes.length-800)}
function updateCount(){$('#countLabel').textContent=nodes.length+' SIGNAL'+(nodes.length===1?'':'S')}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(e._to);e._to=setTimeout(()=>e.classList.remove('show'),1000)}
function pulse(x=W/2,y=H/2,power=1){ripples.push({x,y,r:0,a:1,color:palette[(Math.random()*palette.length)|0]});for(const n of nodes){let dx=n.x-x,dy=n.y-y,d=Math.hypot(dx,dy)+1,imp=16*power/(1+d*.012);n.vx+=dx/d*imp;n.vy+=dy/d*imp;n.pulse=1}for(let i=0;i<70;i++)spawnMote(x,y,palette[i%palette.length],5*power)}
function seed(){if(nodes.length)return;['EMBODIED EXPERIENCE','THOUGHT','RECORDING','PATTERN','APPLICATION','REFINEMENT','AUTOMATION'].forEach((s,i)=>addSignal(s,W*(.18+.64*(i%4)/3),H*(.32+.36*Math.floor(i/4)),false));toast('FIELD SEEDED')}
function physics(dt){t+=dt;const drive=.25+level*3.8;for(let i=0;i<nodes.length;i++){let a=nodes[i];a.age+=dt;a.pulse*=.94;if(!a.pinned){a.vx+=(W/2-a.x)*.000018*dt;a.vy+=(H/2-a.y)*.000018*dt;for(let j=i+1;j<nodes.length;j++){let b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+90,d=Math.sqrt(d2),S=sim(a,b),ideal=92+(1-S)*190,force=(d-ideal)*(.000008+S*.00004)*dt;let fx=dx/d*force,fy=dy/d*force;a.vx+=fx;b.vx-=fx;a.vy+=fy;b.vy-=fy;let electro=(a.charge*b.charge)*32/d2*dt;a.vx-=dx/d*electro;b.vx+=dx/d*electro;a.vy-=dy/d*electro;b.vy+=dy/d*electro}a.vx+=Math.sin(t*.00045+a.h)*.003*dt*drive;a.vy+=Math.cos(t*.00037+a.h*.001)*.003*dt*drive;if(pointer.down){let dx=a.x-pointer.x,dy=a.y-pointer.y,d=Math.hypot(dx,dy)+20,drag=Math.min(1,60/d);a.vx+=(pointer.x-pointer.px)*drag*.05;a.vy+=(pointer.y-pointer.py)*drag*.05}a.vx*=Math.pow(.985,dt/16.7);a.vy*=Math.pow(.985,dt/16.7);let max=3.5+level*10,s=Math.hypot(a.vx,a.vy);if(s>max){a.vx=a.vx/s*max;a.vy=a.vy/s*max}a.x+=a.vx*dt/16.7;a.y+=a.vy*dt/16.7;if(a.x<-80)a.x=W+80;if(a.x>W+80)a.x=-80;if(a.y<-80)a.y=H+80;if(a.y>H+80)a.y=-80}}
for(const m of motes){m.life-=dt/16.7;let nearest=null,nd=1e9;for(const n of nodes){let dx=n.x-m.x,dy=n.y-m.y,d=dx*dx+dy*dy;if(d<nd){nd=d;nearest=n}}if(nearest){let dx=nearest.x-m.x,dy=nearest.y-m.y,d=Math.sqrt(nd)+1;let swirl=(nearest.charge*.032+treble*.05);m.vx+=(-dy/d)*swirl+dx/d*.006;m.vy+=(dx/d)*swirl+dy/d*.006}m.vx*=.995;m.vy*=.995;m.x+=m.vx*(1+level*3);m.y+=m.vy*(1+level*3);if(m.x<0)m.x+=W;if(m.x>W)m.x-=W;if(m.y<0)m.y+=H;if(m.y>H)m.y-=H}motes=motes.filter(m=>m.life>0);while(motes.length<Math.min(420,140+nodes.length*12))spawnMote();for(const r of ripples){r.r+=dt*(.08+level*.2);r.a*=Math.pow(.96,dt/16.7)}ripples=ripples.filter(r=>r.a>.03);if(auto){autoTimer-=dt;if(autoTimer<=0){autoTimer=800+Math.random()*1800;let p=seedPhrases[(Math.random()*seedPhrases.length)|0]; if(Math.random()<.45 && nodes.length) p=nodes[(Math.random()*nodes.length)|0].text+' / '+seedPhrases[(Math.random()*seedPhrases.length)|0];addSignal(p,undefined,undefined,false);pulse(Math.random()*W,Math.random()*H,.45)}}}
function bg(){ctx.fillStyle=mode===3?'rgba(4,5,8,.11)':mode===1?'rgba(4,4,4,.24)':'rgba(8,8,8,.14)';ctx.fillRect(0,0,W,H)}
function drawConnections(){ctx.save();for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],S=sim(a,b),d=Math.hypot(a.x-b.x,a.y-b.y),thr=160+S*300+level*180;if(d<thr){let alpha=(1-d/thr)*(.05+S*.5+level*.35);ctx.strokeStyle=`rgba(244,241,232,${alpha})`;ctx.lineWidth=.5+S*2+level*1.5;ctx.beginPath();ctx.moveTo(a.x,a.y);let mx=(a.x+b.x)/2+Math.sin(t*.001+a.h+b.h)*20*(1-S),my=(a.y+b.y)/2+Math.cos(t*.0013+a.h-b.h)*20*(1-S);ctx.quadraticCurveTo(mx,my,b.x,b.y);ctx.stroke()}}ctx.restore()}
function drawMotes(){ctx.save();ctx.globalCompositeOperation=mode===3?'screen':'lighter';for(const m of motes){let a=Math.min(.8,m.life/80)*(.18+level*.7);ctx.globalAlpha=a;ctx.fillStyle=m.color;if(mode===1){let q=5+Math.floor(level*8);ctx.fillRect(Math.round(m.x/q)*q,Math.round(m.y/q)*q,q*(.35+m.size*.18),q*(.35+m.size*.18))}else{ctx.beginPath();ctx.arc(m.x,m.y,m.size*(.55+level*1.8),0,TAU);ctx.fill()}}ctx.restore()}
function drawNodes(){for(const n of nodes){const r=n.r*(.72+level*.25+n.pulse*.35);ctx.save();ctx.translate(n.x,n.y);if(mode===2){ctx.globalAlpha=.08+level*.12;ctx.fillStyle=n.color;ctx.font=`900 ${Math.max(28,Math.min(110,W/(n.text.length*.47)))}px Arial Black,Impact,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.text,0,0);ctx.globalAlpha=.85;ctx.strokeStyle=n.color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,7+n.pulse*20,0,TAU);ctx.stroke()}else{ctx.globalCompositeOperation='screen';ctx.fillStyle=n.color;ctx.globalAlpha=.07+level*.07;ctx.beginPath();ctx.arc(0,0,r*1.9,0,TAU);ctx.fill();ctx.globalAlpha=.92;ctx.strokeStyle=n.color;ctx.lineWidth=1.2+n.pulse*3;ctx.beginPath();ctx.arc(0,0,r*.42,0,TAU);ctx.stroke();ctx.globalAlpha=.85;ctx.fillStyle='#f4f1e8';ctx.font='800 9px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';let label=n.text.length>26?n.text.slice(0,24)+'…':n.text;ctx.fillText(label,0,r*.72+12);if(n.pinned){ctx.fillStyle=n.color;ctx.fillRect(-2,-2,4,4)}}ctx.restore()}}
function drawRipples(){for(const r of ripples){ctx.globalAlpha=r.a*.65;ctx.strokeStyle=r.color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}ctx.globalAlpha=1}
function drawGrid(){if(mode!==3)return;ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle='#f4f1e8';ctx.lineWidth=.5;let s=48;for(let x=(t*.01)%s;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(t*.006)%s;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function render(now){let dt=Math.min(35,now-last||16.7);last=now;physics(dt);bg();drawGrid();drawConnections();drawMotes();drawRipples();drawNodes();meterFill.style.width=Math.min(100,level*180)+'%';requestAnimationFrame(render)}requestAnimationFrame(render);
function pointerPos(e){let p=e.touches?.[0]||e;return{x:p.clientX,y:p.clientY}}
c.addEventListener('pointerdown',e=>{let p=pointerPos(e);pointer={x:p.x,y:p.y,px:p.x,py:p.y,down:true};pulse(p.x,p.y,.35)});c.addEventListener('pointermove',e=>{let p=pointerPos(e);pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=p.x;pointer.y=p.y;if(pointer.down&&Math.random()<.35)spawnMote(p.x,p.y,palette[(Math.random()*palette.length)|0],2)});addEventListener('pointerup',()=>pointer.down=false);
c.addEventListener('dblclick',e=>{let best=null,d=1e9;for(const n of nodes){let q=Math.hypot(n.x-e.clientX,n.y-e.clientY);if(q<d){d=q;best=n}}if(best&&d<100){best.pinned=!best.pinned;toast(best.pinned?'SIGNAL PINNED':'SIGNAL RELEASED')}});
async function toggleMic(){if(micOn){micOn=false;$('#mic').classList.remove('on');$('#mic').textContent='Live mic';level=bass=treble=0;if(source)try{source.mediaStream.getTracks().forEach(t=>t.stop())}catch{}return}try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.72;freq=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);micOn=true;$('#mic').classList.add('on');$('#mic').textContent='Mic on';toast('LIVE AUDIO FIELD ENABLED');audioLoop()}catch(e){toast('MIC PERMISSION NEEDED') ; console.warn(e)}}
function audioLoop(){if(!micOn||!analyser)return;analyser.getByteFrequencyData(freq);let sum=0,b=0,tr=0;for(let i=0;i<freq.length;i++){sum+=freq[i];if(i<18)b+=freq[i];if(i>90&&i<230)tr+=freq[i]}level=(sum/freq.length)/128;bass=(b/18)/128;treble=(tr/140)/128;if(bass>.72&&Math.random()<.16)pulse(W/2,H/2,.2+bass*.4);requestAnimationFrame(audioLoop)}
function speech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('SPEECH INPUT NOT SUPPORTED HERE');return}let r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;$('#speak').classList.add('on');r.onresult=e=>{let s=e.results[0][0].transcript;input.value=s;addSignal(s);input.value=''};r.onend=()=>$('#speak').classList.remove('on');r.onerror=()=>toast('SPEECH INPUT FAILED');r.start()}
function addFromInput(){if(input.value.trim()){addSignal(input.value);input.value=''}}
$('#add').onclick=addFromInput;input.addEventListener('keydown',e=>{if(e.key==='Enter')addFromInput()});$('#speak').onclick=speech;$('#mic').onclick=toggleMic;
$('#auto').onclick=()=>{auto=!auto;$('#auto').classList.toggle('on',auto);toast(auto?'AUTO FIELD RUNNING':'AUTO FIELD PAUSED')};$('#mode').onclick=()=>{mode=(mode+1)%modes.length;$('#mode').textContent=modes[mode];$('#modeLabel').textContent=modes[mode];ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H);toast(modes[mode])};$('#pulse').onclick=()=>pulse(W/2,H/2,1);$('#clear').onclick=()=>{nodes=[];motes=[];ripples=[];updateCount();ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H);toast('FIELD CLEARED')};
$('#shot').onclick=()=>{let a=document.createElement('a');a.download='RCF-LIVE-FIELD-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();toast('PNG CAPTURED')};
$('#full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{document.body.classList.toggle('clean')}};
$('#record').onclick=()=>{if(rec&&rec.state==='recording'){rec.stop();return}try{let stream=c.captureStream(60);recChunks=[];rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(recChunks,{type:'video/webm'}),a=document.createElement('a');a.download='RCF-LIVE-FIELD-'+Date.now()+'.webm';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#record').classList.remove('on');$('#record').textContent='Rec';toast('RECORDING SAVED')};rec.start();$('#record').classList.add('on');$('#record').textContent='Stop';toast('CANVAS RECORDING') }catch(e){toast('RECORDING NOT SUPPORTED');console.warn(e)}};
addEventListener('keydown',e=>{if(e.target===input)return;if(e.code==='Space'){e.preventDefault();pulse(W/2,H/2,1)}if(e.key.toLowerCase()==='m')toggleMic();if(e.key.toLowerCase()==='a')$('#auto').click();if(e.key.toLowerCase()==='v')$('#mode').click();if(e.key.toLowerCase()==='h'){clean=!clean;document.body.classList.toggle('clean',clean)}});
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})},1000);seed();
})();
</script>
</body>
</html>
