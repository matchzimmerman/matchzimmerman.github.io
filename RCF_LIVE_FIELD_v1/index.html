<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0b09" />
<title>RCF // SIGNAL PRESSURE — MZCMG</title>
<style>
:root{--bg:#0b0b09;--paper:#eee9dc;--acid:#e8ff00;--orange:#ff5b1a;--blue:#4b66ff;--panel:#0b0b09e8;--line:#eee9dc38}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input{font:inherit}button{border-radius:0}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand{font-size:10px;font-weight:900;line-height:1.35;letter-spacing:.09em;text-transform:uppercase}.brand b{color:var(--acid)}.status{text-align:right;font-size:9px;line-height:1.45;opacity:.72}.instructions{position:absolute;left:12px;top:72px;max-width:300px;font-size:9px;line-height:1.55;letter-spacing:.03em;text-transform:uppercase;opacity:.68}.instructions strong{color:var(--acid)}
.panel{pointer-events:auto;display:grid;grid-template-columns:minmax(220px,1fr) repeat(7,auto);gap:5px;align-items:center;width:min(1160px,100%);background:var(--panel);border:1px solid var(--line);padding:7px;backdrop-filter:blur(10px)}
input{height:36px;background:#050504;color:var(--paper);border:1px solid #eee9dc45;outline:0;padding:0 10px;font-size:11px;min-width:0}input:focus{border-color:var(--acid)}button{height:36px;border:1px solid #eee9dc45;background:#11110e;color:var(--paper);padding:0 10px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}button:hover,button.on{background:var(--acid);border-color:var(--acid);color:#0b0b09}.meter{height:36px;width:72px;border:1px solid #eee9dc45;position:relative;overflow:hidden;background:#050504}.meter i{position:absolute;left:0;bottom:0;height:100%;width:0;background:var(--acid);transition:width .05s linear}.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;font-weight:900;mix-blend-mode:difference;color:white}.word{position:fixed;left:50%;top:50%;transform:translate(-50%,-52%);z-index:2;pointer-events:none;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-weight:900;font-size:clamp(56px,14vw,240px);line-height:.8;text-align:center;letter-spacing:-.035em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(238,233,220,.35);mix-blend-mode:screen;opacity:.72;max-width:96vw;overflow-wrap:anywhere}.word[data-mode="mask"]{color:var(--paper);-webkit-text-stroke:0;mix-blend-mode:difference;opacity:.95}.word[data-mode="ghost"]{color:transparent;-webkit-text-stroke:2px var(--acid);mix-blend-mode:normal;opacity:.42}
#trace{position:fixed;right:12px;top:70px;width:min(280px,42vw);font-size:8px;line-height:1.45;text-align:right;text-transform:uppercase;opacity:.45;pointer-events:none}#trace b{color:var(--acid);font-weight:900}.tick{display:inline-block;width:7px;height:7px;border:1px solid currentColor;margin-left:3px;vertical-align:-1px}.tick.on{background:currentColor}
body.clean #hud,body.clean #trace{opacity:0;transition:.2s}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acid);color:#000;padding:6px 9px;font-size:9px;font-weight:900;text-transform:uppercase;z-index:6;opacity:0;transition:.15s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:820px){.panel{grid-template-columns:1fr repeat(3,auto)}.panel .optional{display:none}.instructions{top:58px;max-width:245px}.status{font-size:8px}.brand{font-size:9px}button{padding:0 8px}.word{font-size:clamp(58px,21vw,180px)}#trace{display:none}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="word" id="word" data-mode="mask">SIGNAL</div>
<div id="trace"></div><div class="toast" id="toast"></div>
<div id="hud">
  <div class="top"><div class="brand"><b>RCF // SIGNAL PRESSURE</b><br>MZCMG + MATCH ZIMMERMAN CREATIVE MEDIA GROUP</div><div class="status"><span id="modeLabel">STRATA</span> / <span id="wordLabel">0 WORDS</span><br><span id="clock">00:00:00</span></div></div>
  <div class="instructions"><strong>01</strong> ENTER A PHRASE → EACH WORD BECOMES A FORCE<br><strong>02</strong> THE FORCES BEND A LOW-RES FIELD<br><strong>03</strong> MIC / TOUCH ADDS PRESSURE<br><strong>04</strong> THE ACTIVE WORD BECOMES THE MASK</div>
  <div class="panel">
    <input id="signal" autocomplete="off" maxlength="100" value="THE OBJECTIVE IS ALGORITHMIC MANIPULATION" aria-label="Signal phrase" />
    <button id="build">Build</button>
    <button id="mic">Mic</button>
    <div class="meter"><i id="meterFill"></i><span>PRESSURE</span></div>
    <button id="mode">Strata</button>
    <button id="wordMode" class="optional">Mask</button>
    <button id="cycle" class="optional on">Cycle</button>
    <button id="shot" class="optional">PNG</button>
    <button id="record" class="optional">Rec</button>
    <button id="full">Full</button>
    <button id="hide" class="optional">UI</button>
  </div>
</div>
<script>
(()=>{
'use strict';
const cvs=document.querySelector('#field'),ctx=cvs.getContext('2d',{alpha:false});
const low=document.createElement('canvas'),lx=low.getContext('2d',{willReadFrequently:true});
const $=s=>document.querySelector(s),TAU=Math.PI*2;
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2),LW=180,LH=100,t=0,last=0,mode=0,wordMode=0,cycle=true,active=0,nextWord=0,level=0,bass=0,treble=0,micOn=false,audioCtx,analyser,freq,source,rec,chunks=[];
let sources=[],touches=[],phrase='';
const modes=['STRATA','CONTOUR','RUPTURE'];
const wordModes=['MASK','OUTLINE','GHOST'];
const P={dark:[11,11,9],paper:[238,233,220],acid:[232,255,0],orange:[255,91,26],blue:[75,102,255]};
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);LW=Math.max(120,Math.min(240,Math.round(W/6)));LH=Math.max(80,Math.round(LW*H/W));low.width=LW;low.height=LH}addEventListener('resize',resize);resize();
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rand(h,n){let x=Math.sin((h+n*997)*12.9898)*43758.5453;return x-Math.floor(x)}
function build(raw=$('#signal').value){phrase=(raw||'').trim().toUpperCase();let words=phrase.match(/[A-Z0-9’'-]+/g)||[];if(!words.length)return;sources=words.map((w,i)=>{let h=hash(w+i);let a=(i/words.length)*TAU+rand(h,1)*.7,r=.18+.22*rand(h,2);return{word:w,h,x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r,str:.65+rand(h,3)*1.15,sign:rand(h,4)>.45?1:-1,phase:rand(h,5)*TAU}});active=0;nextWord=performance.now()+1100;updateLabels();toast(words.length+' WORD FIELD BUILT')}
function updateLabels(){$('#wordLabel').textContent=sources.length+' WORD'+(sources.length===1?'':'S');$('#modeLabel').textContent=modes[mode];$('#word').textContent=sources[active]?.word||'SIGNAL';$('#word').dataset.mode=wordModes[wordMode].toLowerCase()==='outline'?'':wordModes[wordMode].toLowerCase();let tr=sources.map((s,i)=>`${i===active?'<b>→ '+s.word+'</b>':s.word} <span class="tick ${s.sign>0?'on':''}"></span>`).join('<br>');$('#trace').innerHTML=tr}
function fieldAt(x,y,time){let v=0;for(let i=0;i<sources.length;i++){let s=sources[i],dx=x-s.x,dy=y-s.y,d=Math.sqrt(dx*dx+dy*dy)+.012;let wave=Math.sin(d*34-time*.0018+s.phase);v+=s.sign*s.str*(1/(1+d*8)) + wave*(.12+s.str*.05)/(1+d*5)}for(let q of touches){let dx=x-q.x,dy=y-q.y,d=Math.sqrt(dx*dx+dy*dy)+.01;v+=q.str/(1+d*12)}v+=Math.sin((x*7+y*4)+time*.00018)*.12;v+=Math.cos((x*3-y*9)-time*.00014)*.09;return v*(1+level*1.8)}
function renderField(now){const img=lx.createImageData(LW,LH),d=img.data;let k=0;for(let y=0;y<LH;y++){for(let x=0;x<LW;x++){let nx=x/LW,ny=y/LH,v=fieldAt(nx,ny,now);let r,g,b;if(mode===0){let q=v>.42?2:v>-.08?1:0;if(q===0)[r,g,b]=P.dark;else if(q===1)[r,g,b]=P.paper;else [r,g,b]=P.acid;if(((x+y+Math.floor(now*.015))%17===0)&&Math.abs(v)<.18)[r,g,b]=P.orange}
else if(mode===1){let bands=Math.floor((v+2)*4.2);let edge=Math.abs(((v+2)*4.2)%1-.5);if(edge>.42)[r,g,b]=P.paper;else if(bands%5===0)[r,g,b]=P.blue;else [r,g,b]=P.dark;if(v>.65)[r,g,b]=P.acid}
else{let q=Math.sin(v*7+Math.sin(nx*19-now*.0005)*1.8);if(q>.28)[r,g,b]=P.paper;else [r,g,b]=P.dark;if(v>.72)[r,g,b]=P.orange;if(v<-.72)[r,g,b]=P.blue}
d[k++]=r;d[k++]=g;d[k++]=b;d[k++]=255}}lx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,LW,LH,0,0,W,H);drawSources(now)}
function drawSources(now){ctx.save();ctx.globalCompositeOperation='difference';for(let i=0;i<sources.length;i++){let s=sources[i],x=s.x*W,y=s.y*H,p=4+Math.sin(now*.003+s.phase)*2+(i===active?5:0);ctx.strokeStyle=i===active?'#ffffff':'#777';ctx.lineWidth=1;ctx.strokeRect(Math.round(x)-p,Math.round(y)-p,p*2,p*2);ctx.beginPath();ctx.moveTo(x-p*2.2,y);ctx.lineTo(x+p*2.2,y);ctx.moveTo(x,y-p*2.2);ctx.lineTo(x,y+p*2.2);ctx.stroke()}ctx.restore();if(mode===2){ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#eee9dc';ctx.lineWidth=1;for(let y=0;y<H;y+=16){ctx.beginPath();for(let x=0;x<W;x+=10){let yy=y+fieldAt(x/W,y/H,now)*9; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke()}ctx.restore()}}
function animate(now){let dt=Math.min(50,now-last||16);last=now;t+=dt;for(let q of touches)q.str*=.94;touches=touches.filter(q=>Math.abs(q.str)>.03);if(cycle&&sources.length&&now>nextWord){active=(active+1)%sources.length;nextWord=now+850+Math.min(900,sources[active].word.length*55);updateLabels()}renderField(now);$('#meterFill').style.width=Math.min(100,level*155)+'%';requestAnimationFrame(animate)}requestAnimationFrame(animate);
function inject(clientX,clientY,p=1){touches.push({x:clientX/W,y:clientY/H,str:p});if(touches.length>12)touches.shift()}
cvs.addEventListener('pointerdown',e=>inject(e.clientX,e.clientY,e.shiftKey?-1:1));cvs.addEventListener('pointermove',e=>{if(e.buttons)inject(e.clientX,e.clientY,e.movementX<0?-0.6:.6)});
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),900)}
async function toggleMic(){if(micOn){micOn=false;$('#mic').classList.remove('on');$('#mic').textContent='Mic';level=bass=treble=0;try{source.mediaStream.getTracks().forEach(t=>t.stop())}catch{}return}try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.8;freq=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);micOn=true;$('#mic').classList.add('on');$('#mic').textContent='Mic on';audioLoop();toast('MIC → FIELD PRESSURE')}catch(e){toast('MIC PERMISSION NEEDED')}}
function audioLoop(){if(!micOn)return;analyser.getByteFrequencyData(freq);let sum=0,lo=0,hi=0;for(let i=0;i<freq.length;i++){sum+=freq[i];if(i<16)lo+=freq[i];if(i>55&&i<150)hi+=freq[i]}level=(sum/freq.length)/150;bass=(lo/16)/150;treble=(hi/95)/150;if(bass>.72)inject(W/2,H/2,.22+bass*.3);requestAnimationFrame(audioLoop)}
$('#build').onclick=()=>build();$('#signal').addEventListener('keydown',e=>{if(e.key==='Enter')build()});$('#mic').onclick=toggleMic;
$('#mode').onclick=()=>{mode=(mode+1)%modes.length;$('#mode').textContent=modes[mode];updateLabels();toast(modes[mode])};
$('#wordMode').onclick=()=>{wordMode=(wordMode+1)%wordModes.length;$('#wordMode').textContent=wordModes[wordMode];updateLabels()};
$('#cycle').onclick=()=>{cycle=!cycle;$('#cycle').classList.toggle('on',cycle);toast(cycle?'WORD CYCLE ON':'WORD CYCLE PAUSED')};
$('#shot').onclick=()=>{let a=document.createElement('a');a.download='RCF-SIGNAL-PRESSURE-'+Date.now()+'.png';a.href=cvs.toDataURL('image/png');a.click()};
$('#record').onclick=()=>{if(rec&&rec.state==='recording'){rec.stop();return}try{chunks=[];rec=new MediaRecorder(cvs.captureStream(60),{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let a=document.createElement('a');a.download='RCF-SIGNAL-PRESSURE-'+Date.now()+'.webm';a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.click();$('#record').classList.remove('on');$('#record').textContent='Rec'};rec.start();$('#record').classList.add('on');$('#record').textContent='Stop'}catch{toast('RECORDING NOT SUPPORTED')}};
$('#full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};$('#hide').onclick=()=>document.body.classList.toggle('clean');
addEventListener('keydown',e=>{if(e.target===$('#signal'))return;let k=e.key.toLowerCase();if(k==='m')toggleMic();if(k==='v')$('#mode').click();if(k==='w')$('#wordMode').click();if(k===' ') {e.preventDefault();inject(W/2,H/2,1)}if(e.key==='ArrowRight'&&sources.length){active=(active+1)%sources.length;updateLabels()}if(e.key==='ArrowLeft'&&sources.length){active=(active-1+sources.length)%sources.length;updateLabels()}});
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false}),1000);build();
})();
</script>
</body>
</html>
