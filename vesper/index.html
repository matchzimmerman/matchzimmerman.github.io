const blurFS=`precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform vec2 uStep;void main(){vec3 c=texture2D(uTex,vUV).rgb*.227027;

function shaderProgram(gl,vs,fs){const make=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};let p=gl.createProgram();gl.attachShader(p,make(gl.VERTEX_SHADER,vs));gl.attachShader(p,make(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}

class World{
 constructor(){this.solid=[];this.lines=[];this.particles=[];this.rng=rand;this.blooms=[];this.floor=[];this.build()}
 addVertex(position,normal,color,uv=[0,0],motion=[0,0],kind=0){this.solid.push(...position,...normal,...color,...uv,...motion,kind)}
 addTri(a,b,c,kind=0){let pa=a.p,pb=b.p,pc=c.p;let n=norm(cross(sub(pb,pa),sub(pc,pa)));for(const v of [a,b,c])this.addVertex(v.p,n,v.c,v.uv||[0,0],v.m||[0,0],kind)}
 addLine(a,b,col1,col2=col1,m=[0,0]){this.lines.push(...a,...col1,...m,...b,...col2,...m)}
 tube(points,rad,color,sides=6,kind=1,phase=0,amp=0){for(let i=0;i<points.length-1;i++){
  let a=points[i],b=points[i+1],t=norm(sub(b,a)),ref=Math.abs(t[1])>.9?[1,0,0]:[0,1,0];let u=norm(cross(t,ref)),v=cross(t,u);

   this.addTri(A,C,B,kind);this.addTri(B,C,D,kind)

 }}
 petal(center,scale,ang,layer,petalIndex,color,phase,leaf=false){
  const U=11,V=6;let verts=[];const ripple=R(-.08,.08), curl=R(.1,.7),flair=R(.78,1.16);
  for(let i=0;i<=U;i++){
   let u=i/U,row=[];

  // transverse branches, and a hairline along each curved petal edge.
  const ink=[...color.map(v=>mix(v,1,.72)),.22];
  for(const j of [0,1,2,3,4,5,6]){
    if(j===0||j===6||j===3||(!leaf&&j%2===0)){

   let a=(j/ (master?28:13))*Math.PI*2 + phase,r=R(.2,.47)*scale,h=R(.28,.68)*scale;
