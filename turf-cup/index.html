<!doctype html>
<html lang="en">
<head>
<title>Turf Cup</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NES-style 4v4 field hockey. Pick a nation, pass, one-time it and beat the keeper.">
<meta property="og:title" content="Turf Cup">
<meta property="og:description" content="NES-style 4v4 field hockey you can play in the browser.">
<meta name="theme-color" content="#16152a">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: handheld shell. Screen on top with pad below in portrait; stick | screen | buttons in landscape. Single dark arcade look by design. */
:root{
  --shell:#16152a; --shell-hi:#232142; --ink:#f1ead8; --dim:#8b87a8;
  --red:#d6303a; --red-lo:#8e1720;
  --px:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--px);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:8px;box-sizing:border-box;position:relative}
#screen{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
  box-shadow:0 0 0 3px #000,0 0 0 6px var(--shell-hi),0 10px 30px rgba(0,0,0,.5);touch-action:none}
#help{margin:0;text-align:center;font-size:8px;line-height:1.9;color:var(--dim);text-wrap:balance;padding-bottom:4px}
#help b{color:var(--ink);font-weight:normal}
#pad{display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-bottom:4px;touch-action:none}
#stick{justify-self:start;width:136px;height:136px;border-radius:50%;position:relative;touch-action:none;
  background:radial-gradient(circle at 50% 50%,#0d0c1c 0 58%,#0a0916 59% 100%);box-shadow:inset 0 0 0 2px #2c2a4d}
#stick::before,#stick::after{content:"";position:absolute;left:50%;top:50%;background:#2c2a4d;transform:translate(-50%,-50%)}
#stick::before{width:96px;height:4px}#stick::after{width:4px;height:96px}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;z-index:1;
  background:#3a3762;box-shadow:inset 0 -4px 0 #24223f,0 3px 0 #08070f;pointer-events:none}
#btns{justify-self:end;display:flex;gap:14px;align-items:flex-start}
.ab{width:70px;height:70px;border-radius:50%;border:0;background:var(--red);color:#fff;font:14px/1 var(--px);
  box-shadow:inset 0 -5px 0 var(--red-lo),0 3px 0 #08070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none}
.ab small{font-size:6px;letter-spacing:.06em;opacity:.85}
#bB{margin-top:30px}
.ab.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--red-lo)}
#meta{display:flex;flex-direction:column;gap:12px;align-items:center}
.pill{border:0;border-radius:10px;background:#3a3762;color:var(--ink);font:7px/1 var(--px);letter-spacing:.08em;padding:9px 12px;box-shadow:0 3px 0 #08070f;touch-action:none}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 #08070f}
button:focus-visible{outline:2px solid #ffd54a;outline-offset:3px}
#mute{position:absolute;top:8px;right:0}
@media (pointer:coarse){ #pad{display:grid} #help{display:none} #mute{display:none} }
@media (pointer:coarse) and (orientation:landscape){
  #app{flex-direction:row;align-items:center;gap:12px}
  #pad{display:contents}
  #stick{order:0;flex:0 0 auto;width:120px;height:120px}
  #screen{order:1;height:100%}
  #btns{order:2;flex:0 0 auto;flex-direction:column-reverse;gap:14px}
  #bB{margin-top:0;margin-right:30px}
  .ab{width:64px;height:64px}
  #meta{position:absolute;top:8px;left:0;flex-direction:column;gap:10px}
}
@media (prefers-reduced-motion:reduce){ .ab.on,.pill.on{transform:none} }
</style>

</head>
<body>
<div id="app">
  <div id="screen"><canvas id="game" width="384" height="216" role="img" aria-label="Turf Cup game screen"></canvas></div>
  <div id="pad">
    <div id="stick" aria-label="Direction pad"><div id="knob"></div></div>
    <div id="meta">
      <button class="pill" id="bSel" type="button">SOUND ON</button>
      <button class="pill" id="bStart" type="button">START</button>
    </div>
    <div id="btns">
      <button class="ab" id="bB" type="button" aria-label="B: pass, block tackle or switch">B<small>PASS</small></button>
      <button class="ab" id="bA" type="button" aria-label="A: shoot or jab">A<small>SHOOT</small></button>
    </div>
  </div>
  <p id="help"><b>ARROWS</b> move &nbsp;·&nbsp; <b>Z</b> shoot (hold = drag flick) / jab &nbsp;·&nbsp; <b>X</b> pass / block tackle / switch &nbsp;·&nbsp; <b>ENTER</b> start / pause &nbsp;·&nbsp; <b>M</b> sound &nbsp;·&nbsp; gamepads work too</p>
  <button class="pill" id="mute" type="button">SOUND ON</button>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const VH=216;let VW=384;
const FONT='"Press Start 2P", ui-monospace, monospace';
const R=Math.random,hyp=Math.hypot,clamp=(v,a,b)=>v<a?a:v>b?b:v,sgn=v=>v<0?-1:1;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};

/* ---------- world: 7 units per metre, blue turf, side-on camera ---------- */
const PL=520,PD=300,GY=PD/2,GH=20,DR=118,M23=130,CX=PL/2,GOAL_H=22;
const LGX=0,RGX=PL;
const SY0=46,KY=.46,NEAR=.22; // screen y of far touchline, depth scale, perspective strength
let SWAP=false;
const ZLO=.66,ZHI=.82; // sweet spot on the shot meter
const attGoal=t=>(t===0)!==SWAP?RGX:LGX,defGoal=t=>(t===0)!==SWAP?LGX:RGX,dirX=t=>(t===0)!==SWAP?1:-1;
function inD(x,y,gx){
  if(gx===RGX?x>RGX+1:x<LGX-1)return false;
  const dy=y<GY-GH?(GY-GH)-y:y>GY+GH?y-(GY+GH):0;
  return hyp(x-gx,dy)<=DR;
}
const cam={x:CX};
const dscale=y=>1-NEAR+NEAR*clamp(y,-40,PD+40)/PD;
function sx(x,y){return VW/2+(x-cam.x)*dscale(y)}
function sy(y){return SY0+y*KY}

/* ---------- teams: identified by kit colours only ---------- */
const TEAMS=[
 {c:'NED',n:'NETHERLANDS',k:'#ff7a00',s:'#ffffff',a:9,d:9,g:8},
 {c:'ARG',n:'ARGENTINA',k:'#8fd0ff',s:'#ffffff',a:8,d:8,g:8},
 {c:'BEL',n:'BELGIUM',k:'#d81e2c',s:'#1a1a1a',a:9,d:8,g:7},
 {c:'GER',n:'GERMANY',k:'#f2f2f2',s:'#1a1a1a',a:8,d:8,g:9},
 {c:'AUS',n:'AUSTRALIA',k:'#ffcc00',s:'#0b7a3d',a:8,d:7,g:7},
 {c:'IND',n:'INDIA',k:'#1e4fd0',s:'#ff9933',a:8,d:6,g:7},
 {c:'ENG',n:'ENGLAND',k:'#ffffff',s:'#c8102e',a:7,d:7,g:8},
 {c:'ESP',n:'SPAIN',k:'#c60b1e',s:'#ffc400',a:6,d:7,g:7},
 {c:'IRL',n:'IRELAND',k:'#169b62',s:'#ffffff',a:5,d:6,g:8},
 {c:'NZL',n:'NEW ZEALAND',k:'#141414',s:'#ffffff',a:6,d:5,g:6},
 {c:'USA',n:'USA',k:'#0d2b6b',s:'#e03a3e',a:4,d:5,g:6},
 {c:'JPN',n:'JAPAN',k:'#e8e8e8',s:'#bc002d',a:5,d:4,g:5},
];
const TS=t=>TEAMS[t===0?G.my:G.op];
const STYLE_ORDER=[2,0,3,1,4,6,5,7,8],SHOES=['#ffffff','#1b1b1b','#ff3d7f','#3dd6ff','#ffe14d','#7bf08a'];
const GKC=[{k:'#b44cff',s:'#ffe14d'},{k:'#3fe08a',s:'#14131f'}];
const SKINS=['#f3cfae','#e3b088','#c98b62','#a76a45','#83502f','#5e3a22'];
const HAIR=['#24160c','#4e3218','#111111','#c99a4a','#6e4224','#2d2d2d','#a33a1c'];
const LV=[{n:'EASY',sp:.84,tk:.5,gk:.34,acc:7,st:.3},{n:'NORMAL',sp:.94,tk:1,gk:.46,acc:4,st:.4},{n:'HARD',sp:1.03,tk:1.6,gk:.56,acc:2,st:.5}];
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const cdist=(a,b)=>{const x=rgb(a),y=rgb(b);return hyp(x[0]-y[0],x[1]-y[1],x[2]-y[2])};

/* ---------- crowd texture (far stand) ---------- */
const crowdC=document.createElement('canvas');crowdC.width=512;crowdC.height=26;
(()=>{const c=crowdC.getContext('2d');c.fillStyle='#1b1a2c';c.fillRect(0,0,512,26);
  const col=['#e85d4a','#f2c14e','#5fa8d3','#e8e8e8','#7bc96f','#c77dff','#ff9a5a','#3a3a52','#2a2a3e','#2a2a3e'];
  let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  for(let y=1;y<26;y+=3)for(let x=(y%2)*2;x<512;x+=4){const k=col[(rnd()*col.length)|0];c.fillStyle=k;c.fillRect(x,y,2,2);if(k!=='#2a2a3e'&&k!=='#3a3a52'){c.fillStyle='#e8c09a';c.fillRect(x,y-1,2,1)}}
})();

/* ---------- audio ---------- */
let AC=null,master=null,muted=false,NB=null;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){return}}
  if(AC.state==='suspended')AC.resume().catch(()=>{});
}
function tone(f,d,type='square',v=.05,w=0,sl=0){
  if(!AC||muted)return;const t=AC.currentTime+w;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.linearRampToValueAtTime(Math.max(20,f+sl),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.08,w=0,hp=1000){
  if(!AC||muted)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=AC.createGain();const t=AC.currentTime+w;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  hit(){noise(.06,.2,0,1500);tone(900,.04,'square',.03)},
  clack(){noise(.04,.16,0,2500);tone(1400,.03,'square',.025)},
  pass(){noise(.04,.1,0,2200);tone(660,.04,'square',.025)},
  tick(){tone(1250,.02,'square',.02)},
  whistle(n=1){for(let i=0;i<n;i++)for(let j=0;j<6;j++)tone(j%2?2350:2150,.045,'square',.022,i*.32+j*.045)},
  goal(){[60,64,67,72,67,72,76].forEach((m,i)=>{tone(mf(m+12),.12,'square',.04,i*.09);tone(mf(m),.12,'triangle',.07,i*.09)});noise(1.4,.05,.1,500)},
  save(){tone(190,.12,'triangle',.1,0,-70);noise(.05,.12)},
  sel(){tone(988,.05,'square',.03)},
  ok(){tone(784,.06,'square',.035);tone(1175,.09,'square',.035,.06)},
  swish(){noise(.08,.06,0,3000)},
  warn(){tone(1500,.05,'square',.02)},
  buzz(){tone(110,.35,'square',.05)},
};
const MEL=[72,0,76,79,84,0,79,76,74,0,77,81,79,0,0,0,72,0,76,79,84,0,86,84,83,0,79,74,72,0,0,0];
const BAS=[48,0,55,0,48,0,55,0,50,0,57,0,55,0,47,0,48,0,55,0,45,0,52,0,43,0,50,0,48,0,43,0];
let musStep=0,musAcc=0;
function setMute(m){muted=m;const l=muted?'SOUND OFF':'SOUND ON';$('bSel').textContent=l;$('mute').textContent=l}

/* ---------- input ---------- */
const K={},T={x:0,y:0,a:false,b:false,st:false};let tapA=false;
const I={x:0,y:0,a:false,b:false,st:false,aP:false,aR:false,bP:false,stP:false,l:false,r:false,u:false,d:false};
let prev={x:0,y:0,a:false,b:false,st:false};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM'&&!e.repeat)setMute(!muted);
  K[e.code]=true;audio();
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false});
cv.addEventListener('pointerdown',()=>{audio();tapA=true});
(function touch(){
  const st=$('stick'),kn=$('knob');let sid=null;
  const move=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const R0=r.width*.36,d=hyp(dx,dy);if(d>R0){dx*=R0/d;dy*=R0/d}kn.style.transform=`translate(${dx}px,${dy}px)`;T.x=dx/R0;T.y=dy/R0};
  st.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;try{st.setPointerCapture(sid)}catch(_){}move(e);audio()});
  st.addEventListener('pointermove',e=>{if(e.pointerId===sid)move(e)});
  const end=e=>{if(e.pointerId!==sid)return;sid=null;T.x=T.y=0;kn.style.transform=''};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  const hold=(el,k)=>{
    el.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}audio()});
    const off=()=>{T[k]=false;el.classList.remove('on')};
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,off));
    el.addEventListener('contextmenu',e=>e.preventDefault());
  };
  hold($('bA'),'a');hold($('bB'),'b');hold($('bStart'),'st');
  $('bSel').addEventListener('click',()=>{audio();setMute(!muted)});
  $('mute').addEventListener('click',()=>{audio();setMute(!muted)});
})();
function readInput(){
  let x=0,y=0,a=false,b=false,st=false;
  if(K.ArrowLeft||K.KeyA)x-=1;if(K.ArrowRight||K.KeyD)x+=1;if(K.ArrowUp||K.KeyW)y-=1;if(K.ArrowDown||K.KeyS)y+=1;
  a=!!(K.KeyZ||K.KeyJ||K.Space);b=!!(K.KeyX||K.KeyK);st=!!(K.Enter||K.KeyP);
  if(hyp(T.x,T.y)>.22){x=T.x;y=T.y}
  a=a||T.a;b=b||T.b;st=st||T.st;
  try{const gps=navigator.getGamepads?navigator.getGamepads():[];
    for(const gp of gps){if(!gp)continue;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
      if(Math.abs(ax)>.25||Math.abs(ay)>.25){x=ax;y=ay}
      const B=i=>gp.buttons[i]&&gp.buttons[i].pressed;
      if(B(14))x=-1;if(B(15))x=1;if(B(12))y=-1;if(B(13))y=1;
      if(B(0)||B(2))a=true;if(B(1)||B(3))b=true;if(B(9))st=true;}}catch(_){}
  const m=hyp(x,y);if(m>1){x/=m;y/=m}
  const pulse=tapA;tapA=false;
  I.x=x;I.y=y;I.a=a;I.b=b;I.st=st;
  I.aP=(a&&!prev.a)||pulse;I.aR=!a&&prev.a;I.bP=b&&!prev.b;I.stP=st&&!prev.st;
  I.l=x<-.5&&!(prev.x<-.5);I.r=x>.5&&!(prev.x>.5);I.u=y<-.5&&!(prev.y<-.5);I.d=y>.5&&!(prev.y>.5);
  prev={x,y,a,b,st};
}

/* ---------- state ---------- */
const FORM=[['gk',.015,.5],['d',.22,.5],['m',.4,.3],['f',.47,.7]];
const G={state:'title',t:0,menu:0,lv:1,mode:'match',pick:0,my:0,op:1,tsel:0,dsel:0,
  score:[0,0],q:1,clock:900,golden:false,ggWin:false,msg:'',sub:'',msgT:0,restartT:0,goalT:0,qT:0,resetT:0,
  kickNext:0,firstKick:0,charging:false,charge:0,switchCd:0,paused:false,pmenu:0,kits:[null,null],flash:0,
  drill:{a:0,b:0,turn:0},tipT:0,pops:[],st:{poss:[0,0],pa:[0,0],pc:[0,0],tk:[0,0],cor:[0,0]},halfT:0,hitstop:0,shake:0,bulge:[0,0],pcAtt:-1,pcT:0,pcLive:0,pcInj:null,pcStop:null,shots:[0,0],saves:[0,0]};
let FX=[],TRAIL=[];
try{const v=localStorage.getItem('turfcup.lv');if(v!==null)G.lv=clamp(+v,0,2)}catch(_){}
let P=[],ctrl=null;
const ball={x:CX,y:GY,z:0,vx:0,vy:0,vz:0,owner:null,last:0,dTeam:-1,target:null,passT:0,px:CX,offGuard:false,fc:[]};
const lv=()=>LV[G.lv];
function msg(a,b='',d=1.4){G.msg=a;G.sub=b;G.msgT=d}
function setKits(a,b){
  const ka={k:TEAMS[a].k,s:TEAMS[a].s};let kb={k:TEAMS[b].k,s:TEAMS[b].s};
  if(cdist(ka.k,kb.k)<140)kb={k:kb.s,s:kb.k};
  if(cdist(ka.k,kb.k)<140)kb={k:'#2b2b2b',s:'#ffffff'};
  G.kits=[ka,kb];
}
function mkP(t,role,i,bx,by){
  const seed=i*7+t*13+G.my*3+G.op*5,ts=TEAMS[t===0?G.my:G.op],stat=role==='d'?ts.d:role==='gk'?ts.g:ts.a;
  return{team:t,role,idx:i,bx,by,x:bx,y:by,vx:0,vy:0,dvx:0,dvy:0,face:t?Math.PI:0,fx:t?-1:1,
    anim:0,jabT:0,jabCd:0,jabDone:true,blockT:0,blockDone:true,wind:0,windKind:'jab',stun:0,pickCd:0,saveCd:0,think:0,dive:0,diveDir:1,swing:0,recvT:-9,shot:null,
    boost:0,mdir:t?Math.PI:0,spd:(role==='f'?1.04:role==='m'?1.01:role==='d'?.98:1)*(.9+stat*.02)*(.97+((seed*37)%7)/100),
    skin:SKINS[(seed*5)%SKINS.length],hair:HAIR[(seed*3)%HAIR.length],style:STYLE_ORDER[(i+t*2+G.my)%9],shoe:SHOES[(seed*7)%SHOES.length]};
}
function resetBall(x,y){ball.x=ball.px=x;ball.y=y;ball.z=0;ball.vx=ball.vy=ball.vz=0;ball.owner=null;ball.dTeam=-1;ball.target=null;ball.offGuard=false;ball.fc=[]}
function resetP(p){p.vx=p.vy=p.dvx=p.dvy=0;p.jabT=0;p.blockT=0;p.wind=0;p.stun=0;p.pickCd=0;p.saveCd=0;p.jabDone=p.blockDone=true;p.dive=0;p.boost=0;p.shot=null}
function nearest(team,x,y,excl){
  let b=null,bd=1e9;
  for(const p of P){if(p.team!==team||p.role==='gk'||p===excl)continue;const d=hyp(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}
  return b;
}

/* ---------- match setup ---------- */
function startMatch(){
  G.mode='match';setKits(G.my,G.op);
  P=[];for(const t of [0,1])FORM.forEach((f,i)=>{const fx=t?1-f[1]:f[1];P.push(mkP(t,f[0],i,fx*PL,f[2]*PD))});
  G.score=[0,0];G.shots=[0,0];G.saves=[0,0];G.st={poss:[0,0],pa:[0,0],pc:[0,0],tk:[0,0],cor:[0,0]};SWAP=false;G.q=1;G.clock=900;G.golden=false;G.ggWin=false;G.paused=false;G.firstKick=R()<.5?0:1;
  kickoff(G.firstKick,'Q1');
}
function kickoff(team,label){
  for(const p of P){resetP(p);p.x=p.bx;p.y=p.by;
    if(dirX(p.team)>0)p.x=Math.min(p.x,CX-14);else p.x=Math.max(p.x,CX+14);
    p.face=dirX(p.team)>0?0:Math.PI;p.fx=dirX(p.team)}
  resetBall(CX,GY);

/* ---------- AI ---------- */
function steer(p,tx,ty,sp){
  const dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy);
  if(d<2){p.dvx=p.dvy=0;return}
  const k=Math.min(1,d/16);p.dvx=dx/d*sp*k;p.dvy=dy/d*sp*k;
  if(d>4)p.face=Math.atan2(dy,dx);
}
function homeOf(p,has){
  const dx=dirX(p.team),push=has?(p.role==='f'?85:p.role==='m'?55:25):-16;
  let x=p.bx+(ball.x-CX)*.6+dx*push,y=p.by+(ball.y-GY)*(has?.22:.3);
  if(!has&&p.role==='d'){const lim=ball.x-dx*20;x=dx>0?Math.min(x,lim):Math.max(x,lim)}
  return{x:clamp(x,12,PL-12),y:clamp(y,12,PD-12)};
}
let chase=[null,null],cover=null;
let marks=new Map();
function computeChasers(){
  chase[1]=nearest(1,ball.x,ball.y,null);
  cover=G.lv>0||TS(1).d>=7?nearest(1,ball.x,ball.y,chase[1]):null;
  chase[0]=nearest(0,ball.x,ball.y,ctrl);
  marks.clear();
  const own=ball.owner;if(!own||G.mode!=='match')return;
  const t=1-own.team,g=defGoal(t);
  const defs=P.filter(p=>p.team===t&&p.role!=='gk'&&p!==ctrl&&p!==chase[t]&&p!==(t===1?cover:null));
  const atks=P.filter(q=>q.team===own.team&&q.role!=='gk'&&q!==own).sort((a,b)=>Math.abs(a.x-g)-Math.abs(b.x-g));
  for(const a of atks){
    if(!defs.length)break;let bi=0,bd=1e9;
    defs.forEach((d,i)=>{const dd=hyp(d.x-a.x,d.y-a.y)+Math.abs(d.x-g)*.15;if(dd<bd){bd=dd;bi=i}});
    marks.set(defs[bi],a);defs.splice(bi,1);
  }

function cpuSpeed(p){return p.team===1?118*lv().sp*p.spd:114*p.spd}
function outfieldAI(p,dt){
  const t=p.team,own=ball.owner,sp=cpuSpeed(p)*(own===p?.88:1);
  if(own===p)return carrierAI(p,dt,sp);

  if(G.pcLive>0&&t!==G.pcAtt&&p.role!=='f'&&!(own&&own.team===t)){steer(p,ball.x,ball.y,sp*1.15);return}
  const has=own&&own.team===t,dBall=hyp(ball.x-p.x,ball.y-p.y);
  const isChaser=(t===1&&chase[1]===p)||(t===0&&!own&&chase[0]===p&&dBall<60);
  if(!has&&isChaser){
    if(own){
      // close down, hold a stick-length off, then telegraph and jab
      const a=Math.atan2(p.y-ball.y,p.x-ball.x);
      const stand=p.wind>0?11:15;
      steer(p,ball.x+Math.cos(a)*stand,ball.y+Math.sin(a)*stand,sp);
      p.face=Math.atan2(ball.y-p.y,ball.x-p.x);
      if(p.wind<=0&&p.jabCd<=0&&dBall<22&&R()<dt*(.9+1.4*lv().tk)*(.8+TS(t).d*.04)){p.wind=.3;p.windKind=R()<.22+.08*G.lv?'block':'jab';SFX.warn()}
    }else steer(p,ball.x,ball.y,sp);

  }

  if(!has&&own&&marks.has(p)){

function carrierAI(p,dt,sp){

  if(inside&&G.pcLive>0){if(R()<.3&&!p.pcPassed){p.pcPassed=true;const m=P.find(q=>q.team===t&&q!==p&&q.role==='d');if(m){pass(p,Math.atan2(m.y-p.y,m.x-p.x));return}}shoot(p,R()<.35+TS(t).a*.05?.72+R()*(ZHI-.72):cpuCharge(),R()*2-1,lv().acc*2);return}
  if(inside&&(dg<DR-22||R()<dt*1.8)){shoot(p,cpuCharge(),R()*2-1,lv().acc*2.5);return}

function keeperSaves(){

    if(k.role!=='gk'||k.saveCd>0)continue;
    const inw=dirX(k.team);
    if(ball.vx*-inw<60||(ball.px-k.x)*(ball.x-k.x)>0||ball.z>=GOAL_H)continue;
    const st=gkStats(k.team);let reach=st.reach+(k.dive>0?6:0);if(ball.z>6)reach*=.8;
    const sp=hyp(ball.vx,ball.vy),lat=Math.abs(ball.vy)/(sp||1);if(sp>480)reach-=2;
    reach*=1-.28*lat;                 // across the face is harder than straight at the keeper
    if(ball.offGuard)reach*=.8;       // first-time hits after a pass catch them out
    const miss=Math.abs(ball.y-k.y)-reach,g=TS(k.team).g;
    // inside reach: almost always stopped; just beyond it: a fingertip save, likelier for good keepers
    const pr=miss<=0?.95:miss<9?(.15+g*.045)*(1-miss/9)*(ball.offGuard?.5:1):0;
    if(R()<pr){
      ball.vx=inw*(70+R()*90);ball.vy=sgn(ball.y-k.y+.01)*(80+R()*100);ball.vz=0;ball.z=0;
      ball.last=k.team;ball.dTeam=-1;ball.target=null;k.saveCd=.45;k.shot=null;k.dive=Math.max(k.dive,.3);k.diveDir=sgn(ball.y-k.y+.01);
      G.saves[k.team]++;msg(miss>0?'FINGERTIP SAVE!':'SAVE!','',.8);SFX.save();sparks(ball.x,ball.y,6);G.hitstop=.06;
      if(G.mode==='defend'&&k.team===0)drillEnd('SAVE!','','a');

    }else k.saveCd=.5;

}
function gkClear(p,inw){

function humanCtrl(p,dt){

function movePlayers(dt){
  for(const p of P){
    p.jabCd-=dt;p.stun-=dt;p.pickCd-=dt;p.swing=Math.max(0,p.swing-dt);
    if(p.wind>0){p.wind-=dt;p.dvx*=.3;p.dvy*=.3;if(p.wind<=0){p.face=Math.atan2(ball.y-p.y,ball.x-p.x);if(p.windKind==='block')block(p);else jab(p)}}
    if(p.jabT>0){p.jabT-=dt;if(!p.jabDone&&p.jabT<.12){p.jabDone=true;tackleCheck(p,24,'jab');if(G.state!=='play')return}}
    if(p.blockT>0){
      p.blockT-=dt;p.vx=Math.cos(p.face)*185;p.vy=Math.sin(p.face)*185;
      if(R()<dt*30)spray(p.x,p.y,1);
      if(!p.blockDone&&tackleCheck(p,20,'block')){p.blockDone=true;if(G.state!=='play')return}
      if(p.blockT<=0&&!p.blockDone){p.blockDone=true;p.stun=.35}
    }else if(p.stun>0){p.vx*=.8;p.vy*=.8;p.boost=0}

      // momentum: straight running builds to a sprint, sharp cuts bleed speed

    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.anim+=hyp(p.vx,p.vy)*dt;

    if(p.role==='gk'){const g=defGoal(p.team);p.x=g===0?clamp(p.x,-3,70):clamp(p.x,PL-70,PL+3);p.y=clamp(p.y,GY-GH-40,GY+GH+40)}

  }
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy);

  }
}
function updBall(dt,live){

/* ---------- main update ---------- */
function update(dt){

  G.bulge[0]=Math.max(0,G.bulge[0]-dt);G.bulge[1]=Math.max(0,G.bulge[1]-dt);

  if(FX.length)FX=FX.filter(f=>f.life>0);for(const q of TRAIL)q.life-=dt;if(TRAIL.length)TRAIL=TRAIL.filter(q=>q.life>0);

      break;

function updMatch(dt){

function line(x0,y0,x1,y1,c){

/* ---------- pitch ---------- */

  {const BX=Math.round(sx(ball.x,ball.y)),BY=Math.round(sy(ball.y))-2-Math.round(ball.z);
   const hid=P.some(p=>p.y>ball.y+.5&&Math.abs(sx(p.x,p.y)-BX)<9&&BY>sy(p.y)-40&&BY<sy(p.y)+1);
   if(hid){const c=(G.t*8|0)%2?'#ffe14d':'#ffffff';fr(c,BX-3,BY-4,6,1);fr(c,BX-3,BY+3,6,1);fr(c,BX-4,BY-3,1,6);fr(c,BX+3,BY-3,1,6);fr('#0c0b16',BX-2,BY-2,4,4);fr('#ffffff',BX-1,BY-1,3,3)}}

function drawMeter(X,Y,c){

    const h=G.sub?44:30,y=78;
    fr('#000',0,y,VW,h);fr('#ffe14d',0,y,VW,1);fr('#ffe14d',0,y+h-1,VW,1);
    const col=['#ffe14d','#ff7a3d','#ffffff'][(G.t*8|0)%3];txt(G.msg,VW/2,y+6,col,16,'center');if(G.sub)txt(G.sub,VW/2,y+28,'#fff',8,'center');
    return;
  }
  ctx.font='8px '+FONT;
  const w=Math.min(VW-8,Math.max(ctx.measureText(G.msg).width,G.sub?ctx.measureText(G.sub).width:0)+16),h=G.sub?22:13,x=Math.round(VW/2-w/2),y=14;
  fr('rgba(0,0,0,.82)',x,y,w,h);fr('#2558b4',x,y+h-1,w,1);
  txt(G.msg,VW/2,y+3,'#ffffff',8,'center');if(G.sub)txt(G.sub,VW/2,y+12,'#ffe14d',8,'center');
}
function drawStats(title,foot){
  fr('rgba(6,6,16,.86)',0,0,VW,VH);
  const a=TEAMS[G.my],b=TEAMS[G.op],k=G.kits,st=G.st;
  txt(title,VW/2,10,'#ffe14d',16,'center');
  const cx=VW/2;
  fr(k[0].k,cx-90,34,8,8);txt(a.c,cx-78,34,'#fff');txt(String(G.score[0]),cx-16,34,'#ffe14d',8,'right');
  txt('-',cx,34,'#9a96b8',8,'center');
  txt(String(G.score[1]),cx+16,34,'#ffe14d');txt(b.c,cx+78,34,'#fff',8,'right');fr(k[1].k,cx+82,34,8,8);
  const tp=st.poss[0]+st.poss[1]||1;
  const rows=[['POSSESSION',Math.round(st.poss[0]/tp*100)+'%',Math.round(st.poss[1]/tp*100)+'%',st.poss[0],st.poss[1]],
    ['SHOTS',G.shots[0],G.shots[1]],['SAVES',G.saves[0],G.saves[1]],
    ['PASSES',st.pc[0]+'/'+st.pa[0],st.pc[1]+'/'+st.pa[1],st.pc[0],st.pc[1]],
    ['TACKLES WON',st.tk[0],st.tk[1]],['CORNERS',st.cor[0],st.cor[1]]];
  rows.forEach((r,i)=>{
    const y=54+i*21,va=r[3]!==undefined?r[3]:+r[1],vb=r[4]!==undefined?r[4]:+r[2],tot=va+vb||1,bw=Math.min(200,VW-40);
    txt(r[0],cx,y,'#c9c5e0',8,'center');
    txt(String(r[1]),cx-bw/2,y,'#fff');txt(String(r[2]),cx+bw/2,y,'#fff',8,'right');
    const wa=Math.round(bw*va/tot);fr(k[0].k,cx-bw/2,y+10,wa,4);fr(k[1].k,cx-bw/2+wa,y+10,bw-wa,4);fr('#000',cx-bw/2+wa,y+10,1,4);
  });
  if(foot){const f=Array.isArray(foot)?foot:[foot];f.forEach((l,i)=>txt(l,VW/2,VH-38+i*12,i===f.length-1?'#ffe14d':'#ffffff',8,'center'))}
}
function drawShirt(x,y,kt,sc=1){
  const O='#0c0b16',R2=(c,a,b,w,h)=>fr(c,x+a*sc,y+b*sc,w*sc,h*sc);
  R2(O,3,1,10,14);R2(O,0,2,16,6);R2(kt.k,4,2,8,12);R2(kt.k,1,3,14,4);
  R2(kt.s,1,6,3,1);R2(kt.s,12,6,3,1);R2(kt.s,6,2,4,1);R2(kt.s,4,12,8,1);R2(O,7,2,2,2);
}
function turfBg(scroll){for(let i=0;i<22;i++){const x=((i*24-scroll)%528+528)%528-24;fr(i%2?'#1f4ea4':'#2558b4',x,0,24,VH)}}
function fakeP(t,i){return{team:t,role:'f',vx:90,vy:0,anim:G.t*100+i*9,face:0,fx:1,jabT:0,blockT:0,wind:0,stun:0,swing:0,dive:0,boost:1,spd:1,skin:SKINS[i],hair:HAIR[i],style:[2,1,3][i%3],shoe:SHOES[i%SHOES.length]}}
function drawTitle(){
  turfBg(G.t*24);
  fr('rgba(8,7,20,.62)',0,22,VW,76);
  bigTxt('TURF CUP',VW/2,36,'#ffb000',VW>=360?32:24);
  txt('FIELD HOCKEY CHAMPIONSHIP',VW/2,80,'#9fd0ff',8,'center');
  const kits=[{k:'#ff7a00',s:'#fff'},{k:'#8fd0ff',s:'#fff'}];
  const bx=((G.t*70)%(VW+160))-40;
  drawPlayer(fakeP(0,1),Math.round(bx-18),150,kits);drawPlayer(fakeP(1,3),Math.round(bx-46),146,kits);drawPlayer(fakeP(0,5),Math.round(bx-76),153,kits);
  drawBall(Math.round(bx),150,Math.round(Math.abs(Math.sin(G.t*6))*4));
  fr('rgba(8,7,20,.62)',0,160,VW,50);
  const items=['EXHIBITION','PRACTICE','LEVEL: '+LV[G.lv].n];
  items.forEach((s,i)=>{const on=G.menu===i;txt((on?'> ':'  ')+s,VW/2,164+i*14,on?'#ffe14d':'#c9c5e0',8,'center')});
  if(VW<300&&(G.t*1.5|0)%2)txt('TURN SIDEWAYS FOR WIDESCREEN',VW/2,104,'#c9c5e0',8,'center');
}
function drawTeams(){
  fr('#100f22',0,0,VW,VH);
  txt(G.pick===0?'CHOOSE YOUR TEAM':'CHOOSE OPPONENT',VW/2,8,'#ffe14d',8,'center');
  const cw=Math.min(60,(VW-16)/4),ox=(VW-cw*4)/2;
  for(let i=0;i<12;i++){
    const c=i%4,r=(i/4)|0,x=Math.round(ox+c*cw+4),y=22+r*48,t=TEAMS[i],on=i===G.tsel,mine=G.pick===1&&i===G.my,w=Math.round(cw-8);
    if(on){fr((G.t*4|0)%2?'#ffe14d':'#ff7a3d',x-2,y-2,w+4,44);fr('#100f22',x,y,w,40)}else fr(mine?'#2e2a10':'#1d1b38',x,y,w,40);
    drawShirt(Math.round(x+w/2-8),y+5,{k:t.k,s:t.s});
    txt(t.c,x+w/2,y+26,on?'#fff':mine?'#ffe14d':'#9a96b8',8,'center');
  }
  const t=TEAMS[G.tsel];
  txt(t.n,VW/2,166,'#ffffff',8,'center');
  [['ATK',t.a],['DEF',t.d],['GK',t.g]].forEach(([l,v],j)=>{const y=178+j*9;txt(l,VW/2-62,y,'#9a96b8');for(let i=0;i<10;i++)fr(i<v?'#ffe14d':'#33304f',VW/2-28+i*9,y+1,7,5)});
  txt('A: PICK   B: BACK',VW/2,206,'#6f6b8f',8,'center');
}
function drawDrills(){
  turfBg(G.t*10);fr('rgba(8,7,20,.82)',0,0,VW,VH);
  txt('PRACTICE',VW/2,14,'#ffe14d',16,'center');
  const it=[['ATTACK DRILL','YOU + A TEAMMATE VS ONE','DEFENDER AND THE KEEPER.','SCORE FROM INSIDE THE CIRCLE.'],
            ['DEFEND DRILL','STOP ONE ATTACKER. TAP A','TO JAB, B TO BLOCK TACKLE','FROM THE FRONT. DODGE THE !']];
  it.forEach((d,i)=>{const on=G.dsel===i,y=44+i*70;
    if(on)fr('#2a2850',10,y-6,VW-20,60);
    txt((on?'> ':'  ')+d[0],18,y,on?'#ffe14d':'#c9c5e0');
    for(let j=1;j<4;j++)txt(d[j],34,y+4+j*12,'#9a96b8')});
  txt('LEVEL: '+LV[G.lv].n,VW/2,186,'#c9c5e0',8,'center');
  txt('A: START   B: BACK',VW/2,200,'#6f6b8f',8,'center');
}
function drawFT(){
  drawMatch();
  const w=G.score[0]>G.score[1];
  drawStats('FULL TIME',[(w?'YOU WIN':'YOU LOSE')+(G.golden?' · GOLDEN GOAL':''),G.t>1?'PRESS A TO CONTINUE':' ']);
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  switch(G.state){
    case 'title':drawTitle();break;case 'teams':drawTeams();break;case 'drills':drawDrills();break;
    case 'ft':drawFT();break;default:drawMatch();
  }
}

/* ---------- sizing: internal width follows the screen shape ---------- */
function fit(){
  const b=$('screen').getBoundingClientRect();if(!b.width||!b.height)return;
  const nw=clamp(Math.round(VH*b.width/b.height/2)*2,256,432);
  if(nw!==VW){VW=nw;cv.width=VW;cv.height=VH}
  let s=Math.min(b.width/VW,b.height/VH);if(s>=2)s=Math.floor(s);if(s<=0)s=1;
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe($('screen'));
fit();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!document.hidden){readInput();update(dt);draw()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
