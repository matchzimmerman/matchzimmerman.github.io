<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 PERCENT COMPLETE COLOR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffe5b4}canvas{display:block;cursor:none}.info{position:fixed;background:rgba(255,255,255,.82);padding:9px 11px;border-radius:5px;font:12px Arial;pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="i" class="info">Coordinates: (x, y)<br>RGB: (r, g, b)<br>HEX: #FFFFFF</div><script>const c=document.getElementById('c'),x=c.getContext('2d'),i=document.getElementById('i'),g=30;function size(){c.width=innerWidth;c.height=innerHeight;draw(0,0)}function hex(n){return n.toString(16).padStart(2,'0')}function draw(mx,my){x.clearRect(0,0,c.width,c.height);const r=Math.floor(mx/c.width*255)||0,gg=Math.floor(my/c.height*255)||0,b=Math.floor((mx+my)/(c.width+c.height)*255)||0,col='#'+hex(r)+hex(gg)+hex(b);x.fillStyle=col;x.strokeStyle=col;x.lineWidth=1;for(let a=0;a<=c.width;a+=g)for(let q=0;q<=c.height;q+=g){x.beginPath();x.arc(a,q,2,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(a,q);x.lineTo(mx,my);x.stroke()}i.innerHTML='Coordinates: ('+Math.round(mx)+', '+Math.round(my)+')<br>RGB: ('+r+', '+gg+', '+b+')<br>HEX: '+col.toUpperCase();i.style.left=Math.min(mx+20,c.width-170)+'px';i.style.top=Math.max(10,my-25)+'px'}c.addEventListener('mousemove',e=>draw(e.clientX,e.clientY));addEventListener('resize',size);size();</script></body></html>
