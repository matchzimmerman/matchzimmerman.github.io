<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamic SVG Gradient with Crosses</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}svg{display:block;width:100%;height:100%}.s1,.s2{transition:stop-color 3s}.cross{animation:r 4s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient><pattern id="p" width="175" height="175" patternUnits="userSpaceOnUse"><g class="cross" style="transform-origin:50px 50px"><line x1="50" y1="25" x2="50" y2="75" stroke="yellow" stroke-width="10"/><line x1="25" y1="50" x2="75" y2="50" stroke="yellow" stroke-width="10"/></g></pattern></defs><rect width="1000" height="1000" fill="url(#g)"/><rect width="1000" height="1000" fill="url(#p)"/></svg><script>const colors=['red','orange','yellow','green','blue','indigo','violet'],a=document.querySelector('.s1'),b=document.querySelector('.s2');const r=()=>colors[Math.floor(Math.random()*colors.length)];a.setAttribute('stop-color',r());b.setAttribute('stop-color',r());setInterval(()=>a.setAttribute('stop-color',r()),5000);setInterval(()=>b.setAttribute('stop-color',r()),3500);</script></body></html>
