<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Dithering Tool</title><style>body{font:16px Arial;margin:32px;max-width:720px}img{max-width:100%;display:block;margin-top:24px}</style></head><body><h2>Image Dithering Tool</h2><input type="file" id="imageInput" accept="image/*"><br><br>Dither Setting: <input type="range" id="ditherSetting" min="1" max="100" value="50"><br><br><button id="go">Dither Image</button><img id="outputImage"><script>document.getElementById('go').onclick=function(){const f=document.getElementById('imageInput').files[0];if(!f)return;const r=new FileReader();r.onload=e=>document.getElementById('outputImage').src=e.target.result;r.readAsDataURL(f)};</script></body></html>
