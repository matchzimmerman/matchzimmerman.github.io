<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ebe6da" />
  <title>DESPACITO — Digital Vinyl Toy</title>
  <style>
    :root{--paper:#ebe6da;--ink:#273477;--cream:#f2edde;--muted:#6d6b70}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
    .title{font-size:clamp(22px,5vw,48px);font-weight:900;letter-spacing:.025em;line-height:.9;text-transform:uppercase;transform:rotate(-1deg)}
    .sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-top:10px;color:#555b83}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
    .tag{font-size:9px;letter-spacing:.13em;text-align:right;line-height:1.55;color:#676978;max-width:190px}
    .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
    .help{font-size:10px;letter-spacing:.08em;line-height:1.65;color:#66636a}
    .controls{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button{appearance:none;border:1px solid rgba(39,52,119,.34);background:rgba(242,237,222,.78);backdrop-filter:blur(12px);color:var(--ink);font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;padding:11px 13px;border-radius:999px;cursor:pointer}
    button:active{transform:scale(.97)}
    .stamp{position:fixed;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:8px;letter-spacing:.15em;color:rgba(39,52,119,.42);white-space:nowrap;pointer-events:none}
    @media(max-width:640px){.tag{display:none}.hud{padding:18px 14px 22px}.help{max-width:145px}.controls{max-width:190px}.stamp{display:none}}
  </style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="top">
    <div>
      <div class="title">Despacito</div>
      <div class="sub">digital vinyl toy / prototype 002</div>
    </div>
    <div class="tag">REBUILT FROM THE ORIGINAL DRAWING<br>WITH THE SILHOUETTE AS THE PRIORITY</div>
  </div>
  <div class="bottom">
    <div class="help">DRAG → ROTATE<br>PINCH / WHEEL → ZOOM<br>DOUBLE TAP → FRONT</div>
    <div class="controls">
      <button id="spin">Spin</button>
      <button id="wire">Wireframe</button>
      <button id="reset">Front</button>
    </div>
  </div>
</div>
<div class="stamp">PROCEDURAL WEB SCULPT · THREE.JS · NO MODEL FILE</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xebe6da);
scene.fog = new THREE.Fog(0xebe6da, 15, 28);

const camera = new THREE.PerspectiveCamera(33, innerWidth/innerHeight, .1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.enablePan = false;
controls.minPolarAngle = Math.PI*.16;
controls.maxPolarAngle = Math.PI*.82;
controls.autoRotate = false;
controls.autoRotateSpeed = 1.0;

const cream = new THREE.MeshStandardMaterial({color:0xf0eadb,roughness:.56,metalness:.015});
const blue = new THREE.MeshStandardMaterial({color:0x263377,roughness:.5,metalness:.015});
const blueSoft = new THREE.MeshStandardMaterial({color:0x334285,roughness:.58,metalness:.01});
const dark = new THREE.MeshStandardMaterial({color:0x171a2f,roughness:.46});
const eyeWhite = new THREE.MeshStandardMaterial({color:0xf8f3e7,roughness:.4});
const pupil = new THREE.MeshStandardMaterial({color:0x1f2d71,roughness:.32});
const meshMats = [cream,blue,blueSoft,dark,eyeWhite,pupil];
const inkLine = new THREE.MeshStandardMaterial({color:0x263377,roughness:.62});
meshMats.push(inkLine);

const toy = new THREE.Group();
scene.add(toy);

function addMesh(geo,mat,pos=[0,0,0],scale=[1,1,1],rot=[0,0,0],parent=toy){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function sphere(r,mat,pos,scale=[1,1,1],parent=toy){return addMesh(new THREE.SphereGeometry(r,56,40),mat,pos,scale,[0,0,0],parent)}
function cylinder(rt,rb,h,mat,pos,rot=[0,0,0],parent=toy){return addMesh(new THREE.CylinderGeometry(rt,rb,h,28),mat,pos,[1,1,1],rot,parent)}
function tube(points,r,mat,parent=toy,segments=32){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  return addMesh(new THREE.TubeGeometry(curve,segments,r,10,false),mat,[0,0,0],[1,1,1],[0,0,0],parent);
}
function capsuleBetween(a,b,r,mat,parent=toy){
  const va=new THREE.Vector3(...a), vb=new THREE.Vector3(...b), mid=va.clone().add(vb).multiplyScalar(.5);
  const d=va.distanceTo(vb);
  const body=addMesh(new THREE.CylinderGeometry(r,r,d,18),mat,[0,0,0],[1,1,1],[0,0,0],parent);
  body.position.copy(mid);
  body.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vb.clone().sub(va).normalize());
  sphere(r,mat,a,[1,1,1],parent); sphere(r,mat,b,[1,1,1],parent);
  return body;
}
function extrudedShape(shape,depth,bevel=.02){
  return new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:bevel,bevelThickness:bevel*.7,curveSegments:24});
}
function triPrism(points,depth,mat,pos,rot=[0,0,0]){
  const s=new THREE.Shape(); s.moveTo(points[0][0],points[0][1]); s.lineTo(points[1][0],points[1][1]); s.lineTo(points[2][0],points[2][1]); s.closePath();
  return addMesh(extrudedShape(s,depth,.018),mat,pos,[1,1,1],rot);
}

// --- HEAD: custom egg / triangular silhouette, not a sphere ---
const hg=new THREE.SphereGeometry(1.54,72,52);
const hp=hg.attributes.position;
for(let i=0;i<hp.count;i++){
  let x=hp.getX(i), y=hp.getY(i), z=hp.getZ(i);
  const ny=y/1.54;
  const crown=Math.max(0,(ny-.44)/.56);
  const chin=Math.max(0,(-ny-.48)/.52);
  let sx=1.08 + .08*(1-Math.abs(ny));
  sx*=1-.19*crown;
  sx*=1-.18*chin;
  const sz=.83*(1-.10*crown-.05*chin);
  x*=sx; z*=sz; y*=1.06;
  x += -.055*(1-ny)*.5; // slight doodle asymmetry
  if(x<0 && ny<.15) x*=1.035; // fuller patched cheek
  hp.setXYZ(i,x,y,z);
}
hg.computeVertexNormals();
const head=addMesh(hg,cream,[0,5.0,0]);
head.rotation.z=-.035;

// tiny blue scribble-cap on the crown, deliberately small
sphere(.50,blueSoft,[-.05,6.30,.05],[1,.25,.78]);

// ears: flattened, uneven, with ink-dark centers
sphere(.39,cream,[-1.62,4.94,-.03],[.72,1,.46]);
sphere(.36,cream,[ 1.62,4.85,-.03],[.72,.96,.46]);
sphere(.18,blueSoft,[-1.68,4.94,.20],[.55,.72,.16]);
sphere(.16,blueSoft,[ 1.68,4.85,.20],[.55,.72,.16]);

// stitched face patch: flatter and shaped like the drawing
const patchShape=new THREE.Shape();
patchShape.moveTo(-.98,.55);
patchShape.bezierCurveTo(-1.10,.15,-1.03,-.54,-.66,-.85);
patchShape.bezierCurveTo(-.34,-1.02,.20,-.86,.37,-.48);
patchShape.bezierCurveTo(.48,-.20,.39,.19,.29,.58);
patchShape.bezierCurveTo(-.10,.77,-.56,.76,-.98,.55);
patchShape.closePath();
const patch=addMesh(extrudedShape(patchShape,.07,.025),blue,[-.43,5.02,1.13],[1,1,1],[0,0,-.08]);

// spiral eye inside patch
sphere(.49,eyeWhite,[-.62,5.08,1.29],[1,1,.24]);
addMesh(new THREE.TorusGeometry(.31,.045,14,52),blue,[-.62,5.08,1.425]);
addMesh(new THREE.TorusGeometry(.18,.038,14,48),blue,[-.62,5.08,1.438]);
sphere(.065,pupil,[-.62,5.08,1.47],[1,1,.45]);

// large worried eye, less bug-eyed than v1
sphere(.60,eyeWhite,[.67,4.88,1.16],[1.02,1.05,.26]);
sphere(.105,pupil,[.60,4.90,1.34],[1,1,.55]);
// ink halo around big eye
addMesh(new THREE.TorusGeometry(.61,.035,12,64),blueSoft,[.67,4.88,1.31],[1.01,1.03,1]);

// eyebrows
capsuleBetween([-.25,5.84,1.17],[.02,5.93,1.18],.035,blueSoft);
capsuleBetween([.90,5.66,1.08],[1.14,5.57,1.05],.035,blueSoft);

// forehead seam and stitch marks
const seamPts=[[-1.27,5.91,1.02],[-.76,6.00,1.10],[-.20,5.99,1.15],[.38,5.91,1.14],[.94,5.82,1.06],[1.27,5.76,.96]];
tube(seamPts,.022,blueSoft,toy,40);
for(let i=0;i<11;i++){
  const t=i/10, x=-1.22+t*2.45, y=5.91 + .10*Math.cos((t-.18)*Math.PI), z=1.10;
  capsuleBetween([x,y-.09,z+.015],[x,y+.09,z+.025],.022,blueSoft);
}

// patch stitches: irregular ellipse around the patch perimeter
for(let i=0;i<15;i++){
  const a=i/15*Math.PI*2;
  const rx=.82, ry=.82, cx=-.53, cy=5.00;
  const x=cx+Math.cos(a)*rx, y=cy+Math.sin(a)*ry;
  const nx=Math.cos(a)*.10, ny=Math.sin(a)*.10;
  capsuleBetween([x-nx,y-ny,1.205],[x+nx,y+ny,1.235],.019,blueSoft);
}

// tiny worried mouth
const mouthCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-.16,4.10,1.18),new THREE.Vector3(.02,4.22,1.25),new THREE.Vector3(.22,4.10,1.18));
addMesh(new THREE.TubeGeometry(mouthCurve,18,.035,10,false),dark);

// neck
cylinder(.16,.21,.62,cream,[0,3.58,0]);

// high, sharp collar from the drawing
triPrism([[0,.05],[-.94,.12],[-.31,-.42]],.18,blue,[-.02,3.61,.22],[-.08,0,-.02]);
triPrism([[0,.05],[ .94,.12],[ .31,-.42]],.18,blue,[ .02,3.61,.22],[-.08,0,.02]);

// torso: narrow, long, almost rectangular striped tunic
const torsoYs=[3.15,2.73,2.31,1.89];
const torsoMats=[cream,blue,cream,blue];
for(let i=0;i<4;i++){
  const g=new RoundedBoxGeometry(1.38,.44,.70,5,.10);
  const seg=addMesh(g,torsoMats[i],[0,torsoYs[i],0]);
  seg.scale.x=1-(i*.025);
}

// arms: long and thin, slightly drooped like the drawing
function arm(side){
  const s=side;
  capsuleBetween([s*.72,3.16,.00],[s*.84,2.68,.03],.085,cream);
  capsuleBetween([s*.84,2.68,.03],[s*.94,2.20,.05],.085,blue);
  capsuleBetween([s*.94,2.20,.05],[s*1.03,1.67,.06],.080,cream);
  cylinder(.14,.13,.22,blue,[s*1.05,1.55,.06],[0,0,s*.12]);
  // palm
  sphere(.18,cream,[s*1.08,1.31,.08],[.72,1.05,.55]);
  // four little fingers, splayed downward
  const offs=[-.11,-.035,.045,.12];
  offs.forEach((o,j)=>{
    const x=s*(1.08+o), y=1.22-Math.abs(o)*.15;
    capsuleBetween([x,y,.08],[x+s*(.018+j*.004),y-.22-(j===0?.01:0),.10],.034,cream);
  });
}
arm(-1); arm(1);

// legs: thin with single blue calf band
function leg(side){
  const s=side;
  capsuleBetween([s*.39,1.66,0],[s*.40,1.13,0],.095,cream);
  capsuleBetween([s*.40,1.13,0],[s*.41,.72,0],.095,blue);
  capsuleBetween([s*.41,.72,0],[s*.42,.31,0],.092,cream);
}
leg(-1); leg(1);

// pointed shoes as extruded wedges, angled outward
function shoe(side){
  const s=new THREE.Shape();
  s.moveTo(-.17,.17); s.lineTo(.12,.17); s.lineTo(.55,-.14); s.lineTo(-.28,-.14); s.closePath();
  const g=extrudedShape(s,.42,.035);
  g.translate(0,0,-.21);
  const m=addMesh(g,blue,[side*.42,.18,.16],[side,1,1],[0,side*.10,side*.06]);
  return m;
}
shoe(-1); shoe(1);

// restrained hatch marks on the blue patch and lower shirt: references pen without turning into noise
const hatchMaterial=new THREE.LineBasicMaterial({color:0x7b84b2,transparent:true,opacity:.30});
function hatch(x1,y1,x2,y2,z){
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,z),new THREE.Vector3(x2,y2,z)]);
  toy.add(new THREE.Line(g,hatchMaterial));
}
for(let i=0;i<7;i++) hatch(-1.02+i*.18,4.50+i*.05,-.62+i*.18,5.18+i*.05,1.225);
for(let i=0;i<4;i++) hatch(-.53+i*.28,1.76,-.24+i*.28,2.02, .37);

// floor
const floorMat=new THREE.MeshStandardMaterial({color:0xe4ded2,roughness:.95});
const floor=addMesh(new THREE.CircleGeometry(7.5,96),floorMat,[0,.02,0],[1,1,1],[-Math.PI/2,0,0],scene);
floor.receiveShadow=true; floor.castShadow=false;

// lighting: soft product-photo setup
scene.add(new THREE.HemisphereLight(0xfffbf2,0x73758b,2.05));
const key=new THREE.DirectionalLight(0xffffff,3.6); key.position.set(-4.5,8.5,7.5); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-5; key.shadow.camera.right=5; key.shadow.camera.top=9; key.shadow.camera.bottom=-2; scene.add(key);
const rim=new THREE.DirectionalLight(0x9ca8ff,1.0); rim.position.set(5,5,-5); scene.add(rim);
const fill=new THREE.PointLight(0xfff0d8,12,16); fill.position.set(3,3,6); scene.add(fill);

function fitFront(){
  controls.target.set(0,3.15,0);
  const portrait=innerHeight>innerWidth;
  camera.position.set(.12,3.15,portrait?14.4:12.2);
  controls.minDistance=portrait?10.2:8.6;
  controls.maxDistance=18;
  controls.update();
}
fitFront();

let wire=false;
const spinBtn=document.getElementById('spin');
spinBtn.onclick=()=>{controls.autoRotate=!controls.autoRotate; spinBtn.textContent=controls.autoRotate?'Stop spin':'Spin'};
document.getElementById('wire').onclick=()=>{
  wire=!wire; meshMats.forEach(m=>m.wireframe=wire);
  document.getElementById('wire').textContent=wire?'Solid':'Wireframe';
};
document.getElementById('reset').onclick=()=>{controls.autoRotate=false;spinBtn.textContent='Spin';toy.rotation.set(0,0,0);fitFront()};
renderer.domElement.addEventListener('dblclick',fitFront);
let lastTap=0; renderer.domElement.addEventListener('touchend',()=>{const n=performance.now();if(n-lastTap<320) fitFront();lastTap=n},{passive:true});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  fitFront();
});
</script>
</body>
</html>
