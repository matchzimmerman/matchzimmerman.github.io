<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Version Original</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ffd1a1}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let pts=[];function size(){c.width=innerWidth;c.height=innerHeight;pts=[];for(let a=0;a<Math.ceil(innerWidth/20);a++)for(let b=0;b<Math.ceil(innerHeight/20);b++)pts.push([a*20,b*20])}function draw(mx,my){x.clearRect(0,0,c.width,c.height);x.strokeStyle='#000';x.fillStyle='#000';x.lineWidth=1;pts.forEach(p=>{x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(mx,my);x.stroke();x.beginPath();x.arc(p[0],p[1],2,0,Math.PI*2);x.fill()});x.beginPath();x.arc(mx,my,2,0,Math.PI*2);x.fill()}c.addEventListener('mousemove',e=>draw(e.clientX,e.clientY));addEventListener('resize',size);size();</script></body></html>
