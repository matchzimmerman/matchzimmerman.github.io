<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generative Art</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');function draw(){c.width=innerWidth;c.height=innerHeight;x.clearRect(0,0,c.width,c.height);for(let gx=0;gx<9;gx++)for(let gy=0;gy<9;gy++){const w=c.width/9,h=c.height/9;x.beginPath();for(let i=0;i<8;i++){const px=gx*w+Math.random()*w,py=gy*h+Math.random()*h;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke()}}addEventListener('resize',draw);draw();</script></body></html>
