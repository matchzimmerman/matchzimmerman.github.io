<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>001 — THE ONE THE ONE THE ONE</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;cursor:none}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d'),g=30;function size(){c.width=innerWidth;c.height=innerHeight;draw(c.width/2,c.height/2)}function dot(a,b){x.beginPath();x.arc(a,b,2,0,Math.PI*2);x.fill()}function draw(mx,my){x.clearRect(0,0,c.width,c.height);x.fillStyle='#000';x.strokeStyle='#000';x.lineWidth=1;for(let a=-c.width/2;a<=c.width/2;a+=g)for(let b=-c.height/2;b<=c.height/2;b+=g){const x1=a+c.width/2,y1=b+c.height/2,x2=a+mx,y2=b+my;dot(x1,y1);dot(x2,y2);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}}c.addEventListener('mousemove',e=>draw(e.clientX,e.clientY));addEventListener('resize',size);size();</script></body></html>
