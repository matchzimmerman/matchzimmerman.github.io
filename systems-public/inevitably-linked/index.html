<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inevitably Linked: framework_001</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ffd1a1}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let pts=[],intro=true,mx=0,my=0;function size(){c.width=innerWidth;c.height=innerHeight;draw()}function text(){x.fillStyle='#000';x.font='15px monospace';x.textAlign='left';x.textBaseline='middle';x.fillText('click to plot a dot',c.width/2,c.height/2);x.fillText('right-click to clear and start again',c.width/2,c.height/2+40)}function draw(){x.clearRect(0,0,c.width,c.height);if(intro){text();return}x.strokeStyle='#000';x.fillStyle='#000';pts.forEach(p=>{x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke();x.beginPath();x.arc(p.x,p.y,2,0,Math.PI*2);x.fill()})}addEventListener('resize',size);addEventListener('click',e=>{intro=false;pts.push({x:e.clientX,y:e.clientY});draw()});addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;draw()});addEventListener('contextmenu',e=>{e.preventDefault();pts=[];intro=true;draw()});size();</script></body></html>
